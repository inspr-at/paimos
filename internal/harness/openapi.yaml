# P5.3 fragment for coordinator reconciliation into api/openapi.yaml.
# All paths require the existing Aeon tenant identity. Agent key scopes are
# harness.read, harness.write, harness.worker and harness.control respectively.
paths:
  /api/projects/{projectId}/harness-sessions:
    get:
      operationId: listHarnessSessions
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200': {description: Public non-secret generations}
    post:
      operationId: registerHarnessSession
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HarnessRegistration'}
      responses:
        '201': {description: Registered or exact active replay}
  /api/projects/{projectId}/harness-sessions/orchestrator:
    get:
      operationId: resolveHarnessOrchestrator
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200': {description: 'Resolved, ambiguous or unset'}
  /api/projects/{projectId}/harness-sessions/{sessionId}:
    get:
      operationId: getHarnessSession
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200': {description: Public non-secret generation}
  /api/projects/{projectId}/harness-sessions/{sessionId}/binding:
    patch:
      operationId: bindHarnessSession
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HarnessBinding'}
      responses:
        '200': {description: Revisioned hierarchy and ticket binding}
  /api/projects/{projectId}/harness-sessions/{sessionId}/recovery:
    get:
      operationId: previewHarnessRecovery
      summary: Human-authorized recovery preview
      parameters: [{$ref: '#/components/parameters/projectId'}, {$ref: '#/components/parameters/sessionId'}]
      responses:
        '200': {description: 'Exact session, host, observed revision and recovery confirmation; process state remains unknown'}
        '403': {description: Human harness.recover permission required}
  /api/projects/{projectId}/harness-sessions/{sessionId}/controls/force-stop:
    post:
      operationId: forceStopHarnessSession
      summary: Human-confirmed force stop of a verified live owned process group
      parameters: [{$ref: '#/components/parameters/projectId'}, {$ref: '#/components/parameters/sessionId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, confirmation, request_id, reason]
              properties:
                expected_revision: {type: string, pattern: '^[0-9a-f]{64}$'}
                confirmation: {type: string, maxLength: 300}
                request_id: {type: string, format: uuid}
                reason: {type: string, minLength: 1, maxLength: 240}
      responses:
        '201': {description: Idempotent control with exact ownership and a 45-second expiry; pending is not confirmed exit}
        '403': {description: Human harness.force_stop permission required}
        '409': {description: Stale confirmation or unavailable ownership}
  /api/projects/{projectId}/harness-sessions/{sessionId}/remove:
    post:
      operationId: removeHarnessSession
      summary: Human with harness.read project access removes any registration without stopping its process
      parameters: [{$ref: '#/components/parameters/projectId'}, {$ref: '#/components/parameters/sessionId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessRemoveRequest'}}}}
      responses:
        '200': {description: Record removed; process state unknown, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessRemoveResult'}}}}
        '400': {description: Invalid reason}
        '403': {description: Human project access required}
        '404': {description: Session not visible}
  /api/projects/{projectId}/harness-sessions/remove-stale:
    post:
      operationId: removeStaleHarnessSessions
      summary: Remove up to 200 records per request whose last accepted heartbeat (or creation) is older than 15 minutes under row locks; events carry batch_id and cutoff
      parameters: [{$ref: '#/components/parameters/projectId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessRemoveRequest'}}}}
      responses:
        '200': {description: Removed records and server eligibility cutoff, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessRemoveStaleResult'}}}}
        '400': {description: Invalid reason}
        '403': {description: Human harness.read project access required}
        '404': {description: Project not visible}
  /api/projects/{projectId}/harness-sessions/{sessionId}/archive:
    post:
      operationId: archiveHarnessSession
      summary: Archive a generation without claiming process exit
      parameters: [{$ref: '#/components/parameters/projectId'}, {$ref: '#/components/parameters/sessionId'}]
      responses:
        '200': {description: Archived generation; old worker proofs and registration replays revoked; history retained}
        '403': {description: Human harness.recover permission required}
        '409': {description: Stale observation or divergent retry}
  /api/projects/{projectId}/harness-sessions/{sessionId}/heartbeat:
    post:
      operationId: heartbeatHarnessSession
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/workerLease'
      responses:
        '410': {description: Authenticated archived generation; detach harness servicing without signaling a process}
        '200': {description: Updated heartbeat and phase}
  /api/projects/{projectId}/harness-sessions/{sessionId}/yield:
    post:
      operationId: yieldHarnessSession
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/workerLease'
      responses:
        '410': {description: Authenticated archived generation; detach harness servicing without signaling a process}
        '200': {description: Claimed typed owned controls}
  /api/projects/{projectId}/harness-sessions/{sessionId}/drain:
    post:
      operationId: drainHarnessInbox
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/workerLease'
      responses:
        '410': {description: Authenticated archived generation; detach harness servicing without signaling a process}
        '200': {description: Leased FIFO inbox message}
  /api/projects/{projectId}/harness-sessions/{sessionId}/complete-delivery:
    post:
      operationId: completeHarnessDelivery
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/workerLease'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery_id, cursor]
              properties:
                delivery_id: {type: string, format: uuid}
                cursor: {type: integer, minimum: 1}
                effective_level: {type: string, enum: [simple], default: simple}
                outcome: {type: string, enum: [handed_off, failed], default: handed_off}
                failure_reason: {type: string, enum: [outcome_unconfirmed, child_unavailable]}
      responses:
        '410': {description: Authenticated archived generation; detach harness servicing without signaling a process}
        '200': {description: Exact leased delivery settled idempotently}
  /api/projects/{projectId}/harness-sessions/{sessionId}/managed-controls:
    post:
      operationId: requestManagedHarnessControl
      description: Person-only harness.control; request_id, kind, exact expected_ownership and optional transient steer text. Managed sandbox/budget capability required; expiry and retries fenced.
      responses:
        '201': {description: Typed pending or replayed control metadata}
        '403': {description: Person permission required}
        '409': {description: 'Unmanaged, unsupported or stale generation'}
  /api/projects/{projectId}/harness-sessions/{sessionId}/managed-context:
    post:
      operationId: managedHarnessContext
      description: Exact managed worker lease; ephemeral ADR-004 rules for the bound session only.
      responses:
        '200': {description: Merged rules envelope}
  /api/projects/{projectId}/harness-sessions/{sessionId}/controls/interrupt:
    post:
      operationId: interruptHarnessSession
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
      responses:
        '201': {description: Pending typed interrupt}
  /api/projects/{projectId}/harness-sessions/{sessionId}/controls/stop:
    post:
      operationId: stopHarnessSession
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
      responses:
        '201': {description: Pending typed stop}
  /api/projects/{projectId}/harness-sessions/{sessionId}/controls/{controlId}:
    get:
      operationId: getHarnessControl
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/controlId'
      responses:
        '200': {description: Scoped typed control state and outcome}
  /api/projects/{projectId}/harness-sessions/{sessionId}/controls/{controlId}/complete:
    post:
      operationId: completeHarnessControl
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/controlId'
        - $ref: '#/components/parameters/workerLease'
      responses:
        '410': {description: Authenticated archived generation; detach harness servicing without signaling a process}
        '200': {description: Exact claimed control completion}
  /api/projects/{projectId}/harness-sessions/{sessionId}/stop:
    post:
      operationId: markHarnessStopped
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/workerLease'
      responses:
        '410': {description: Authenticated archived generation; detach harness servicing without signaling a process}
        '200': {description: Closed immutable generation}
  /api/projects/{projectId}/instruction-provenance:
    get:
      operationId: queryHarnessInstructionProvenance
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200': {description: 'Instruction source identities for one visible project, newest first'}
        '400': {description: Unknown or invalid query}
        '404': {description: Project is not visible}
  /api/projects/{projectId}/harness-sessions/{sessionId}/provenance:
    get:
      operationId: getHarnessInstructionProvenance
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200': {description: Newest instruction provenance revisions}
    post:
      operationId: recordHarnessInstructionProvenance
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/workerLease'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HarnessProvenanceWrite'}
      responses:
        '200': {description: Created or replayed provenance revision}
        '410': {description: Authenticated archived generation; existing provenance remains readable}
  /api/projects/{projectId}/harness-sessions/{sessionId}/rules-receipts:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getHarnessRulesReceipts
      description: Requires harness.read and session project visibility. Newest 32 append-only worker-reported received receipts, separate from instruction provenance. History remains readable after stop/archive. Use before_revision for older history; the newest receipt revision is the next write's expected_revision, or zero for empty history.
      parameters:
        - {name: before_revision, in: query, schema: {type: integer, minimum: 1}, description: Exclusive revision cursor. Omit to read newest receipts.}
      responses:
        '200': {description: Receipt history, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessRulesReceiptPage'}}}}
        '400': {description: Invalid revision cursor}
        '404': {description: Session is not visible}
    post:
      operationId: recordHarnessRulesReceipt
      description: >-
        Explicit worker report of receiving particular merged bytes; never publishes rules or proves
        model load, obedience or execution, and grants no authority. A newly appended receipt also
        appends session instruction provenance for that merged version and body hash, plus constituent
        set versions from the one manifest served with those bytes. When that serve was not recorded, or
        more than one set list was served for the same bytes, only the merged identity is stored. Replay does not append another provenance
        revision. The receipt row itself stays free of rule text.
        Requires harness.worker and the exact active owning generation lease. Server verifies tenant,
        project, agent, canonical key creator, registered harness and any task's current session/project
        binding. Role, bytes, version and source remain worker-reported; publication is not verified.
        No offline recording or deferred automatic submission. Cache/floor-only source reports remain
        unverified even when recorded online. expected_revision is a receipt revision, independent of
        session/provenance revisions. Append only when it equals the latest revision (initially zero).
        An identical request_id and normalized metadata replays its original receipt, including after newer appends;
        divergent reuse or competing stale writes return 409. All authorization and generation checks
        precede replay, so expired/revoked credentials and stopped/archived generations cannot replay.
      parameters:
        - {name: X-Aeon-Worker-Lease, in: header, required: true, schema: {type: string}, description: Private exact generation proof; never stored in a receipt or returned}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HarnessRulesReceiptWrite'}
      responses:
        '200': {description: Appended or replayed receipt, content: {application/json: {schema: {$ref: '#/components/schemas/HarnessRulesReceiptRecorded'}}}}
        '400': {description: Invalid or unbounded metadata; unknown fields rejected}
        '403': {description: Worker proof or context binding rejected}
        '409': {description: Expected receipt revision conflict or divergent request reuse}
        '410': {description: Authenticated archived generation; receipt history remains readable}
components:
  parameters:
    projectId: {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
    sessionId: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    controlId: {name: controlId, in: path, required: true, schema: {type: string, format: uuid}}
    workerLease: {name: X-Aeon-Worker-Lease, in: header, required: true, schema: {type: string}, description: Private per-generation proof; never returned or logged}
  schemas:
    HarnessRemoveRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 240}
    HarnessRemoveResult:
      type: object
      required: [session, message, processes_signalled, process_state]
      properties:
        session: {$ref: '#/components/schemas/HarnessSession'}
        message: {type: string, const: 'Record removed; process not stopped by removal.'}
        processes_signalled: {type: boolean, const: false}
        process_state: {type: string, const: unknown}
        event_id: {type: integer, format: int64, description: 'The harness.removed event; POST /events/{eventId}/undo restores the record as it was (AEON-291). Omitted when the record was already removed.'}
        undoable: {type: boolean, description: 'Whether the caller may undo event_id (events.undo in the project). Answered by a single removal with event_id; remove-stale items omit it.'}
    HarnessRemoveStaleResult:
      type: object
      required: [items, cutoff, more]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/HarnessRemoveResult'}}
        cutoff: {type: string, format: date-time}
        more: {type: boolean, description: Eligible records remain after this batch; repeat the request}
    # The session shape is owned by the product contract.
    HarnessSession: {$ref: '../../api/openapi.yaml#/components/schemas/HarnessSession'}
    HarnessRulesReceiptContext:
      type: object
      additionalProperties: false
      required: [tenant_id, project_id, person_id, agent_id, role, harness]
      description: Identity/binding checked against the authenticated generation at recording time; role is a worker-reported merge selector, never a permission. Registered harness is metadata, not attestation of the running executable. Optional task must match the session ticket and remain in the project.
      properties:
        tenant_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        person_id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        role: {type: string, enum: [coordinator, builder, reviewer, operator]}
        harness: {type: string, enum: [claude-code, codex, grok, pi, cursor]}
    HarnessRulesReceiptWrite:
      type: object
      additionalProperties: false
      required: [request_id, expected_revision, context, body_sha256, version, byte_size, source]
      properties:
        request_id: {type: string, format: uuid, description: Caller-generated idempotency ID scoped to the session; reuse only with the identical payload}
        expected_revision: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775806}
        context: {$ref: '#/components/schemas/HarnessRulesReceiptContext'}
        body_sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 'Worker-reported SHA256 of exact merged bytes, never a hash of a version label'}
        version: {type: string, maxLength: 16, pattern: '^(floor-only|[0-9]{12}\.0\.0)$', description: Worker-reported calendar version or floor-only; no assertion of publication}
        byte_size: {type: integer, minimum: 1, maximum: 12000}
        source: {type: string, enum: [online, cache, floor-only], description: Worker-reported source; cache/floor-only are stale fallback evidence and never fresh authority}
    HarnessRulesReceipt:
      type: object
      required: [request, id, session_id, revision, recorded_by_principal_id, recorded_at, evidence, publication_verified, load_verified, execution_verified, authority_granted]
      properties:
        request: {$ref: '#/components/schemas/HarnessRulesReceiptWrite'}
        id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        recorded_by_principal_id: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
        evidence: {type: string, const: worker_reported_received}
        publication_verified: {type: boolean, const: false}
        load_verified: {type: boolean, const: false}
        execution_verified: {type: boolean, const: false}
        authority_granted: {type: boolean, const: false}
    HarnessRulesReceiptRecorded:
      type: object
      required: [receipt, replayed]
      properties:
        receipt: {$ref: '#/components/schemas/HarnessRulesReceipt'}
        replayed: {type: boolean}
    HarnessRulesReceiptPage:
      type: object
      required: [session_id, receipts, next_before_revision]
      properties:
        session_id: {type: string, format: uuid}
        receipts: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/HarnessRulesReceipt'}}
        next_before_revision: {type: [integer, 'null'], format: int64}
    HarnessRegistration:
      type: object
      required: [agent_principal_id, harness, host, management_mode, role, harness_session_ref, worker_lease]
      properties:
        succeeds_session_id: {type: [string, 'null'], format: uuid, description: Explicit same-principal coordinator predecessor in this project.}
        agent_principal_id: {type: string, format: uuid}
        run_id: {type: [string, 'null'], format: uuid}
        ticket_node_id: {type: [string, 'null'], format: uuid}
        work_order_id: {type: [string, 'null'], format: uuid}
        parent_harness_session_id: {type: [string, 'null'], format: uuid}
        display_label: {type: [string, 'null'], maxLength: 128, description: Optional public label. Trimmed; empty becomes null. Control characters are rejected. Part of exact registration replay.}
        harness: {type: string, enum: [codex, claude, pi, cursor, grok]}
        host: {type: string, maxLength: 128}
        management_mode: {type: string, enum: [managed, unmanaged]}
        role: {type: string, enum: [coordinator, worker]}
        work_shape: {type: string, enum: [unknown, ship, scout]}
        advertised_capabilities: {type: array, items: {type: string, enum: [inbox, status, steer, interrupt, stop]}}
        harness_session_ref: {type: string, writeOnly: true}
        worker_lease: {type: string, writeOnly: true}
    HarnessBinding:
      type: object
      required: [expected_revision, parent_harness_session_id, ticket_node_id, work_shape]
      properties:
        expected_revision: {type: integer, minimum: 1}
        parent_harness_session_id: {type: [string, 'null'], format: uuid}
        ticket_node_id: {type: [string, 'null'], format: uuid}
        work_shape: {type: string, enum: [unknown, ship, scout]}
    HarnessProvenanceWrite:
      type: object
      required: [items]
      properties:
        items: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/HarnessProvenanceItem'}}
    HarnessProvenanceItem:
      type: object
      required: [kind, logical_name, hash_kind]
      properties:
        kind: {type: string, enum: [agents, claude, skill, prompt_template, rules_merged, rules_set]}
        logical_name: {type: string, maxLength: 80}
        hash_kind: {type: string, enum: [content, absent]}
        content_sha256: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: Present only for hash_kind content. Null when absent. Never a hash of the version identifier.}
        version: {type: [string, 'null'], maxLength: 80}
        byte_size: {type: [integer, 'null'], minimum: 0, maximum: 1048576}

# SPDX-License-Identifier: AGPL-3.0-only
name: Decision Desk UI
on:
  pull_request:
    paths:
      - web/**
      - .github/workflows/decision-desk-ui.yml
permissions:
  contents: read
jobs:
  desk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx vitest run tests/decision-desk.unit.test.ts --maxWorkers=1
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Desk keyboard, protected adapters and AEON-541 geometry
        run: npx playwright test tests/decision-desk.spec.ts -c playwright.ui.config.ts --workers=1 --trace=retain-on-failure
        working-directory: web
        env:
          AEON_DESK_SHOTS: test-results/desk-shots
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: decision-desk-ui
          path: web/test-results
          if-no-files-found: ignore

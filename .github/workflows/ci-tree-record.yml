# SPDX-License-Identifier: AGPL-3.0-only
name: CI tree record

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  record:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.CI_TREE_REUSE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      statuses: write
      packages: write
    steps:
      # workflow_run executes the trusted default branch, never PR code or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Publish API-verified full-suite tree record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_TREE_REUSE: ${{ vars.CI_TREE_REUSE }}
        run: node scripts/ci-tree-reuse.mjs publish

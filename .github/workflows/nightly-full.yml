# SPDX-License-Identifier: AGPL-3.0-only
# AEON-1335: scratch experiment only. Never merge, open a PR, or enqueue this ref.
# Reuse the registered nightly path so no new default-branch workflow is needed.
name: Nightly full
run-name: 'AEON-1335 ${{ inputs.shards }}x${{ inputs.workers }} repeat ${{ inputs.repetition }}'

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Workers in parallel-safe browser groups'
        type: choice
        options: ['1', '2', '3']
        default: '1'
        required: true
      shards:
        description: 'Browser shards (12x1, 6x2, or 4x3 only)'
        type: choice
        options: ['12', '6', '4']
        default: '12'
        required: true
      repetition:
        description: 'Independent repetition on the same immutable SHA'
        type: choice
        options: ['1', '2']
        default: '1'
        required: true

# Run one experiment at a time (within the brief's maximum of two).
# Dispatch the next only after completion; GitHub retains just one pending run.
# The dispatcher must monitor ALL org queues and stop/cancel its own run above 20.
concurrency:
  group: aeon-1335-worker-qualification
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI_IMPACT: 'off'

jobs:
  experiment-plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/exp/aeon-1335-workers'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.layout.outputs.matrix }}
    steps:
      - name: Validate the paired layout
        id: layout
        env:
          WORKERS: ${{ inputs.workers }}
          SHARDS: ${{ inputs.shards }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { cpus } from 'node:os';
          const n = Number(process.env.WORKERS), m = Number(process.env.SHARDS);
          if (![[12, 1], [6, 2], [4, 3]].some(([shards, workers]) => shards === m && workers === n)) throw new Error('Invalid paired layout');
          if (cpus().length !== 4) throw new Error('Qualification requires 4-vCPU hosted runners');
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(Array.from({ length: m }, (_, index) => index + 1))}\n`);
          JS

  nightly-web-setup:
    needs: experiment-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      browser-cache-key: ${{ steps.web-cache-keys.outputs.browsers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve lockfile and Playwright cache keys
        id: web-cache-keys
        env:
          LOCKFILE_HASH: ${{ hashFiles('web/package-lock.json') }}
        run: |
          set -euo pipefail
          pw_version="$(node -p "require('./web/package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "dependencies=web-deps-v1-${RUNNER_OS}-${RUNNER_ARCH}-node24-${LOCKFILE_HASH}-pw${pw_version}" >> "$GITHUB_OUTPUT"
          echo "browsers=web-playwright-v1-${RUNNER_OS}-${RUNNER_ARCH}-${LOCKFILE_HASH}-pw${pw_version}" >> "$GITHUB_OUTPUT"
      - name: Cache installed web dependencies
        id: web-dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: web/node_modules
          key: ${{ steps.web-cache-keys.outputs.dependencies }}
      - name: Install web dependencies
        if: steps.web-dependencies.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci
      - name: Check Docker web inputs without Docker
        run: node --test scripts/docker-web-inputs.test.mjs
      - name: Require every web case to be classified
        run: node scripts/test-tiers/cli.mjs check web --strict
      - name: Install shells used by command round-trip unit tests
        timeout-minutes: 4
        run: bash "$GITHUB_WORKSPACE/scripts/ci/bounded-apt.sh" apt fish zsh
      - working-directory: web
        run: npm run typecheck
      # The session and run ledger fences (AEON-449): endpoints only in lib/agentRows.ts, wire rows only through the ledger.
      - working-directory: web
        run: npm run lint
      - name: Web unit checks (once)
        # Scratch only (LEAD 2026-10-17): aeon-676-ci.test.mjs asserts the production nightly-full.yml
        # shape, which this experiment replaces by design. Unit results stay recorded, never block the measurement.
        continue-on-error: true
        working-directory: web
        run: |
          npm run ci:web:shard:test
          node ../scripts/test-tiers/cli.mjs run web --all --unit --job web-unit
      - name: Preserve unit tier measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-unit-tier-measurements
          path: tmp/test-tiers/
          if-no-files-found: warn
          retention-days: 8
          overwrite: true
      - name: Browser runner safety (no browsers)
        working-directory: web
        run: npm run test:browser-safety
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Cache Playwright browsers
        id: web-browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.web-cache-keys.outputs.browsers }}
      - name: Install Playwright browsers
        if: steps.web-browsers.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium
      # Tar preserves executable bits, symlinks and hidden dependency files.
      # Build output is run-specific; never replay a dist cache for another commit.
      - name: Pack web runtime for shards
        run: tar -cf "$RUNNER_TEMP/web-runtime.tar" web/node_modules web/dist
      - name: Share web runtime with shards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-runtime
          path: ${{ runner.temp }}/web-runtime.tar
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  nightly-web-shard:
    needs: [experiment-plan, nightly-web-setup]
    runs-on: ubuntu-latest
    # Measurement-only budgets (LEAD 2026-10-17): static weights put every layout near the
    # production 30/40-minute limits, so a timeout would hide the measurement. Headroom is
    # reported against the production budgets (browser step 30, job 40), not these.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.experiment-plan.outputs.matrix) }}
    env:
      PW_RETRIES: '0'
      EXPERIMENT_WORKERS: ${{ inputs.workers }}
      EXPERIMENT_SHARD: ${{ matrix.shard }}
      EXPERIMENT_SHARDS: ${{ inputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Download shared web runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-runtime
          path: ${{ runner.temp }}/web-runtime
      - name: Restore web runtime
        run: tar -xf "$RUNNER_TEMP/web-runtime/web-runtime.tar"
      - name: Restore Playwright browsers
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ needs.nightly-web-setup.outputs.browser-cache-key }}
          fail-on-cache-miss: true
      # OS libraries are per runner; browser downloads and npm ci are shared.
      - name: Install Chromium system dependencies
        timeout-minutes: 13
        working-directory: web
        run: bash "$GITHUB_WORKSPACE/scripts/ci/bounded-apt.sh" playwright install-deps chromium
      - name: Run selected UI cases without retries
        timeout-minutes: 50
        env:
          RELEASE_LIST_SHOTS: ${{ runner.temp }}/aeon-release-list-shots
          AEON_DESK_SHOTS: ${{ runner.temp }}/aeon-desk-shots
          ATTACH_DISCOVERABLE_SHOTS: ${{ runner.temp }}/aeon-attach-shots
          ATTACH_SHOTS: ${{ runner.temp }}/aeon-attach-shots
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { freemem, cpus } from 'node:os';
          import { plan, run } from './scripts/test-tiers/cli.mjs';
          import { key } from './scripts/test-tiers/core.mjs';
          import { loadManifest } from './web/scripts/ci-web-shard.mjs';
          import { runPlaywright } from './scripts/playwright-safe.mjs';

          // AEON-1335 helpers: keep worker policy and accounting independently checkable.
          function experimentPolicy(policy) {
            return { ...policy, groups: policy.groups.map(group => ({ ...group, env: {
              ...group.env,
              AEON_WORKER_EXPERIMENT_SERIAL: group.config !== 'playwright.ui.config.ts' ||
                !group.flags.includes('--workers=2') || group.env.AEON_PW_SHARD === '1' ? '1' : '0',
            } })) };
          }
          function workerArguments(args, serial, workers) {
            if (!Number.isInteger(workers) || workers < 1 || workers > 3) throw new Error('Invalid worker count');
            const effective = serial ? 1 : workers;
            if (args.filter(arg => arg === '--workers=1').length !== 1) throw new Error('Unexpected tier worker policy');
            return { effective, args: args.map(arg => arg === '--workers=1' ? `--workers=${effective}` : arg) };
          }
          function activeSeconds(report) {
            if (!Array.isArray(report.suites)) return null;
            const intervals = [];
            let valid = true;
            const visit = suites => {
              for (const suite of suites ?? []) {
                for (const spec of suite.specs ?? []) for (const test of spec.tests ?? []) {
                  if ((test.results ?? []).length !== 1) valid = false;
                  for (const result of test.results ?? []) {
                    if (result.status === 'skipped') continue;
                    if (!['passed', 'failed', 'timedOut'].includes(result.status)) valid = false;
                    const start = Date.parse(result.startTime), end = start + result.duration;
                    if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) valid = false;
                    else intervals.push([start, end]);
                  }
                }
                visit(suite.suites);
              }
            };
            visit(report.suites);
            if (!valid || report.errors?.length) return null;
            intervals.sort((a, b) => a[0] - b[0]);
            let milliseconds = 0, end = -Infinity;
            for (const [start, stop] of intervals) { milliseconds += Math.max(0, stop - Math.max(start, end)); end = Math.max(end, stop); }
            return milliseconds / 1000;
          }
          // AEON-1335 execution: hosted dispatch only; never call this from local validation.
          const env = process.env;
          if (env.GITHUB_EVENT_NAME !== 'workflow_dispatch' || env.GITHUB_REF !== 'refs/heads/exp/aeon-1335-workers' ||
              env.GITHUB_ACTIONS !== 'true' || env.RUNNER_ENVIRONMENT !== 'github-hosted' ||
              env.RUNNER_OS !== 'Linux' || cpus().length !== 4) throw new Error('Experiment requires its scratch ref and 4-vCPU hosted Linux');
          const workers = Number(env.EXPERIMENT_WORKERS), index = Number(env.EXPERIMENT_SHARD), count = Number(env.EXPERIMENT_SHARDS);
          if (![[12, 1], [6, 2], [4, 3]].some(([m, n]) => m === count && n === workers) ||
              !Number.isInteger(index) || index < 1 || index > count) throw new Error('Invalid experiment layout');
          const job = `web-shard-${index}`, directory = resolve('tmp/test-tiers');
          const launches = [], memory = { samples: 0, minFreeBytes: null, peakCgroupBytes: null, eventsBefore: null, eventsAfter: null };
          const cgroup = name => { try { return readFileSync(`/sys/fs/cgroup/${name}`, 'utf8').trim(); } catch { return null; } };
          const events = () => {
            const value = cgroup('memory.events');
            return value === null ? null : Object.fromEntries(value.split('\n').filter(Boolean).map(line => {
              const [name, count] = line.split(/\s+/); return [name, Number(count)];
            }));
          };
          const sample = () => {
            memory.samples++;
            const free = freemem(), current = cgroup('memory.current');
            memory.minFreeBytes = Math.min(memory.minFreeBytes ?? free, free);
            if (current !== null && Number.isFinite(Number(current))) memory.peakCgroupBytes = Math.max(memory.peakCgroupBytes ?? 0, Number(current));
          };
          const policy = experimentPolicy(loadManifest());
          const selection = plan('web', { env, event: 'workflow_dispatch', paths: [], all: true, index, count, cache: false });
          memory.eventsBefore = events(); sample();
          const timer = setInterval(sample, 1000);
          const dependencies = {
            loadBrowserPolicy: () => policy,
            runPlaywright: async (args, options) => {
              const serial = options.env.AEON_WORKER_EXPERIMENT_SERIAL === '1';
              const chosen = workerArguments(args, serial, workers);
              const started = performance.now();
              const result = await runPlaywright(chosen.args, { ...options, env: { ...options.env,
                ...(serial ? { AEON_PW_SHARD: '1' } : {}), PW_WORKERS: String(chosen.effective) } });
              const wallSeconds = (performance.now() - started) / 1000;
              let active = null;
              try { active = activeSeconds(JSON.parse(readFileSync(options.env.PLAYWRIGHT_JSON_OUTPUT_FILE, 'utf8'))); } catch {}
              launches.push({ workers: chosen.effective, serial, config: args[args.indexOf('--config') + 1],
                result: result.code, wallSeconds, activeSeconds: active,
                nonCaseSeconds: active === null || active > wallSeconds ? null : wallSeconds - active,
                browserProcesses: result.metrics });
              return result;
            },
          };
          let firstCode = 1, retryCode = null, first, retry, failed = [];
          try {
            firstCode = await run('web', selection, { env, job }, dependencies);
            first = JSON.parse(readFileSync(resolve(directory, `${job}-measurement.json`), 'utf8'));
            const failedKeys = new Set(first.browserCases.filter(row => row.status === 'failed').map(row => row.key));
            failed = selection.tests.filter(row => failedKeys.has(key(row)));
            // Bounded, explicit diagnostic retry; first-pass failure remains red.
            if (!first.runnerFailure && first.execution.status === 'completed' && failed.length > 0 && failed.length <= 3) {
              retryCode = await run('web', { ...selection, tests: failed, full: false, scope: 'experiment-failed-cases',
                timing: { collectSeconds: 0, planSeconds: 0 } }, { env, job: `${job}-retry` }, dependencies);
              retry = JSON.parse(readFileSync(resolve(directory, `${job}-retry-measurement.json`), 'utf8'));
            }
          } finally {
            clearInterval(timer); sample(); memory.eventsAfter = events();
            writeFileSync(resolve(directory, `${job}-experiment.json`), JSON.stringify({
              sha: env.GITHUB_SHA, run: env.GITHUB_RUN_ID, attempt: env.GITHUB_RUN_ATTEMPT, workers, index, count,
              firstCode, retryCode, firstPassFailures: first ? failed.length : null,
              failThenPass: retry?.browserCases.filter(row => row.status === 'passed').map(row => row.key) ?? [],
              retryIncomplete: failed.length > 0 && (!retry || retry.runnerFailure || retry.execution.status !== 'completed'),
              launches, memory,
              accounting: 'Use complete Actions job durations for runner-minutes. Summed case durations are worker-seconds; nonCaseSeconds uses the union of case intervals. Cgroup readings may be unavailable; samples are not a proof of no OOM.',
            }, null, 2) + '\n');
          }
          process.exitCode = firstCode;
          JS
      - name: Preserve browser tier measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-shard-${{ matrix.shard }}-tier-measurements
          path: tmp/test-tiers/
          if-no-files-found: warn
          retention-days: 8
          overwrite: true
      - name: Preserve shard traces and screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-shard-${{ matrix.shard }}-evidence
          path: |
            web/test-results/
            web/playwright-report/
            .agent-shots/planning/
            .agent-shots/queue/
            ${{ runner.temp }}/aeon-release-list-shots/
            ${{ runner.temp }}/aeon-desk-shots/
            ${{ runner.temp }}/aeon-attach-shots/
            ${{ runner.temp }}/aeon-521a-shots/
            ${{ runner.temp }}/status-autopilot-shots/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

name: backend-full

# Full execution is nightly and on demand, never on ordinary main pushes.
# Dispatch may pin an older protected-main commit for a release. The run title
# binds that checkout to evidence even if main advances before dispatch starts.
run-name: backend-full ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact protected-main commit to verify (empty uses dispatch head)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  backend-full-authorize:
    if: github.event_name != 'pull_request' || github.event.label.name == 'backend-full-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.authorize.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Authorize exhaustive backend evidence
        id: authorize
        env:
          BACKEND_FULL_LABEL: ${{ github.event.label.name }}
          BACKEND_FULL_REQUESTED_SHA: ${{ inputs.target_sha }}
          BACKEND_FULL_TARGET_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          scripts/backend-full-authorize.sh
          target="$BACKEND_FULL_TARGET_SHA"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ -n "$BACKEND_FULL_REQUESTED_SHA" ]]; then
            git merge-base --is-ancestor "$target" origin/main || exit 1
          fi
          echo "source_sha=$target" >> "$GITHUB_OUTPUT"

  backend-full-serial:
    needs: backend-full-authorize
    runs-on: ubuntu-latest
    # Exact-main run 33871597020 started handlers 19m05s into the full step;
    # its 747th of 749 tests then exhausted the old 30m Go alarm. A 40m package
    # alarm gives 33% measured headroom. The 90m job leaves more than 20m over
    # the observed pre-package + package cap + 4m25s post-package tail.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.backend-full-authorize.outputs.source_sha }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Backend - full serial suite
        working-directory: backend
        run: go test -count=1 -p 1 -timeout=40m ./...

      - name: Backend - unsupported platform fails closed
        working-directory: backend
        run: |
          go test -tags paimos_test_unsupported -count=1 ./cmd/paimos -run '^TestUnsupportedPlatformProcessOwnershipFailsClosed$'
          go test -tags paimos_test_unsupported -count=1 ./agentd ./agentdwire ./ownedprocess -run '^TestUnsupportedPlatform'

  backend-full-race:
    needs: backend-full-authorize
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, handlers, runtime]
    # PAI-991: exact release run 34514767389 exhausted the 90m core job
    # during the second agentmode invocation. All ten handler invocations
    # had already passed, using about 45m. Give those unchanged invocations
    # their own sequential runner; core retains every other package and its
    # existing limits. Runtime and the full serial suite remain unchanged.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.backend-full-authorize.outputs.source_sha }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Backend - broad control-plane race (${{ matrix.group }})
        working-directory: backend
        # The runner walks package-local and handler shard concurrency contracts sequentially.
        # That stays broad without starving latency-budget tests by racing all
        # heavyweight packages against each other on one shared CI machine.
        # Run 33871597020 proved supervision reached its final selected test at
        # 7m32s and then exhausted the old 8m package cap during migration 152.
        # Fifteen minutes keeps a finite per-package alarm within the 90m job.
        env:
          BACKEND_RACE_PACKAGE_TIMEOUT: 15m
        run: ../scripts/backend-pr-race.sh --group="${{ matrix.group }}" './...'

  backend-full:
    if: always() && (github.event_name != 'pull_request' || github.event.label.name == 'backend-full-evidence')
    needs: [backend-full-authorize, backend-full-serial, backend-full-race]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require serial assurance and every race group
        env:
          AUTHORIZATION: ${{ needs.backend-full-authorize.result }}
          SERIAL: ${{ needs.backend-full-serial.result }}
          RACE: ${{ needs.backend-full-race.result }}
        run: |
          set -euo pipefail
          [[ "$AUTHORIZATION" == 'success' ]] || exit 1
          [[ "$SERIAL" == 'success' ]] || exit 1
          [[ "$RACE" == 'success' ]] || exit 1

# SPDX-License-Identifier: AGPL-3.0-only
name: Full UI QA

on:
  schedule:
    # Once nightly, away from the top-of-hour Actions rush (02:37 UTC).
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to test (blank means main)'
        required: false
        type: string
        default: main
  pull_request:
    types: [opened, reopened, synchronize, labeled]

# All tested refs, including manual refs and fork PRs, stay on hosted runners.
# No repository secrets or persistent checkout credentials enter the tests.
permissions:
  contents: read

jobs:
  qa-source:
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'full-qa') &&
       (github.event.action != 'labeled' || github.event.label.name == 'full-qa'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'main' || github.event_name == 'workflow_dispatch' && (inputs.ref || 'main') || github.sha }}
      - name: Bind every shard to the same immutable commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  qa-shard:
    needs: qa-source
    runs-on: ubuntu-latest
    # The existing offline audit itself allows 60 minutes. Leave room for
    # dependency/browser setup and the other tests assigned to that shard.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, config: playwright.ui.config.ts, partition: 1/8 }
          - { shard: 2, config: playwright.ui.config.ts, partition: 2/8 }
          - { shard: 3, config: playwright.ui.config.ts, partition: 3/8 }
          - { shard: 4, config: playwright.ui.config.ts, partition: 4/8 }
          - { shard: 5, config: playwright.ui.config.ts, partition: 5/8 }
          - { shard: 6, config: playwright.ui.config.ts, partition: 6/8 }
          - { shard: 7, config: playwright.ui.config.ts, partition: 7/8 }
          - { shard: 8, config: playwright.ui.config.ts, partition: 8/8 }
          # Keep the complete inventory: cold loads need the production build,
          # never the throttled development module graph (AEON-1527).
          - { shard: performance, config: playwright.perf.config.ts, partition: 1/1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.qa-source.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        timeout-minutes: 13
        working-directory: web
        run: bash "$GITHUB_WORKSPACE/scripts/ci/bounded-apt.sh" playwright install --with-deps chromium
      # ci.yml's visual-comparison owns visual checkpoints in the pinned renderer;
      # visual-capture.yml's visual-reference-capture owns reference capture.
      # This runner explicitly excludes tests/visual/** from its file arguments.
      - name: Run the non-visual UI inventory and production performance suite without retries
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/full-ui-results.json
          # Mocked UI inventory. The performance partition does not use the readiness setup.
          AEON_REQUIRE_BACKEND: 'off'
        run: >-
          if [ "${{ matrix.config }}" = playwright.ui.config.ts ]; then
          node ../scripts/full-ui-qa-shard.mjs '${{ matrix.partition }}';
          else
          npx playwright test -c ${{ matrix.config }}
          --shard=${{ matrix.partition }} --workers=1 --retries=0 --forbid-only
          --trace=retain-on-failure --reporter=github,line,json;
          fi
      - name: Preserve shard results and failed browser traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-ui-qa-${{ github.run_attempt }}-${{ matrix.shard }}
          path: web/test-results/
          if-no-files-found: warn
          retention-days: 7

  qa-full:
    name: full-ui-qa
    if: ${{ always() && needs.qa-source.result != 'skipped' }}
    needs: [qa-source, qa-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize and require every shard
        env:
          SOURCE_RESULT: ${{ needs.qa-source.result }}
          SHARD_RESULT: ${{ needs.qa-shard.result }}
          TESTED_SHA: ${{ needs.qa-source.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo '## Full UI QA'
            printf 'Tested commit: `%s`\n\n' "$TESTED_SHA"
            printf 'Source resolution: **%s**\n\n' "$SOURCE_RESULT"
            printf 'All eight UI shards and the production performance suite: **%s**\n\n' "$SHARD_RESULT"
            echo 'One browser worker per shard; zero retries; complete non-visual UI and performance inventories.'
            echo 'tests/visual/**: EXCLUDED; checkpoints belong to ci.yml visual-comparison in the pinned renderer.'
            echo 'Per-shard JSON results and failed traces are attached as full-ui-qa artifacts.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$SOURCE_RESULT" = success
          test "$SHARD_RESULT" = success

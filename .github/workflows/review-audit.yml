# SPDX-License-Identifier: AGPL-3.0-only
name: Weekly review audit plan
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  audit-plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Select the previous UTC week's merged PRs for independent audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_REPOSITORY: ${{ github.repository }}
        run: node scripts/review-audit.mjs plan --repository "$AUDIT_REPOSITORY" --output review-audit-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-audit-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-audit-plan.json
          retention-days: 30
          if-no-files-found: error

# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  # One run per change (AEON-419): pushes to main, pull requests, and the merge queue.
  # A bare `push:` also ran on every PR branch push, doubling CI load under the 20-job limit.
  push:
    branches: [main]
  pull_request:
  merge_group:

# A newer push to the same pull request supersedes its older run; main and the queue always finish.
concurrency:
  # Unique per non-PR run: main pushes and queue runs never share a group, so none is cancelled while pending.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runner-route:
    uses: ./.github/workflows/test-runner-route.yml

  go-test:
    strategy:
      fail-fast: false
      matrix:
        # Seven shards. Five peaked at 232s. Six, splitting every package over 90s,
        # started one process per package and peaked at 254s. Only packages over 140s are split.
        shard: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeon -d aeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Maintenance database only. This user is the image superuser, so tests may CREATE DATABASE.
      AEON_TEST_DATABASE_URL: postgres://aeon:aeon@127.0.0.1:5432/aeon?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
      - name: Install shells when this shard runs pairing path-proof tests
        run: |
          set -euo pipefail
          need="$(go run ./scripts/ci-go-shards needs-shell -shard "${{ matrix.shard }}")"
          if [ "$need" = yes ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
          fi
      - name: Test this shard
        run: go run ./scripts/ci-go-shards test -shard "${{ matrix.shard }}"
      # Run 36704871290 wall clock: shards 1..7 finished in 199s, 195s, 194s, 165s, 177s, 196s, 175s.
      # Shard 4 is the shortest, so the serial timing step is appended there.
      - name: Timing budgets, alone
        if: success() && matrix.shard == 4
        run: go run ./scripts/ci-go-shards test-timing

  go-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
      - run: go vet ./...
      - name: Check prepared rules bootstrap drift
        run: go run ./scripts/rules-bootstrap check
      - name: Check the shard list covers go test ./...
        run: go run ./scripts/ci-go-shards check

  # Job id go is the required check. It stays red when a shard or the static
  # job fails because if: always() still runs this gate.
  go:
    if: always()
    needs: [go-test, go-static]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Go shard and the static checks
        env:
          GO_TEST: ${{ needs.go-test.result }}
          GO_STATIC: ${{ needs.go-static.result }}
        run: |
          set -euo pipefail
          echo "go-test=${GO_TEST} go-static=${GO_STATIC}"
          test "${GO_TEST}" = success
          test "${GO_STATIC}" = success

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm run build

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node scripts/verify-release.mjs
      - run: node --test scripts/homebrew-formula.test.mjs scripts/homebrew-tap-pr.test.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Enforce test runner trust boundary
        run: |
          node --test scripts/ci-runner-route.test.mjs
          go test ./scripts/ci-runner-guard
          go run ./scripts/ci-runner-guard

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeon -d aeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AEON_ENV: dev
      AEON_DATABASE_URL: postgres://aeon:aeon@127.0.0.1:5432/aeon?sslmode=disable
      BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Build server
        run: go build -tags webembed -o bin/paimos ./cmd/aeon
      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start server and run smoke
        run: |
          set -euo pipefail
          nohup ./bin/paimos serve >"$RUNNER_TEMP/aeon.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/aeon.pid"
          ready=0
          for _ in $(seq 1 30); do
            if curl -sf "$BASE_URL/api/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "server did not become ready" >&2
            cat "$RUNNER_TEMP/aeon.log" >&2 || true
            exit 1
          fi
          npm run e2e --prefix web

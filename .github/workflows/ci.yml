  e2e:
    needs: tree-reuse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ needs.tree-reuse.outputs.reuse != 'tree' && 'pgvector/pgvector:pg18' || '' }}
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeon -d aeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AEON_ENV: dev
      AEON_DATABASE_URL: postgres://aeon:aeon@127.0.0.1:5432/aeon?sslmode=disable
      BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Reuse the verified successful tree
        if: needs.tree-reuse.outputs.reuse == 'tree'
        run: echo 'reuse=tree; successful full suite verified by repository, workflow, run and tree'
      - uses: actions/checkout@v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
      - uses: actions/setup-go@v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npm ci
      - name: Build web
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npm run build
      - name: Build server
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: go build -tags webembed -o bin/paimos ./cmd/aeon
      - name: Install Playwright
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Measure Chromium shell cleanup on success, failure and interruption
        if: needs.tree-reuse.outputs.reuse != 'tree'
        env:
          AEON_BROWSER_LIFECYCLE: '1'
        run: node --test --test-concurrency=1 scripts/playwright-safe.test.mjs
      - name: Start server and run smoke
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: |
          set -euo pipefail
          nohup ./bin/paimos serve >"$RUNNER_TEMP/aeon.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/aeon.pid"
          ready=0
          for _ in $(seq 1 30); do
            if curl -sf "$BASE_URL/api/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "server did not become ready" >&2
            cat "$RUNNER_TEMP/aeon.log" >&2 || true
            exit 1
          fi
          npm run e2e --prefix web
      - name: Test workspace model provider controls
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npm test -- tests/model-provider.spec.ts --workers=1


          cache-dependency-path: go.sum
      - name: Tree reuse provenance and workflow regressions
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: |
          node --test scripts/ci-tree-reuse.test.mjs
          go test ./scripts/releaseworkflow -count=1
      - name: Enforce test runner trust boundary
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: |
          node --test scripts/ci-runner-route.test.mjs

# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  # One run per change (AEON-419): pushes to main, pull requests, and the merge queue.
  # A bare `push:` also ran on every PR branch push, doubling CI load under the 20-job limit.
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    # Nightly full UI run. The quarantine project retries on other events;
    # this run passes --retries=0 so a flake fails in the open.
    - cron: '15 4 * * *'

# A newer push to the same pull request supersedes its older run; main and the queue always finish.
concurrency:
  # Unique per non-PR run: main pushes and queue runs never share a group, so none is cancelled while pending.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeon -d aeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Maintenance database only. This user is the image superuser, so tests may CREATE DATABASE.
      AEON_TEST_DATABASE_URL: postgres://aeon:aeon@127.0.0.1:5432/aeon?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Install the shells the pairing command tests run in
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - run: go vet ./...
      - run: go test ./...
      - name: Check prepared rules bootstrap drift
        run: go run ./scripts/rules-bootstrap check

  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: Reject mutations of imported fixtures
        run: node --test scripts/check-fixture-mutation.test.mjs
      - name: Check duration shard selection
        run: node --test scripts/playwright-ui-shards.test.mjs
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm run build

  release-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node scripts/verify-release.mjs
      - run: node --test scripts/homebrew-formula.test.mjs scripts/homebrew-tap-pr.test.mjs

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeon -d aeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AEON_ENV: dev
      AEON_DATABASE_URL: postgres://aeon:aeon@127.0.0.1:5432/aeon?sslmode=disable
      BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Build server
        run: go build -tags webembed -o bin/paimos ./cmd/aeon
      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start server and run smoke
        run: |
          set -euo pipefail
          nohup ./bin/paimos serve >"$RUNNER_TEMP/aeon.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/aeon.pid"
          ready=0
          for _ in $(seq 1 30); do
            if curl -sf "$BASE_URL/api/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "server did not become ready" >&2
            cat "$RUNNER_TEMP/aeon.log" >&2 || true
            exit 1
          fi
          npm run e2e --prefix web

  # Eight jobs, one worker each. Files and independent audit states are packed
  # by measured duration. With four Go shards, vet and the Go gate, plus web,
  # e2e, release-check and the Playwright gate, this is 18 jobs (limit: 19).
  # Quarantine retries stay project-local; nightly explicitly sets retries=0.
  playwright-shard:
    name: playwright (${{ matrix.shard }}/8)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'schedule'
    # Measure the serial configuration on standard M1 runners. The Free plan
    # schedules at most five macOS jobs at once; retain eight one-worker jobs.
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps --only-shell chromium
      - name: UI shard
        env:
          PW_NIGHTLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
          PW_COMPILED_UI: '1'
        run: node scripts/playwright-ui-shards.mjs --shard=${{ matrix.shard }}/8

  playwright:
    name: playwright
    needs: [playwright-shard]
    if: ${{ always() && !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every UI and audit shard
        shell: bash
        env:
          SHARD: ${{ needs.playwright-shard.result }}
        run: |
          set -euo pipefail
          echo "playwright-shard: ${SHARD}"
          test "${SHARD}" = "success"

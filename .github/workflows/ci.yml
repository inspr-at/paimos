# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  # One run per change (AEON-419): pushes to main, pull requests, and the merge queue.
  # A bare `push:` also ran on every PR branch push, doubling CI load under the 20-job limit.
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A newer push to the same pull request supersedes its older run; main and the queue always finish.
concurrency:
  # Unique per non-PR run: main pushes and queue runs never share a group, so none is cancelled while pending.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Read-only, bounded proof lookup. Any lookup failure falls back to full CI.
  tree-reuse:
    permissions:
      contents: read
      actions: read
      packages: read
    runs-on: ubuntu-latest
    # Checkout has its own retries; a failed proof must never suppress CI.
    continue-on-error: true
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      # GitHub persists the evaluated SHA in this run attempt's job metadata.
      # The completion publisher must never use the PR's later live merge ref.
      - name: Checkout tested commit ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify a successful full-suite tree
        id: proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_TREE_REUSE: ${{ vars.CI_TREE_REUSE }}
        run: node scripts/ci-tree-reuse.mjs check

  runner-route:
    uses: ./.github/workflows/test-runner-route.yml
    with:
      required-idle-runners: 4

  go-test:
    needs: [runner-route, tree-reuse]
    strategy:
      fail-fast: false
      matrix:
        # Use the same event/ref/attempt guards as runs-on when evaluated.
        # Re-run all jobs: partial reruns may retain earlier matrix values.
        shard: ${{ fromJSON(contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && needs.runner-route.outputs.run_attempt == github.run_attempt && needs.runner-route.outputs.runner_class == 'mbp2606' && '[1, 2, 3, 4]' || '[1, 2, 3, 4, 5, 6, 7]') }}
    runs-on: ${{ fromJSON(contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && needs.runner-route.outputs.run_attempt == github.run_attempt && needs.runner-route.outputs.runs_on || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: ${{ needs.tree-reuse.outputs.reuse != 'tree' && 'pgvector/pgvector:pg18' || '' }}
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeon -d aeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Maintenance database only. This user is the image superuser, so tests may CREATE DATABASE.
      AEON_TEST_DATABASE_URL: postgres://aeon:aeon@127.0.0.1:5432/aeon?sslmode=disable
      AEON_GO_SHARD_COUNT: ${{ strategy.job-total }}
      # Four-shard reruns may retain the Mac layout on hosted hardware. Never
      # replay test results from the self-hosted runner's persistent GOCACHE.
      GOFLAGS: ${{ strategy.job-total == 4 && '-count=1' || '' }}
    steps:
      - name: Reuse the verified successful tree
        if: needs.tree-reuse.outputs.reuse == 'tree'
        run: echo 'reuse=tree; successful full suite verified by repository, workflow, run and tree'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
        id: setup-go
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum
      - name: Locate Go build cache
        if: needs.tree-reuse.outputs.reuse != 'tree'
        id: go-cache-path
        run: echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # setup-go's dependency snapshot is immutable. Refresh compiled artifacts
      # per source revision and shard, restoring the branch first, then main.
      # GOCACHE also holds test results; all shard tests bypass those below.
      # GitHub scopes PR writes to refs/pull/N/merge; main cannot restore them.
      - name: Persist Go build cache
        if: needs.tree-reuse.outputs.reuse != 'tree'
        id: go-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.go-cache-path.outputs.path }}
          key: go-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ strategy.job-total }}-${{ matrix.shard }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            go-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ strategy.job-total }}-${{ matrix.shard }}-${{ github.head_ref || github.ref_name }}-
            go-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ strategy.job-total }}-${{ matrix.shard }}-main-
      - name: Install shells when this shard runs pairing path-proof tests
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: |
          set -euo pipefail
          need="$(go run ./scripts/ci-go-shards needs-shell -count "$AEON_GO_SHARD_COUNT" -shard "${{ matrix.shard }}")"
          if [ "$need" = yes ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
          fi
      - name: Test this shard
        if: needs.tree-reuse.outputs.reuse != 'tree'
        env:
          # Applies to every go test child, including PR and merge-group runs.
          # External scripts and database images are outside Go's test cache id.
          GOFLAGS: -count=1
        run: |
          set -euo pipefail
          go run ./scripts/ci-go-shards test -count "$AEON_GO_SHARD_COUNT" -shard "${{ matrix.shard }}" 2>&1 | tee "$RUNNER_TEMP/go-test.log"
          cached=$(grep -cE '^ok[[:space:]].*\(cached\)$' "$RUNNER_TEMP/go-test.log" || true)
          packages=$(grep -cE '^ok[[:space:]]' "$RUNNER_TEMP/go-test.log" || true)
          printf 'Go shard %s/%s: %s successful package invocations, %s cached\n' "${{ matrix.shard }}" "$AEON_GO_SHARD_COUNT" "$packages" "$cached" >> "$GITHUB_STEP_SUMMARY"
          test "$cached" -eq 0
      - name: Record successful test evidence
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: |
          case "$RUNNER_ENVIRONMENT" in
            github-hosted) runner_class=hosted ;;
            self-hosted) runner_class=mbp2606 ;;
            *) exit 1 ;;
          esac
          printf 'Green test result: runner_class=%s commit=%s event=%s shards=%s\n' "$runner_class" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$AEON_GO_SHARD_COUNT" >> "$GITHUB_STEP_SUMMARY"

  # Timing budgets were calibrated on hosted hardware. Always run this job,
  # regardless of the selected shard layout or which jobs are being rerun.
  go-timing:
    needs: tree-reuse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ needs.tree-reuse.outputs.reuse != 'tree' && 'pgvector/pgvector:pg18' || '' }}
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeon -d aeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AEON_TEST_DATABASE_URL: postgres://aeon:aeon@127.0.0.1:5432/aeon?sslmode=disable
    steps:
      - name: Reuse the verified successful tree
        if: needs.tree-reuse.outputs.reuse == 'tree'
        run: echo 'reuse=tree; successful full suite verified by repository, workflow, run and tree'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum
      - name: Timing budgets, alone
        if: needs.tree-reuse.outputs.reuse != 'tree'
        env:
          GOFLAGS: -count=1
        run: go run ./scripts/ci-go-shards test-timing

  go-static:
    needs: tree-reuse
    runs-on: ubuntu-latest
    steps:
      - name: Reuse the verified successful tree
        if: needs.tree-reuse.outputs.reuse == 'tree'
        run: echo 'reuse=tree; successful full suite verified by repository, workflow, run and tree'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum
      - name: Forbid volatile CI identity reads in Go tests
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          # Include multiline calls and indirect reads via named constants.
          volatile = re.compile(r'\bGITHUB_(?:SHA|RUN_ID|RUN_NUMBER|RUN_ATTEMPT)\b')
          allowed = '--source-digest \\"$GITHUB_SHA\\"'
          failures = []
          for path in sorted(pathlib.Path('.').rglob('*_test.go')):
              source = path.read_text()
              # This existing release-contract assertion checks a workflow's
              # literal binding; it does not read the process environment.
              if path.as_posix() == 'scripts/releaseworkflow/workflow_test.go':
                  source = source.replace(allowed, '')
              for match in volatile.finditer(source):
                  line = source.count('\n', 0, match.start()) + 1
                  failures.append(f'{path}:{line}: volatile CI identity in test source')
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              sys.exit(1)
          print('Go tests do not depend on volatile CI identity')
          PY
      - run: go vet ./...
        if: needs.tree-reuse.outputs.reuse != 'tree'
      - name: Check prepared rules bootstrap drift
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: go run ./scripts/rules-bootstrap check
      - name: Check the shard list covers go test ./...
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: |
          go run ./scripts/ci-go-shards check -count 7
          go run ./scripts/ci-go-shards check -count 4

  # Job id go is the required check. It stays red when a shard or the static
  # job fails because if: always() still runs this gate.
  go:
    if: always()
    needs: [go-test, go-static, go-timing]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Go shard and the static checks
        env:
          GO_TEST: ${{ needs.go-test.result }}
          GO_STATIC: ${{ needs.go-static.result }}
          GO_TIMING: ${{ needs.go-timing.result }}
        run: |
          set -euo pipefail
          echo "go-test=${GO_TEST} go-static=${GO_STATIC} go-timing=${GO_TIMING}"
          test "${GO_TEST}" = success
          test "${GO_STATIC}" = success
          test "${GO_TIMING}" = success

  web:
    needs: tree-reuse
    runs-on: ubuntu-latest
    steps:
      - name: Reuse the verified successful tree
        if: needs.tree-reuse.outputs.reuse == 'tree'
        run: echo 'reuse=tree; successful full suite verified by repository, workflow, run and tree'
      - uses: actions/checkout@v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
      - uses: actions/setup-node@v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check Docker web inputs without Docker
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: node --test scripts/docker-web-inputs.test.mjs
      - working-directory: web
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: npm ci
      - name: Install shells used by command round-trip unit tests
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - working-directory: web
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: npm run typecheck
      # The session and run ledger fences (AEON-449): endpoints only in lib/agentRows.ts, wire rows only through the ledger.
      - working-directory: web
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: npm run lint
      # AEON-488: the dock adapter, list, version/header and release-entry regressions
      # run on hosted CI, keeping browser suites off the operator workstation.
      - name: Install shells for command round-trip unit tests
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - working-directory: web
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: npm run test:unit
      - working-directory: web
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: npx playwright install --with-deps chromium
      - name: Capture the round-6 release list for comparison
        if: needs.tree-reuse.outputs.reuse != 'tree'
        id: release-list-before
        working-directory: web
        env:
          RELEASE_LIST_SHOTS: ${{ runner.temp }}/aeon-release-list-shots
          RELEASE_LIST_SHOT_LABEL: before
        run: |
          # Render the immutable prior UI with the current screenshot fixture.
          # Restore the current sources even when capture fails.
          git fetch --no-tags --depth=1 origin 900c24ebef0d6188f300e13b56d1e5f53b7ac54d
          trap 'git show HEAD:web/src/components/ReleaseName.vue > src/components/ReleaseName.vue; git show HEAD:web/src/components/releases/ReleasesSheet.vue > src/components/releases/ReleasesSheet.vue' EXIT
          git show 900c24ebef0d6188f300e13b56d1e5f53b7ac54d:web/src/components/ReleaseName.vue > src/components/ReleaseName.vue
          git show 900c24ebef0d6188f300e13b56d1e5f53b7ac54d:web/src/components/releases/ReleasesSheet.vue > src/components/releases/ReleasesSheet.vue
          npx playwright test -c playwright.ui.config.ts tests/release-codenames.spec.ts --workers=1 -g 'release list screenshot'
      - working-directory: web
        if: needs.tree-reuse.outputs.reuse != 'tree'
        env:
          RELEASE_LIST_SHOTS: ${{ runner.temp }}/aeon-release-list-shots
        run: npx playwright test -c playwright.ui.config.ts tests/release-header.spec.ts tests/release-codenames.spec.ts tests/release-presentation.spec.ts tests/version-reveal.spec.ts tests/releases.spec.ts tests/header-menus.spec.ts tests/brand.spec.ts --workers=1
      - name: Upload release list comparison screenshots
        if: (always() && steps.release-list-before.outcome != 'skipped') && needs.tree-reuse.outputs.reuse != 'tree'
        uses: actions/upload-artifact@v7
        with:
          name: aeon-488-release-list-comparison
          path: ${{ runner.temp }}/aeon-release-list-shots
          if-no-files-found: error
      - working-directory: web
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: npm run test:unit
      - name: Browser runner safety (no browsers)
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npm run test:browser-safety
      - working-directory: web
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: npm run build
      - name: Access scope and role helper tests
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: node --experimental-strip-types --test tests/access.test.ts tests/agent-login.test.ts
      - name: Install browser for access dialog regressions
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Access dialog regressions (hosted only)
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npx playwright test -c playwright.ui.config.ts tests/key-dialog.spec.ts tests/new-agent.spec.ts tests/key-scopes.spec.ts tests/key-expiry.spec.ts tests/access.spec.ts --workers=2 --trace=retain-on-failure
      - name: Preserve failed access dialog traces
        if: (failure()) && needs.tree-reuse.outputs.reuse != 'tree'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: access-dialog-failures
          path: web/test-results/
          retention-days: 7
      - name: Install shells for account command tests
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fish zsh
      - working-directory: web
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: npm run test:unit
      - name: Planning columns regression and theme screenshots
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npx playwright test tests/planning-columns.spec.ts -c playwright.ui.config.ts --workers=2
      - name: Planning screenshot evidence
        if: (always()) && needs.tree-reuse.outputs.reuse != 'tree'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: planning-columns-${{ github.sha }}
          path: .agent-shots/planning/*.png
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Work queue regressions and theme screenshots
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npx playwright test tests/work-queue.spec.ts -c playwright.ui.config.ts --workers=1
      - name: Work queue screenshot evidence
        if: (always()) && needs.tree-reuse.outputs.reuse != 'tree'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: work-queue-${{ github.sha }}
          path: .agent-shots/queue/*.png
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Ticket dispatch, panel and worker regressions
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npx playwright test tests/start-agent.spec.ts tests/ticket-panel.spec.ts tests/ticket-workers.spec.ts -c playwright.ui.config.ts --workers=2

      - name: Session linking unit checks
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: node --experimental-strip-types --test tests/attach-copy.test.ts tests/attach-flow-scope.test.ts tests/attach-watch.test.ts tests/account-link.test.ts
      - name: Morning briefing unit checks
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npx vitest run tests/morning-briefing.unit.test.ts tests/ticket-outcomes.unit.test.ts --maxWorkers=1

      - name: Additional harness brands and pairing vocabulary
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: node --experimental-strip-types --test tests/brandMarks.test.ts tests/agent-pairing.test.ts
      - name: Scope code wire and ceiling checks
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: node --experimental-strip-types --test tests/scope-code.test.ts tests/access.test.ts
      - name: Install browser for session linking regressions
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Controls stay put and affected dialog regressions (AEON-541)
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: >-
          npx playwright test -c playwright.ui.config.ts --workers=2 --trace=retain-on-failure
          tests/no-shift.spec.ts tests/approval-feedback.spec.ts tests/managed-controls.spec.ts
          tests/accounts-computers.spec.ts tests/agents-top.spec.ts
          tests/relations.spec.ts tests/ticket-outcomes.spec.ts tests/views-filters.spec.ts tests/session-recovery.spec.ts
      - name: Session linking, approval and security regressions
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        env:
          ATTACH_DISCOVERABLE_SHOTS: ${{ runner.temp }}/aeon-attach-shots
          ATTACH_SHOTS: ${{ runner.temp }}/aeon-attach-shots
        run: npm test -- tests/attach-discoverable.spec.ts tests/attach-watch.spec.ts tests/attach-security.spec.ts tests/classic-invite.spec.ts tests/access.spec.ts tests/account-link.spec.ts --workers=2
      - name: Preserve account linking screenshots and failures
        if: (always()) && needs.tree-reuse.outputs.reuse != 'tree'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: account-link-browser-evidence
          path: web/test-results/
          retention-days: 7
      - name: Scope proposals and key management regressions
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npx playwright test -c playwright.ui.config.ts tests/scope-codes.spec.ts tests/key-scopes.spec.ts tests/key-expiry.spec.ts --workers=2

      - name: Morning briefing regressions
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npx playwright test -c playwright.ui.config.ts tests/morning-briefing.spec.ts --workers=1

  # AEON-515: footer integration checks run remotely; screenshots stay in artifacts.
  footer-ui:
    needs: tree-reuse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reuse the verified successful tree
        if: needs.tree-reuse.outputs.reuse == 'tree'
        run: echo 'reuse=tree; successful full suite verified by repository, workflow, run and tree'
      - uses: actions/checkout@v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
      - uses: actions/setup-node@v7
        if: needs.tree-reuse.outputs.reuse != 'tree'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: npm ci
      - name: Install shells for web command tests
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - name: Web unit tests
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        run: npm run test:unit
      - working-directory: web
        if: needs.tree-reuse.outputs.reuse != 'tree'
        run: npx playwright install --with-deps chromium
      - name: Footer and affected release/brand integration checks
        if: needs.tree-reuse.outputs.reuse != 'tree'
        working-directory: web
        env:
          AEON_SCREENSHOTS_DIR: test-results/footer-release-pill
        run: >-
          npx playwright test -c playwright.ui.config.ts --workers=2
          tests/footer-release-pill.spec.ts tests/footer-flow-pill.spec.ts
          tests/release-codenames.spec.ts tests/version-reveal.spec.ts
          tests/developer-settings.spec.ts tests/brand.spec.ts tests/tenant-brand.spec.ts
          tests/header-menus.spec.ts tests/shell.spec.ts tests/releases.spec.ts
      - name: Desktop light screenshot
        if: (always()) && needs.tree-reuse.outputs.reuse != 'tree'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: footer-desktop-light
          path: web/test-results/footer-release-pill/desktop-light.png
          if-no-files-found: error
      - name: Desktop dark screenshot
        if: (always()) && needs.tree-reuse.outputs.reuse != 'tree'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:

# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  # One run per change (AEON-419): pushes to main, pull requests, and the merge queue.
  # A bare `push:` also ran on every PR branch push, doubling CI load under the 20-job limit.
  push:
    branches: [main]
  pull_request:
  merge_group:

# A newer push to the same pull request supersedes its older run; main and the queue always finish.
concurrency:
  # Unique per non-PR run: main pushes and queue runs never share a group, so none is cancelled while pending.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runner-route:
    uses: ./.github/workflows/test-runner-route.yml

  go:
    needs: runner-route
    runs-on: ${{ fromJSON(contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && needs.runner-route.outputs.run_attempt == github.run_attempt && needs.runner-route.outputs.runs_on || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeon -d aeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Maintenance database only. This user is the image superuser, so tests may CREATE DATABASE.
      AEON_TEST_DATABASE_URL: postgres://aeon:aeon@127.0.0.1:5432/aeon?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install the shells the pairing command tests run in
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - run: go vet ./...
      - name: Run Go tests with fresh evidence on mbp2606
        run: |
          test_args=()
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            test_args=(-count=1)
          fi
          go test "${test_args[@]}" ./...
      - name: Check prepared rules bootstrap drift
        run: go run ./scripts/rules-bootstrap check
      - name: Record successful test evidence
        run: |
          case "$RUNNER_ENVIRONMENT" in
            github-hosted) runner_class=hosted ;;
            self-hosted) runner_class=mbp2606 ;;
            *) exit 1 ;;
          esac
          printf 'Green test result: runner_class=%s commit=%s event=%s\n' "$runner_class" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm run build

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node scripts/verify-release.mjs
      - run: node --test scripts/homebrew-formula.test.mjs scripts/homebrew-tap-pr.test.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Enforce test runner trust boundary
        run: |
          node --test scripts/ci-runner-route.test.mjs
          go test ./scripts/ci-runner-guard
          go run ./scripts/ci-runner-guard

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeon -d aeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AEON_ENV: dev
      AEON_DATABASE_URL: postgres://aeon:aeon@127.0.0.1:5432/aeon?sslmode=disable
      BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Build server
        run: go build -tags webembed -o bin/paimos ./cmd/aeon
      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start server and run smoke
        run: |
          set -euo pipefail
          nohup ./bin/paimos serve >"$RUNNER_TEMP/aeon.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/aeon.pid"
          ready=0
          for _ in $(seq 1 30); do
            if curl -sf "$BASE_URL/api/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "server did not become ready" >&2
            cat "$RUNNER_TEMP/aeon.log" >&2 || true
            exit 1
          fi
          npm run e2e --prefix web

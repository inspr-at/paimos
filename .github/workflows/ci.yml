# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  # One run per change (AEON-419): pushes to main, pull requests, and the merge queue.
  # A bare `push:` also ran on every PR branch push, doubling CI load under the 20-job limit.
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A newer push to the same pull request supersedes its older run; main and the queue always finish.
concurrency:
  # Unique per non-PR run: main pushes and queue runs never share a group, so none is cancelled while pending.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runner-route:
    uses: ./.github/workflows/test-runner-route.yml
    with:
      required-idle-runners: 4

  go-test:
    needs: runner-route
    strategy:
      fail-fast: false
      matrix:
        # Use the same event/ref/attempt guards as runs-on when evaluated.
        # Re-run all jobs: partial reruns may retain earlier matrix values.
        shard: ${{ fromJSON(contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && needs.runner-route.outputs.run_attempt == github.run_attempt && needs.runner-route.outputs.runner_class == 'mbp2606' && '[1, 2, 3, 4]' || '[1, 2, 3, 4, 5, 6, 7]') }}
    runs-on: ${{ fromJSON(contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && needs.runner-route.outputs.run_attempt == github.run_attempt && needs.runner-route.outputs.runs_on || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeon -d aeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Maintenance database only. This user is the image superuser, so tests may CREATE DATABASE.
      AEON_TEST_DATABASE_URL: postgres://aeon:aeon@127.0.0.1:5432/aeon?sslmode=disable
      AEON_GO_SHARD_COUNT: ${{ strategy.job-total }}
      GOFLAGS: ${{ strategy.job-total == 4 && '-count=1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install shells when this shard runs pairing path-proof tests
        run: |
          set -euo pipefail
          need="$(go run ./scripts/ci-go-shards needs-shell -count "$AEON_GO_SHARD_COUNT" -shard "${{ matrix.shard }}")"
          if [ "$need" = yes ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
          fi
      - name: Test this shard
        run: go run ./scripts/ci-go-shards test -count "$AEON_GO_SHARD_COUNT" -shard "${{ matrix.shard }}"
      - name: Record successful test evidence
        run: |
          case "$RUNNER_ENVIRONMENT" in
            github-hosted) runner_class=hosted ;;
            self-hosted) runner_class=mbp2606 ;;
            *) exit 1 ;;
          esac
          printf 'Green test result: runner_class=%s commit=%s event=%s shards=%s\n' "$runner_class" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$AEON_GO_SHARD_COUNT" >> "$GITHUB_STEP_SUMMARY"

  # Timing budgets were calibrated on hosted hardware. Always run this job,
  # regardless of the selected shard layout or which jobs are being rerun.
  go-timing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeon -d aeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AEON_TEST_DATABASE_URL: postgres://aeon:aeon@127.0.0.1:5432/aeon?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
      - name: Timing budgets, alone
        run: go run ./scripts/ci-go-shards test-timing

  go-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
      - run: go vet ./...
      - name: Check prepared rules bootstrap drift
        run: go run ./scripts/rules-bootstrap check
      - name: Check the shard list covers go test ./...
        run: |
          go run ./scripts/ci-go-shards check -count 7
          go run ./scripts/ci-go-shards check -count 4

  # Job id go is the required check. It stays red when a shard or the static
  # job fails because if: always() still runs this gate.
  go:
    if: always()
    needs: [go-test, go-static, go-timing]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Go shard and the static checks
        env:
          GO_TEST: ${{ needs.go-test.result }}
          GO_STATIC: ${{ needs.go-static.result }}
          GO_TIMING: ${{ needs.go-timing.result }}
        run: |
          set -euo pipefail
          echo "go-test=${GO_TEST} go-static=${GO_STATIC} go-timing=${GO_TIMING}"
          test "${GO_TEST}" = success
          test "${GO_STATIC}" = success
          test "${GO_TIMING}" = success

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck
      # The session and run ledger fences (AEON-449): endpoints only in lib/agentRows.ts, wire rows only through the ledger.
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run build
      - name: Access scope and role helper tests
        working-directory: web
        run: node --experimental-strip-types --test tests/access.test.ts tests/agent-login.test.ts
      - name: Install browser for access dialog regressions
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Access dialog regressions (hosted only)
        working-directory: web
        run: npx playwright test -c playwright.ui.config.ts tests/key-dialog.spec.ts tests/new-agent.spec.ts tests/key-scopes.spec.ts tests/key-expiry.spec.ts tests/access.spec.ts --workers=2 --trace=retain-on-failure
      - name: Preserve failed access dialog traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: access-dialog-failures
          path: web/test-results/
          retention-days: 7

      - name: Session linking unit checks
        working-directory: web
        run: node --experimental-strip-types --test tests/attach-copy.test.ts tests/attach-flow-scope.test.ts tests/attach-watch.test.ts
      - name: Install browser for session linking regressions
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Session linking, approval and security regressions
        working-directory: web
        env:
          ATTACH_DISCOVERABLE_SHOTS: ${{ runner.temp }}/aeon-attach-shots
          ATTACH_SHOTS: ${{ runner.temp }}/aeon-attach-shots
        run: npx playwright test -c playwright.ui.config.ts tests/attach-discoverable.spec.ts tests/attach-watch.spec.ts tests/attach-security.spec.ts --workers=2

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node scripts/verify-release.mjs
      - name: Require this release's own frozen product notes
        run: |
          node --test scripts/check-own-release-notes.test.mjs
          node scripts/check-own-release-notes.mjs
      - run: node --test scripts/homebrew-formula.test.mjs scripts/homebrew-tap-pr.test.mjs scripts/release-timing.test.mjs
      - run: node --test scripts/cross-family-gate.test.mjs
      - run: node --test scripts/release-pin-pr.test.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Enforce test runner trust boundary
        run: |
          node --test scripts/ci-runner-route.test.mjs
          go test ./scripts/ci-runner-guard
          go run ./scripts/ci-runner-guard

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: aeon
          POSTGRES_PASSWORD: aeon
          POSTGRES_DB: aeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeon -d aeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AEON_ENV: dev
      AEON_DATABASE_URL: postgres://aeon:aeon@127.0.0.1:5432/aeon?sslmode=disable
      BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Build server
        run: go build -tags webembed -o bin/paimos ./cmd/aeon
      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start server and run smoke
        run: |
          set -euo pipefail
          nohup ./bin/paimos serve >"$RUNNER_TEMP/aeon.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/aeon.pid"
          ready=0
          for _ in $(seq 1 30); do
            if curl -sf "$BASE_URL/api/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "server did not become ready" >&2
            cat "$RUNNER_TEMP/aeon.log" >&2 || true
            exit 1
          fi
          npm run e2e --prefix web
      - name: Test workspace model provider controls
        working-directory: web
        run: npx playwright test -c playwright.ui.config.ts tests/model-provider.spec.ts --workers=1

  status-autopilot-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: node --experimental-strip-types --test tests/status-autopilot.test.ts
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        env:
          STATUS_AUTOPILOT_SHOTS: ${{ runner.temp }}/status-autopilot-shots
        run: npx playwright test -c playwright.ui.config.ts tests/status-autopilot.spec.ts tests/settings.spec.ts --workers=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: status-autopilot-screenshots
          path: ${{ runner.temp }}/status-autopilot-shots

  # AEON-415: previous-release compatibility uses hosted Linux on every CI event.
  migration-compat:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Resolve the latest published stable release
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
          tag="$(jq -r '.tag_name' <<< "$release")"
          [[ "$tag" =~ ^v[0-9]{12}\.0\.0$ ]] || { echo 'Expected a published calendar release' >&2; exit 1; }
          digest="$(jq -r '.body' <<< "$release" | sed -nE 's/^Digest: (sha256:[a-f0-9]{64})\r?$/\1/p')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Expected one published image digest' >&2; exit 1; }
          git show-ref --verify "refs/tags/$tag" >/dev/null
          echo "Previous published release: $tag; image: ghcr.io/inspr-at/aeon@$digest"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Static migration policy
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          node --test scripts/check-migrations.test.mjs
          node scripts/check-migrations.mjs --base-ref "$PREVIOUS_TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Checker and migration runner SQL splitter parity
        run: GOMAXPROCS=2 go test -p 2 ./internal/db -run '^TestMigrationCheckerSplitParity$' -count=1
      - name: Previous binary on the candidate schema
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          PREVIOUS_DIGEST: ${{ steps.previous.outputs.digest }}
        run: |
          python3 -B -m unittest discover -s scripts -p migration_compat_probe_test.py
          bash scripts/migration-compat.sh "$PREVIOUS_TAG" "$PREVIOUS_DIGEST"

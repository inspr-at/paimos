# SPDX-License-Identifier: AGPL-3.0-only
name: Docker web stage
on:
  workflow_dispatch:
  pull_request:
    paths:
      - web/**
      - internal/**/*.json
      - scripts/**
      - version.json
      - go.mod
      - NOTICE
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-web-check.yml
permissions:
  contents: read
jobs:
  docker-web-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the production Docker web stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: web
          push: false
          provenance: false

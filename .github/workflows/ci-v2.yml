name: ci

# Test on every push and PR. Build + publish the Docker image only on
# pushes to `main` and on tag pushes `v*`. The image is tagged:
#   - `latest` on main
#   - `1.2.3` on tag `v1.2.3` (semver, v-prefix stripped)
#   - `sha-abcdef0` on every push (short commit SHA for pinning)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  # PAI-121: keyless signing via GitHub's OIDC token + sigstore. The
  # cosign step on tag pushes signs the published image and attaches
  # the CycloneDX SBOMs as attestations.
  id-token: write
  # PAI-195: provenance attestations are a first-class release artifact.
  attestations: write

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The DCO gate validates every commit introduced by the PR.
          fetch-depth: 0

      - name: Every PR commit carries its author's DCO sign-off
        run: ./scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  backend-pr-vet:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          # Keep CI, release, container and go.mod on one audited patch.
          # Bump deliberately when govulncheck flags the standard library.
          cache-dependency-path: backend/go.sum

      - name: Backend — vet
        working-directory: backend
        run: go vet ./...

  backend-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Backend — affected package tests
        working-directory: backend
        run: |
          set -euo pipefail
          mapfile -t packages < <(../scripts/backend-changed-packages.sh \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')
          if (( ${#packages[@]} == 0 )); then
            echo 'No backend package changed; affected test lane is empty.'
          else
            printf 'Affected backend package: %s\n' "${packages[@]}"
            ../scripts/backend-pr-test.sh --lane=affected "${packages[@]}"
          fi

  backend-pr-db:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Backend — affected DB tests (four isolated shards)
        working-directory: backend
        run: |
          set -euo pipefail
          mapfile -t packages < <(../scripts/backend-changed-packages.sh \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')
          if (( ${#packages[@]} == 0 )); then
            echo 'No backend package changed; DB test lane is empty.'
          else
            ../scripts/backend-pr-test.sh --lane=db "${packages[@]}"
          fi

  backend-pr-handlers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Backend — affected handler tests (five isolated shards)
        working-directory: backend
        run: |
          set -euo pipefail
          mapfile -t packages < <(../scripts/backend-changed-packages.sh \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')
          if (( ${#packages[@]} == 0 )); then
            echo 'No backend package changed; handler test lane is empty.'
          else
            ../scripts/backend-pr-test.sh --lane=handlers --shard="${{ matrix.shard }}/5" "${packages[@]}"
          fi

  backend-pr-performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      # This unchanged five-second SLO must run on an otherwise-idle runner.
      # Package contention invalidates the measurement; the affected lane runs
      # the parent test's other subtests and excludes only this exact duplicate.
      - name: Backend — isolated Agent Mode performance contract
        working-directory: backend
        run: |
          set -euo pipefail
          mapfile -t packages < <(../scripts/backend-changed-packages.sh \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')
          if (( ${#packages[@]} == 0 )); then
            echo 'No backend package changed; performance test lane is empty.'
          else
            ../scripts/backend-pr-test.sh --lane=performance "${packages[@]}"
          fi

  backend-pr-race:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Backend — directly changed package race
        working-directory: backend
        run: |
          set -euo pipefail
          mapfile -t packages < <(../scripts/backend-changed-packages.sh --direct \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')
          if (( ${#packages[@]} == 0 )); then
            echo 'No backend package changed; affected race lane is empty.'
          else
            ../scripts/backend-pr-race.sh --lane=affected "${packages[@]}"
          fi

  backend-pr-db-race:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Backend — directly changed DB race contracts
        working-directory: backend
        run: |
          set -euo pipefail
          mapfile -t packages < <(../scripts/backend-changed-packages.sh --direct \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')
          if (( ${#packages[@]} == 0 )); then
            echo 'No backend package changed; DB race lane is empty.'
          else
            ../scripts/backend-pr-race.sh --lane=db "${packages[@]}"
          fi

  backend-pr-handlers-race:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Backend — directly changed handler race contracts (five isolated shards)
        working-directory: backend
        run: |
          set -euo pipefail
          mapfile -t packages < <(../scripts/backend-changed-packages.sh --direct \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')
          if (( ${#packages[@]} == 0 )); then
            echo 'No backend package changed; handler race lane is empty.'
          else
            ../scripts/backend-pr-race.sh --lane=handlers --shard="${{ matrix.shard }}/5" "${packages[@]}"
          fi

  backend-security-invariants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Backend — security invariants
        working-directory: backend
        run: go test -count=1 -run '^TestRegression_|^TestAuthzFuzz_' ./handlers/...

      # PAI-809: force the complementary process implementation into the
      # executable Linux test binary. A cross-compile proves only syntax; this
      # test proves the unsupported-platform path withholds the owned-process
      # signal and therefore never issues a running-cancel control lease.
      - name: Backend — unsupported platform fails closed
        working-directory: backend
        run: |
          go test -tags paimos_test_unsupported -count=1 ./cmd/paimos -run '^TestUnsupportedPlatformProcessOwnershipFailsClosed$'
          go test -tags paimos_test_unsupported -count=1 ./agentd ./agentdwire ./ownedprocess -run '^TestUnsupportedPlatform'

  quality:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      # PAI-578: the hygiene/freshness scripts use ripgrep (`rg`), which is
      # not preinstalled on the ubuntu-24 runner image. Without it,
      # check-knowledge-freshness.sh's `rg -q` probes all fail "command not
      # found" and falsely report INSTALL.md version drift.
      - name: Install ripgrep (hygiene scripts depend on rg)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Release hygiene
        run: ./scripts/check-release-hygiene.sh

      - name: Knowledge freshness — live contract
        run: ./scripts/test-knowledge-freshness.sh

      - name: Deploy scripts — target resolution
        run: ./scripts/test-deploy-target.sh

      - name: Release scripts — protected-main flow and recovery
        run: ./scripts/test-release.sh

      - name: CI scripts — backend PR/full split
        run: ./scripts/test-backend-pr-gate.sh

      # PAI-270: prove the dev-login route does NOT ship in production
      # binaries. Build the production binary the same way the
      # Dockerfile does (no `-tags dev_login`, `-ldflags="-s -w"`)
      # and assert the dev-only canary strings are absent. `-s -w`
      # strips debug info but leaves string literals intact, so a
      # string-search is a reliable post-strip invariant. If a future
      # refactor accidentally moves dev-login code into a non-tagged
      # file, one of these greps catches it before the image ships.
      - name: Backend — dev-login symbol absent in production binary (PAI-270)
        working-directory: backend
        run: |
          set -euo pipefail
          go build -trimpath -ldflags="-s -w -buildid=" -o /tmp/paimos-prod .
          # Two canaries: a panic message + a boot-warning, both only
          # in dev_login_dev.go (the build-tag-gated file). Neither
          # appears anywhere else in the codebase as a string literal.
          for canary in \
              "PAIMOS_DEV_LOGIN_TOKEN must be at least 32 chars" \
              "DEV-LOGIN ROUTE ENABLED"
          do
            if grep -aFq "$canary" /tmp/paimos-prod; then
              echo "::error::production binary contains dev-login canary: $canary"
              echo "::error::either the build-tag chain is broken or dev-login code leaked into a non-tagged file"
              exit 1
            fi
          done
          # Inverse sanity check: under -tags dev_login the canaries
          # MUST be present, otherwise the test gives a false-positive
          # all-clear when the canary strings themselves are removed.
          go build -tags dev_login -trimpath -ldflags="-s -w -buildid=" -o /tmp/paimos-dev .
          for canary in \
              "PAIMOS_DEV_LOGIN_TOKEN must be at least 32 chars" \
              "DEV-LOGIN ROUTE ENABLED"
          do
            if ! grep -aFq "$canary" /tmp/paimos-dev; then
              echo "::error::dev-build binary is missing canary: $canary"
              echo "::error::canary string was removed; this test is no longer load-bearing — pick a new canary"
              exit 1
            fi
          done
          echo "✓ dev-login canaries: absent in prod build, present in dev build"

      - name: Backend — dev-login tagged contracts
        working-directory: backend
        run: go test -tags dev_login -count=1 ./auth ./devseed

      - name: Anchor index — verify dogfood anchors
        working-directory: backend
        run: go run ./cmd/paimos anchors verify --repo-root .. --index ../.paimos/anchors.json

  frontend-quality:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — lint + typecheck + test
        working-directory: frontend
        run: |
          npm ci
          npm run schema:check   # generated enums must match the live backend schema (PAI-490)
          npm run lint           # PAI-295: eslint gate (errors fail; existing debt is warnings)
          npm run typecheck
          npm test

  # Keep the protected `test` context stable while its independent lanes run
  # concurrently. The ruleset still fails closed if any relevant lane fails.
  test:
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    needs:
      - backend-pr-vet
      - backend-pr
      - backend-pr-db
      - backend-pr-handlers
      - backend-pr-performance
      - backend-pr-race
      - backend-pr-db-race
      - backend-pr-handlers-race
      - backend-security-invariants
      - quality
      - frontend-quality
    runs-on: ubuntu-latest
    steps:
      - name: Require every event-relevant test lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND_PR_VET: ${{ needs.backend-pr-vet.result }}
          BACKEND_PR: ${{ needs.backend-pr.result }}
          BACKEND_PR_DB: ${{ needs.backend-pr-db.result }}
          BACKEND_PR_HANDLERS: ${{ needs.backend-pr-handlers.result }}
          BACKEND_PR_PERFORMANCE: ${{ needs.backend-pr-performance.result }}
          BACKEND_PR_RACE: ${{ needs.backend-pr-race.result }}
          BACKEND_PR_DB_RACE: ${{ needs.backend-pr-db-race.result }}
          BACKEND_PR_HANDLERS_RACE: ${{ needs.backend-pr-handlers-race.result }}
          BACKEND_SECURITY_INVARIANTS: ${{ needs.backend-security-invariants.result }}
          QUALITY: ${{ needs.quality.result }}
          FRONTEND_QUALITY: ${{ needs.frontend-quality.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            [[ "$BACKEND_PR_VET" == 'success' ]]
            [[ "$BACKEND_PR" == 'success' ]]
            [[ "$BACKEND_PR_DB" == 'success' ]]
            [[ "$BACKEND_PR_HANDLERS" == 'success' ]]
            [[ "$BACKEND_PR_PERFORMANCE" == 'success' ]]
            [[ "$BACKEND_PR_RACE" == 'success' ]]
            [[ "$BACKEND_PR_DB_RACE" == 'success' ]]
            [[ "$BACKEND_PR_HANDLERS_RACE" == 'success' ]]
            [[ "$BACKEND_SECURITY_INVARIANTS" == 'success' ]]
          else
            [[ "$BACKEND_PR_VET" == 'skipped' ]]
            [[ "$BACKEND_PR" == 'skipped' ]]
            [[ "$BACKEND_PR_DB" == 'skipped' ]]
            [[ "$BACKEND_PR_HANDLERS" == 'skipped' ]]
            [[ "$BACKEND_PR_PERFORMANCE" == 'skipped' ]]
            [[ "$BACKEND_PR_RACE" == 'skipped' ]]
            [[ "$BACKEND_PR_DB_RACE" == 'skipped' ]]
            [[ "$BACKEND_PR_HANDLERS_RACE" == 'skipped' ]]
            [[ "$BACKEND_SECURITY_INVARIANTS" == 'skipped' ]]
          fi
          [[ "$QUALITY" == 'success' ]]
          [[ "$FRONTEND_QUALITY" == 'success' ]]

  e2e:
    # PAI-297: E2E smoke — boots the real backend + vite stack and drives the
    # cross-boundary flows with Playwright. Skipped on tag pushes (same
    # reasoning as `test`).
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (boots backend + vite, runs Playwright)
        run: bash scripts/e2e.sh

  security-scan:
    # PAI-365: skip on tag pushes — same reasoning as `test` above.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # PAI-128 / PAI-700: full history is required because the gitleaks
          # step below scans every commit, not just the tip. Before PAI-700
          # this comment was aspirational — the deep checkout was paid for
          # and then discarded by a `--log-opts=-1` scan. It is now accurate.
          fetch-depth: 0

      # PAI-128 / PAI-700: secret scanning. BLOCKING, over FULL HISTORY.
      #
      # The custom paimos-api-key rule in .gitleaks.toml is the targeted
      # defence named in INCIDENT_RESPONSE.md § 3.1 (compromised API key).
      # Known-benign historical matches are forgiven by fingerprint in
      # .gitleaksignore — see that file for the triage record.
      #
      # Runs the gitleaks binary instead of gitleaks/gitleaks-action.
      # The Action is free for personal accounts but requires a paid
      # licence once the repo is organisation-owned, and fails closed with
      # "[inspr-at] is an organization. License key is required." The
      # scanner itself is MIT, so the binary gives identical rules and
      # identical blocking behaviour at no cost.
      #
      # --exit-code defaults to 1, so findings still fail the job.
      # --redact keeps candidate secret values out of the CI log.
      #
      # No --log-opts: gitleaks walks every commit. Until PAI-700 this ran
      # with --log-opts=-1 (tip commit only), so a secret that was committed
      # and then superseded was never scanned. Scanning the full history
      # costs ~0.4s for ~800 commits, so there is no reason to narrow it.
      - name: gitleaks (secret scanning)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          # Keep CI, release, container and go.mod on one audited patch.
          # Bump deliberately when govulncheck flags the standard library.
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: govulncheck (Go vulnerability scan)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # PAI-578: pin gosec to a fixed version. `@latest` silently bumps when
      # a new gosec releases, and its taint/SAST analysis changes findings and
      # line numbers — drifting the committed baseline and turning this gate
      # red with no code change. Bump deliberately (regenerate the baseline in
      # the same commit). govulncheck stays @latest on purpose: it is not
      # baseline-gated and we want the freshest vulnerability database.
      - name: gosec (Go SAST baseline gate)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          ./scripts/check-gosec-baseline.sh

      - name: npm audit (frontend production deps)
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  docker:
    # PAI-365: docker job runs on push events (main + tag).
    # `always() && != 'failure'` lets docker run when test/security
    # were SKIPPED on tag pushes (PAI-365 dedupe), but still gates on
    # SUCCESS for main-branch pushes where they actually executed.
    # Equivalent to: "needs passed OR were intentionally skipped".
    # `needs['security-scan']` uses bracket-notation because the job
    # ID contains a `-`; dot-notation would parse as subtraction.
    if: |
      github.event_name == 'push' &&
      always() &&
      needs.test.result != 'failure' &&
      needs['security-scan'].result != 'failure'
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Bake the correct __APP_VERSION__ into the SPA so the sidebar footer
      # matches the image tag. vite.config.ts reads ../VERSION at build time;
      # on tag pushes we sync it to the git tag, on main we append -dev+<sha>.
      - name: Sync VERSION to git ref
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(cat VERSION)-dev+${GITHUB_SHA:0:7}"
          fi
          printf '%s\n' "$v" > VERSION
          echo "baked VERSION=$v"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Compute SOURCE_DATE_EPOCH
        id: sde
        run: |
          ts=$(git log -1 --format=%ct)
          echo "epoch=$ts" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$ts"

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.epoch }}

      # PAI-121: SBOM + signed release. Run only on tag pushes — main
      # builds keep the existing latest/sha tags untouched, and the
      # heavy work (cyclonedx + cosign + sigstore) only runs when a
      # real release is being cut.
      - name: SBOM — Go (cyclonedx-gomod)
        if: github.ref_type == 'tag'
        working-directory: backend
        run: |
          # Run via `go run` so we don't depend on a third-party
          # GitHub Action; matches what scripts/sbom.sh does locally.
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest \
            app -licenses -json -output ../backend.sbom.json -main .
      - name: SBOM — npm (cyclonedx-npm)
        if: github.ref_type == 'tag'
        working-directory: frontend
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format JSON --output-file ../frontend.sbom.json
      - name: Upload SBOMs to release artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ github.ref_name }}
          path: |
            backend.sbom.json
            frontend.sbom.json
      - uses: sigstore/cosign-installer@v3
        if: github.ref_type == 'tag'
      - name: Cosign — sign image (keyless via GitHub OIDC)
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # Sign every meta tag we just pushed by digest so the
          # signature pins the immutable manifest, not a moving label.
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || cosign sign --yes "$tag@$DIGEST"
          done <<<"${{ steps.meta.outputs.tags }}"
      - name: Cosign — attach SBOM attestations
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          attest_with_retry() {
            local predicate="$1"
            for attempt in 1 2 3; do
              if cosign attest --yes --predicate "$predicate" \
                --type cyclonedx "$IMAGE@$DIGEST"; then
                return 0
              fi
              echo "cosign attest $predicate failed on attempt $attempt; retrying..." >&2
              sleep $((attempt * 5))
            done
            return 1
          }

          attest_with_retry backend.sbom.json
          attest_with_retry frontend.sbom.json
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

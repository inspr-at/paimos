# SPDX-License-Identifier: AGPL-3.0-only
name: Queue correlation
# Observational daily evidence only. No required-check or queue configuration changes.
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Replay recorded queue evidence
        run: node --test scripts/ci-queue-correlate.test.mjs
      - name: Publish completed UTC days with runner wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          to=$(date -u +%Y-%m-%dT00:00:00Z)
          from=$(date -u -d "$to -7 days" +%Y-%m-%dT00:00:00Z)
          node scripts/ci-queue-correlate.mjs --repo "$GITHUB_REPOSITORY" --from "$from" --to "$to" --out tmp/queue-correlation >> "$GITHUB_STEP_SUMMARY"
      - name: Publish replayable Delivery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: queue-correlation
          path: tmp/queue-correlation/
          if-no-files-found: error
          retention-days: 30

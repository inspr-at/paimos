# SPDX-License-Identifier: AGPL-3.0-only
name: Release image dry run

# Branch/PR validation has no signing environment, registry writes or release
# publication. The tag workflow remains the sole publisher and attester.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-image-check.yml
      - scripts/smoke-image.sh
      - scripts/releaseworkflow/**
      - scripts/release-image-index*.mjs
      - scripts/release-pin-pr*.mjs
      - Dockerfile

permissions:
  contents: read

concurrency:
  group: release-image-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-dry-run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cache: buildcache
            runner: ubuntu-24.04
          - arch: arm64
            cache: buildcache-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Check release workflow invariants
        run: |
          go test ./scripts/releaseworkflow
          node --test scripts/release-image-index.test.mjs
          node --test scripts/release-pin-pr.test.mjs
      - name: Validate version and presentation bundle
        id: version
        run: |
          set -euo pipefail
          metadata="$(node scripts/verify-release.mjs --release)"
          node --input-type=module -e 'import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_OUTPUT, "version=" + JSON.parse(process.argv[1]).version + "\n");' "$metadata"
      - name: Release history fixture
        run: go run ./internal/releasehistory/generate -repo . -repository "$GITHUB_REPOSITORY" -offline
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Require native platform
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) echo 'Native runner architecture mismatch' >&2; exit 1 ;; esac
      - name: Build cached smoke image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          provenance: false
          tags: aeon-release-smoke:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/inspr-at/aeon:${{ matrix.cache }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
      - name: Resolve loaded smoke image
        id: smoke-image
        env:
          SMOKE_TAG: aeon-release-smoke:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="$(docker image ls --quiet --no-trunc "$SMOKE_TAG")"
          if [[ ! "$image" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Expected exactly one loaded smoke image' >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Smoke production image
        env:
          AEON_SMOKE_IMAGE: ${{ steps.smoke-image.outputs.image }}
          AEON_SMOKE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/smoke-image.sh
      - name: Record dry run
        run: echo 'linux/${{ matrix.arch }} built and smoked natively; nothing pushed, attested or published.' >> "$GITHUB_STEP_SUMMARY"

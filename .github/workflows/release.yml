# SPDX-License-Identifier: AGPL-3.0-only
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agentd-darwin:
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    # Apple signing secrets live only in this environment, which releases them
    # to v* tag runs (synced from the markus-barta/apple-signing vault). PR and
    # branch CI never reference it.
    environment: release-signing
    # Notarization waits on Apple; it usually takes a few minutes.
    timeout-minutes: 45
    env:
      # Must match the signing identity; the daemon embeds it (expectedTeamID).
      AEON_DEVELOPER_ID_TEAM: P66J39QV6V
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No job that ships a binary restores a Go cache (AEON-422). setup-go's
      # cache is also written by CI jobs on the self-hosted pool and the go
      # command never re-verifies a build-cache entry, so a poisoned entry
      # would be compiled into the release. Each shipped build compiles cold
      # in an empty GOCACHE under RUNNER_TEMP, from modules checked against
      # go.sum (scripts/build-release-binaries.sh enforces both).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Require exact-SHA release rehearsal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release-rehearsal.mjs --sha "$GITHUB_SHA"
      - name: Build darwin paimos-agentd with LocalAuthentication
        env:
          AEON_DARWIN_ARCH: ${{ matrix.arch }}
          GOCACHE: ${{ runner.temp }}/go-build-agentd
          GOMODCACHE: ${{ runner.temp }}/go-mod
          GOFLAGS: -mod=readonly
        run: bash scripts/build-release-binaries.sh darwin-agentd
      # Before upload: SHA256SUMS in the assets job is computed over the signed
      # binary. Bare binaries cannot be stapled; Gatekeeper checks online.
      - name: Sign and notarize paimos-agentd
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ "$APPLE_TEAM_ID" != "$AEON_DEVELOPER_ID_TEAM" ]; then
            echo "::error::signing team does not match AEON_DEVELOPER_ID_TEAM; Mac confirmation would fail closed"
            exit 1
          fi
          bash scripts/sign-notarize.sh --identifier paimos-agentd "dist/paimos-agentd-darwin-${{ matrix.arch }}"
      # Backstop for sign-notarize.sh's EXIT trap, which a cancellation during
      # notarization can skip: however the signing step ended, delete the
      # temporary keychain (private key), drop it from the search list and
      # remove every signing temp file (.p12, .p8, zip). Idempotent. Every
      # operation is attempted; failures are collected and fail the step at
      # the end.
      - name: Remove signing keychain and temp files
        if: always()
        run: |
          set +e +o pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          rt="$(cd "$RUNNER_TEMP" 2>/dev/null && pwd -P)"
          if [ -z "$rt" ] || [ "$rt" -ef / ]; then
            echo "::error::RUNNER_TEMP is not a usable directory; refusing to clean up"
            exit 1
          fi
          failed=0
          for kc in "$rt"/sign.*/signing.keychain-db; do
            [ -e "$kc" ] || continue
            security delete-keychain "$kc" || { echo "::error::could not delete $kc"; failed=1; }
          done
          # Without a readable search list the restore is skipped rather than
          # guessed; delete-keychain above already unlisted what it removed.
          if current="$(security list-keychains -d user)"; then
            kept=()
            while IFS= read -r k; do
              k="${k#"${k%%[![:space:]]*}"}"; k="${k#\"}"; k="${k%\"}"
              case "$k" in ""|*/signing.keychain-db) ;; *) kept+=("$k") ;; esac
            done <<<"$current"
            [ ${#kept[@]} -gt 0 ] || kept=("$HOME/Library/Keychains/login.keychain-db")
            security list-keychains -d user -s "${kept[@]}" || { echo "::error::could not restore the keychain search list"; failed=1; }
          else
            echo "::error::could not read the keychain search list"
            failed=1
          fi
          rm -rf "$rt"/sign.* || failed=1
          if compgen -G "$rt/sign.*" >/dev/null; then
            echo "::error::signing temp files remain"
            failed=1
          fi
          if list="$(security list-keychains -d user)"; then
            case "$list" in *signing.keychain-db*) echo "::error::signing keychain is still on the search list"; failed=1 ;; esac
          else
            echo "::error::could not verify the keychain search list"
            failed=1
          fi
          [ "$failed" = 0 ] || exit 1
          echo "signing keychain and temp files removed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentd-darwin-${{ matrix.arch }}
          path: dist/paimos-agentd-darwin-${{ matrix.arch }}
          if-no-files-found: error

  # The server digest must never wait for signing/notarization or client builds.
  image-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cache: buildcache
            runner: ubuntu-24.04
          - arch: arm64
            cache: buildcache-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # 30 instead of the former 20 minutes: three cold Go compilations (the
    # smoked build and both proof runs) and a cold runtime closure preparation
    # replace the former warm caches. The timeout only guards against a hang.
    timeout-minutes: 30
    permissions:
      # Preserve push access for the draft-aware release immutability lookup.
      contents: write
      actions: read
      packages: write
      attestations: write
      id-token: write
    # One output name per matrix leg; each leg sets only its own.
    outputs:
      runtime_amd64: ${{ steps.runtime.outputs.runtime_amd64 }}
      runtime_arm64: ${{ steps.runtime.outputs.runtime_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release history reads every tag and the commits between them.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # The npm cache stays, unlike the Go caches below: it holds downloaded
      # tarballs only, web/package-lock.json pins a sha512 for every one and
      # npm ci checks that hash for cached and downloaded bytes alike, so
      # altered cache content fails the install instead of shipping.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate inspr-calendar-v2 tag
        id: version
        run: node scripts/release-tag.mjs

      - name: Require an annotated release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
            echo 'Release tags must be annotated: git tag -a "$tag" -m "Release $tag"' >&2
            exit 1
          fi

      - name: Require exact-SHA release rehearsal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release-rehearsal.mjs --sha "$GITHUB_SHA"

      - name: Release checks
        run: node scripts/verify-release.mjs --release

      - name: Tag matches version.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          got=$(node scripts/verify-release.mjs --release)
          node --input-type=module -e 'const got = JSON.parse(process.argv[1]); if (got.version !== process.env.VERSION) { console.error("version.json " + got.version + " does not match tag " + process.env.VERSION); process.exit(1); }' "$got"

      # Include drafts: a rerun must never replace a reserved release or its assets.
      - name: Reject an existing GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name')"
          if printf '%s\n' "$tags" | grep -Fx -- "v${VERSION}" >/dev/null; then
            echo "Release v${VERSION} already exists (draft or published); reserve a new coordinate" >&2
            exit 1
          fi

      # No restored Go cache: see agentd-darwin. Every Go step that feeds the
      # image names its own empty GOCACHE under RUNNER_TEMP; the module cache
      # there is shared within this job and verified before each use.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      # Embed the history in both the smoked and pushed builds. Path context is
      # intentional: the generated manifest is not committed to the tag.
      # The generator's output is linked into the binary, so it runs cold too.
      - name: Release history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOCACHE: ${{ runner.temp }}/go-build-history
          GOMODCACHE: ${{ runner.temp }}/go-mod
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go run ./internal/releasehistory/generate -repo . -repository "${GITHUB_REPOSITORY}"

      - name: Require native platform
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) echo 'Native runner architecture mismatch' >&2; exit 1 ;; esac
      - name: Freeze external build inputs
        id: inputs
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/build-image-inputs.mjs inputs
      - name: Compile web and Go outside Docker
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.inputs.outputs.epoch }}
          GOCACHE: ${{ runner.temp }}/go-build-image
          GOMODCACHE: ${{ runner.temp }}/go-mod
          GOFLAGS: -mod=readonly
        run: node scripts/build-image-inputs.mjs build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Include images left by partial runs; a rerun cannot replace a coordinate.
      - name: Reject an existing image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tags="$(gh api --paginate 'orgs/inspr-at/packages/container/aeon/versions?per_page=100' \
            --jq '.[].metadata.container.tags[]?')"
          if printf '%s\n' "$tags" | grep -Fx -- "$VERSION" >/dev/null; then
            echo "Image tag ${VERSION} is already published; reserve a new coordinate" >&2
            exit 1
          fi

      - name: Pin both exports to the source epoch
        id: source-epoch
        env:
          FROZEN_SOURCE_EPOCH: ${{ steps.inputs.outputs.epoch }}
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          [[ "$epoch" =~ ^[0-9]+$ && "$epoch" == "$FROZEN_SOURCE_EPOCH" ]]
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
      # Prepared cold in every tag build and rehearsal, from the digest-pinned
      # Alpine base and the pinned chromium/tini. No registry cache is read or
      # written for it and no-cache excludes a builder-local layer, so the APK
      # repositories are resolved exactly once per build.
      # Keep one platform result: BUILDKIT_MULTI_PLATFORM=1 forces a manifest
      # list that the Docker exporter rejects even for one target. Load without
      # provenance, then export the same builder/context/args with provenance.
      - name: Prepare pinned runtime closure
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: scripts/Dockerfile.runtime
          platforms: linux/${{ matrix.arch }}
          provenance: false
          no-cache: true
          outputs: type=oci,dest=${{ runner.temp }}/aeon-runtime,tar=false,rewrite-timestamp=true
          build-args: |
            SOURCE_DATE_EPOCH=0
      # Everything after this step uses the closure by this digest only. The
      # summary, the proof evidence and the draft release notes record it: the
      # traceability record for the runtime bytes of this release.
      - name: Bind runtime closure digest
        id: runtime
        run: node scripts/image-evidence.mjs runtime "$RUNNER_TEMP/aeon-runtime" linux/${{ matrix.arch }}
      - name: Start assembly and smoke timing
        run: node scripts/image-evidence.mjs start "$RUNNER_TEMP/image-timing"
      - name: Build cached smoke image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          outputs: type=docker,rewrite-timestamp=true,oci-mediatypes=true
          platforms: linux/${{ matrix.arch }}
          provenance: false
          tags: aeon-release-smoke:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/inspr-at/aeon:${{ matrix.cache }}
          build-contexts: |
            aeon-runtime=oci-layout://${{ runner.temp }}/aeon-runtime@${{ steps.runtime.outputs.digest }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.inputs.outputs.epoch }}

      # BuildKit's config digest is not a runnable ID in every Docker image
      # store. Resolve the loaded tag through the daemon, then pin that ID.
      - name: Resolve loaded smoke image
        id: smoke-image
        env:
          SMOKE_TAG: aeon-release-smoke:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="$(docker image ls --quiet --no-trunc "$SMOKE_TAG")"
          if [[ ! "$image" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Expected exactly one loaded smoke image' >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Smoke production image
        id: smoke
        env:
          AEON_SMOKE_IMAGE: ${{ steps.smoke-image.outputs.image }}
          AEON_SMOKE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/smoke-image.sh

      - name: Record assembly and smoke timing
        if: always()
        env:
          ASSEMBLY_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: node scripts/image-evidence.mjs timing "$RUNNER_TEMP/image-timing" linux/${{ matrix.arch }}

      - name: Prove two clean image rebuilds
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.inputs.outputs.epoch }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          SMOKE_IMAGE: ${{ steps.smoke-image.outputs.image }}
          SMOKE_CONFIG_DIGEST: ${{ steps.build.outputs.imageid }}
          # Each proof run creates its own empty GOCACHE; none is passed here.
          GOMODCACHE: ${{ runner.temp }}/go-mod
          GOFLAGS: -mod=readonly
        run: node scripts/reproduce-image.mjs "$RUNNER_TEMP/aeon-runtime" "$RUNNER_TEMP/image-reproducibility.json"
      - name: Upload image assembly evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-assembly-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/image-timing.json
            ${{ runner.temp }}/image-reproducibility.json
            dist/image-input/inputs.json
            ${{ runner.temp }}/aeon-runtime/index.json
          if-no-files-found: error
          retention-days: 14

      # Export by digest only. Neither worker can publish the release tag.
      # Separate cache refs prevent parallel architectures overwriting each other.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          outputs: type=image,name=ghcr.io/inspr-at/aeon,push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true,oci-mediatypes=true
          cache-from: type=registry,ref=ghcr.io/inspr-at/aeon:${{ matrix.cache }}
          cache-to: type=registry,ref=ghcr.io/inspr-at/aeon:${{ matrix.cache }},mode=max
          build-contexts: |
            aeon-runtime=oci-layout://${{ runner.temp }}/aeon-runtime@${{ steps.runtime.outputs.digest }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.inputs.outputs.epoch }}

      # The push is a second export of the smoked inputs. Nothing is attested
      # unless the pushed platform manifest carries the smoked image config;
      # a mismatch prints both digests. The rehearsal runs the same check on
      # its local provenance export; reading back a pushed digest can only be
      # proven by a tag build.
      - name: Require pushed image to equal the smoked build
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SMOKE_CONFIG_DIGEST: ${{ steps.build.outputs.imageid }}
        run: node scripts/verify-pushed-image.mjs registry "ghcr.io/inspr-at/aeon@${DIGEST}" linux/${{ matrix.arch }}
      # Compare ordered rootfs diff IDs and runtime settings. Export timestamps
      # and provenance are not runtime identity; both builds share one epoch.
      - name: Verify pushed runtime matches smoke
        env:
          SMOKED_IMAGE: ${{ steps.smoke-image.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          reference="ghcr.io/inspr-at/aeon@${DIGEST}"
          docker pull "$reference"
          directory="$(mktemp -d "$RUNNER_TEMP/runtime-identity.XXXXXX")"
          format='{"architecture":{{json .Architecture}},"os":{{json .Os}},"variant":{{json .Variant}},"rootfs":{"type":{{json .RootFS.Type}},"diff_ids":{{json .RootFS.Layers}}},"config":{{json .Config}}}'
          docker image inspect --format "$format" "$SMOKED_IMAGE" > "$directory/smoked.json"
          docker image inspect --format "$format" "$reference" > "$directory/published.json"
          node scripts/release-image-index.mjs identity "$directory/smoked.json" "$directory/published.json"

      - name: Attest pushed image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/inspr-at/aeon
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Keep existing token scopes: artifact-metadata:write is unnecessary.
          create-storage-record: false

      - name: Verify pushed image attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://ghcr.io/inspr-at/aeon@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

      - name: Record platform digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Invalid platform image digest' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/image-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/image-digests/$ARCH.txt"
          {
            echo "### Pushed and verified image"
            echo
            echo "ghcr.io/inspr-at/aeon@${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  # Both native smoke and platform attestation gates must finish successfully.
  # Preserve the image job/output contract: deploy pins this multi-arch index.
  image:
    needs: [image-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Coordinator-provisioned environment restricted to trusted v* releases.
    # Its App proposes pins on nixcfg only; the coordinator reviews and deploys.
    environment: release-pinning
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
      pin_evidence: ${{ steps.pin.outputs.pin_evidence }}
      # Per-architecture runtime closure digests, for the draft release notes.
      runtime_amd64: ${{ needs.image-platform.outputs.runtime_amd64 }}
      runtime_arm64: ${{ needs.image-platform.outputs.runtime_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Validate inspr-calendar-v2 tag
        id: version
        run: node scripts/release-tag.mjs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: true
      - name: Reject an existing GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name')"
          if printf '%s\n' "$tags" | grep -Fx -- "v${VERSION}" >/dev/null; then
            echo "Release v${VERSION} already exists (draft or published); reserve a new coordinate" >&2
            exit 1
          fi

      - name: Reject an existing image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tags="$(gh api --paginate 'orgs/inspr-at/packages/container/aeon/versions?per_page=100' \
            --jq '.[].metadata.container.tags[]?')"
          if printf '%s\n' "$tags" | grep -Fx -- "$VERSION" >/dev/null; then
            echo "Image tag ${VERSION} is already published; reserve a new coordinate" >&2
            exit 1
          fi

      - name: Publish multi-arch index
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-image-index.mjs sources "$RUNNER_TEMP/image-digests" > "$RUNNER_TEMP/image-sources.txt"
          mapfile -t sources < "$RUNNER_TEMP/image-sources.txt"
          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/image-index.json"
          node scripts/release-image-index.mjs verify "$RUNNER_TEMP/image-index.json"
          docker buildx imagetools create --tag "ghcr.io/inspr-at/aeon:${VERSION}" \
            --metadata-file "$RUNNER_TEMP/image-index-metadata.json" "${sources[@]}"
          echo "pushed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          digest="$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/image-index-metadata.json")"
          if ! [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Invalid multi-arch image digest' >&2
            exit 1
          fi
          docker buildx imagetools inspect --raw "ghcr.io/inspr-at/aeon@$digest" > "$RUNNER_TEMP/published-index.json"
          node scripts/release-image-index.mjs verify "$RUNNER_TEMP/published-index.json"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest pushed image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/inspr-at/aeon
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Keep existing token scopes: artifact-metadata:write is unnecessary.
          create-storage-record: false

      - name: Verify pushed image attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://ghcr.io/inspr-at/aeon@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

      - name: Record pushed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Verified multi-arch release index (linux/amd64 + linux/arm64)"
            echo
            echo "ghcr.io/inspr-at/aeon@${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Optional proposal: failures remain visible without blocking agent assets.
      # --write is an explicit coordinator opt-in; otherwise produce a dry run.
      - name: Propose verified nixcfg deployment pin
        id: pin
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          AEON_PIN_BOT_ENABLED: ${{ vars.AEON_PIN_BOT_ENABLED }}
          AEON_PIN_APP_ID: ${{ secrets.AEON_PIN_APP_ID }}
          AEON_PIN_APP_KEY: ${{ secrets.AEON_PIN_APP_KEY }}
          INDEX_PUSHED_AT: ${{ steps.push.outputs.pushed_at }}
        run: |
          set -euo pipefail
          args=(scripts/release-pin-pr.mjs)
          if [ "$AEON_PIN_BOT_ENABLED" = true ]; then
            args+=(--write)
          fi
          if ! node "${args[@]}"; then
            echo '::warning::Deployment pin proposal failed; release assets will still be built.'
            echo 'Deployment pin proposal failed; release assets will still be built.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  assets:
    needs: [agentd-darwin, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      # No restored Go cache: see agentd-darwin.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      # Darwin paimos-agentd is built on the matching Mac with LocalAuthentication.
      # Linux agentd and every CLI target stay static. -trimpath and the version
      # -X match the server image (scripts/build-image-inputs.mjs).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: agentd-darwin-*
          path: dist
          merge-multiple: true
      - name: Build linux paimos-agentd and aeon-cli
        env:
          VERSION: ${{ needs.image.outputs.version }}
          GOMODCACHE: ${{ runner.temp }}/go-mod
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          # One empty build cache per compilation; the script rejects a used one.
          GOCACHE="$RUNNER_TEMP/go-build-linux-agentd" bash scripts/build-release-binaries.sh linux-agentd
          GOCACHE="$RUNNER_TEMP/go-build-cli" bash scripts/build-release-binaries.sh cli
          bash scripts/build-release-binaries.sh verify-darwin
          (
            cd dist
            sha256sum \
              paimos-agentd-darwin-arm64 \
              paimos-agentd-darwin-amd64 \
              paimos-agentd-linux-arm64 \
              paimos-agentd-linux-amd64 \
              aeon-cli-darwin-arm64 \
              aeon-cli-darwin-amd64 \
              aeon-cli-linux-amd64 \
              aeon-cli-linux-arm64 \
              > SHA256SUMS
          )

      # Include drafts: a rerun must never replace a reserved release or its assets.
      - name: Reject an existing GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          set -euo pipefail
          tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name')"
          if printf '%s\n' "$tags" | grep -Fx -- "v${VERSION}" >/dev/null; then
            echo "Release v${VERSION} already exists (draft or published); reserve a new coordinate" >&2
            exit 1
          fi

      # Publication is an explicit post-deploy step; see docs/RELEASE.md.
      - name: Create draft GitHub release with signed assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          PIN_EVIDENCE: ${{ needs.image.outputs.pin_evidence }}
          RUNTIME_AMD64: ${{ needs.image.outputs.runtime_amd64 }}
          RUNTIME_ARM64: ${{ needs.image.outputs.runtime_arm64 }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          notes="$(printf '%s\n' \
            "paimos-agentd ${VERSION} for darwin-arm64, darwin-amd64, linux-arm64 and linux-amd64." \
            "darwin paimos-agentd links LocalAuthentication (CGO enabled); linux is static." \
            "aeon-cli ${VERSION} for darwin-arm64, darwin-amd64, linux-amd64 and linux-arm64." \
            "Install aeon-cli as aeon. A symlink named paimos selects the paimos-compatible CLI (PAIMOS_URL)." \
            "Verify SHA256SUMS before installing." \
            "" \
            "Container: ghcr.io/inspr-at/aeon:${VERSION}" \
            "Digest: ${DIGEST}" \
            "Runtime closure linux/amd64: ${RUNTIME_AMD64:-unknown}" \
            "Runtime closure linux/arm64: ${RUNTIME_ARM64:-unknown}" \
            "" \
            "$PIN_EVIDENCE")"
          gh release create "$tag" \
            dist/paimos-agentd-darwin-arm64 \
            dist/paimos-agentd-darwin-amd64 \
            dist/paimos-agentd-linux-arm64 \
            dist/paimos-agentd-linux-amd64 \
            dist/aeon-cli-darwin-arm64 \
            dist/aeon-cli-darwin-amd64 \
            dist/aeon-cli-linux-amd64 \
            dist/aeon-cli-linux-arm64 \
            dist/SHA256SUMS \
            --draft \
            --verify-tag \
            --title "$tag" \
            --notes "$notes"

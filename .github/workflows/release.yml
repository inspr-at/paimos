# SPDX-License-Identifier: AGPL-3.0-only
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # write: attach paimos-agentd and aeon-cli binaries and SHA256SUMS to the GitHub release
  contents: write
  packages: write
  attestations: write
  id-token: write
  # read: the release history lists the CI and Release runs of each tagged commit
  actions: read

jobs:
  agentd-darwin:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    # Apple signing secrets live only in this environment, which releases them
    # to v* tag runs (synced from the markus-barta/apple-signing vault). PR and
    # branch CI never reference it.
    environment: release-signing
    # Notarization waits on Apple; it usually takes a few minutes.
    timeout-minutes: 45
    env:
      # Must match the signing identity; the daemon embeds it (expectedTeamID).
      AEON_DEVELOPER_ID_TEAM: P66J39QV6V
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Build darwin paimos-agentd with LocalAuthentication
        env:
          AEON_DARWIN_ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/build-release-binaries.sh darwin-agentd
          bash scripts/build-release-binaries.sh cli-darwin
      # Before upload: SHA256SUMS in the release job is computed over the signed
      # binary. Bare binaries cannot be stapled; Gatekeeper checks online.
      - name: Sign and notarize paimos-agentd
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ "$APPLE_TEAM_ID" != "$AEON_DEVELOPER_ID_TEAM" ]; then
            echo "::error::signing team does not match AEON_DEVELOPER_ID_TEAM; Mac confirmation would fail closed"
            exit 1
          fi
          bash scripts/sign-notarize.sh --identifier paimos-agentd "dist/paimos-agentd-darwin-${{ matrix.arch }}"
          bash scripts/sign-notarize.sh --identifier aeon-cli "dist/aeon-cli-darwin-${{ matrix.arch }}"
          /usr/bin/codesign --verify --strict -R='anchor apple generic and identifier "aeon-cli" and certificate leaf[subject.OU] = "P66J39QV6V"' "dist/aeon-cli-darwin-${{ matrix.arch }}"
      # Backstop for sign-notarize.sh's EXIT trap, which a cancellation during
      # notarization can skip: however the signing step ended, delete the
      # temporary keychain (private key), drop it from the search list and
      # remove every signing temp file (.p12, .p8, zip). Idempotent. Every
      # operation is attempted; failures are collected and fail the step at
      # the end.
      - name: Remove signing keychain and temp files
        if: always()
        run: |
          set +e +o pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          rt="$(cd "$RUNNER_TEMP" 2>/dev/null && pwd -P)"
          if [ -z "$rt" ] || [ "$rt" -ef / ]; then
            echo "::error::RUNNER_TEMP is not a usable directory; refusing to clean up"
            exit 1
          fi
          failed=0
          for kc in "$rt"/sign.*/signing.keychain-db; do
            [ -e "$kc" ] || continue
            security delete-keychain "$kc" || { echo "::error::could not delete $kc"; failed=1; }
          done
          # Without a readable search list the restore is skipped rather than
          # guessed; delete-keychain above already unlisted what it removed.
          if current="$(security list-keychains -d user)"; then
            kept=()
            while IFS= read -r k; do
              k="${k#"${k%%[![:space:]]*}"}"; k="${k#\"}"; k="${k%\"}"
              case "$k" in ""|*/signing.keychain-db) ;; *) kept+=("$k") ;; esac
            done <<<"$current"
            [ ${#kept[@]} -gt 0 ] || kept=("$HOME/Library/Keychains/login.keychain-db")
            security list-keychains -d user -s "${kept[@]}" || { echo "::error::could not restore the keychain search list"; failed=1; }
          else
            echo "::error::could not read the keychain search list"
            failed=1
          fi
          rm -rf "$rt"/sign.* || failed=1
          if compgen -G "$rt/sign.*" >/dev/null; then
            echo "::error::signing temp files remain"
            failed=1
          fi
          if list="$(security list-keychains -d user)"; then
            case "$list" in *signing.keychain-db*) echo "::error::signing keychain is still on the search list"; failed=1 ;; esac
          else
            echo "::error::could not verify the keychain search list"
            failed=1
          fi
          [ "$failed" = 0 ] || exit 1
          echo "signing keychain and temp files removed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentd-darwin-${{ matrix.arch }}
          path: |
            dist/paimos-agentd-darwin-${{ matrix.arch }}
            dist/aeon-cli-darwin-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: agentd-darwin
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The release history reads every tag and the commits between them.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate inspr-calendar-v2 tag
        id: version
        run: node scripts/release-tag.mjs

      - name: Release checks
        run: node scripts/verify-release.mjs --release

      - name: Tag matches version.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          got=$(node scripts/verify-release.mjs --release)
          node --input-type=module -e 'const got = JSON.parse(process.argv[1]); if (got.version !== process.env.VERSION) { console.error("version.json " + got.version + " does not match tag " + process.env.VERSION); process.exit(1); }' "$got"

      # A rerun must never replace a published coordinate or its release assets.
      - name: Reject an existing GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header @<(printf 'Authorization: Bearer %s' "$GH_TOKEN") \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}")"
          case "$status" in
            404) ;;
            200) echo "Release v${VERSION} is already published; reserve a new coordinate" >&2; exit 1 ;;
            *) echo "Cannot establish release immutability (HTTP ${status})" >&2; exit 1 ;;
          esac

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # Darwin paimos-agentd is built on the matching Mac with LocalAuthentication.
      # Linux agentd and every CLI target stay static. Darwin CLI assets are
      # signed/notarized on the Mac jobs; never overwrite them here. -trimpath and the version
      # -X match the server image (Dockerfile).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: agentd-darwin-*
          path: dist
          merge-multiple: true
      - name: Build linux paimos-agentd and aeon-cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/build-release-binaries.sh linux-agentd
          bash scripts/build-release-binaries.sh cli-linux
          bash scripts/build-release-binaries.sh verify-darwin
          (
            cd dist
            sha256sum \
              paimos-agentd-darwin-arm64 \
              paimos-agentd-darwin-amd64 \
              paimos-agentd-linux-arm64 \
              paimos-agentd-linux-amd64 \
              aeon-cli-darwin-arm64 \
              aeon-cli-darwin-amd64 \
              aeon-cli-linux-amd64 \
              aeon-cli-linux-arm64 \
              > SHA256SUMS
          )

      # inspr.release-history.v1: every v* tag with its changes and evidence, embedded
      # in the server image (internal/releasehistory/data/history.json, not committed).
      - name: Release history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./internal/releasehistory/generate -repo . -repository "${GITHUB_REPOSITORY}"

      - uses: docker/setup-buildx-action@v4

      # Build and exercise the exact runtime layout before any image or release is published.
      - name: Smoke production image
        env:
          AEON_SMOKE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/smoke-image.sh

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A previous partial run may have pushed the image before release creation.
      - name: Reject an existing image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tags="$(gh api --paginate 'orgs/inspr-at/packages/container/aeon/versions?per_page=100' \
            --jq '.[].metadata.container.tags[]?')"
          if printf '%s\n' "$tags" | grep -Fxq "$VERSION"; then
            echo "Image tag ${VERSION} is already published; reserve a new coordinate" >&2
            exit 1
          fi

      # The only published tag is the calendar version. Never push a latest tag.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          tags: ghcr.io/inspr-at/aeon:${{ steps.version.outputs.version }}
          # -X github.com/inspr-at/paimos/internal/version.Version=<version without v>
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Record pushed digest
        run: |
          {
            echo "### Pushed image"
            echo
            echo "ghcr.io/inspr-at/aeon@${{ steps.push.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach paimos-agentd to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          notes="$(printf '%s\n' \
            "paimos-agentd ${VERSION} for darwin-arm64, darwin-amd64, linux-arm64 and linux-amd64." \
            "darwin paimos-agentd links LocalAuthentication (CGO enabled); linux is static." \
            "aeon-cli ${VERSION} for darwin-arm64, darwin-amd64, linux-amd64 and linux-arm64." \
            "Install aeon-cli as aeon. A symlink named paimos selects the paimos-compatible CLI (PAIMOS_URL)." \
            "Verify SHA256SUMS before installing." \
            "" \
            "Container: ghcr.io/inspr-at/aeon:${VERSION}" \
            "Digest: ${DIGEST}")"
          gh release create "$tag" \
            dist/paimos-agentd-darwin-arm64 \
            dist/paimos-agentd-darwin-amd64 \
            dist/paimos-agentd-linux-arm64 \
            dist/paimos-agentd-linux-amd64 \
            dist/aeon-cli-darwin-arm64 \
            dist/aeon-cli-darwin-amd64 \
            dist/aeon-cli-linux-amd64 \
            dist/aeon-cli-linux-arm64 \
            dist/SHA256SUMS \
            --title "$tag" \
            --notes "$notes"

  # Runs only after the release assets exist. The homebrew-tap environment is
  # limited to v* tags. App secrets are read only in the bump step. Absent
  # secrets skip the pull request and succeed.
  homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    environment: homebrew-tap
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Open Homebrew tap formula pull request
        env:
          HOMEBREW_TAP_APP_ID: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          HOMEBREW_TAP_APP_KEY: ${{ secrets.HOMEBREW_TAP_APP_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/homebrew-tap-pr.mjs

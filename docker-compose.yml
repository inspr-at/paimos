services:
  paimos:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8888
      - INSTANCE_LABEL=${INSTANCE_LABEL:-}
      # Live deployments must pass PAIMOS_ENV=production and matching,
      # non-default PAIMOS_DEPLOYMENT_INSTANCE / PAIMOS_AGENT_BUS_INSTANCE values.
      - PAIMOS_ENV=${PAIMOS_ENV:-development}
      - PAIMOS_DEPLOYMENT_INSTANCE=${PAIMOS_DEPLOYMENT_INSTANCE:-}
      - PAIMOS_AGENT_BUS_INSTANCE=${PAIMOS_AGENT_BUS_INSTANCE:-default}
      # First-run only. Pass from the host for bootstrap; omit after rotation.
      - ADMIN_PASSWORD
      - ADMIN_PASSWORD_FILE
      # Runtime secret-file paths. The referenced files must also be mounted
      # into the container by the deployment.
      - PAIMOS_SECRET_KEY_FILE
      - SMTP_PASS_FILE
      - OIDC_CLIENT_SECRET_FILE
      # Set COOKIE_SECURE=true on live (HTTPS). Leave unset for staging/local (HTTP).
      # Set INSTANCE_LABEL=STAGING on staging to show a red banner in the sidebar.
    restart: unless-stopped

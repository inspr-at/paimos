openapi: 3.1.0
info: {title: AEON P5.4 messaging, version: '1'}
# Coordinator merges these paths into api/openapi.yaml and mounts inbox.NewMessaging.
paths:
  /api/projects/{projectId}/messages:
    parameters:
      - {$ref: '#/components/parameters/Project'}
    post:
      operationId: sendCompatMessage
      description: Authenticated sender; agents require inbox.send. Exact idempotent retries return the original. Action requests are held outside R2 inbox; only an accepted exact counterpart reply closes an obligation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Send'}
      responses:
        '201': {description: Durable message, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
        '409': {description: Idempotency conflict or session ended}
    get:
      operationId: inspectCompatMessages
      description: Person administrator inspection, including held bodies. Never releases or executes an action request.
      responses:
        '200': {description: Message page}
  /api/projects/{projectId}/messages/listen:
    parameters:
      - {$ref: '#/components/parameters/Project'}
    get:
      operationId: listenCompatMessages
      description: Only the authenticated recipient, optionally selecting its own harness address. Pending accepted R2 messages only; at most ten, ordered by event ID. No target references or secrets. Reading and ACK never close reply obligations.
      parameters:
        - {name: session, in: query, schema: {type: string, format: uuid}, description: 'Active caller session plus unbound principal broadcasts; absent retains the legacy principal inbox and JSON shape'}
        - {name: to, in: query, schema: {type: string}}
        - {name: after, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10, default: 10}}
      responses:
        '200': {description: Message page with items, next_after and untrusted-message preamble}
  /api/projects/{projectId}/messages/{messageId}/ack:
    parameters:
      - {$ref: '#/components/parameters/Project'}
      - {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: ackCompatMessage
      description: Recipient-only ACK of a compatibility message. Resolves its R2 inbox ID in the project and appends the inbox ACK event; exact replay is idempotent.
      responses:
        '200': {description: Redacted ACK result}
  /api/projects/{projectId}/message-targets:
    parameters:
      - {$ref: '#/components/parameters/Project'}
    post:
      operationId: setCompatTarget
      description: Administrator only. Immutable encrypted target version; supersedes the enabled version for this address and role, without retargeting existing deliveries. Omitted principal_id resolves the unique agent name from the address. References and secrets are write-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TargetInput'}
      responses:
        '201': {description: Redacted target}
    get:
      operationId: listCompatTargets
      description: Administrator only; redacted metadata and has_secret, never target_ref or target_secret.
      parameters:
        - {name: address, in: query, schema: {type: string}}
      responses:
        '200': {description: Redacted target array}
  /api/projects/{projectId}/message-deliveries:
    parameters:
      - {$ref: '#/components/parameters/Project'}
    get:
      operationId: listCompatDeliveries
      description: Administrator only; state, reason, attempts, controlled effective level and fallback reason, and immutable target IDs only. No bodies, references, credentials or provider errors.
      responses:
        '200': {description: Redacted delivery array}
  /api/projects/{projectId}/messages/delivery-claim:
    parameters:
      - {$ref: '#/components/parameters/Project'}
    post:
      operationId: claimCompatDelivery
      description: Recipient-only, ordered claim for one local adapter. Returns a private target reference and authenticated tenant/principal scope only for the selected adapter; never returns a sender key. A claim is leased and appends an event. Empty work returns null. Blocked or foreign-adapter work is reported without a reference.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [to, adapter], properties: {to: {type: string}, adapter: {type: string}}}}}}
      responses:
        '200': {description: One delivery work item or null}
  /api/projects/{projectId}/messages/delivery-complete:
    parameters:
      - {$ref: '#/components/parameters/Project'}
    post:
      operationId: completeCompatDelivery
      description: Recipient-only fenced completion; atomically records the redacted result, durable cursor, inbox ACK and tenant events. Exact replay is idempotent.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [delivery_id, lease_token, effective_level], properties: {delivery_id: {type: string, format: uuid}, lease_token: {type: string, format: uuid}, effective_level: {type: string, enum: [simple, steer]}, fallback_reason: {type: string}}}}}}
      responses:
        '200': {description: Redacted delivery result}
  /api/projects/{projectId}/messages/delivery-unavailable:
    parameters:
      - {$ref: '#/components/parameters/Project'}
    post:
      operationId: rerouteCompatDelivery
      description: Recipient-only fenced reroute of a leased unavailable local adapter to the frozen simple fallback target. Preserves the original target, clears the lease, and appends an event; no recipient ACK occurs.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [delivery_id, lease_token, fallback_reason], properties: {delivery_id: {type: string, format: uuid}, lease_token: {type: string, format: uuid}, fallback_reason: {type: string, enum: [idle, not_steerable, transport_error, unsupported]}}}}}}
      responses:
        '200': {description: Redacted reroute result}
components:
  parameters:
    Project: {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    Send:
      type: object
      additionalProperties: false
      required: [to, body, idempotency_key]
      properties:
        to: {type: string, description: 'harness:agent or principal UUID'}
        recipient_session_id: {type: string, format: uuid, description: Exact active generation belonging to the recipient in this project}
        sender_session_id: {type: string, format: uuid, description: Exact active generation belonging to the authenticated sender in this project}
        body: {type: string, minLength: 1, maxLength: 65536}
        idempotency_key: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
        reply_to: {type: string, format: uuid}
        thread_id: {type: string, maxLength: 128}
        expects_reply: {type: boolean, default: false}
        is_action_request: {type: boolean, default: false}
        delivery_level: {type: string, enum: [simple, steer], default: simple}
    Message:
      type: object
      properties:
        id: {type: string, format: uuid}
        sender_principal_id: {type: string, format: uuid}
        recipient_principal_id: {type: string, format: uuid}
        recipient_session_id: {type: string, format: uuid}
        sender_session_id: {type: string, format: uuid}
        sender_label: {type: string, description: Frozen session label or principal name; legacy history falls back to its stored sender address. Omitted from legacy unbound send and listen responses.}
        from: {type: string, description: Sender address at send time}
        to: {type: string}
        body: {type: string}
        reply_to: {type: [string, 'null'], format: uuid}
        thread_id: {type: string}
        hop: {type: integer, minimum: 1}
        sent_event_id: {type: integer}
        is_action_request: {type: boolean}
        expects_reply: {type: boolean}
        reply_obligation: {type: string, enum: [none, open, closed]}
        status: {type: string, enum: [accepted, held]}
        delivery_level: {type: string, enum: [simple, steer]}
        delivery_target:
          description: Immutable redacted primary and simple fallback target version snapshot; private references and credentials are excluded.
          type: [object, 'null']
          properties:
            primary: {$ref: '#/components/schemas/TargetBinding'}
            simple_fallback: {$ref: '#/components/schemas/TargetBinding'}
    TargetBinding:
      type: [object, 'null']
      properties:
        binding_id: {type: string, format: uuid}
        kind: {type: string}
    TargetInput:
      type: object
      additionalProperties: false
      required: [address, adapter, target_kind, target_ref]
      properties:
        address: {type: string}
        principal_id: {type: string, format: uuid}
        adapter: {type: string, enum: [codex, agentd_codex, agentd_claude, agentd_pi, agentd_cursor, grok_bot_routine, claude_resume, claude_channel]}
        target_kind: {type: string, enum: [codex_thread, agentd_session, https_webhook, claude_session]}
        target_ref: {type: string, writeOnly: true}
        target_secret: {type: string, writeOnly: true, description: Required only for grok_bot_routine}
        maximum_level: {type: string, enum: [simple, steer], default: simple}
        role: {type: string, enum: [primary, simple_fallback], default: primary}

components:
  schemas:
    AccountLinkDeviceView:
      type: object
      additionalProperties: false
      required: [account_id, state, show_prompt, show_result]
      properties:
        account_id: {type: string, format: uuid}
        request_id: {type: string, format: uuid}
        state: {type: string, enum: [pending, linked, expired, revoked]}
        show_prompt: {type: boolean}
        show_result: {type: boolean, description: True only for the first linked poll across all watching windows}
        user_code: {type: string, pattern: '^[0-9]{3} [0-9]{3}$', description: Only on the first offer}
        verification_uri: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
        person_name: {type: string}
    AccountLinkReview:
      type: object
      additionalProperties: false
      required: [request_id, tenant_id, tenant_name, account_id, harness, account_label, computer_name, person_id, person_name, revision, state, expires_at, request_digest]
      properties:
        request_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        request_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        tenant_name: {type: string}
        account_id: {type: string, format: uuid}
        harness: {type: string}
        account_label: {type: string}
        computer_name: {type: string}
        person_id: {type: string, format: uuid}
        person_name: {type: string}
        revision: {type: integer, minimum: 0}
        state: {type: string, enum: [pending, linked]}
        expires_at: {type: string, format: date-time}
    AgentCompatibility:
      type: object
      required: [status, action]
      properties:
        status: {type: string, enum: [compatible, update_required, protocol_mismatch, unknown]}
        action: {type: string, maxLength: 500, description: Server-generated advice; empty for compatible or unknown reports. Does not change enrollment or terminate work.}
    AgentCompatibilityPolicy:
      type: object
      required: [protocol, min_version, version_scheme]
      description: Server-owned inclusive agent floor; newer agents using the same pairing protocol and version scheme are supported. No maximum. The floor changes only for an incompatible agent change, never merely for a server release.
      properties:
        protocol: {type: string}
        min_version: {type: string}
        version_scheme: {type: string}
    AgentRelease:
      type: object
      required: [protocol, version, version_scheme]
      description: Advisory identity of the last reporting helper process; absent legacy reports and development builds do not prove compatibility.
      properties:
        protocol: {type: string, maxLength: 64}
        version: {type: string, maxLength: 64}
        version_scheme: {type: string, maxLength: 64}
    AttachDeviceRequest:
      type: object
      additionalProperties: false
      required: [operation, computer_id, poll_key]
      oneOf:
        - properties:
            operation: {const: register}
          required: [device_proof]
        - properties:
            operation: {enum: [request, poll, detach, exited, message_request, message_activate, message_observed, message_offer, message_receipt, message_validate]}
          required: [request_id, snapshot, request_digest]
      properties:
        operation: {type: string, enum: [register, request, poll, detach, exited, message_request, message_activate, message_observed, message_offer, message_receipt, message_validate]}
        request_id: {type: string, format: uuid}
        computer_id: {type: string, format: uuid}
        attach_protocol: {type: integer, enum: [1, 2], description: 'Registration only. Omission registers protocol 1; all later attach operations return 409 update_agentd. Protocol 2 declares paired-origin pinning, redirect refusal and kernel checks in both modes. A later request cannot upgrade a registered key.'}
        local_consent_proof_version: {type: integer, minimum: 1, description: 'Registration-bound signature format. Omission means v1. Attach protocol 2 requires v2, which binds the canonical Touch ID reason; unsupported versions return 409 update_agentd with upgrade paimos-agentd guidance. A later request cannot upgrade a registered key. Existing pairing keys remain valid after upgrading the daemon.'}
        device_proof: {type: string, writeOnly: true, description: 'Existing computer lifecycle proof; registration only, never watch authority'}
        poll_key: {type: string, pattern: '^[a-f0-9]{64}$', writeOnly: true, description: Fresh daemon-start random key held only in memory; required for every operation}
        snapshot: {$ref: '#/components/schemas/AttachSnapshot'}
        request_digest: {type: string, description: 'Required with the snapshot for request, activation, poll and detachment'}
        consent_digest: {type: string, description: Echo of the server-selected consent binding; required for activation and every active poll in both modes}
        local_confirmed: {type: boolean, deprecated: true, description: 'Retained for wire compatibility; true is refused. Supply signed local confirmation instead.'}
        local_auth_nonce: {type: string, pattern: '^[0-9a-f]{64}$', description: Server-issued single-use challenge for the approved request}
        local_auth_signature: {type: string, maxLength: 144, description: 'Base64 ASN.1 DER ECDSA P-256 signature over SHA-256("aeon.attach.local-consent.v2\0" + consent_digest + "\0" + local_auth_nonce + "\0" + canonical reason). The reason is "Allow " + action + " " + harness + " session PID " + pid + " on " + host. Action is "watching the conversation" or "status only (no conversation text) for". Never accepted on the local socket.'}
        local_auth_capability:
          type: string
          enum: [available, unsupported, unsigned, no_gui, policy]
          description: Registration only. An omitted registration is stored as unreported. A later poll cannot change it. This value never satisfies local confirmation.
        message_epoch: {type: string, minLength: 1, maxLength: 128, description: Daemon per-binding epoch; first offer binds it atomically to the grant}
        message_binding: {$ref: '#/components/schemas/AttachedMessageBinding'}
        message_receipt: {$ref: '#/components/schemas/AttachedMessageReceipt'}
        message_protocol: {type: string, enum: [attached_messages_v1], description: Negotiated at registration; mandatory for message operations}
        message_generation: {type: string, format: uuid}
        hook_release_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        hook_config_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        qualified_harness_version: {type: string, maxLength: 80}
        message_consent_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        message_local_auth_nonce: {type: string, pattern: '^[a-f0-9]{64}$', description: Messaging-specific single-use challenge; never the watch challenge}
        message_local_auth_signature: {type: string, maxLength: 144, description: 'P-256 DER signature in base64 over the messaging consent digest, nonce and canonical prompt; verified against the pairing-pinned key'}
        sequence: {type: integer, minimum: 1}
        text: {type: string, maxLength: 16384, description: Default conversation watch only; rejected for mode=lease}
        doing: {type: string, maxLength: 60, description: Public summary on an active poll only; collected only in agent_summary mode.}
        tool_activity: {$ref: '#/components/schemas/CurrentAgentActivity'}
    AttachRefusal:
      type: object
      required: [code, error]
      properties:
        code: {type: string, description: "Existing error code, retained for older clients"}
        error: {type: string}
        attach_refusal:
          type: string
          enum: [version_mismatch, pairing_revoked, ticket_not_visible, code_expired, draining, enrollment_unavailable, poll_key_unknown]
          description: Optional fixed cause. Poll_key_unknown requires the owning computer principal and valid attach scope; other causes require the computer proof and principal. Includes no identifiers or request contents.
    AttachedMessageBinding:
      type: object
      description: Immutable consent tuple. Each operation rechecks every field and the live attachment lease; message operations never renew it.
      required: [tenant_id, project_id, attach_request_id, session_id, computer_id, owner_id, message_generation, daemon_epoch, hook_release_digest, hook_config_digest, qualified_harness_version, scope, consent_policy, snapshot_digest, service_epoch]
      properties:
        tenant_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        attach_request_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        computer_id: {type: string, format: uuid}
        owner_id: {type: string, format: uuid}
        message_generation: {type: string, format: uuid}
        daemon_epoch: {type: string, pattern: '^[a-f0-9]{64}$'}
        hook_release_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        hook_config_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        qualified_harness_version: {type: string, maxLength: 80}
        scope: {type: string, const: owner_messages}
        consent_policy: {type: string, enum: [aeon, local_auth]}
        snapshot_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        service_epoch: {type: string, format: uuid}
    AttachedMessageCapability:
      type: object
      required: [ready, blocker]
      properties:
        ready: {type: boolean}
        blocker: {type: string, description: 'Specific disabled, consent, owner, hook, lease, generation or qualification blocker.'}
        grant: {$ref: '#/components/schemas/AttachedMessageGrant'}
    AttachedMessageExchange:
      type: object
      required: [state]
      description: Content-free except for the first successful offer. Empty/replayed calls never return a previous body. message_validate rechecks current consent and the released attempt without text, immediately before local disclosure. Receipt retries return only committed metadata; they cannot reopen a terminal outcome.
      properties:
        state: {type: string, enum: [empty, offered, completed, uncertain, revoked, expired, not_delivered, cancelled]}
        offer: {$ref: '#/components/schemas/AttachedMessageOffer'}
        shown_at: {type: string, format: date-time, description: Hook reported full stdout handoff; does not prove model consumption}
        completed_at: {type: string, format: date-time, description: Transport settlement only; never task completion}
    AttachedMessageGrant:
      type: object
      required: [id, binding, state, consent_digest, expires_at, snapshot, notice]
      properties:
        id: {type: string, format: uuid}
        binding: {$ref: '#/components/schemas/AttachedMessageBinding'}
        snapshot: {$ref: '#/components/schemas/AttachSnapshot'}
        notice: {type: string, description: 'Server-authored vendor retention, live-watch audience and same-user isolation limits'}
        state: {type: string, enum: [pending, approved, active, revoked]}
        consent_digest: {type: string}
        expires_at: {type: string, format: date-time}
        message_local_auth_nonce: {type: string, description: Present after policy B approval; consumed atomically by activation}
    AttachedMessageOffer:
      type: object
      description: Single attempt committed before releasing body, never replayed. Offered only at a fresh hook invocation through the paired attach exchange; a lost response is uncertain. No lease renewal.
      required: [binding, grant_id, delivery_id, message_id, deadline, nonce, body, owner, created_at, epoch]
      properties:
        binding: {$ref: '#/components/schemas/AttachedMessageBinding'}
        grant_id: {type: string, format: uuid}
        delivery_id: {type: string, format: uuid}
        message_id: {type: string, format: uuid}
        deadline: {type: string, format: date-time}
        nonce: {type: string, pattern: '^[a-f0-9]{64}$'}
        epoch: {type: string}
        owner: {type: string, description: Server-authenticated owner label}
        created_at: {type: string, format: date-time}
        body: {type: string, maxLength: 4096, description: 'Volatile UTF-8, 4096 bytes maximum; full escaped frame at most 8000 characters and complete encoded hook output at most 10000 characters for every supported event, checked before acceptance. Never logged or persisted.'}
    AttachedMessageReceipt:
      type: object
      additionalProperties: false
      required: [delivery_id, message_id, nonce, outcome, epoch]
      properties:
        delivery_id: {type: string, format: uuid}
        message_id: {type: string, format: uuid}
        nonce: {type: string, pattern: '^[a-f0-9]{64}$'}
        outcome: {type: string, enum: [shown, uncertain]}
        epoch: {type: string, description: Exact daemon binding epoch captured at claim; compared atomically with the current grant and attempt at settlement}
    HostCapacityPolicy:
      type: object
      additionalProperties: false
      required: [mode, maximum_agents, maximum_load, wait_when_busy, ease_on_battery, ease_when_hot, consider_activity]
      properties:
        mode: {type: string, enum: [off, smart, fixed], default: off}
        maximum_agents: {type: integer, minimum: 0, maximum: 64, default: 0, description: Zero preserves the existing unlimited policy; configured limits are 1–64.}
        maximum_load: {type: number, minimum: 1, maximum: 200, default: 30}
        wait_when_busy: {type: boolean, default: true}
        ease_on_battery: {type: boolean, default: true}
        ease_when_hot: {type: boolean, default: true}
        consider_activity: {type: boolean, default: false, description: "Opt-in; measures activity only, never input content."}
    HostCapacitySignals:
      type: object
      additionalProperties: false
      required: [load, cores, memory_pressure, power, thermal]
      properties:
        load: {type: [number, 'null'], minimum: 0, maximum: 10000}
        cores: {type: integer, minimum: 1, maximum: 4096}
        memory_pressure: {type: string, enum: [unknown, normal, high]}
        memory_used_gb: {type: [number, 'null'], minimum: 0, maximum: 1048576}
        memory_total_gb: {type: [number, 'null'], minimum: 0, maximum: 1048576}
        power: {type: string, enum: [unknown, plugged_in, battery]}
        thermal: {type: string, enum: [unknown, normal, hot]}
        input_active: {type: [boolean, 'null']}
    HostCapacityView:
      type: object
      required: [policy, running, queued, reason, load_limit, history]
      properties:
        policy: {$ref: '#/components/schemas/HostCapacityPolicy'}
        signals: {oneOf: [{$ref: '#/components/schemas/HostCapacitySignals'}, {type: 'null'}]}
        reported_at: {type: [string, 'null'], format: date-time}
        running: {type: integer, minimum: 0}
        queued: {type: integer, minimum: 0}
        reason: {type: string, description: Empty means allowed; otherwise the reason new starts wait.}
        load_limit: {type: number, minimum: 0}
        history:
          type: array
          maxItems: 60
          items:
            type: object
            required: [at, load]
            properties:
              at: {type: string, format: date-time}
              load: {type: number, minimum: 0}
    PairingAccountChoice: {"type": "object", "additionalProperties": false, "required": ["account_key", "harness", "label"], "properties": {"account_key": {"type": "string", "minLength": 1, "maxLength": 128}, "harness": {"type": "string", "enum": ["claude", "codex", "cursor", "grok", "pi", "gemini", "opencode"]}, "provider": {"type": "string", "pattern": "^[a-z][a-z0-9_-]{0,63}$", "description": "Optional pi configured-provider binding; restricts the selected model profile, never a person identity or credential."}, "label": {"type": "string", "minLength": 1, "maxLength": 128}, "model_profile_id": {"type": "string", "format": "uuid"}, "config_home_id": {"type": "string", "pattern": "^[0-9a-f]{64}$", "description": "Opaque computer-local identifier for a separate isolated config home. Each home must have its own identifier; never send its path, contents or vendor identity. Multiple accounts per harness require it on every account."}}}
    PairingApproval: {"type": "object", "description": "Connect only never creates verification. Repeating the same selection may withdraw queued verification by changing one_per_harness to connect_only; it never replenishes verification. A new approval for an existing computer cancels older unclaimed queued verifications.", "additionalProperties": false, "required": ["request_digest", "verification", "selected_account_keys"], "properties": {"request_digest": {"type": "string", "pattern": "^[0-9a-f]{64}$"}, "verification": {"type": "string", "enum": ["one_per_harness", "connect_only"]}, "selected_account_keys": {"type": "array", "minItems": 1, "maxItems": 32, "uniqueItems": true, "items": {"type": "string", "maxLength": 128}}}}
    PairingDeviceRequest: {"type": "object", "additionalProperties": false, "required": ["request_id", "device_hash", "runtime_hash", "lifecycle_hash", "computer_name", "platform", "arch", "workspace_path", "capabilities", "accounts"], "properties": {"request_id": {"type": "string", "format": "uuid"}, "tenant_id": {"type": "string", "format": "uuid"}, "tenant_slug": {"type": "string"}, "device_hash": {"type": "string", "pattern": "^[0-9a-f]{64}$"}, "runtime_hash": {"type": "string", "pattern": "^[0-9a-f]{64}$"}, "lifecycle_hash": {"type": "string", "pattern": "^[0-9a-f]{64}$"}, "computer_name": {"type": "string", "minLength": 1, "maxLength": 128}, "platform": {"type": "string", "enum": ["darwin", "linux"]}, "arch": {"type": "string", "enum": ["arm64", "amd64"]}, "workspace_path": {"type": "string", "maxLength": 1024}, "capabilities": {"type": "array", "minItems": 1, "maxItems": 2, "uniqueItems": true, "items": {"type": "string", "enum": ["managed_runs", "ledger-v1"]}, "contains": {"const": "managed_runs"}}, "accounts": {"type": "array", "minItems": 1, "maxItems": 32, "items": {"$ref": "#/components/schemas/PairingAccountChoice"}}, "existing_computer_id": {"type": "string", "format": "uuid"}, "existing_lifecycle_secret": {"type": "string", "pattern": "^[0-9a-f]{64}$"}, "local_auth_public_key": {"type": "string", "maxLength": 88, "description": "Optional base64 X9.63 uncompressed P-256 public key from the Secure Enclave; immutable for the computer and included in browser-reviewed pairing details. Darwin only."}}, "oneOf": [{"required": ["tenant_id"], "not": {"required": ["tenant_slug"]}}, {"required": ["tenant_slug"], "not": {"required": ["tenant_id"]}}], "dependentRequired": {"existing_computer_id": ["existing_lifecycle_secret"], "existing_lifecycle_secret": ["existing_computer_id"]}}
    PairingDeviceResponse: {"type": "object", "additionalProperties": false, "required": ["request_id", "tenant_id", "user_code", "state", "expires_at", "interval_seconds", "verification_uri", "request_digest"], "properties": {"request_id": {"type": "string", "format": "uuid"}, "tenant_id": {"type": "string", "format": "uuid"}, "user_code": {"type": "string"}, "state": {"type": "string"}, "expires_at": {"type": "string", "format": "date-time"}, "interval_seconds": {"const": 5}, "verification_uri": {"type": "string"}, "request_digest": {"type": "string", "pattern": "^[0-9a-f]{64}$"}}}
    PairingDisconnect: {"type": "object", "additionalProperties": false, "required": ["mode", "expected_revision"], "properties": {"mode": {"type": "string", "enum": ["drain", "revoke_now"]}, "expected_revision": {"type": "integer", "minimum": 1, "description": "Required for person disconnect/remove from a reviewed PairingView. Optional for self-disconnect."}}}
    PairingGuide:

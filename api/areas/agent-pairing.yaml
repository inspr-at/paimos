        platforms: {type: array, items: {type: string}}
        platform_qualification: {type: string, description: Candidate builds require exact-release service qualification evidence}
        setup_command: {type: string, description: Instance-bound pair command; defaults are confirmed locally before requesting person approval}
        homebrew_command: {type: string, description: "Always offered; installs the latest INSPR release, which may differ from this server. brew install, then env \"$(brew --prefix)/bin/aeon-agentd\" pair --url …. env is the command so the substitution stays out of command position in fish, zsh, and bash, and an older binary on PATH cannot shadow it."}
        homebrew_formula_current:
          type: [boolean, 'null']
          deprecated: true
          description: "Legacy field retained for schema compatibility. New servers omit it and never fetch the tap; new clients ignore it."
        managed_installation: {type: string}
        managed_setup:
          type: object
          description: Optional deployment-admin-configured Nix/Home Manager guide; omitted when the instance has no reviewed module configuration. Commands remain bound to the server origin and never install or change a managed service.
          required: [command, service_option, module_url, service_note]
          properties:
            command: {type: string, description: "Instance-bound pair command: env \"$HOME/.nix-profile/bin/aeon-agentd\" pair --url …. env keeps the path out of command position in fish, zsh, and bash."}
            service_option: {type: string}
            module_url: {type: string, format: uri}
            service_note: {type: string}
            platform_note: {type: string, description: 'Platforms supported by the configured module, independent of the helper build targets'}
            prerequisite_note: {type: string, description: Reviewed package pin and PATH requirements before using the pair command}
        install_available: {type: boolean}
        install_targets:
          type: array
          items:
            type: object
            required: [platform, arch, service, qualification, artifact_url, checksums_url, command]
            properties:
              platform: {type: string, enum: [darwin, linux]}
              arch: {type: string, enum: [arm64, amd64]}
              service: {type: string, enum: [launchd-user, systemd-user]}
              qualification: {type: string}
              artifact_url: {type: string, format: uri}
              checksums_url: {type: string, format: uri}
              command: {type: string}
    PairingHarnessDetails: {"type": "object", "description": "Per-harness state, reason code and fix. The reason vocabulary is shared with the daemon's per-account blocked_accounts: repin_pending, dependency_invalid, pin_missing, pin_partial, pin_drifted, pin_invalid, pin_unsafe, login_required, starting, harness_failed, cli_unavailable, profile_permissions, binding_missing, probe_pending, probe_timeout, probe_failed, capacity_capture, capacity_timeout, pairing_sync_failed. pairing_sync_failed means lifecycle reconciliation or runtime refresh prevented polling; reason_detail carries only an allowlisted short cause, never a probe timeout. binding_missing means an approved enrollment has no local binding. probe_pending is bounded to 60 seconds after daemon startup; capacity_capture is expected to finish within 10 seconds. Expired waits become blocked probe_timeout or capacity_timeout reports. Gemini and OpenCode version-only probes report blocked with sign_in_unverified; this proves launcher availability only, never sign-in or readiness, and carries no guessed repair command. Newer bounded code tokens (state or reason) are retained and shown as needing attention with the raw code and no fix. Unsupported or unenrolled harnesses, malformed codes and reports that disagree with harness_statuses are ignored without interrupting fence sync or cleanup. Only allowlisted reason_detail sentences cross the host boundary; no raw diagnostics or paths. A ready, blocked or login_required harness may include attention_accounts naming enrolled accounts that need a fix. A ready harness requires a proper subset; blocked and login_required may name every enrollment. Diagnostics are scoped by account id, never copied from a harness summary to multiple accounts. attention_count is the full size of that set. attention_truncated is true when the account list is shorter than the count, or when an older report stopped at five names without a count; an omitted account is not ready. Omission clears earlier details.", "additionalProperties": {"type": "object", "required": ["state"], "properties": {"state": {"type": "string", "description": "Known states: ready, blocked, login_required, checking, draining. Other tokens come from newer daemons; harness_statuses omits them.", "maxLength": 64, "pattern": "^[a-z][a-z0-9_]{0,63}$"}, "reason": {"type": "string", "maxLength": 64, "pattern": "^[a-z][a-z0-9_]{0,63}$", "description": "Shared reason code; absent for ready and draining. A ready harness may still list attention_accounts for accounts that need a fix."}, "fix": {"$ref": "#/components/schemas/PairingHarnessFix"}, "attention_accounts": {"type": "array", "maxItems": 32, "description": "Enrolled accounts that need a fix, including when every account is blocked. A ready harness requires a proper subset; blocked and login_required reports may include every enrollment. At most 32 entries are kept, sorted by account id. The server drops unknown account ids, empty or malformed reasons, and any client-supplied command; the repair command is derived from the reason. A shorter list is not a claim that every omitted account is ready.", "items": {"type": "object", "additionalProperties": false, "required": ["account_id", "reason"], "properties": {"account_id": {"type": "string", "format": "uuid"}, "reason": {"type": "string", "maxLength": 64, "pattern": "^[a-z][a-z0-9_]{0,63}$"}, "reason_detail": {"type": "string", "maxLength": 160, "description": "Fixed allowlisted explanation of a failed sign-in check, confirmed sign-out, or pairing synchronization failure in the daemon view. Never vendor output, paths, identities or arbitrary error text. Omitted when ready or unknown. The server validates the phrase before storing it."}}}}, "attention_count": {"type": "integer", "minimum": 1, "maximum": 10000, "description": "Full number of enrolled accounts that still need a fix. Present with attention_accounts. Larger than that list when the list was capped. Equal to the list length when attention_truncated is true and an older report stopped at five names, so the count is only a lower bound."}, "attention_truncated": {"type": "boolean", "description": "True when attention_accounts omits accounts included in attention_count, or when a report stopped at the legacy five-name cap without proving the list is complete. An omitted account is not ready."}, "reason_detail": {"type": "string", "maxLength": 160, "description": "Fixed allowlisted explanation of a failed sign-in check, confirmed sign-out, or pairing synchronization failure in the daemon view. Never vendor output, paths, identities or arbitrary error text. Omitted when ready or unknown. The server validates the phrase before storing it."}}}}
    PairingHarnessFix: {"type": "object", "required": ["kind", "command"], "properties": {"kind": {"type": "string", "enum": ["repin", "add_harness", "login", "restart", "permissions"]}, "command": {"type": "string", "description": "Exact CLI line, for example `aeon-agentd repin --harness claude` or `aeon-agentd add-harness --harness codex`."}}, "description": "One fix form for harness_details and local blocked_accounts: the repair kind and the exact CLI line, derived by the server from the harness and reason code, never taken from daemon text. repin: Claude pin or dependency problems (replaces the shared Node/SDK pins). add_harness: the same problems for other harnesses; for a connected account it renews only that account's blocked interpreter pin. login: the vendor's normal sign-in. restart: resume setup after restoring the approved launcher, executable or profile permissions. permissions: make the default Claude profile private; only offered for that fixed diagnostic."}
    PairingHarnessStatuses: {"type": "object", "description": "Latest daemon-reported readiness by enrolled harness, independent of setup and process ownership. Missing entries are unreported; connectivity determines freshness. Contains status codes only, never local diagnostics. The computer stays ready while any harness is ready. Unknown, unenrolled or revoked harnesses are ignored during reconciliation so lifecycle fences and cleanup still succeed; a newer state token appears only in harness_details.", "additionalProperties": {"type": "string", "enum": ["ready", "blocked", "login_required", "checking", "draining"]}}
    PairingHookCapability: {"type": "object", "additionalProperties": false, "required": ["harness", "version", "os", "verified", "blocker"], "properties": {"harness": {"type": "string", "enum": ["claude", "codex", "cursor", "grok", "pi"]}, "version": {"type": "string", "maxLength": 80, "pattern": "^[A-Za-z0-9._+-]{0,80}$"}, "os": {"type": "string", "enum": ["darwin", "linux"]}, "verified": {"type": "boolean"}, "blocker": {"type": "string", "enum": ["", "feature_disabled", "qualification_pending", "unsupported_harness", "unsupported_version", "unsupported_platform", "artifact_untrusted", "artifact_changed", "config_environment", "project_override", "config_provenance", "project_scope", "settings_changed", "ownership_unknown", "repair_required"]}}}
    PairingLookup: {"type": "object", "additionalProperties": false, "required": ["user_code"], "properties": {"user_code": {"type": "string"}}}
    PairingReconcileRequest: {"type": "object", "additionalProperties": false, "required": ["tenant_id", "request_id", "lifecycle_secret"], "properties": {"tenant_id": {"type": "string", "format": "uuid"}, "request_id": {"type": "string", "format": "uuid"}, "lifecycle_secret": {"type": "string", "pattern": "^[0-9a-f]{64}$"}, "cleanup_confirmed_account_ids": {"type": "array", "maxItems": 256, "items": {"type": "string", "format": "uuid"}}, "computer_cleanup_confirmed": {"type": "boolean"}, "progress": {"type": "object", "additionalProperties": false, "required": ["state"], "properties": {"state": {"type": "string", "enum": ["provisioning", "login_required", "service_conflict", "connected", "setup_failed"]}, "error_code": {"type": "string", "enum": ["", "login_required", "service_conflict", "unsupported_platform", "managed_installation", "connectivity_failed", "private_storage_failed", "installation_failed", "verification_unavailable"]}, "harness_statuses": {"$ref": "#/components/schemas/PairingHarnessStatuses"}, "harness_details": {"$ref": "#/components/schemas/PairingHarnessDetails"}, "agent_release": {"$ref": "#/components/schemas/AgentRelease"}}}, "hook_capabilities": {"type": "array", "maxItems": 5, "items": {"$ref": "#/components/schemas/PairingHookCapability"}, "description": "Content-free local hook evidence, capped by the server qualification catalog. Never a messaging grant; absent means repair required."}}}
    PairingRedeemRequest: {"type": "object", "additionalProperties": false, "required": ["tenant_id", "request_id", "device_secret"], "properties": {"tenant_id": {"type": "string", "format": "uuid"}, "request_id": {"type": "string", "format": "uuid"}, "device_secret": {"type": "string", "pattern": "^[0-9a-f]{64}$"}}}
    PairingSelfDisconnect: {"type": "object", "additionalProperties": false, "required": ["mode"], "properties": {"mode": {"type": "string", "enum": ["drain", "revoke_now"]}, "account_id": {"type": "string", "format": "uuid"}, "expected_revision": {"type": "integer", "minimum": 1, "description": "Required for person disconnect/remove from a reviewed PairingView. Optional for self-disconnect."}}}
    PairingVerificationCapabilities:
      type: object
      description: Server-owned qualification of its matching helper release; a client cannot widen this map. Unsupported choices require explicit connect_only or exclusion.
      additionalProperties:
        type: object
        required: [supported, policy, reason]
        properties:
          supported: {type: boolean}
          policy: {type: string, enum: [no_tools, read_only, unavailable]}
          reason: {type: string, description: 'One concise explanation of the missing enforcement boundary when unsupported; empty when supported. Display as text, never infer support from the reason.'}


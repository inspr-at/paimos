# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/agentpairing
paths:
  /agent-pairing/account-link:
    post:
      operationId: accountLinkDevice
      summary: Offer or poll one account ownership code on its paired computer
      description: Requires the paired runtime bearer with account.probe and its installation lifecycle proof. Only its connected enrollment is accepted. A first offer returns one six-digit code valid for ten minutes; only its hash is persisted and subsequent offers never repeat the code or prompt. An explicit renew replaces an expired offer. Polls name the original request. Due pending requests become expired with one account.link_expired event in the same transaction. Computer or enrollment disconnect cancels pending requests with account.link_cancelled. No ownership, ongoing-use approval, capacity, grants or pairing changes occur here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_id, device_proof, operation]
              properties:
                account_id: {type: string, format: uuid}
                device_proof: {type: string, pattern: '^[a-f0-9]{64}$', writeOnly: true}
                operation: {type: string, enum: [offer, poll, renew]}
                request_id: {type: string, format: uuid, description: Required for poll}
      responses:
        '200': {description: Terminal prompt or its result; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AccountLinkDeviceView'}}}}
        '403': {description: Paired runtime and installation proof required}
        '404': {description: Connected enrollment or request not found}
        '409': {description: Offer still pending or pairing not redeemed}
        '429': {description: Persistent tenant attempt limit reached}
  /agent-pairing/account-link/lookup:
    post:
      operationId: lookupAccountLink
      summary: Review an account code as the current person
      description: Same-origin signed-in person with profile.write. The code hash is looked up only in that person's tenant and verified with a constant-time comparison. A consumed or expired code cannot be looked up. Observing expiry persists the expired state and account.link_expired event before returning 410. No account ownership is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [user_code], properties: {user_code: {type: string, maxLength: 16}}}
      responses:
        '200': {description: 'Account, computer and current person to confirm', content: {application/json: {schema: {$ref: '#/components/schemas/AccountLinkReview'}}}}
        '403': {description: Same-origin signed-in person required}
        '404': {description: Code not found in current tenant}
        '410': {description: Code expired or consumed}
        '429': {description: Persistent tenant attempt limit reached}
        '503': {description: Account linking signing key unavailable}
  /agent-pairing/account-link/{requestId}/approve:
    post:
      operationId: approveAccountLink
      summary: Link the reviewed account to the current person in one confirmation
      description: Same-origin signed-in person with profile.write; agent keys are rejected. Body binds the reviewed tenant, person and account revision, preventing stale reviews or changed sessions. Requires the entered user_code and verifies its server-peppered HMAC in constant time inside the transaction before atomically consuming the request and appending account.linked. Observing expiry persists the expired state and account.link_expired event before returning 410. Never transfers an owned account. Does not authorize agent spending or alter machine pairing.
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenant_id, person_id, expected_revision, request_digest, user_code]
              properties:
                tenant_id: {type: string, format: uuid}
                person_id: {type: string, format: uuid}
                expected_revision: {type: integer, minimum: 0}
                request_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
                user_code: {type: string, maxLength: 16, writeOnly: true, description: Six-digit code entered by the person; spaces and hyphens are ignored}
      responses:
        '200': {description: Linked account, content: {application/json: {schema: {$ref: '#/components/schemas/AccountLinkReview'}}}}
        '403': {description: Same-origin signed-in person required}
        '404': {description: Request or code not found in current tenant}
        '409': {description: Account or session changed}
        '410': {description: Code expired or consumed}
        '429': {description: Persistent tenant attempt limit reached}
        '503': {description: Account linking signing key unavailable}
  /agent-pairing/account-links:
    get:
      operationId: listMyAccountLinks
      summary: Current person's linked accounts
      responses:
        '200': {description: Own links only, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccountLinkReview'}}}}}
        '403': {description: Signed-in person with profile.write required}
  /agent-pairing/account-links/{accountId}/unlink:
    post:
      operationId: unlinkMyAccount
      summary: Unlink one of the current person's accounts
      description: Same-origin person with profile.write. Only its owner can unlink. Invalidates outstanding codes and increments the ownership revision; emits account.unlinked. Runs, pairing, capacity and history stay.
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expected_revision], properties: {expected_revision: {type: integer, minimum: 0}}}
      responses:
        '204': {description: Unlinked}
        '403': {description: Same-origin signed-in owner required}
        '404': {description: Own linked account not found}
        '409': {description: Ownership changed; refresh first}

  /agent-pairing/accounts/sign-out:
    post:
      operationId: signOutAccountEverywhere
      description: Person account.manage and ownership of every sign-in required. Atomically revokes the complete revision-bound canonical quota account set. Other accounts and vendor sessions outside PAIMOS remain untouched; local cleanup stays pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targets]
              properties:
                targets:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [computer_id, account_id, expected_revision]
                    properties:
                      computer_id: {type: string, format: uuid}
                      account_id: {type: string, format: uuid}
                      expected_revision: {type: integer, minimum: 1}
      responses:
        '200': {description: All reviewed sign-ins blocked; local cleanup pending}
        '403': {description: Current owner permission required}
        '409': {description: Reviewed sign-in set changed}
  /agent-pairing/attach:
    post:
      operationId: attachDevice
      summary: Paired daemon requests, activates, renews or ends an attached session
      description: >-
        The single paired-runtime attach route. At daemon startup, register requires the
        paired bearer, computer lifecycle proof and a fresh memory-only poll_key.
        Protocol-less registrations are acknowledged as registered with protocol 1 so older
        daemons keep serving; every other attach operation from those keys returns 409
        update_agentd. Only keys registered with attach_protocol=2 and
        local_consent_proof_version=2 can attach. Omitted proof versions mean v1;
        protocol-2 registrations with an unsupported proof version return 409 update_agentd
        with guidance to upgrade paimos-agentd before any approval or Touch ID prompt.
        Successful registration advertises the server's required proof version.
        Upgrading the daemon preserves existing pairing keys; re-pairing is unnecessary.
        Successful registration invalidates all earlier watches on that computer,
        requiring new owner approval.
        All other operations require the paired bearer and registered poll_key; lifecycle
        proof alone is rejected. Neither daemon nor server persists the poll key. Codes never
        appear in URL paths or queries; approval links use a fragment removed by the web app.
        If process memory lost the registration, an authenticated principal for a connected
        computer with valid attach scope receives 403 with attach_refusal=poll_key_unknown.
        This is distinct from an incorrect key, revoked pairing, draining enrollment or
        foreign tenant, which never authorize automatic registration. The daemon may register
        once and replay the rejected operation once, with serialized, bounded jittered backoff.
        Registration still ends earlier approvals and watches; recovery never resumes them.
        Unknown-key eligibility checks have a separate in-memory budget of 30 attempts per
        minute per authenticated computer principal, checked before database eligibility reads.
        Recovery does not spend the tenant-wide attach request budget. A capped recovery
        returns 429 with code=attach_recovery_limited and Retry-After in seconds; it does
        not authorize registration. The daemon honors valid Retry-After delays before any
        further exchange or registration. The server retains at most 4096 live recovery
        budgets across tenants; at capacity, new principals are refused until an existing
        slot expires, including principals from other tenants (accepted AEON-608 limitation).
        Requests, activation and every poll
        repeat the immutable kernel-observed snapshot. Lease is 60 seconds and cannot
        be resurrected. The server pins the owner's consent_mode at person approval.
        local_auth remains approved (no session or lease) until the registered daemon
        echoes consent_digest, the server-issued local_auth_nonce and a P-256 ASN.1 DER
        local_auth_signature from its pairing-pinned Secure Enclave key. The signature
        covers the canonical Touch ID reason as well as the digest and nonce. A bare
        local_confirmed boolean is refused. Nonces are single-use and expire with
        the request. Once a pairing has a pinned key, pending approval uses local_auth
        regardless of local_auth_capability, and the snapshot platform must match the
        platform stored at pairing. Legacy pairings use Aeon approval until re-paired.
        Missing confirmation never activates; request-supplied policy overrides are refused.
        Registration may report local_auth_capability. Omission is stored as unreported.
        That report is advisory and never satisfies local confirmation. A later poll cannot change it.
        A snapshot with mode=lease attaches metadata only: transcript and file_id must be
        empty, text is rejected, and no conversation stream is available. Both modes require
        consent_digest at approval, activation and every active poll; approval is single-use.
        The exited operation is only for a kernel confirmation that the pinned process
        has exited; loss of contact is unreachable.
        Snapshots without mode select the default conversation watch; status-only is an explicit local choice.
        Owner diagnostics are additive: errors retain their existing code and error fields
        and may include attach_refusal (version_mismatch, pairing_revoked, ticket_not_visible,
        code_expired, draining, enrollment_unavailable, or poll_key_unknown). Draining or removed enrollments
        refuse new attachment authority, including status-only attachment of a running process.
        Registration authenticates the computer lifecycle proof before
        reporting version mismatch; apart from poll_key_unknown, later operations authenticate
        the registered poll key and computer principal before reporting a cause. Unauthenticated and foreign callers
        receive generic refusals without attach_refusal. Revoked bearer credentials remain
        unauthenticated; only the locally authenticated interactive helper offers pairing-repair guidance.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttachDeviceRequest'}
      responses:
        '200':
          description: Registration acknowledgement or attach state; user_code is returned only to the requesting daemon
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/AttachView'}
                  - {$ref: '#/components/schemas/AttachedMessageCapability'}
                  - {$ref: '#/components/schemas/AttachedMessageExchange'}
                  - type: object
                    required: [state]
                    additionalProperties: false
                    properties:
                      state: {type: string, const: registered}
                      local_consent_proof_version: {type: integer, const: 2, description: Required consent signature version; independent of attach_protocol}
        '400': {description: Invalid attach request; conversation text on status-only or pre-activation polls detaches the attach}
        '403':
          description: Registered memory-only poll key required; lifecycle proof only authorizes registration. Only an authenticated owning daemon receives a diagnostic.
          content: {application/json: {schema: {$ref: '#/components/schemas/AttachRefusal'}}}
        '409':
          description: Snapshot or consent mismatch, poll sequence rejected, or update agentd required. Only an authenticated owning daemon receives a diagnostic.
          content: {application/json: {schema: {$ref: '#/components/schemas/AttachRefusal'}}}
        '410':
          description: Expired or revoked; new owner approval required
          content: {application/json: {schema: {$ref: '#/components/schemas/AttachRefusal'}}}
        '429':
          description: >-
            Attempt or stream quota exceeded, or (error code attach_recovery_limited) the
            computer recovery budget is exhausted; honor Retry-After before retrying.
            Alternatively (error code attach_live_limit) the person
            already has 32 attach requests waiting or approved. Declining, approving into a
            session or letting one expire frees a slot; a retry of an existing request is
            still answered. The daemon prints this case in plain words.
          headers:
            Retry-After:
              description: Seconds to wait before retrying a capped operation
              schema: {type: string, pattern: '^[1-9][0-9]*$'}
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                  code: {type: string, examples: [attach_live_limit, attach_recovery_limited, rate_limited]}
  /agent-pairing/attach/lookup:
    post:
      operationId: lookupAttach
      summary: Paired computer owner reviews a nine-digit attach code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_code]
              properties:
                user_code: {type: string, pattern: '^[0-9]{9}$'}
      responses:
        '200':
          description: Immutable approval snapshot and digest, no conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttachView'}
        '403': {description: Same-origin signed-in owner required}
        '404': {description: Code unavailable}
        '429': {description: Attempt cap reached}
  /agent-pairing/attach/pending:
    get:
      operationId: listPendingAttach
      summary: Paired computer owner lists their attach requests that are not a session yet
      description: >-
        Person-only, read-only and additive. Returns the signed-in owner's requests
        that have not become a session, waiting ones first: every pending or approved
        request that has not expired (newest first; admission allows at most 32 per
        person, so none is ever cut off, whatever else ended after it), then up to four ended ones created in the last fifteen minutes,
        detached (declined or cancelled) and unreachable (expired). An unpolled
        request past its expiry is an ended one, reported as unreachable without
        changing the row. Each item is
        the same AttachView lookup returns, so the owner can approve it with the
        request and consent digests and no code; user_code, session_id and
        local_auth_nonce are never present. Approval keeps every existing check.
      responses:
        '200':
          description: The owner's recent attach requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                additionalProperties: false
                properties:
                  requests:
                    type: array
                    maxItems: 36
                    items: {$ref: '#/components/schemas/AttachView'}
        '403': {description: Signed-in person with account.manage required}
  /agent-pairing/attach/{requestId}/approve:
    parameters:
      - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: approveAttach
      summary: Same-origin paired owner approves exactly the reviewed snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_digest]
              properties:
                request_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
                consent_digest: {type: string, pattern: '^[0-9a-f]{64}$', description: 'Optional in the legacy request shape; protocol 2 requires this binding for both watch and status-only approval, otherwise returns 409'}
      responses:
        '200': {description: 'Approved snapshot; activation requires the registered daemon poll key and, for local_auth, its local confirmation'}
        '403': {description: Same-origin paired owner required}
        '409': {description: Digest differs from reviewed snapshot or approval already consumed}
        '410': {description: Approval expired or revoked}
  /agent-pairing/attach/{requestId}/messages:
    parameters:
      - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: attachedMessageCapability
      summary: Owner-only content-free messaging grant and specific readiness blocker
      responses:
        '200': {description: Messaging capability, content: {application/json: {schema: {$ref: '#/components/schemas/AttachedMessageCapability'}}}}
        '403': {description: Authenticated computer owner required}
  /agent-pairing/attach/{requestId}/messages/approve:
    parameters:
      - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: approveAttachedMessages
      summary: Allow my messages at the next step for this attachment and generation
      description: Separate single-use approval; watch consent never grants messaging. Requires an interactive same-origin owner session and the exact digest prepared by the independent local helper. Vendor context retention and the live watch audience remain outside Aeon's text-not-retained promise. Processes running as your OS user are not isolated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message_generation, consent_digest]
              properties:
                message_generation: {type: string, format: uuid}
                consent_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200': {description: Approved; policy B still requires a messaging-specific signed local confirmation, content: {application/json: {schema: {$ref: '#/components/schemas/AttachedMessageCapability'}}}}
        '403': {description: Same-origin interactive owner required}
        '409': {description: 'Stale generation, replay, digest mismatch, disabled feature or hook blocker'}
  /agent-pairing/attach/{requestId}/messages/revoke:
    parameters:
      - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: revokeAttachedMessages
      summary: Turn messages off; keep watching
      description: Stops later offers and purges queued payloads. An already released note cannot be recalled. Re-enabling needs a new generation and explicit approval.
      responses:
        '200': {description: Messages off; watch lease unchanged}
        '403': {description: Same-origin interactive owner required}
  /agent-pairing/attach/{requestId}/revoke:
    parameters:
      - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: revokeAttach
      summary: Paired owner ends a watch without stopping the process
      responses:
        '200': {description: Detached; conversation access ends}
        '403': {description: Same-origin paired owner required}

  /agent-pairing/computers:
    get:
      operationId: listPairedComputers
      responses:
        '200': {"description": "Pairing result; see state and cleanup fields", "content": {"application/json": {"schema": {"type": "object"}}}}
        '400': {description: Invalid or mismatched request}
        '403': {description: Person permission and same-origin approval required}
        '404': {description: Request or proof not found}
        '409': {description: Immutable choice or lifecycle conflict}
        '429': {description: Rate or attempt limit reached; honor Retry-After}
  /agent-pairing/computers/{computerId}:
    get:
      operationId: getPairedComputer
      parameters:
        - {"name": "computerId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      responses:
        '200': {"description": "Pairing result; see state and cleanup fields", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PairingView"}}}}
        '400': {description: Invalid or mismatched request}
        '403': {description: Person permission and same-origin approval required}
        '404': {description: Request or proof not found}
        '409': {description: Immutable choice or lifecycle conflict}
        '429': {description: Rate or attempt limit reached; honor Retry-After}
  /agent-pairing/computers/{computerId}/capacity:
    parameters:
      - {name: computerId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: saveComputerCapacity
      description: Person account.manage required; current computer owner only. Revision-bound, under the pairing access fence. Off by default; changes affect only new starts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, policy]
              properties:
                expected_revision: {type: integer, minimum: 1}
                policy: {$ref: '#/components/schemas/HostCapacityPolicy'}
      responses:
        '200': {description: Saved capacity, content: {application/json: {schema: {$ref: '#/components/schemas/HostCapacityView'}}}}
        '400': {description: Invalid or oversized policy}
        '403': {description: Current owner permission required}
        '409': {description: Revision changed or computer removed}
  /agent-pairing/computers/{computerId}/disconnect:
    post:
      operationId: disconnectPairedComputer
      parameters:
        - {"name": "computerId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PairingDisconnect"}}}}
      responses:
        '200': {"description": "Pairing result; see state and cleanup fields", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PairingView"}}}}
        '400': {description: Invalid or mismatched request}
        '403': {description: Person permission and same-origin approval required}
        '404': {description: Request or proof not found}
        '409': {description: Immutable choice or lifecycle conflict}
        '429': {description: Rate or attempt limit reached; honor Retry-After}
  /agent-pairing/computers/{computerId}/enrollments/{accountId}/disconnect:
    post:
      operationId: disconnectPairedEnrollment
      parameters:
        - {"name": "computerId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
        - {"name": "accountId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PairingDisconnect"}}}}
      responses:
        '200': {"description": "Pairing result; see state and cleanup fields", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PairingView"}}}}
        '400': {description: Invalid or mismatched request}
        '403': {description: Person permission and same-origin approval required}
        '404': {description: Request or proof not found}
        '409': {description: Immutable choice or lifecycle conflict}
        '429': {description: Rate or attempt limit reached; honor Retry-After}
  /agent-pairing/computers/{computerId}/enrollments/{accountId}/verify:
    post:
      operationId: verifyPairedAccountAgain
      summary: Authorize one fresh read-only verification of an existing account
      description: Signed-in account owner with account.manage, same-origin. For an unlinked account the enrollment approver is its owner. Rechecks ownership, computer revision and prior verification run inside the write. Supersedes only this enrollment's unclaimed queued verification and releases its holds. Claimed nonterminal work is rejected. Keeps the account, key, pairing request, daemon generation, ongoing approval and local cleanup. Creates one run and one expiring request allowance, audited; no automatic refill. The local verify command opens this person's approval screen and grants nothing itself.
      security: [{session: []}]
      parameters:
        - {name: computerId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, expected_verification_run_id]
              properties:
                expected_revision: {type: integer, minimum: 1}
                expected_verification_run_id: {type: [string, 'null'], format: uuid}
      responses:
        '200':
          description: Fresh verification created; stale repeats are rejected without another allowance
          content:
            application/json:
              schema:
                type: object
                required: [account_id, run_id, expires_at]
                properties:
                  account_id: {type: string, format: uuid}
                  run_id: {type: string, format: uuid}
                  expires_at: {type: string, format: date-time}
        '400': {description: Invalid request}
        '403': {description: Account owner and person permission required}
        '404': {description: Enrollment not found}
        '409': {description: 'Stale binding, active claimed check or unavailable enrollment'}

  /agent-pairing/computers/{computerId}/name:
    parameters:
      - {name: computerId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: renamePairedComputer
      description: Person account.manage and computer ownership required; changes only its displayed name, using the reviewed revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, expected_revision]
              properties:
                name: {type: string, minLength: 1, maxLength: 128}
                expected_revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Saved computer name}
        '400': {description: Invalid name}
        '403': {description: Current owner permission required}
        '409': {description: Computer changed or removed}
  /agent-pairing/computers/{computerId}/remove:
    post:
      operationId: removePairedComputer
      summary: Remove a revoked or never-confirmed computer from the list (AEON-402)
      description: Signed-in person with account.manage, same-origin. A never-confirmed computer (approved, never redeemed or seen) is revoked first. The computer and its account bindings are archived and leave the computers list; the rows, runs and audit events stay (agent_pairing.removed). A connected or draining computer that has reported must be disconnected first (409 computer_connected); unsettled runs keep it listed (409 runs_unsettled). Repeating it returns the same view.
      parameters:
        - {"name": "computerId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      responses:
        '200': {"description": "The removed computer, with archived_at", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PairingView"}}}}
        '403': {description: Person permission and same-origin approval required}
        '404': {description: Computer not found}
        '409': {description: Connected computer or unsettled runs}
  /agent-pairing/device:
    post:
      operationId: requestDevicePairing
      security: []
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PairingDeviceRequest"}}}}
      responses:
        '200': {"description": "Pairing result; see state and cleanup fields", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PairingDeviceResponse"}}}}
        '400': {description: Invalid or mismatched request}
        '403': {description: Person permission and same-origin approval required}
        '404': {description: Request or proof not found}
        '409': {description: Immutable choice or lifecycle conflict}
        '429': {description: Rate or attempt limit reached; honor Retry-After}
  /agent-pairing/guide:
    get:
      operationId: pairingGuide
      security: []
      responses:
        '200': {description: Instance-bound bootstrap guide and candidate release targets, content: {application/json: {schema: {$ref: '#/components/schemas/PairingGuide'}}}}
        '400': {description: Invalid or mismatched request}
        '403': {description: Person permission and same-origin approval required}
        '404': {description: Request or proof not found}

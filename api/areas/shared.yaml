        source: {type: string}
        applies: {type: string, enum: [next_run, next_turn]}
        change_instructions: {type: string}
        tiers: {type: array, minItems: 3, maxItems: 3, items: {$ref: '#/components/schemas/ServiceTierCapability'}}
    StageArtifact:

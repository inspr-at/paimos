      properties:
        id: {type: string, format: uuid}
        heading: {type: string}
        body: {type: string}
        nodes: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/QuoteTextNode'}}
        numbering_style: {type: string, enum: [decimal, upper-roman, lower-roman, upper-alpha, lower-alpha, none], description: Omitted means decimal}
        page_break_before: {type: boolean, description: Omitted means false}
        keep_together: {type: boolean, description: Omitted means true}
        spacing_before_mm: {type: string, pattern: '^(?:0|[1-9][0-9]?)(?:\.[0-9])?$', description: Exact millimetres from 0 to 40}
        spacing_after_mm: {type: string, pattern: '^(?:0|[1-9][0-9]?)(?:\.[0-9])?$', description: Exact millimetres from 0 to 40}
    QuoteInlineMark:
      type: object
      required: [start, end]
      properties:
        start: {type: integer, minimum: 0, description: Inclusive UTF-16 offset}
        end: {type: integer, minimum: 1, description: Exclusive UTF-16 offset}
        bold: {type: boolean}
        italic: {type: boolean}
    QuoteTextNode:
      type: object
      required: [id, kind, text]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [paragraph, item]}
        text: {type: string}
        depth: {type: integer, minimum: 0, maximum: 5}
        marker: {type: string, enum: [disc, circle, square, dash, decimal]}
        numbering: {type: string, enum: [outline]}
        list_start: {type: integer, minimum: 0, maximum: 9999}
        list_continue: {type: boolean}
        section_bound: {type: boolean}
        glyph: {type: string}
        marker_x_mm: {type: string, description: Exact signed decimal millimetres}
        marker_y_mm: {type: string, description: Exact signed decimal millimetres}
        text_start_mm: {type: string, description: Exact signed decimal millimetres}
        marks: {type: array, items: {$ref: '#/components/schemas/QuoteInlineMark'}}
    RecurrenceTrigger:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [time, event]}
        rrule: {type: string, maxLength: 256, description: 'Time only. FREQ=DAILY, FREQ=WEEKLY with optional BYDAY=MO,TU,WE,TH,FR,SA,SU, or FREQ=MONTHLY with optional BYMONTHDAY=-31..-1,1..31 and INTERVAL=1,2,3,6 (default 1). Monthly intervals step from the month of start_date. INTERVAL is rejected for DAILY and WEEKLY. Unspecified days derive from start_date. Other RFC 5545 parts are rejected.'}
        time_of_day: {type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$', description: Time only; HH:MM wall time.}
        timezone: {type: string, maxLength: 128, description: Time only; IANA timezone or UTC.}
        start_date: {type: string, format: date, description: Time only; defaults to today's date in the selected timezone. Inclusive earliest local date.}
        event: {type: string, enum: [release.published, node.done, knowledge.changed, external.tag, external.deploy], description: 'Event only. Done is a transition into the configured Done category; knowledge changes include creation, updates and archival. Sources before creation or during pause are ignored. New event kinds consume events in order, at most once per source event.'}
        event_start: {type: string, enum: [now, hour, morning], default: now, description: 'Event only; immediately, one hour later or next local morning at 06:00.'}
        event_timezone: {type: string, maxLength: 128, description: 'Event only; IANA zone for next morning, default UTC.'}
        filter: {$ref: '#/components/schemas/RecurrenceEventFilter'}
        external: {$ref: '#/components/schemas/RecurrenceExternalSender'}
    ReleaseNotes:
      type: object
      required: [source, snapshot_sha256, captured_at, release_revision, items, gaps, hidden]
      description: Additive v1 extension. Captured member benefits are authoritative, including an empty or hidden-only membership. When no snapshot was captured, fallback is historical-tag-headline and the git tag headline is only a labelled historical fallback for that release. Old manifests without notes keep the same labelled headline display. New builds always record notes, including gaps. Snapshot digest binds the exact tagged file bytes or the stored database snapshot JSON. Git headlines never replace captured benefits. written_after_release is true only when the captured snapshot was labelled backfilled.
      properties:
        source: {type: string}
        fallback: {type: string, enum: [historical-tag-headline], description: Set only when member benefits were not captured and the git tag headline is the labelled historical fallback}
        snapshot_sha256: {type: string}
        captured_at: {type: [string, 'null'], format: date-time}
        release_revision: {type: integer}
        hidden: {type: integer, minimum: 0}
        written_after_release: {type: boolean, description: "True when the captured snapshot was labelled backfilled. The release sheet says the notes were written after the release."}
        corrections:
          type: array
          description: Reviewed public-note corrections applied over the frozen original. The original snapshot digest is preserved; each correction records its reason and exact version binding. Hidden or absent tickets cannot be added.
          items:
            type: object
            required: [version, key, snapshot_sha256, reason]
            properties:
              version: {type: string}
              key: {type: string}
              snapshot_sha256: {type: string}
              reason: {type: string}
              group: {type: string, enum: [features, fixes, other]}
              pill_en: {type: string}
              pill_de: {type: string}
              benefit_en: {type: string}
              benefit_de: {type: string}
        gaps: {type: array, items: {type: string}}
        public_items:
          type: array
          description: Portable product notes with no tenant-local identifiers. When present, these are the embedded fallback instead of items. Tenant snapshots omit this field and retain precedence.
          items:
            type: object
            required: [key, pill_en, pill_de, benefit_en, benefit_de]
            properties:
              key: {type: string}
              pill_en: {type: string}
              pill_de: {type: string}
              benefit_en: {type: string}
              benefit_de: {type: string}
              group: {type: string, enum: [features, fixes, other], description: "Frozen classification, including a group recorded at export when an older snapshot did not capture one. Omitted until then."}
        items:
          type: array
          items:
            type: object
            required: [id, key, pill_en, pill_de, benefit_en, benefit_de]
            properties:
              id: {type: string, format: uuid}
              key: {type: string}
              group: {type: string, enum: [features, fixes, other], description: "Frozen classification when the snapshot captured it. When an older snapshot omitted it, the server fills features or fixes from the ticket's current classification only (a bug is a fix) and leaves the captured pill and benefit unchanged."}
              pill_en: {type: string}
              pill_de: {type: string}
              benefit_en: {type: string}
              benefit_de: {type: string}
    ReviewBinding:
      type: object
      required: [ticket_node_id, repository, base_sha, head_sha, author_family]
      properties:
        ticket_node_id: {type: string, format: uuid}
        repository: {type: string}
        base_sha: {type: string}
        head_sha: {type: string}
        author_family: {type: string}

        mode: {type: string, enum: [off, other_family, allowlist]}
        allowed_families:
          type: array
          maxItems: 6
          uniqueItems: true
          description: "Nonempty only for allowlist; other modes require an empty list."
          items: {type: string, enum: [openai, anthropic, xai, cursor, google, local]}
    ReviewPolicySettings:
      type: object
      required: [project_id, policy, effective, source, updated_by, updated_at]
      properties:
        project_id: {type: [string, 'null'], format: uuid}

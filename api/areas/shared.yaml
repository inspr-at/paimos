        author_run_id: {type: [string, 'null'], format: uuid}
        reviewer_profile_id: {type: [string, 'null'], format: uuid}
        reviewer_family: {type: [string, 'null']}
        pull_request: {type: [integer, 'null']}
    ReviewPolicy:
      type: object

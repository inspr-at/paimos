        source_handover_id: {type: string, format: uuid, description: Reserved for a verified AEON-524 adapter; currently returns source_unavailable}
        anyway_reason: {type: string, minLength: 1, maxLength: 2000}
    QuestionOption:
      type: object
      additionalProperties: false
      required: [id, title, description, answer]
      properties:
        id: {type: string, pattern: '^[a-zA-Z0-9_-]{1,40}$'}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 1000}
        answer: {type: string, minLength: 1, maxLength: 4000}
    QuestionOutcome:
      type: string
      enum: [once, always, requirement, doctrine]
    QuestionOutcomeAvailability:
      type: object
      required: [outcome, available, why]
      properties:
        outcome: {$ref: '#/components/schemas/QuestionOutcome'}
        available: {type: boolean}

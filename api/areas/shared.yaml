        mapping_present: {type: boolean, description: Cheap Doctrine mapping hint; the exact source and guard are validated only when deciding and applying.}
    QuestionPage:
      type: object
      required: [items, has_more]
      properties:
        next_cursor: {type: string, maxLength: 512, description: Present only when order=desc has another page. Continue with the same scope and filters; concurrent new decisions appear after refreshing from the first page.}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Question'}}
        has_more: {type: boolean}
    QuestionPending:
      type: object
      required: [id, revision, kind, state, deliver_after]
      properties:
        id: {type: string, format: uuid}
        asker_id: {type: string, format: uuid}
        revision: {type: integer}
        kind: {type: string, enum: [inbox, comment, outcome]}
        state: {type: string, enum: [pending, delivered, failed, replaced]}
        deliver_after: {type: string, format: date-time}
        effect_ref: {type: string}
        error_code: {type: string}
        error_message: {type: string, description: Safe explanation of a failed effect; retryable effects recheck authority; final conflicts require a new decision.}
        effect_data: {$ref: '#/components/schemas/QuestionEffectData'}
        receipt_state: {type: string, enum: [queued, handed_off, failed], description: Inbox receiver confirmation. Outbox state delivered means dispatched only.}
        receipt_failure: {type: string}
        delivery_session_id: {type: string, format: uuid, description: Exact original generation or verified successor.}
        doctrine_state: {type: string, description: Current referenced proposal state; delivered does not mean the draft is still pending.}
    QuestionReuse:
      type: object
      description: Immutable per-asker provenance retained when the answer is later corrected. The active source decision reuse_count increments once per new membership, never on replay or delivery retry.
      required: [label, decision_id, revision]
      properties:
        label: {type: string, const: From the record}
        decision_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 2}
    QueuedTicket:
      type: object
      required: [position, by, at, run_id, targeted, waiting]
      properties:
        position: {type: integer, minimum: 1}
        by: {type: object, required: [id, name, kind], properties: {id: {type: string, format: uuid}, name: {type: string}, kind: {type: string, enum: [person, agent]}}}
        at: {type: string, format: date-time}
        run_id: {type: string, format: uuid}
        targeted: {type: boolean}
        target_agent_id: {type: [string, 'null'], format: uuid}
        expected_agent_id: {type: [string, 'null'], format: uuid}
        model_profile_id: {type: [string, 'null'], format: uuid}
        expected_start_at: {type: [string, 'null'], format: date-time}
        manual_order: {type: boolean}
        waiting: {type: boolean}
        wait_reason: {type: string}
        security_review_required: {type: boolean}
    QuoteDocument:
      type: object
      additionalProperties: false
      required: [schema_version, minimum_writer_version, title, subtitle, project_ref, offer_date, valid_until, currency, sender, recipient, legal, layout, sections, positions, net_total_cents]
      properties:
        schema_version: {type: integer, const: 1}
        minimum_writer_version: {type: integer, enum: [1, 2]}
        title: {type: string, maxLength: 512}
        subtitle: {type: string, maxLength: 512}
        project_ref: {type: string, maxLength: 512}
        offer_date: {type: string, format: date}
        valid_until: {type: string, format: date}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        sender: {type: object}
        recipient: {type: object}
        legal: {type: object}
        layout: {type: object}
        profile: {type: object, description: 'Immutable selected profile id, revision, and full definition snapshot; included in the issued document digest'}
        sections: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/QuoteDocumentSection'}}
        positions: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/QuoteDocumentPosition'}}
        net_total_cents: {type: integer, minimum: 0, description: Server-computed; input is ignored}
    QuoteDocumentPosition:
      type: object
      required: [id, pricing_source, short_text, long_text, quantity, unit_label, unit_price_cents, total_cents, currency]
      properties:
        id: {type: string, format: uuid}
        pricing_source: {type: string, enum: [manual, cost_unit]}
        short_text: {type: string}
        long_text: {type: string}
        quantity: {type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$', description: Exact quantity}
        unit_label: {type: string, maxLength: 80}
        unit_price_cents: {type: integer, minimum: 0}
        total_cents: {type: integer, minimum: 0, description: Server-computed}
        cost_unit_node_id: {type: string, format: uuid}
        rate_unit: {type: string, enum: [hour, day, item]}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    QuoteDocumentSection:
      type: object

      required: [code, challenge_id, expires_at]
      properties:
        code: {const: step_up_required}
        challenge_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
    Tenant:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        brand:
          $ref: "#/components/schemas/TenantBrand"
    TenantBrand:
      type: object
      description: The workspace's own brand for the header (AEON-431). Absent when the workspace has set nothing; each part is absent when unset. Render logos only through an img element.
      properties:
        short_name: {type: string, maxLength: 32}
        logo: {$ref: "#/components/schemas/TenantBrandLogo"}
        logo_dark: {$ref: "#/components/schemas/TenantBrandLogo"}
    TenantBrandLogo:
      type: object
      required: [url, width, height]
      properties:
        url: {type: string, description: Same-origin image URL carrying the content hash; the response is immutable.}
        width: {type: integer, minimum: 1, maximum: 4096}
        height: {type: integer, minimum: 1, maximum: 4096}
    Theme:
      type: object
      required: [id, tenant_id, name, scope, owner_principal_id, values, revision, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        scope: {type: string, enum: [default, workspace, personal]}
        owner_principal_id: {type: [string, 'null'], format: uuid, description: 'Person owning a personal theme (canonical at creation); preserved through linking and unlinking. Null means workspace-owned'}
        values: {$ref: '#/components/schemas/ThemeValues'}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ThemeAccent:
      type: object
      additionalProperties: false
      required: [light, dark]
      properties:
        light: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        dark: {type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$', description: 'Null means derived; explicit Porcelain dark preserves the current look'}
    ThemeAgentStates:
      type: object
      additionalProperties: false
      required: [working, waiting, throttled, problem, idle]
      properties:
        working: {$ref: '#/components/schemas/ThemeAccent'}
        waiting: {$ref: '#/components/schemas/ThemeAccent'}
        throttled: {$ref: '#/components/schemas/ThemeAccent'}
        problem: {$ref: '#/components/schemas/ThemeAccent'}
        idle: {$ref: '#/components/schemas/ThemeAccent'}
    ThemeValues:
      type: object
      additionalProperties: false
      required: [primary, secondary, recurring_marker, agents]
      properties:
        primary: {$ref: '#/components/schemas/ThemeAccent'}
        secondary: {$ref: '#/components/schemas/ThemeAccent'}
        recurring_marker:
          type: object
          additionalProperties: false
          required: [source, custom]
          properties:
            source: {type: string, enum: [primary, secondary, neutral, custom]}
            custom: {type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$', description: Required and non-null when source is custom; retained when choosing another source}
        agents:
          type: object
          additionalProperties: false
          required: [avatar, ring, hover, size, palette]
          allOf:
            - if:
                properties:
                  palette: {const: custom}
                required: [palette]
              then:
                required: [custom_states]
                properties:
                  custom_states: {$ref: '#/components/schemas/ThemeAgentStates'}
          properties:
            avatar: {type: string, enum: [pulse, robot-1, robot-2, robot-3, robot-4, robot-5, orbit, quill, sprite]}
            ring: {type: [string, 'null'], enum: [moving, still, off, null], description: Null retains the selected style's drawn ring}
            hover: {type: boolean}
            size: {type: [integer, 'null'], minimum: 30, maximum: 100, description: Artwork fullness percentage; null retains the style's drawn size}
            palette: {type: string, enum: [standard, protan, deutan, tritan, monochrome, focus, errors, custom]}
            custom_states:
              description: 'Five state accents; required and non-null for custom, retained for other looks. Omitted means null; no migration needed.'
              default: null
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/ThemeAgentStates'
            dim_inactive: {type: boolean, description: 'Dim idle and ended agents; omitted means true'}
            inactive_opacity: {type: integer, minimum: 40, maximum: 80, description: 'Inactive opacity percent; omitted means 55'}
    TicketBenefitFields:
      type: object
      additionalProperties: true
      description: Tenant-default ticket fields. Drafts may be incomplete; entering a built-in completed state (done, accepted, delivered) from outside that set validates pills (2–4 whitespace-separated words) and nonblank benefits. One or two plain-language sentences and translation quality are editorial requirements, not inferred by software. roadmap_public publishes the ticket on the public roadmap. Only a person can turn that on or clear it. The server writes source, by and at. Agents cannot publish.
      properties:
        pill_en: {type: string, description: "English pill, 2–4 words"}
        pill_de: {type: string, description: "German pill, 2–4 words"}
        benefit_en: {type: string, description: "English benefit, one or two plain-language sentences"}
        benefit_de: {type: string, description: "German benefit, one or two plain-language sentences, neutral without direct address"}
        hide_from_release_notes: {type: boolean, default: false, description: Omit from public notes; does not waive completion requirements}
        no_release_needed: {type: boolean, default: false, description: 'Content or tool work needing no software release. Done work uses rules.accept.days before automatic acceptance, unless there is an objection or pending human check. Omitted from release notes; completion requirements still apply.'}
        roadmap_public: {type: boolean, description: Person approval for the public roadmap. False and omitted are unpublished. Only a person can change that.}
        roadmap_public_source: {type: [string, 'null'], enum: [person, null], description: Acting principal kind. Must be person when supplied while publishing.}
        roadmap_public_by: {type: [string, 'null'], format: uuid, readOnly: true, description: Person principal id. The server overwrites this.}
        roadmap_public_at: {type: [string, 'null'], format: date-time, readOnly: true, description: 'When a person published the ticket, UTC. The server overwrites this.'}
    TicketEstimate:
      type: object
      required: [hours, estimated_children, open_children]
      description: Read-only leaf estimate sum. A parent's own typed estimate is planned_hours and is never added to the sum. Archived, cancelled and deleted leaves are excluded. Existing estimated_children/open_children fields remain compatibility aliases for estimated_leaves/leaf_count. Counts include done leaves so regrouping cannot alter the total.
      properties:
        hours: {type: [number, 'null'], exclusiveMinimum: 0}
        planned_hours: {type: [number, 'null'], exclusiveMinimum: 0}
        is_parent: {type: boolean}
        estimated_leaves: {type: integer, minimum: 0}
        leaf_count: {type: integer, minimum: 0}
        estimated_children: {type: integer, minimum: 0}
        open_children: {type: integer, minimum: 0}
        by: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}}}
    TicketEstimateFields:
      type: object
      additionalProperties: true
      description: Agent work hours until ready for review. New values must be positive and at most 200. Omit or set hours to null to clear with the provenance. Legacy unchanged values remain editable. The server derives source from the authenticated principal (person or agent), and sets by and at; supplied new provenance cannot impersonate another principal. An explicit source must match the caller. To confirm the same hours, resubmit them without by/at. A person or an active agent bound to this ticket confirms the estimate.
      properties:
        estimate_hours: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 200}
        estimate_source: {type: string, enum: [agent, person]}
        estimate_by: {type: string, format: uuid, readOnly: true}
        estimate_at: {type: string, format: date-time, readOnly: true}
        estimate_confirmed: {type: boolean, readOnly: true, description: True for a person or active bound worker; false for an agent draft.}
    TicketRouteFields:
      type: object
      additionalProperties: true
      description: >-
        Classification of work items, tickets and tasks. Creating an estimate or changing its hours or provenance fills missing route_role, area and complexity from title/labels, ancestor defaults, then build/backend. A changed route_role also refreshes suggestions. These changes are compared with the stored fields under the node lock; resending an unchanged estimate with an unrelated fields edit leaves missing hints absent.
        Server suggestions have source suggested and confirmed false; by is the acting principal and at is UTC. Explicit values are stamped person or agent; only a person confirms classifications.
        To confirm an unchanged suggestion or an unconfirmed agent classification, a person resubmits its value without source/by/at. Other unchanged values retain stored provenance. Clients cannot forge confirmation or attribution.
        Complexity is S for up to 2 hours, M for up to 8, L above 8; build-hard promotes S to M and M to L. Only unconfirmed server-derived complexity follows estimate/role changes.
        Null clears a classification and provenance. When an estimate or route_role changes and valid hours remain, missing classifications are suggested again. Existing tickets are not backfilled by unrelated edits.
      properties:
        route_role: {type: [string, 'null'], enum: [scout, mechanical, build, build-hard, review-gate, review-gate-security, null]}
        route_role_source: {type: [string, 'null'], enum: [agent, person, suggested, null]}
        route_role_by: {type: [string, 'null'], format: uuid, readOnly: true}
        route_role_at: {type: [string, 'null'], format: date-time, readOnly: true}
        route_role_confirmed: {type: boolean, readOnly: true}
        area: {type: [string, 'null'], maxLength: 48, description: 'Active default or project work-kind slug, excluding review and other. security is valid.'}
        area_source: {type: [string, 'null'], enum: [agent, person, suggested, null]}
        area_by: {type: [string, 'null'], format: uuid, readOnly: true}
        area_at: {type: [string, 'null'], format: date-time, readOnly: true}
        area_confirmed: {type: boolean, readOnly: true}
        complexity: {type: [string, 'null'], enum: [S, M, L, null]}
        complexity_source: {type: [string, 'null'], enum: [agent, person, suggested, null]}
        complexity_by: {type: [string, 'null'], format: uuid, readOnly: true}
        complexity_at: {type: [string, 'null'], format: date-time, readOnly: true}
        complexity_confirmed: {type: boolean, readOnly: true}
    WorkDisplayWords:
      type: object
      additionalProperties: false
      required: [label, hint, examples]
      properties:
        label: {type: string, minLength: 1, maxLength: 60}
        hint: {type: string, maxLength: 120}
        examples: {type: array, maxItems: 3, items: {type: string, minLength: 1, maxLength: 120}}
    WorkKind:
      type: object
      required: [id, slug, label, hint, position]
      properties:
        words_de: {$ref: '#/components/schemas/WorkDisplayWords', description: "German wording, stored separately from English; omitted for untranslated custom kinds."}
        display_words: {$ref: '#/components/schemas/WorkDisplayWords', description: "Complete wording for the requested display language, falling back to English as a whole."}
        examples: {type: array, maxItems: 3, items: {type: string, maxLength: 120}}
        labels: {type: array, maxItems: 32, items: {type: string, maxLength: 48}}
        ticket_count: {type: integer, minimum: 0}
        id: {type: string, format: uuid}
        slug: {type: string, maxLength: 48}
        label: {type: string, minLength: 1, maxLength: 60}
        hint: {type: string, maxLength: 120}
        project_id: {type: string, format: uuid}
        system: {type: string, enum: [review, security, other]}
        position: {type: integer}
        archived_at: {type: string, format: date-time}
    WorkerHandoff:
      type: object
      required: [run_id, work_order_id, worker_principal_id, project_id, lead_session_id, lead_generation, ticket_id, ticket_revision, work_order_revision, brief_sha256, state]
      properties:
        run_id: {type: string, format: uuid}
        work_order_id: {type: string, format: uuid}
        worker_principal_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        lead_session_id: {type: string, format: uuid}
        lead_generation: {type: integer, format: int64, minimum: 1}
        ticket_id: {type: string, format: uuid}
        ticket_revision: {type: string, format: date-time}
        work_order_revision: {type: integer, format: int64, minimum: 1}
        brief_sha256: {type: string, pattern: '^[a-f0-9]{64}$', description: 'SHA-256 of domain-separated canonical JSON title, body and ordered criterion descriptions; content is fetched through existing work-order/node APIs.'}
        worktree_id: {type: string, pattern: '^[a-f0-9]{64}$'}
        state: {type: string, enum: [assigned, launch_unknown, launched, completed], description: Completed requires confirmed process exit or proof launch was not attempted. Silence and terminal labels do not prove exit.}
        accepted_at: {type: string, format: date-time}
        launched_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        outcome: {type: string, enum: [completed, failed, cancelled, ownership_lost]}
  parameters:
    AeonStepUp:
      name: Aeon-Step-Up
      in: header
      required: false
      description: Single-use signed proof for the exact request; see OwnerWorkstationStepUp.
      schema: {type: string, maxLength: 181}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor bound to filters and sort
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
  responses:
    Error:
      description: Request error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Node:
      description: Node
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Node'
    OwnerWorkstationStepUpRequired:
      description: A marked owner workstation key needs local confirmation for this exact action.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OwnerWorkstationStepUp"}

        version: {type: string}
        release_channel: {type: string}
        release_sequence: {type: integer, minimum: 1}
        digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        commit_digest: {type: string}
        manifest_coordinate: {type: string}
        manifest_digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    StatusAutopilotChange:
      type: object
      required: [event_id, node_id, key, title, actor, rule, reason, from, to, at, undone, undoable]
      properties:
        event_id: {type: integer}
        node_id: {type: string, format: uuid}
        key: {type: string}
        title: {type: string}
        actor: {type: string, const: Status autopilot}
        rule: {type: string, enum: [new, backlog, blocked, progress, done, publish, accept, work_parent]}
        reason: {type: string}
        from: {type: string}
        to: {type: string}
        at: {type: string, format: date-time}
        undone: {type: boolean}
        changed_since: {type: boolean, description: A later ticket edit made the original change stale}
        requires_preview: {type: boolean, description: A derived parent change uses the causal Undo preview and confirmation API.}
        undoable: {type: boolean, description: Revision and state still match; Undo requires events.undo_other and nodes.update}
    StatusAutopilotOverride:
      type: object

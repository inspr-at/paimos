    Node:
      description: Ticket creation may return benefit warnings. Entering a built-in completed state (done, accepted, delivered) from outside that set requires both pills and benefits, including on creation and when hidden from release notes. Already-completed records remain editable, including transitions within that set.
      type: object
      required: [id, key, kind_id, title, body, fields, state, parent_id, position, created_at, updated_at]
      properties:
        is_leaf: {type: boolean, description: 'Work shape; only live work children make a parent. Absent for non-work nodes.'}
        depth: {type: integer, minimum: 1, description: 'Work level, starting at 1 after every project.'}
        level_name: {type: string, description: 'Workspace name, behind work-parent-status rollout. Leaf name wins over depth.'}
        level_icon: {type: string, description: 'Workspace SVG icon token; stable fallback.'}
        work_children_count: {type: integer, minimum: 0, description: 'Visible direct work children; never includes non-work children.'}
        status_derived: {type: boolean, description: 'Parent status follows children while rollout is enabled.'}
        queued: {$ref: '#/components/schemas/QueuedTicket'}
        recurrence:
          $ref: '#/components/schemas/NodeRecurrence'
          readOnly: true
          description: Read-only provenance on node GET and list responses, derived from a visible recurrence_occurrences receipt, never editable fields. Absent for ordinary tickets or an inaccessible source recurrence. Loaded once per bounded page, with no per-row HTTP requests. Retained after recurrence retirement.
        queue_stale: {type: boolean, description: 'Authoritative idle In progress eligibility: no assignee and no live agent run or bound session. Contains no worker identity. Rechecked on queue writes.'}
        id:
          type: string
          format: uuid
        key:
          type: string
          example: PAI-123
        kind_id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
          description: Markdown
        warnings:
          type: array
          items: {type: string}
          description: "Non-blocking ticket benefit guidance. An agent creating a ticket or task without estimate_hours is told to set fields.estimate_hours. The warning does not name a client flag."
        fields:
          type: object
          description: Tenant-configured fields. TicketBenefitFields and TicketEstimateFields describe default work properties; TicketRouteFields describes route_role, area and complexity classification. Other kinds retain their own schema. PATCH replaces fields. Unchanged estimate metadata is preserved; changing or resubmitting hours without provenance attributes the estimate to the caller.
        human_check:
          type: [string, 'null']
          maxLength: 500
          description: Optional pending person-only check. Automatic moves to Delivered and Accepted skip it. A person clears it with PATCH human_check=null; fields.human_check_completed then carries server-authored text, by (principal id) and at (UTC timestamp). Null when no pending check exists.
        state:
          type: string
        parent_id:
          type: [string, 'null']
          format: uuid
        position:
          type: string
          description: Decimal sibling rank
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        estimate:
          $ref: '#/components/schemas/TicketEstimate'
        deleted_at:
          type: [string, 'null']
          format: date-time

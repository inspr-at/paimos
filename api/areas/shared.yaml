    OwnerWorkstationStepUp:
      type: object
      description: >-
        HTTP 428 for a marked key's high-risk governance action. Retry the identical
        method, route (including query), body and conditional headers with
        Aeon-Step-Up: <challenge_id>.<base64 signature>. nonce and action_digest are
        lowercase 64-character hexadecimal strings. Sign their UTF-8 concatenation
        (128 ASCII bytes, no separator or hex decoding) with ECDSA P-256/SHA-256;
        the signature is ASN.1 DER in standard padded base64. The server verifies
        against the computer's pairing-pinned key, never a request-supplied key.
        Challenges expire after two minutes and are consumed once even if the
        eventual action fails. They bind tenant, key, agent, computer, exact action
        and signer. Changing marking, revoking, disconnecting or changing the signer
        invalidates authority. All mutating keys, roles, settings, rules publication,
        approval decisions, member removal/deactivation and workspace role changes
        require step-up. All governance attempts are recorded in the access audit.
        Agents must forward only challenge_id to agentd; agentd retrieves the original
        challenge using GET /agentd/step-ups/{challenge_id} with its runtime bearer and
        device proof. The agent receives no summary, nonce or action_digest.
      additionalProperties: false
      required: [code, challenge_id, expires_at]
      properties:
        code: {type: string, const: step_up_required}
        challenge_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
    PairingError: {"type": "object", "additionalProperties": false, "required": ["error", "code"], "properties": {"error": {"type": "string"}, "code": {"type": "string"}}}

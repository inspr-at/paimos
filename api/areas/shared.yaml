        speed_factor: {type: [number, 'null'], exclusiveMinimum: 0}
        price_multiplier: {type: [number, 'null'], exclusiveMinimum: 0}
        usage_multiplier: {type: [number, 'null'], exclusiveMinimum: 0, description: 'Subscription capacity consumption, separate from token price.'}
        mechanism: {type: string}
        reason: {type: string}
    ServiceTierReport:

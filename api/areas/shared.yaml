          oneOf:
            - {$ref: '#/components/schemas/ReviewPolicy'}
            - {type: 'null'}
          description: "The policy stored at this scope; null means inherited."
        effective: {$ref: '#/components/schemas/ReviewPolicy'}
        workspace: {$ref: '#/components/schemas/ReviewPolicy', description: 'Current workspace default before the project override.'}
        valid_families: {type: array, maxItems: 6, uniqueItems: true, items: {type: string}, description: 'The server registry of eligible model families.'}
        source: {type: string, enum: [default, tenant, project]}
        updated_by: {type: [string, 'null'], format: uuid}
        updated_at: {type: [string, 'null'], format: date-time}

    RuleError: {type: object, required: [error, code], properties: {error: {type: string}, code: {type: string, description: "forbidden for a general denial. GET /rules/merged and GET /rules/explained may use not_key_creator, key_revoked, key_expired, or agent_inactive when the caller could already see that agent."}, actual_bytes: {type: integer}, max_bytes: {type: integer}, layer: {type: string, enum: [company, project, person, agent], description: "AEON-314: the layer whose own cap was crossed; absent for the total"}}}
    RulesClientMaximum:
      type: [integer, 'null']

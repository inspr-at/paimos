# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/stagehandoff
paths:
  /stage-handoffs:
    post:
      deprecated: true
      operationId: requestStageHandoff
      summary: Request a stage operation
      description: "The INSPR Flow is retired. This compatibility route returns 410 without reading or changing Flow data. Historic success schemas remain pinned for external clients."
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageHandoffWrite'}}}}
      responses:
        '410': {$ref: '#/components/responses/Error'}
        '201': {description: Handoff, headers: {Aeon-Contract: {$ref: '#/components/headers/StageHandoffsContract'}}, content: {application/json: {schema: {$ref: '#/components/schemas/StageHandoff'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}:
    get:
      deprecated: true
      operationId: getStageHandoff
      summary: Read a stage handoff
      description: "The INSPR Flow is retired. This compatibility route returns 410 without reading or changing Flow data. Historic success schemas remain pinned for external clients."
      security: *auth
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '410': {$ref: '#/components/responses/Error'}
        '200': {description: Safe handoff projection, headers: {Aeon-Contract: {$ref: '#/components/headers/StageHandoffsContract'}}, content: {application/json: {schema: {$ref: '#/components/schemas/StageHandoff'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/classic-batch-alias:
    post:
      deprecated: true
      operationId: bindClassicBatchAlias
      summary: Bind an imported classic batch ID to an Aeon delivery handoff
      description: "The INSPR Flow is retired. This compatibility route returns 410 without reading or changing Flow data. Historic success schemas remain pinned for external clients."
      security: *auth
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [classic_batch_id, classic_project_id, classic_batch]
              properties:
                classic_batch_id: {type: integer, minimum: 1}
                classic_project_id: {type: integer, minimum: 1}
                classic_batch: {type: object}
                implementation_execution: {type: integer, minimum: 0}
                implementation_authority_epoch: {type: integer, minimum: 0}
                account_key: {type: string}
                runtime_generation: {type: string}
      responses:
        '410': {$ref: '#/components/responses/Error'}
        '201': {description: Alias bound to the handoff, headers: {Aeon-Contract: {$ref: '#/components/headers/BaselineBatchesContract'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ClassicBatchAliasResponse'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/evidence:
    post:
      deprecated: true
      operationId: appendStageEvidence
      summary: Append typed stage evidence
      description: "The INSPR Flow is retired. This compatibility route returns 410 without reading or changing Flow data. Historic success schemas remain pinned for external clients."
      security: [{agentKey: []}]
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageEvidenceWrite'}}}}
      responses:
        '410': {$ref: '#/components/responses/Error'}
        '201': {description: Evidence, headers: {Aeon-Contract: {$ref: '#/components/headers/StageEvidenceContract'}}, content: {application/json: {schema: {$ref: '#/components/schemas/StageEvidence'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/launch/admit:
    post:
      deprecated: true
      operationId: admitStageLaunch
      summary: Admit one Pharos launch
      description: "The INSPR Flow is retired. This compatibility route returns 410 without reading or changing Flow data. Historic success schemas remain pinned for external clients."
      security: *auth
      parameters:
        - {name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageArtifact'}}}}
      responses:
        '410': {$ref: '#/components/responses/Error'}
        '200': {description: Original launch admission, headers: {Aeon-Contract: {$ref: '#/components/headers/StageLaunchContract'}}, content: {application/json: {schema: {$ref: '#/components/schemas/StageLaunchAdmission'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/launch/consume:
    post:
      deprecated: true
      operationId: consumeStageLaunch
      summary: Consume one launch admission
      description: "The INSPR Flow is retired. This compatibility route returns 410 without reading or changing Flow data. Historic success schemas remain pinned for external clients."
      security: *auth
      parameters:
        - {name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageLaunchConsume'}}}}
      responses:
        '410': {$ref: '#/components/responses/Error'}
        '200': {description: Consumption receipt, headers: {Aeon-Contract: {$ref: '#/components/headers/StageLaunchContract'}}, content: {application/json: {schema: {$ref: '#/components/schemas/StageLaunchConsumption'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/result:
    post:
      deprecated: true
      operationId: closeStageHandoff
      summary: Record a terminal stage result
      description: "The INSPR Flow is retired. This compatibility route returns 410 without reading or changing Flow data. Historic success schemas remain pinned for external clients."
      security: [{agentKey: []}]
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageResultWrite'}}}}
      responses:
        '410': {$ref: '#/components/responses/Error'}
        '200': {description: Result, headers: {Aeon-Contract: {$ref: '#/components/headers/StageResultContract'}}, content: {application/json: {schema: {$ref: '#/components/schemas/StageResult'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  headers:
    StageEvidenceContract: {description: Stage evidence response contract, schema: {type: string, enum: ['stage-evidence/1.0']}}
    StageHandoffsContract: {description: Stage handoff response contract, schema: {type: string, enum: ['stage-handoffs/1.0']}}
    StageLaunchContract: {description: Stage launch response contract, schema: {type: string, enum: ['stage-launch/1.0']}}
    StageResultContract: {description: Stage result response contract, schema: {type: string, enum: ['stage-result/1.0']}}
  schemas:
    ClassicBatchAliasResponse:
      type: object
      additionalProperties: false
      required: [handoff_id, classic_batch_id]
      properties:
        handoff_id: {type: string, format: uuid}
        classic_batch_id: {type: integer, minimum: 1}
    StageEvidence:
      allOf:
        - {$ref: '#/components/schemas/StageEvidenceWrite'}
        - {type: object, required: [handoff_id, received_at], properties: {handoff_id: {type: string, format: uuid}, received_at: {type: string, format: date-time}}}
    StageEvidenceWrite:
      type: object
      additionalProperties: false
      required: [sequence, kind, outcome, observed_at, authority_epoch]
      properties:
        sequence: {type: integer, minimum: 1}
        kind: {type: string, enum: [deployment, verification, authorization, credential_handoff, launch_readiness]}
        outcome: {type: string, enum: [succeeded, failed, satisfied, blocked]}
        observed_at: {type: string, format: date-time}
        authority_epoch: {type: integer, minimum: 1}
        workflow: {type: string, description: Pharos symbolic configured workflow}
        environment: {type: string, description: Pharos symbolic configured environment}
        artifact: {$ref: '#/components/schemas/StageArtifact'}
        authorized: {type: boolean, description: Janus fact only}
        credential_ready: {type: boolean, description: Janus fact only}
        reviewed_plan_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase sha256 hex. Required for launch_readiness and forbidden on other kinds.
        host:
          type: string
          minLength: 1
          maxLength: 256
          description: Required for launch_readiness and forbidden on other kinds.
        all_host_eval_passed: {type: boolean, description: Required for launch_readiness. A false value refuses admission.}
        target_build_passed: {type: boolean, description: Required for launch_readiness. A false value refuses admission.}
        backup_ready: {type: boolean, description: Required for launch_readiness. A false value refuses admission.}
        backup_observed_at: {type: string, format: date-time, description: Required for launch_readiness.}
        restart_required: {type: boolean, description: 'Required for launch_readiness. Stored, and not an admission input.'}
        running_kernel: {type: string, minLength: 1, maxLength: 128, description: Required for launch_readiness.}
        expected_kernel: {type: string, minLength: 1, maxLength: 128, description: Required for launch_readiness.}
    StageHandoff:
      type: object
      required: [id, project_node_id, release_node_id, stage, operation, plugin_id, attempt, authority_epoch, superseded_by, authority_open, state, expires_at, evidence_ceiling, plan_digest, predecessor_digest, context_digest, prerequisite_seal_sha256]
      properties:
        id: {type: string, format: uuid}
        project_node_id: {type: string, format: uuid}
        release_node_id: {type: string, format: uuid}
        stage: {type: string, enum: [deploy, access]}
        operation: {type: string, enum: [prepare, apply, deploy, verify]}
        plugin_id: {type: string}
        attempt: {type: integer, minimum: 1}
        authority_epoch: {type: integer, minimum: 1}
        superseded_by: {type: [string, 'null'], format: uuid, description: 'Latest newer attempt for this release, stage and operation'}
        authority_open: {type: boolean, description: 'Whether this attempt can currently accept another action; read-only status, not a grant'}
        state: {type: string, enum: [requested, active, blocked, succeeded, failed, revoked]}
        expires_at: {type: string, format: date-time}
        evidence_ceiling: {type: array, items: {type: string, enum: [deployment, verification, authorization, credential_handoff, launch_readiness]}}
        plan_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        predecessor_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        context_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        prerequisite_seal_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            Stored seal of the required predecessor set. It is the SHA-256 of
            the ordered dependency handoff id, evidence kind and terminal
            sequence joined by NUL, or the hash of an empty join when nothing
            is required. POST /stage-handoffs/{handoffId}/result must echo this
            exact value. A different seal is refused. Clients do not recompute
            it as authority.
        result: {$ref: '#/components/schemas/StageResult'}
        admission: {$ref: '#/components/schemas/StageHandoffAdmissionState'}
    StageHandoffAdmissionState:
      type: object
      required: [admission_id, epoch, expires_at]
      properties:
        admission_id: {type: string, format: uuid}
        epoch: {type: integer, minimum: 1}
        expires_at: {type: string, format: date-time}
        consumed_at: {type: string, format: date-time}
        consumed_by_principal_id: {type: string, format: uuid}
    StageHandoffWrite:
      type: object
      additionalProperties: false
      required: [project_node_id, release_node_id, stage, operation, expected_journey_revision, idempotency_key]
      properties:
        project_node_id: {type: string, format: uuid}
        release_node_id: {type: string, format: uuid}
        stage: {type: string, enum: [deploy, access]}
        operation: {type: string, enum: [prepare, apply, deploy, verify]}
        expected_journey_revision: {type: integer, minimum: 1}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
        target: {$ref: '#/components/schemas/DeployTarget', description: Optional for operation deploy; omit for other operations}
    StageLaunchAdmission:
      type: object
      required: [id, handoff_id, binding_digest_sha256, artifact_digest_sha256, authority_epoch, authority_open, expires_at]
      properties:
        id: {type: string, format: uuid}
        handoff_id: {type: string, format: uuid}
        binding_digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        artifact_digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        authority_epoch: {type: integer, minimum: 1}
        authority_open: {type: boolean, description: Recomputed on exact replay; false after the handoff closes or is superseded}
        expires_at: {type: string, format: date-time}
        consumed_at: {type: [string, 'null'], format: date-time}
    StageLaunchConsume:
      type: object
      additionalProperties: false
      required: [admission_id]
      properties:
        admission_id: {type: string, format: uuid}
    StageLaunchConsumption:
      type: object
      additionalProperties: false
      required: [handoff_id, admission_id, consumed, consumed_at, authority_open]
      properties:
        handoff_id: {type: string, format: uuid}
        admission_id: {type: string, format: uuid}
        consumed: {type: boolean, enum: [true]}
        consumed_at: {type: string, format: date-time}
        authority_open: {type: boolean, description: Recomputed on exact replay; false after the handoff closes or is superseded}
    StageResult:
      allOf:
        - {$ref: '#/components/schemas/StageResultWrite'}
        - {type: object, required: [handoff_id, completed_at], properties: {handoff_id: {type: string, format: uuid}, completed_at: {type: string, format: date-time}}}
    StageResultWrite:
      type: object
      additionalProperties: false
      required: [outcome, terminal_sequence, authority_epoch, prerequisite_seal_sha256]
      properties:
        outcome: {type: string, enum: [succeeded, failed]}
        terminal_sequence: {type: integer, minimum: 1}
        authority_epoch: {type: integer, minimum: 1}
        prerequisite_seal_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        blocker_code: {type: string, enum: [dependency_pending, dependency_failed, reporter_stale, external_waiting, policy_refused]}

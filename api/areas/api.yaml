paths:
  /api/projects/{projectId}/delivery-shipping:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get: {"operationId":"listDeliveryShipping","description":"Requires delivery_ship.read. Bounded keyset list of shadow decisions; no GitHub or worker writes.","security":[{"session":[]},{"agentKey":[]}],"responses":{"200":{"description":"Shadow shipping result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryShipPage"}}}},"400":{"$ref":"#/components/responses/Error"},"403":{"$ref":"#/components/responses/Error"},"404":{"$ref":"#/components/responses/Error"},"409":{"$ref":"#/components/responses/Error"}},"parameters":[{"name":"after","in":"query","schema":{"type":"string","pattern":"^[0-9]{1,19}$"}},{"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":50}}]}
  /api/projects/{projectId}/delivery-shipping/claim:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post: {"operationId":"claimDeliveryShipping","description":"Requires explicit delivery_ship.claim. Reads GitHub through a repository-scoped read-only App token. Rechecks current authority, leaf, source, latest gate, holds, freeze and quarantine in the final fenced write. Idempotent head-bound proposals and script comparisons are events. Cancelled or timed-out shards propose failed-job reruns; real failures propose one fix per head. Merge and land proposals cover branches without PRs. Always execute=false; never pushes, opens PRs, enqueues, reruns jobs, starts workers or grants gate authority. Partial observations stay closed.","security":[{"session":[]},{"agentKey":[]}],"responses":{"200":{"description":"Shadow shipping result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryShipDecision"}}}},"400":{"$ref":"#/components/responses/Error"},"403":{"$ref":"#/components/responses/Error"},"404":{"$ref":"#/components/responses/Error"},"409":{"$ref":"#/components/responses/Error"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryShipInput"}}}}}
  /api/projects/{projectId}/delivery-shipping/settings:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get: {"operationId":"getDeliveryShipSettings","description":"Requires delivery_ship.read. Defaults off; only off and shadow are supported.","security":[{"session":[]},{"agentKey":[]}],"responses":{"200":{"description":"Shadow shipping result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryShipSettings"}}}},"400":{"$ref":"#/components/responses/Error"},"403":{"$ref":"#/components/responses/Error"},"404":{"$ref":"#/components/responses/Error"},"409":{"$ref":"#/components/responses/Error"}}}
    put: {"operationId":"putDeliveryShipSettings","description":"Requires explicit delivery_ship.manage and current revision. Records switch changes as events.","security":[{"session":[]},{"agentKey":[]}],"responses":{"200":{"description":"Shadow shipping result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryShipSettings"}}}},"400":{"$ref":"#/components/responses/Error"},"403":{"$ref":"#/components/responses/Error"},"404":{"$ref":"#/components/responses/Error"},"409":{"$ref":"#/components/responses/Error"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryShipSettings"}}}}}
components:
  schemas:
    DeliveryShipDecision: {"type":"object","additionalProperties":false,"required":["request_id","source_round_id","head_sha","project_id","claimant_id","position","mode","execute","action","reason","repository","branch","facts","run_id","run_attempt","round","agreement","claimed","updated_at"],"properties":{"request_id":{"type":"string","format":"uuid"},"source_round_id":{"type":"string","format":"uuid"},"head_sha":{"type":"string","pattern":"^[0-9a-f]{40}$"},"script_action":{"type":["string","null"],"enum":["wait","held","noop","open_pr","update_pr","enqueue","rerun_failed","fix","merge","land",null]},"project_id":{"type":"string","format":"uuid"},"claimant_id":{"type":"string","format":"uuid"},"position":{"type":"integer"},"mode":{"type":"string","enum":["off","shadow"]},"execute":{"type":"boolean","const":false},"action":{"type":"string","enum":["wait","held","noop","open_pr","update_pr","enqueue","rerun_failed","fix","merge","land"]},"reason":{"type":"string"},"repository":{"type":"string"},"branch":{"type":"string"},"facts":{"$ref":"#/components/schemas/DeliveryShipFacts"},"run_id":{"type":["integer","null"]},"run_attempt":{"type":"integer"},"round":{"oneOf":[{"$ref":"#/components/schemas/DeliveryRoundInput"},{"type":"null"}]},"agreement":{"type":["boolean","null"]},"claimed":{"type":"boolean"},"updated_at":{"type":"string","format":"date-time"}}}
    DeliveryShipFacts: {"type":"object","additionalProperties":false,"required":["pushed_head","base_sha","behind","pull_request","pull_head","open","merged","draft","conflict","mergeable_known","queued","queue_head","checks","runs"],"properties":{"pushed_head":{"type":"string"},"base_sha":{"type":"string"},"behind":{"type":"boolean"},"pull_request":{"type":["integer","null"]},"pull_head":{"type":"string"},"open":{"type":"boolean"},"merged":{"type":"boolean"},"draft":{"type":"boolean"},"conflict":{"type":"boolean"},"mergeable_known":{"type":"boolean"},"queued":{"type":"boolean"},"queue_head":{"type":"string"},"checks":{"type":"array","maxItems":2000,"items":{"type":"object","additionalProperties":false,"required":["name","status","conclusion"],"properties":{"name":{"type":"string"},"status":{"type":"string"},"conclusion":{"type":"string"}}}},"runs":{"type":"array","maxItems":20,"items":{"$ref":"#/components/schemas/DeliveryShipRun"}}}}
    DeliveryShipInput: {"type":"object","additionalProperties":false,"required":["request_id","source_round_id","head_sha"],"properties":{"request_id":{"type":"string","format":"uuid"},"source_round_id":{"type":"string","format":"uuid"},"head_sha":{"type":"string","pattern":"^[0-9a-f]{40}$"},"script_action":{"type":["string","null"],"enum":["wait","held","noop","open_pr","update_pr","enqueue","rerun_failed","fix","merge","land",null]}}}
    DeliveryShipPage: {"type":"object","additionalProperties":false,"required":["items","settings","next_cursor"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/DeliveryShipDecision"}},"settings":{"$ref":"#/components/schemas/DeliveryShipSettings"},"next_cursor":{"type":["string","null"]}}}
    DeliveryShipRun: {"type":"object","additionalProperties":false,"required":["id","attempt","head_sha","workflow","event","status","conclusion","jobs"],"properties":{"id":{"type":"integer"},"attempt":{"type":"integer"},"head_sha":{"type":"string"},"workflow":{"type":"string"},"event":{"type":"string"},"status":{"type":"string"},"conclusion":{"type":"string"},"jobs":{"type":"array","maxItems":1000,"items":{"type":"object","additionalProperties":false,"required":["name","status","conclusion"],"properties":{"name":{"type":"string"},"status":{"type":"string"},"conclusion":{"type":"string"}}}}}}
    DeliveryShipSettings: {"type":"object","additionalProperties":false,"required":["mode","revision"],"properties":{"mode":{"type":"string","enum":["off","shadow"],"default":"off"},"revision":{"type":"integer","minimum":0}}}

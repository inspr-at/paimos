        "409": {"description":"Revision/version conflict or ambiguous same-rank identity","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "422": {"description":"Rendered rules exceed the workspace budget (default 12000 UTF-8 bytes) or a layer cap; reduce always-on text or move content to details","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "401": {"description":"Authentication required","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
      parameters:
        -
          name: "setId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "version"
          in: "path"
          required: true
          schema:
            type: "string"
components:
  schemas:
    AgentRule:
      type: "object"
      additionalProperties: false
      properties:
        identity:
          type: "string"
          pattern: "^[a-z][a-z0-9._-]{0,95}$"
        text:
          type: "string"
          maxLength: 512
          description: "Required nonempty single line; <=512 UTF-8 bytes"
        why:
          type: "string"
          maxLength: 1024
          description: "Required nonempty single line; <=1024 UTF-8 bytes"
        details:
          type: "string"
          maxLength: 16384
          description: "On demand only; <=16384 UTF-8 bytes"
        strength:
          description: "Locked rules must be enabled and non-expiring; company locked rules are unconditional."
          type: "string"
          enum: ["normal", "locked"]
        enabled:
          type: "boolean"
        expires_at:
          type: ["string", "null"]
          format: "date-time"
        roles:
          type: "array"
          items:
            type: "string"
            enum: ["coordinator", "builder", "reviewer", "operator"]
          uniqueItems: true
        harnesses:
          type: "array"
          items:
            type: "string"
            enum: ["claude-code", "codex", "grok", "pi", "cursor", "gemini", "opencode"]
          uniqueItems: true
        source:
          type: "object"
          required: ["reference"]
          additionalProperties: false
          properties:
            reference:
              type: "string"
              maxLength: 512
            revision:
              type: "string"
              maxLength: 128
            identity:
              type: "string"
              maxLength: 96
            edited_here:
              type: "boolean"
        tldr:
          "$ref": "#/components/schemas/RuleTLDR"
      required: ["identity", "text", "why", "strength", "enabled", "source"]
    DoctrineFile:
      type: object
      additionalProperties: false
      required: [path, blob_sha, sha256, bytes, kind, layer, url, sets, rules]
      properties:
        path: {type: string}
        blob_sha: {type: string, pattern: "^[0-9a-f]{40}$"}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        bytes: {type: integer, minimum: 0}
        kind: {type: string}
        layer: {type: string}
        url: {type: string, format: uri}
        tldr: {"$ref": "#/components/schemas/DoctrineTLDR"}
        sets: {type: array, items: {"$ref": "#/components/schemas/DoctrineSet"}}
        rules: {type: array, items: {"$ref": "#/components/schemas/DoctrineRule"}}
        sidecar:
          type: object
          additionalProperties: false
          required: [path, url]
          properties:
            path: {type: string}
            url: {type: string, format: uri}
            problem: {type: string}
            unmatched: {type: array, maxItems: 50, items: {type: string}}
        problem: {type: string, description: "Set when the file could not be indexed"}
    DoctrineFinding:
      type: object
      required: [id, pattern, title, count, rules_version, harness, ticket_kind, status, evidence, before, created_at]
      properties:
        id: {type: string, format: uuid}
        pattern: {type: string}
        title: {type: string}
        count: {type: integer, minimum: 1}
        rules_version: {type: string}
        harness: {type: string}
        ticket_kind: {type: string}
        status: {type: string, enum: [pending, draft, awaiting_use, internal_note, observed, closed], description: "draft: the proposal waits in the doctrine inbox or as a person's PR"}
        reason: {type: string, description: Value-free reason for an internal note or pending retry}
        proposal_id: {type: string, format: uuid}
        pr_url: {type: string}
        rule_label: {type: string}
        before: {"$ref": "#/components/schemas/DoctrineMetric"}
        metrics: {type: array, items: {"$ref": "#/components/schemas/DoctrineMetric"}, description: "Baseline context for review and fix rounds, CI failures, reverts, exception votes and time to done; missing observations are omitted"}
        after: {"$ref": "#/components/schemas/DoctrineMetric"}
        delta: {type: number, description: After mean minus before mean; lower is the intended direction}
        evidence:
          type: array
          items:
            type: object
            required: [id, ticket_id, ticket_key, href, kind]
            properties:
              id: {type: string}
              ticket_id: {type: string, format: uuid}
              ticket_key: {type: string}
              href: {type: string}
              kind: {type: string}
        created_at: {type: string, format: date-time}
    DoctrineInboxInput:
      type: object
      additionalProperties: false
      required: [request_id, path, rule_key, source, why]
      properties:
        request_id: {type: string, format: uuid}
        source_id: {type: string, format: uuid, description: "The doctrine source; or name it by repository"}
        repository: {type: string, description: "inspr-modules, inspr-doctrine-private, or the full owner/name"}
        path: {type: string, maxLength: 300}
        rule_key: {type: string, maxLength: 200}
        rule_sha256: {type: string, pattern: "^[0-9a-f]{64}$", description: "The pinned rule the change is against; defaults to the current pin"}
        source: {type: string, maxLength: 8000, description: "Replacement rule source, including its explicit marker if present"}
        tldr:
          type: object
          additionalProperties: false
          required: [en]
          properties:
            en: {type: string, maxLength: 300}
            de: {type: string, maxLength: 300}
        why: {type: string, maxLength: 2000, description: Why this change; it becomes the PR description}
        ticket: {type: string, pattern: "^[A-Z][A-Z0-9]{0,15}-[1-9][0-9]{0,8}$"}
    DoctrineInboxItem:
      allOf:
        - {"$ref": "#/components/schemas/DoctrineProposal"}
        - type: object
          required: [heading, label, base, diff, proposer, proposer_kind]
          properties:
            heading: {type: string, description: The rule's heading at the pin}
            strength: {type: string, enum: [normal, locked]}
            label: {type: string, description: "The proposed English TL;DR, else the heading"}
            base: {type: string, description: The rule at the current pin; empty when it is gone}
            base_sha256: {type: string}
            proposed: {type: string}
            tldr:
              type: object
              properties:
                en: {type: string}
                de: {type: string}
            why: {type: string}
            diff:
              type: array
              description: "Word diff from base to proposed; the eq and del runs restore base, the eq and ins runs restore proposed"
              items:
                type: object
                required: [op, text]
                properties:
                  op: {type: string, enum: [eq, del, ins]}
                  text: {type: string}
            outdated: {type: boolean, description: The pinned rule changed since the proposal}
            proposer: {type: string, description: The proposer's name}
            proposer_kind: {type: string, enum: [person, agent]}
            ticket_href: {type: string}
    DoctrineLayer:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources: {type: array, maxItems: 8, items: {"$ref": "#/components/schemas/DoctrineSource"}}
        proposals_enabled: {type: boolean, description: Whether this workspace has a server-provisioned proposal App and quotation guard key}
        proposals_disabled_reason: {type: string, description: Admin-visible reason proposal creation is disabled; contains no key material or host path}
    DoctrineMetric:
      type: object
      required: [name, rules_version, samples, value, from, until]
      properties:
        name: {type: string}
        rules_version: {type: string}
        samples: {type: integer, minimum: 1}
        value: {type: number}
        from: {type: string, format: date-time}
        until: {type: string, format: date-time}
    DoctrineProposal:
      type: object
      required: [id, source_id, repository, path, rule_key, state, head_sha, pr_number, pr_url, proposed_by, created_at, gate_ready, pinned_machines]
      properties:
        id: {type: string, format: uuid}
        source_id: {type: string, format: uuid}
        repository: {type: string}
        path: {type: string}
        rule_key: {type: string}
        state: {type: string, enum: [proposed, in_review, merged, released, pinned, closed, pending, dismissed, promoted], description: "pending, dismissed and promoted belong to the doctrine inbox (AEON-444). promoted is final: the pinned doctrine contains the proposed rule."}
        head_sha: {type: string}
        pr_number: {type: integer}
        pr_url: {type: string}
        proposed_by: {type: string, format: uuid}
        approved_by: {type: string, format: uuid}
        merge_commit: {type: string}
        release: {type: string}
        release_commit: {type: string}
        release_url: {type: string}
        release_requested: {type: boolean}
        gate_ready: {type: boolean}
        gate_reason: {type: string}
        pinned_machines: {type: integer, minimum: 0, description: "Operator-reported, not live machine inventory"}
        branch: {type: string, description: "Proposal branch name when the GitHub ref exists"}
        orphaned: {type: boolean, description: "True when that branch exists without a pull request because authority was revoked during the ref write. An admin should delete the branch."}
        created_at: {type: string, format: date-time}
        draft: {type: boolean, description: "Automatic outcome proposals are created as GitHub drafts; only a person may make them ready on GitHub."}
        automatic: {type: boolean, description: Generated by the deterministic outcome analysis}
        inbox: {type: boolean, description: "Proposed through the doctrine inbox (AEON-444)"}
        base_rule_sha256: {type: string, description: SHA-256 of the pinned rule the proposal changes}
        proposed_rule_sha256: {type: string, description: "SHA-256 of the proposed rule bytes; a pin whose index holds them and the proposed TL;DR closes the proposal as promoted"}
        proposed_tldr_sha256: {type: string, description: "SHA-256 of the proposed TL;DR (English, NUL, German, each trimmed); promotion needs it at the pin too"}
        ticket: {type: string, description: Linked ticket key}
        ticket_id: {type: string, format: uuid}
        submitted_by: {type: string, format: uuid, description: The person who sent it to git}
        edited_by: {type: string, format: uuid, description: The person who edited it before sending}
        dismissed_by: {type: string, format: uuid}
        dismiss_reason: {type: string, maxLength: 500}
        promoted_commit: {type: string, description: The pinned commit that contains the change}
        approved_file_sha256: {type: string, description: "SHA-256 of the rule file as a person sent it to git, then as the promoting pin holds it; outcome measurement follows these bytes"}
    DoctrineProposalInput:
      type: object
      additionalProperties: false
      required: [request_id, source_id, path, rule_key, rule_sha256, source, tldr, explanation]
      properties:
        request_id: {type: string, format: uuid}
        source_id: {type: string, format: uuid}
        path: {type: string, maxLength: 300}
        rule_key: {type: string, maxLength: 200}
        rule_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        source: {type: string, maxLength: 8000, description: "Replacement rule source, including its explicit marker if present. Must still parse as exactly one rule in the same set."}
        tldr:
          type: object
          additionalProperties: false
          required: [en]
          properties:
            en: {type: string, maxLength: 300}
            de: {type: string, maxLength: 300}
        explanation: {type: string, maxLength: 2000, description: Why this change; stored only in the PR body}
    DoctrineRule:
      type: object
      additionalProperties: false
      required: [key, identity, set, heading_path, anchor, start_line, end_line, source, sha256, text, strength, url]
      properties:
        key: {type: string, description: "The rule's aeon-rule id, or its text key (t-…) without one; TL;DR sidecars refer to it"}
        identity: {type: string, description: "repository/path#anchor"}
        set: {type: string}
        heading_path: {type: string}
        anchor: {type: string, description: "GitHub anchor of the heading the rule sits under"}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
        source: {type: string, description: "The exact bytes of lines start_line..end_line at the pinned commit"}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        text: {type: string, description: "The rule line as the importer reads it"}
        strength: {type: string, enum: [normal, locked]}
        url: {type: string, format: uri, description: "The file at the pinned commit, opened at these lines"}
        tldr: {"$ref": "#/components/schemas/DoctrineTLDR"}
    DoctrineSet:
      type: object
      additionalProperties: false
      required: [set, title, anchor]
      properties:
        set: {type: string}
        title: {type: string}
        anchor: {type: string}
        tldr: {"$ref": "#/components/schemas/DoctrineTLDR"}
    DoctrineSkip:
      type: object
      additionalProperties: false
      required: [path, reason]
      properties:
        path: {type: string}
        reason: {type: string}
    DoctrineSource:
      type: object
      additionalProperties: false
      required: [id, repository, visibility, commit, pinned_at, paths, url, state, files, skipped]
      properties:
        proposals_enabled: {type: boolean, description: "Whether this deployment and workspace permit proposals to this source; false for read-only packs and mismatched visibility. Publication still requires person authority and all server guards."}
        id: {type: string, format: uuid}
        repository: {type: string, description: "owner/name on GitHub"}
        visibility: {type: string, enum: [public, private]}
        ref: {type: string, description: "The release tag the pin was set from"}
        commit: {type: string, pattern: "^[0-9a-f]{40}$"}
        committed_at: {type: string, format: date-time}
        pinned_at: {type: string, format: date-time, description: "When this commit was pinned in Aeon"}
        paths: {type: array, minItems: 1, maxItems: 20, items: {type: string}}
        credential_ref: {type: string, description: "Name of the read-only credential; never the credential"}
        url: {type: string, format: uri}
        state: {type: string, enum: [ready, not_indexed, failed]}
        error: {type: string, maxLength: 300}
        indexed_at: {type: string, format: date-time}
        files: {type: array, items: {"$ref": "#/components/schemas/DoctrineFile"}}
        skipped: {type: array, maxItems: 50, items: {"$ref": "#/components/schemas/DoctrineSkip"}}
    DoctrineSourceInput:
      type: object
      additionalProperties: false
      required: [visibility]
      description: "Commit is the pin. ref names the release tag; alone it is resolved to the commit it names now, with commit it must name that commit. paths default to docs/AGENTS-*.md; a wildcard never selects AGENTS-PROFILE*.md. repository is required when adding and must match when pinning."
      properties:
        repository: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$"}
        visibility: {type: string, enum: [public, private]}
        ref: {type: string, maxLength: 128}
        commit: {type: string, pattern: "^[0-9a-f]{40}$"}
        paths: {type: array, maxItems: 20, items: {type: string, maxLength: 200}}
        credential_ref: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$", description: "Required for a private repository. Names a token file in the server's AEON_DOCTRINE_CREDENTIALS_DIR, with an operator-owned credential_ref.allowlist.json granting this tenant/repository pair"}
    DoctrineTLDR:
      type: object
      additionalProperties: false
      required: [en]
      description: "An explanation for people, read from git (AEON-314 shape). check is true when the sidecar's basis no longer matches the text."
      properties:
        en: {type: string, maxLength: 300}
        de: {type: string, maxLength: 300}
        check: {type: boolean}
    ExplainedRules:
      type: "object"
      additionalProperties: false
      properties:
        context:
          "$ref": "#/components/schemas/RuleContext"
        version: {type: string}
        sha256: {type: string}
        body: {type: string, description: "The exact file agents receive for this context"}
        byte_size: {type: integer}
        budget:
          "$ref": "#/components/schemas/RuleBudget"
        usage:
          "$ref": "#/components/schemas/RuleLayerBytes"
        sets:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            properties:
              set_id: {type: string, format: uuid}
              name: {type: string}
              scope:
                "$ref": "#/components/schemas/RuleScope"
              version: {type: string}
              tldr:
                "$ref": "#/components/schemas/RuleTLDR"
              bytes: {type: integer}
            required: ["set_id", "name", "scope", "version", "bytes"]
        rules:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            properties:
              identity: {type: string}
              text: {type: string}
              line: {type: string, description: "The exact line in the file, without its newline"}
              set_id: {type: string, format: uuid}
              layer: {type: string, enum: [company, project, person, agent]}
              strength: {type: string, enum: [normal, locked]}
              tldr:
                "$ref": "#/components/schemas/RuleTLDR"
              bytes: {type: integer}
            required: ["identity", "text", "line", "set_id", "layer", "strength", "bytes"]
        problem:
          "$ref": "#/components/schemas/RuleError"
      required: ["context", "version", "sha256", "body", "byte_size", "budget", "usage", "sets", "rules"]
    MergedRules:
      type: "object"
      additionalProperties: false
      properties:
        context:
          "$ref": "#/components/schemas/RuleContext"
        versions:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            properties:
              set_id:
                type: "string"
                format: "uuid"
              version:
                type: "string"
                pattern: "^[1-9][0-9]{11}\\.0\\.0$"
                description: "Calendar coordinate YYMMDDhhmmss.0.0 (inspr-calver-3; inspr-calendar-v2 for history); valid Gregorian UTC, immutable within set"
              sha256:
                type: "string"
            required: ["set_id", "version", "sha256"]
        version:
          type: "string"
          description: "Latest participating calendar version, or floor-only"
        sha256:
          type: "string"
        body:
          type: "string"
          description: "Exact always-on rendered bytes; within the workspace budget (default 12000, never above 500000 UTF-8 bytes); details and explanations excluded"
        byte_size:
          type: "integer"
          maximum: 512000
        rules:
          type: "array"
          maxItems: 10000
          items:
            "$ref": "#/components/schemas/AgentRule"
        floor:
          type: "string"
          description: "Locked company floor lines present in body. A floor rule delivered through doctrine is represented by its identity and immutable commit, never repeated text. Changing the independently retained floor pin requires explicit review."
        valid_until:
          type: ["string", "null"]
          format: "date-time"
      required: ["context", "versions", "version", "sha256", "body", "byte_size", "rules", "floor", "valid_until"]
    RuleBatchPublish:
      type: "object"
      additionalProperties: false
      properties:
        items:
          type: "array"
          minItems: 1
          maxItems: 100
          items:
            type: "object"
            additionalProperties: false
            properties:
              set_id:
                type: "string"
                format: "uuid"
                pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                description: "Canonical lowercase UUID; other spellings are refused (400)"
              expected_revision:
                type: "integer"
                minimum: 1
              version:
                type: "string"
                pattern: "^(auto|[1-9][0-9]{11}\\.0\\.0)$"
                description: "auto (the server assigns the next calendar coordinate, strictly later than the set's current publication) or an explicit valid UTC calendar coordinate"
            required: ["set_id", "expected_revision", "version"]
        note:
          type: "string"
          maxLength: 500
          description: "Optional note stored on every new snapshot of the batch. Empty or omitted stores no note."
      required: ["items"]
    RuleBatchResult:
      type: "object"
      additionalProperties: false
      properties:
        batch_id:
          type: "string"
          format: "uuid"
          description: "Shared id recorded in each set's rules.published event; a replay returns the stored answer with the same id"
        versions:
          type: "array"
          items:
            "$ref": "#/components/schemas/RuleSnapshot"
        max_bytes:
          type: "integer"
          description: "Largest merged file, in UTF-8 bytes, among the checked files whose every layer the caller may read (rules.read); 0 when there is none"
      required: ["batch_id", "versions", "max_bytes"]
    RuleBudget:
      type: "object"
      additionalProperties: false
      properties:
        max_bytes: {type: integer, minimum: 2000, maximum: 500000}
        layer_max_bytes:
          "$ref": "#/components/schemas/RuleLayerBytes"
      required: ["max_bytes"]
    RuleBudgetBlocker:
      type: object
      required: [host, harness, max_session_file_bytes]
      properties:
        host: {type: string}
        harness: {type: string}
        version: {type: string}
        max_session_file_bytes: {type: integer}
        delivered_max_bytes: {type: integer, description: "Delivery allowance: min(workspace budget, reported client limit). Whole-rule delivery may use fewer bytes; locked rules are never omitted."}
        truncated: {type: boolean, description: "The client's allowance is below the workspace budget."}
    RuleBudgetView:
      type: "object"
      additionalProperties: false
      properties:
        max_bytes: {type: integer}
        layer_max_bytes:
          "$ref": "#/components/schemas/RuleLayerBytes"
        default_bytes: {type: integer}
        min_bytes: {type: integer}
        ceiling_bytes: {type: integer, description: "Product budget ceiling: 500000, independent of recent client reports."}
        blocking_clients:
          type: array
          description: "Recent client delivery inventory (historical field name retained), grouped by host/harness/version/limit, at most 50, including stopped/archived sessions active within seven days. Only people with workspace settings.manage receive these tenant-wide details. Clients never block budget changes."
          maxItems: 50
          items: {$ref: '#/components/schemas/RuleBudgetBlocker'}
        blocking_clients_more: {type: integer, minimum: 0, description: "Additional recent clients omitted after the first 50. Present only together with blocking_clients, and only for settings.manage."}
        min_layer_bytes: {type: integer}
      required: ["max_bytes", "layer_max_bytes", "default_bytes", "min_bytes", "ceiling_bytes", "min_layer_bytes"]
    RuleChannels:
      type: object
      additionalProperties: false
      required: [releases, duplicates]
      description: "Doctrine pins and published Aeon rules that copy them (AEON-320). No doctrine text."
      properties:
        releases:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [repository, commit]
            properties:
              repository: {type: string}
              ref: {type: string}
              commit: {type: string, pattern: "^[0-9a-f]{40}$"}
        duplicates:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [identity, doctrine]
            properties:
              identity: {type: string, maxLength: 96, description: "Aeon rule identity"}
              doctrine: {type: string, maxLength: 300, description: "repository/path#anchor from the doctrine index"}
    RuleContext:
      type: "object"
      additionalProperties: false
      properties:
        tenant_id:
          type: "string"
          format: "uuid"
        project_id:
          type: "string"
          format: "uuid"
        person_id:
          type: "string"
          format: "uuid"
        agent_id:
          type: "string"
          format: "uuid"
        role:
          type: "string"
          enum: ["coordinator", "builder", "reviewer", "operator"]
        harness:
          type: "string"
          enum: ["claude-code", "codex", "grok", "pi", "cursor", "gemini", "opencode"]
        task_id:
          type: "string"
          format: "uuid"
      required: ["tenant_id", "project_id", "person_id", "role", "harness"]
    RuleDraft:
      type: "object"
      additionalProperties: false
      properties:
        expected_revision:
          type: "integer"
          minimum: 1
        name:
          type: "string"
          maxLength: 128
        rules:
          type: "array"
          maxItems: 100
          items:
            "$ref": "#/components/schemas/AgentRule"
        tldr:
          description: "AEON-314. The set explanation. Absent keeps the current one; null removes it."
          oneOf:
            - "$ref": "#/components/schemas/RuleTLDR"
            - type: "null"
      required: ["expected_revision", "name", "rules"]
    RuleLayer:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
        scope:
          "$ref": "#/components/schemas/RuleScope"
      required: ["id", "scope"]
    RuleLayerBytes:
      type: "object"
      additionalProperties: false
      properties:
        company: {type: integer, minimum: 0, maximum: 500000}
        project: {type: integer, minimum: 0, maximum: 500000}
        person: {type: integer, minimum: 0, maximum: 500000}
        agent: {type: integer, minimum: 0, maximum: 500000}
    RulePublish:
      type: "object"
      additionalProperties: false
      properties:
        expected_revision:
          type: "integer"
          minimum: 1
        version:
          type: "string"
          pattern: "^[1-9][0-9]{11}\\.0\\.0$"
          description: "Calendar coordinate YYMMDDhhmmss.0.0 (inspr-calver-3; inspr-calendar-v2 for history); valid Gregorian UTC, immutable within set"
        note:
          type: "string"
          maxLength: 500
          description: "Optional note stored on the new immutable snapshot. Empty or omitted stores no note."
      required: ["expected_revision", "version"]
    RuleRestore:
      type: "object"
      additionalProperties: false
      properties:
        expected_revision:
          type: "integer"
          minimum: 1
        version:
          type: "string"
          pattern: "^[1-9][0-9]{11}\\.0\\.0$"
          description: "Calendar coordinate YYMMDDhhmmss.0.0 (inspr-calver-3; inspr-calendar-v2 for history); valid Gregorian UTC, immutable within set"
        new_version:
          type: "string"
          pattern: "^[1-9][0-9]{11}\\.0\\.0$"
          description: "Calendar coordinate YYMMDDhhmmss.0.0 (inspr-calver-3; inspr-calendar-v2 for history); valid Gregorian UTC, immutable within set"
        note:
          type: "string"
          maxLength: 500
          description: "Optional note for the new version only. It does not rewrite the source version's note."
      required: ["expected_revision", "version", "new_version"]
    RuleScope:
      type: "object"
      additionalProperties: false
      properties:
        layer:
          type: "string"
          enum: ["company", "project", "person", "agent"]
        project_id:
          type: "string"
          format: "uuid"
        owner_id:
          type: "string"
          format: "uuid"
        agent_id:
          type: "string"
          format: "uuid"
        role:
          type: "string"
          enum: ["coordinator", "builder", "reviewer", "operator"]
        task_id:
          type: "string"
          format: "uuid"
      required: ["layer"]
    RuleSet:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
        layer_id:
          type: "string"
          format: "uuid"
        scope:
          "$ref": "#/components/schemas/RuleScope"
        name:
          type: "string"
          maxLength: 128
        revision:
          type: "integer"
          minimum: 1
        rules:
          type: "array"
          maxItems: 100
          items:
            "$ref": "#/components/schemas/AgentRule"
        published_version:
          type: "string"
        tldr:
          "$ref": "#/components/schemas/RuleTLDR"
      required: ["id", "layer_id", "scope", "name", "revision", "rules", "published_version"]
    RuleSnapshot:
      type: "object"
      additionalProperties: false
      properties:
        set_id:
          type: "string"
          format: "uuid"
        scope:
          "$ref": "#/components/schemas/RuleScope"
        name:
          type: "string"
        revision:
          type: "integer"
        version:
          type: "string"
          pattern: "^[1-9][0-9]{11}\\.0\\.0$"
          description: "Calendar coordinate YYMMDDhhmmss.0.0 (inspr-calver-3; inspr-calendar-v2 for history); valid Gregorian UTC, immutable within set"
        sha256:
          type: "string"
          pattern: "^[a-f0-9]{64}$"
        rules:
          type: "array"
          maxItems: 100
          items:
            "$ref": "#/components/schemas/AgentRule"
        published_at:
          type: "string"
          format: "date-time"
        note:
          type: "string"
          maxLength: 500
          description: "Optional publish note. Absent when empty. A non-empty note is part of the immutable snapshot and its sha256; an empty or omitted note does not change the digest of a snapshot that has no note."
        tldr:
          "$ref": "#/components/schemas/RuleTLDR"
      required: ["set_id", "scope", "name", "revision", "version", "sha256", "rules", "published_at"]
    RuleTLDR:
      type: "object"
      additionalProperties: false
      description: "AEON-314. A short technical explanation for people. Part of the draft and of every published snapshot (versioned with history); never part of what agents receive."
      properties:
        en:
          type: "string"
          maxLength: 300
          description: "Required nonempty single line; <=300 UTF-8 bytes"
        de:
          type: "string"
          maxLength: 300
          description: "Optional German; single line; <=300 UTF-8 bytes"
        basis:
          type: "string"
          pattern: "^[a-f0-9]{16}$"
          description: "Fingerprint of the text the explanation was written for; the server stamps it when omitted"
        check:
          type: "boolean"
          readOnly: true
          description: "Derived on read, never stored: the text changed after the explanation was written"
      required: ["en"]
    RuleTLDRInput:
      type: "object"
      additionalProperties: false
      properties:
        expected_revision:
          type: "integer"
          minimum: 1
        set:
          description: "Absent keeps the set explanation; null removes it"
          oneOf:
            - "$ref": "#/components/schemas/RuleTLDRText"
            - type: "null"
        rules:
          type: "object"
          description: "Rule identity to its new explanation; null removes one; identities left out are unchanged"
          additionalProperties:
            oneOf:
              - "$ref": "#/components/schemas/RuleTLDRText"
              - type: "null"
      required: ["expected_revision"]
    RuleTLDRText:
      type: "object"
      additionalProperties: false
      properties:
        en:
          type: "string"
          maxLength: 300
        de:
          type: "string"
          maxLength: 300
      required: ["en"]
    RulesComparison:
      type: object
      additionalProperties: false
      required: [id, harness, role, project_id, repo_sha256, merge_sha256, merge_version, local_set_sha256, counts, rules, created_at]
      properties:
        id: {type: string, format: uuid}
        harness: {type: string, enum: [claude-code, codex]}
        role: {type: string, enum: [coordinator, builder, reviewer, operator]}
        project_id: {type: string, format: uuid}
        repo_name: {type: string, maxLength: 128}
        repo_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        merge_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        merge_version: {type: string, maxLength: 128}
        local_set_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        counts: {"$ref": "#/components/schemas/RulesComparisonCounts"}
        rules:
          type: array
          maxItems: 500
          items: {"$ref": "#/components/schemas/RulesComparisonRule"}
        gaps:
          type: array
          maxItems: 16
          description: "Comparison limits. Tokens only; no paths or instruction text."
          items: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}
        created_at: {type: string, format: date-time}
    RulesComparisonCounts:
      type: object
      additionalProperties: false
      required: [both, only_local, only_merged, differs, files]
      properties:
        both: {type: integer, minimum: 0}
        only_local: {type: integer, minimum: 0}
        only_merged: {type: integer, minimum: 0}
        differs: {type: integer, minimum: 0}
        files: {type: integer, minimum: 0, maximum: 64}
    RulesComparisonRule:
      type: object
      additionalProperties: false
      required: [identity, status]
      properties:
        identity: {type: string, pattern: "^[a-z][a-z0-9._-]{0,95}$"}
        status: {type: string, enum: [both, only_local, only_merged, differs]}
        local_text_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        merged_text_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        changed:
          type: array
          maxItems: 4
          items: {type: string, enum: [text, why, strength, enabled, local_conflict]}
    RulesComparisonUpload:
      type: object
      additionalProperties: false
      required: [harness, role, project_id, repo_sha256, merged, local, rules, counts]
      properties:
        harness: {type: string, enum: [claude-code, codex]}
        role: {type: string, enum: [coordinator, builder, reviewer, operator]}
        project_id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}
        repo_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        repo_name: {type: string, maxLength: 128}
        merged:
          type: object
          additionalProperties: false
          required: [version, sha256, rule_count]
          properties:
            version: {type: string, maxLength: 128}
            sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
            rule_count: {type: integer, minimum: 0, maximum: 500}
        local:
          type: object
          additionalProperties: false
          required: [set_sha256, rule_count]
          properties:
            set_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
            rule_count: {type: integer, minimum: 0, maximum: 500}
        rules:
          type: array
          maxItems: 500
          items: {"$ref": "#/components/schemas/RulesComparisonRule"}
        counts: {"$ref": "#/components/schemas/RulesComparisonCounts"}
        gaps:
          type: array
          maxItems: 16
          description: "Comparison limits. Tokens only; no paths or instruction text."
          items: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}

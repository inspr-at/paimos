# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/rules/doctrine
paths:
  /rules/budget:
    get:
      operationId: "getRuleBudget"
      description: "AEON-432. rules.read. The workspace's always-on budget for one merged session file (default 12,000 bytes; 2,000 to 500,000) and optional per-layer caps. Recent client capabilities describe delivery; they never block saving a budget."
      responses:
        "200":
          description: "The workspace budget"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RuleBudgetView"
        "400": {"description":"Invalid scope, rule, context or calendar version","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "403": {"description":"Permission or scoped ownership denied; agents never publish or edit company rules","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "404": {"description":"Resource unavailable","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "409": {"description":"Revision/version conflict or ambiguous same-rank identity","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "401": {"description":"Authentication required","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
    put:
      operationId: "setRuleBudget"
      description: "AEON-432. settings.manage in the workspace; people only. Sets the total budget (2,000 to 500,000 bytes; older clients never block saving) and optional per-layer caps (500 bytes to the total; omit or 0 for none). Outside the product bounds returns 400 invalid_budget, including 500,001. Refused with 422 when a session file served now would no longer fit. Each client receives whole rules within min(budget, its reported limit), retaining all locked rules or failing closed. Publication and explanation use the workspace budget. The store caps (2,000 rules, 2 MiB) are separate and unchanged."
      responses:
        '428': {$ref: '#/components/responses/OwnerWorkstationStepUpRequired'}
        "200":
          description: "The saved budget"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RuleBudgetView"
        "400": {"description":"Invalid scope, rule, context or calendar version","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "403": {"description":"Permission or scoped ownership denied; agents never publish or edit company rules","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "404": {"description":"Resource unavailable","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "409": {"description":"Ambiguous same-rank rule identity in the published session context","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "401": {"description":"Authentication required","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "422": {"description":"A session file served now would exceed the new budget","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RuleBudget"
  /rules/channels:
    get:
      operationId: getRuleChannels
      description: "rules.read. Delivery channels for rules (AEON-320). releases names each pinned doctrine repository (repository, ref, commit) and carries no doctrine text. duplicates lists only published Aeon rules whose set scope the caller may read (rules.read and scoped ownership), including the exact project. A copy matches a git-backed rule by: the same trimmed text, or a source identity or reference equal to that rule's identity (repository/path#anchor, AEON-318). The session file omits those rules and states the pin as a pointer. At most 100 duplicates, ordered by Aeon identity."
      responses:
        "503": {"description":"Doctrine catalog unavailable (doctrine_unavailable); check the source credential grant and server configuration","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "200":
          description: Doctrine pins and published copies
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RuleChannels"}
        "401": {"description":"Authentication required","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "403": {"description":"Permission denied","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
  /rules/comparisons:
    get:
      operationId: listRulesComparisons
      description: "rules.read in the named project. Latest stored comparison per harness. Hashes, statuses and counts only; no instruction text or paths."
      parameters:
        - name: project_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Latest comparison per harness
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [comparisons]
                properties:
                  comparisons:
                    type: array
                    maxItems: 8
                    items: {"$ref": "#/components/schemas/RulesComparison"}
        "400": {"description":"Invalid project","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "401": {"description":"Authentication required","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "403": {"description":"Permission denied","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "404": {"description":"Project unavailable","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
    post:
      operationId: createRulesComparison
      description: "rules.write in the named project. Stores one comparison summary. The server rejects instruction text, paths and unknown fields. The person is the caller or the agent key's creator."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/RulesComparisonUpload"}
      responses:
        "200":
          description: Stored comparison summary
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RulesComparison"}
        "400": {"description":"Comparison rejected","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "401": {"description":"Authentication required","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "403": {"description":"Permission or agent binding denied","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "404": {"description":"Project unavailable","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "413": {"description":"Comparison is larger than 256 KiB","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
  /rules/doctrine:
    get:
      operationId: getDoctrineLayer
      description: "rules.read (person or agent key). The INSPR doctrine as a git-backed, read-only rule layer (AEON-318): every repository this workspace indexes, at its pinned commit. Git is the source of truth. Each rule's identity is its repository, file and heading anchor; source is the exact bytes of its lines at the pinned commit, and url opens those lines. TL;DRs come from a .tldr.yaml sidecar in git and are only displayed. Aeon holds no doctrine text beyond a cache keyed by the pinned commit. Edits are proposed as PRs; the pinned source remains unchanged. Credential-backed sources require an operator-provisioned tenant/repository grant even when reading cached files; unavailable grants show the source as failed with a generic credential error and no cached files."
      responses:
        "200":
          description: The doctrine layer
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DoctrineLayer"}
        "401": {"description":"Authentication required","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "403": {"description":"Permission denied","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
  /rules/doctrine/analysis:
    get:
      operationId: listDoctrineOutcomeAnalysis
      description: "Person-only, workspace rules.read, outcome.read and knowledge.read. Up to 100 deterministic outcome findings, including internal notes refused by the public leak guard. Evidence stays inside the workspace. Daily analysis defaults to a 14-day window, 3 occurrences, 5 open drafts and 5 draft attempts per UTC day. No LLM calls or token consumption. Metrics are descriptive, not causal; after measurements require instruction provenance matching the changed file, in the same harness and ticket kind. Missing provenance leaves the comparison pending. The job never publishes (AEON-444): each proposal waits in the doctrine inbox, proposed by the System principal, until a person sends it to git or dismisses it; a dismissal closes the finding, a promotion or a merge starts the after measurement."
      responses:
        "200":
          description: Findings and proposal measurements
          content:
            application/json:
              schema:
                type: object
                required: [findings]
                properties:
                  findings: {type: array, items: {"$ref": "#/components/schemas/DoctrineFinding"}}
        "403": {description: Person with workspace rules.read required}
  /rules/doctrine/inbox:
    get:
      operationId: listDoctrineInbox
      description: "rules.read. The doctrine inbox (AEON-444). A person (not a key) sees every waiting proposal; an agent or key sees its own proposals in any state, with the dismissal reason. Each item carries the rule heading, the waiting text, a word diff against the rule at the current pin, the proposer's name and kind, the linked ticket and the why. outdated means the pinned rule changed since the proposal; Propose PR then needs Edit then propose. A private source whose credential grant is unavailable shows neither text nor diff. Each read also sweeps: waiting text of a proposal that left the inbox is deleted, and a proposal waiting longer than 30 days is dismissed with the reason expired (an hourly sweep does the same)."
      responses:
        "200":
          description: The inbox
          content:
            application/json:
              schema:
                type: object
                required: [pending, items]
                properties:
                  pending: {type: integer, minimum: 0}
                  items: {type: array, items: {"$ref": "#/components/schemas/DoctrineInboxItem"}}
    post:
      operationId: proposeDoctrineInboxChange
      description: "Workspace rules.write (person or agent key). Records a waiting doctrine proposal against the rule at the pinned commit; nothing is written to GitHub. The editor's checks apply before anything is stored: exactly one rule in the same section with its marker, a valid TL;DR sidecar, the size budget (rule 8000 bytes, why 2000, TL;DR 300 per language), credential and public-identity text, Unicode and Latin-only rules for the public repository, and the private quotation guard. Locked rules (before or after the change) are person-only (403 locked_rule). Without tldr the rule keeps its current TL;DR. The ticket must be readable by the caller. One waiting proposal per proposer and rule (409 rule_proposal_open; the identical proposal is returned), at most 10 waiting per proposer and 50 per workspace (409 inbox_full). The same request_id replays its proposal. The waiting text is held in Aeon until a person sends it to git or dismisses it, then deleted; the proposal row keeps references only."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/DoctrineInboxInput"}
      responses:
        "200":
          description: The waiting proposal
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DoctrineProposal"}
        "400": {description: "Invalid edit, no change, or a rule without a TL;DR"}
        "403": {description: "Permission denied, or a locked rule (locked_rule)"}
        "404": {description: Unknown source or ticket}
        "409": {description: "Stale rule or pin, request id conflict, an open proposal for this rule (rule_proposal_open), or a full inbox (inbox_full)"}
        "422": {description: "Credential, identity, non-Latin, ambiguous Unicode or private-quotation text refused the proposal"}
        "503": {description: App or quotation guard not configured}
  /rules/doctrine/inbox/summary:
    get:
      operationId: getDoctrineInboxSummary
      description: "rules.read. The waiting count and headlines (id, label, created_at, notified) for the Settings dot and the proposal toast; no rule text. Same visibility as the inbox. notified is true once the caller claimed the proposal's toast (claimDoctrineInboxNotice)."
      responses:
        "200":
          description: Waiting proposals
          content:
            application/json:
              schema:
                type: object
                required: [pending, items]
                properties:
                  pending: {type: integer, minimum: 0}
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, label, created_at, notified]
                      properties:
                        id: {type: string, format: uuid}
                        label: {type: string, description: "The proposed English TL;DR, else the rule heading"}
                        created_at: {type: string, format: date-time}
                        notified: {type: boolean, description: "The caller already claimed this proposal's toast"}
  /rules/doctrine/inbox/{proposalId}/dismiss:
    parameters:
      - {name: proposalId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: dismissDoctrineInboxProposal
      description: "Person-only workspace rules.write. Closes a waiting proposal as dismissed with a reason (1 to 500 bytes, no credential-shaped text). The reason goes back to the proposer: on the proposal they list and as a comment on the linked ticket. The waiting text is deleted. Repeating it is a no-op."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        "200":
          description: The dismissed proposal
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DoctrineProposal"}
        "403": {description: A person with workspace rules.write dismisses proposals}
        "409": {description: The proposal is not waiting}
  /rules/doctrine/inbox/{proposalId}/notified:
    parameters:
      - {name: proposalId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: claimDoctrineInboxNotice
      description: "Person-only (not a key) workspace rules.read. Claims the toast for a waiting proposal: claimed is true only for the first call per person and proposal, across tabs, devices and reloads, so a proposal toasts once. The claim is atomic and idempotent; every later call, and a call for a proposal that is no longer waiting (dismissed, expired, sent to git or promoted), returns claimed false. A claim racing a dismissal waits for it. Claims are deleted once the proposal leaves the inbox."
      responses:
        "200":
          description: Whether this call claimed the toast
          content:
            application/json:
              schema:
                type: object
                required: [claimed]
                properties:
                  claimed: {type: boolean}
        "403": {description: Agents and keys are not notified}
        "400": {description: Not a proposal UUID}
  /rules/doctrine/inbox/{proposalId}/pull-request:
    parameters:
      - {name: proposalId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: submitDoctrineInboxProposal
      description: "Person-only workspace rules.write (Propose PR). Sends a waiting proposal to git through the AEON-319 path with every check of proposeDoctrineChange, run as the submitting person; the proposer stays recorded. Any of source, tldr and why make it Edit then propose: the person's text replaces the waiting text, and rule_sha256 names the pinned rule they edited against. An outdated proposal without edits is 409 stale_rule. A proposal dismissed, expired or promoted before publication starts is 409 not_pending and nothing reaches GitHub. The transaction that records the PR deletes the waiting text. Repeating the request recovers an interrupted PR; a branch left by an attempt with other text or another base is 409 request_conflict."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                source: {type: string, maxLength: 8000}
                tldr:
                  type: object
                  additionalProperties: false
                  required: [en]
                  properties:
                    en: {type: string, maxLength: 300}
                    de: {type: string, maxLength: 300}
                why: {type: string, maxLength: 2000}
                rule_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      responses:
        "200":
          description: The proposal with its pull request
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DoctrineProposal"}
        "403": {description: A person with workspace rules.write sends proposals to git}
        "409": {description: "Not waiting, busy, stale rule or source, or a conflicting earlier attempt"}
        "422": {description: "Refused text, as for proposeDoctrineChange"}
        "503": {description: App not configured or outcome uncertain; repeat the request}
  /rules/doctrine/proposals:
    get:
      operationId: listDoctrineProposals
      description: "rules.read. Workspace proposal references only; proposed text lives in git. At most 100 recent proposals."
      responses:
        "200":
          description: Proposal history
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals: {type: array, items: {"$ref": "#/components/schemas/DoctrineProposal"}}
    post:
      operationId: proposeDoctrineChange
      description: "Workspace rules.write, by a person only (AEON-444): agents and person-created API keys get 403 forbidden and propose through POST /rules/doctrine/inbox, where a person sends the change to git. Locked rules change only through a person (403 locked_rule). Requires a server-configured GitHub App, operator-acknowledged DCO contribution policy and its designated tenant. The App key reference requires an operator-owned tenant/exact-repository allowlist grant, checked before key use for each proposal, refresh or approval. Tokens are narrowed to the owning repository; all GitHub requests use https://api.github.com with redirects disabled. Commit authorship and sign-off use the verified App bot identity. The source determines the owning repository; only the host-configured AEON_DOCTRINE_PUBLIC_REPOSITORY and AEON_DOCTRINE_PRIVATE_REPOSITORY pair is writable, with matching source and App repository visibility. Unset variables retain the INSPR defaults; an explicitly empty public variable makes public packs read-only in a private-only deployment. Before any token mint or GitHub call, the changed rule, its TLDR entry and explanation are normalized with the versioned Unicode default-ignorable/NFKD/casefold/confusables pipeline and checked for identity patterns and quotations from the indexed private doctrine. Ambiguous Unicode compatibility/visual forms are refused (422 ambiguous_text). Public proposal letters must be Latin, including German umlauts and ß, and digits must be ASCII (422 non_latin). Quotation exemptions use only blobs identical to the independently resolved main tree cached during public source indexing, never the configured pin, a proposal branch or an unmerged SHA. The cache expires after five minutes; a private match with a missing or stale cache returns 422 public_main_unavailable without fetching. Reindex the public source to refresh it. Proposals without a private match need no guard network reads. Normal PR preparation still checks main and refuses stale exemptions with 409 stale_source. The private guard is an HMAC keyed by the server secret AEON_DOCTRINE_GUARD_KEY_FILE; a missing guard or mismatched normalizer/table/binary-policy version returns 422 private_index_unavailable until reindex or the startup rebuild. Every non-UTF-8 or control-bearing private file blocks the guard unless its exact path and SHA-256 are in the reviewed host binary allowlist (empty by default). Public proposals require an available, authorized private index; unchanged file content is not scanned. GitHub I/O holds no database locks: short authorized transactions reserve a per-proposal lease and compare the saved version before applying results. Source, main-file blob and rule digest must match. Reuse request_id with identical input to recover a timeout; another input returns 409. No draft prose is retained in Aeon. A ref that lands after authority is revoked is stored as branch with orphaned true and a doctrine.branch_observed event."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/DoctrineProposalInput"}
      responses:
        "200":
          description: Created or recovered proposal
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DoctrineProposal"}
        "400": {description: Invalid edit}
        "403": {description: "Permission or tenant denied; an agent or API key (forbidden); a locked rule changed without a person (locked_rule)"}
        "409": {description: Stale source or request id conflict}
        "422": {description: "Credential, non-Latin public text (non_latin), ambiguous Unicode text (ambiguous_text), private quotation (private_doctrine), a missing or incompatible private guard (private_index_unavailable), or a missing or stale public main cache (public_main_unavailable) refused the proposal"}
        "503": {description: App not configured or outcome uncertain; retry the same request id}
  /rules/doctrine/proposals/{proposalId}/approve:
    parameters:
      - {name: proposalId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: approveDoctrineProposal
      description: "Person-only workspace rules.publish, no agent/key approval. Body head_sha must match the recorded and live PR head. Requires protected main, clean mergeability, and the configured independent gate account's latest APPROVED review on that exact head with explicit ok, checks_green, and distinct author/reviewer families. GitHub enforces required checks at merge; the App must not bypass protections. Record the approval before attempting the SHA-guarded merge. Dispatch doctrine-release to the owning repo after merge (idempotency key proposal id); the repo reserves CalVer3 under its own flow. Refresh observes the published release; dispatch alone is never released. Repeating approval recovers uncertain merge/dispatch outcomes. A merge observed outside Aeon is recorded as an observation, never attributed to the observing person as approver; without an existing Aeon approval, release must be requested in the owning repository."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [head_sha]
              properties:
                head_sha: {type: string, pattern: "^[0-9a-f]{40}$"}
      responses:
        '428': {$ref: '#/components/responses/OwnerWorkstationStepUpRequired'}
        "200":
          description: Proposal after approval attempt
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DoctrineProposal"}
        "403": {description: A person with workspace publication authority must approve}
        "409": {description: Head changed or checks/review gate not green}
  /rules/doctrine/proposals/{proposalId}/pins:
    parameters:
      - {name: proposalId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: reportDoctrineProposalPin
      description: "Person-only settings.manage. Record an operator-verified machine pin, never change one. machine_key is a SHA-256 of a stable machine identity (no hostname); commit must equal this proposal's verified release_commit. Upserts the machine's observation for this repository, so newer pins stop counting toward older releases. UI explicitly labels counts as reported."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [machine_key, commit]
              properties:
                machine_key: {type: string, pattern: "^[0-9a-f]{64}$"}
                commit: {type: string, pattern: "^[0-9a-f]{40}$"}
      responses:
        '428': {$ref: '#/components/responses/OwnerWorkstationStepUpRequired'}
        "200":
          description: Updated reported pin count
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DoctrineProposal"}
  /rules/doctrine/proposals/{proposalId}/refresh:
    parameters:
      - {name: proposalId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: refreshDoctrineProposal
      description: "Workspace rules.write. Observe PR/check/review/release state from GitHub; never merge or dispatch. An unchanged refresh emits no event. A release is accepted only with owning-repo provenance for this proposal and merge, and a tag resolving to that merge or its descendant."
      responses:
        "200":
          description: Current proposal
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DoctrineProposal"}
  /rules/doctrine/sources:
    post:
      operationId: addDoctrineSource
      description: "settings.manage; person only. Adds a repository to the doctrine layer, pinned to a commit. The server resolves ref (or checks commit) on GitHub before anything is stored, then indexes the pinned commit; a failed index is recorded on the source (state failed, error), the pin stays. A private repository names a credential reference; the server requires an operator-owned tenant/repository grant in credential_ref.allowlist.json beside the token before reading it at fetch time and never stores, logs or returns it. Tenant owners cannot grant credential access. GitHub reads use only https://api.github.com and never follow redirects. At most 8 repositories per workspace."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/DoctrineSourceInput"}
      responses:
        '428': {$ref: '#/components/responses/OwnerWorkstationStepUpRequired'}
        "200":
          description: The doctrine layer after the change
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DoctrineLayer"}
        "400": {"description":"Invalid repository, ref, commit, paths or credential reference","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "401": {"description":"Authentication required","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "403": {"description":"Permission denied; agent keys never configure doctrine","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "409": {"description":"The repository is already configured, the limit is reached, or ref does not name commit (code ref_mismatch)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "422": {"description":"GitHub or the credential could not be used (code git_unavailable); nothing was stored","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
  /rules/doctrine/sources/{sourceId}:
    parameters:
      - {name: sourceId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: pinDoctrineSource
      description: "settings.manage; person only. Replaces a source's pin and selection. The repository cannot change. A new commit restarts pinned_at, drops the cached bytes of the old commit and indexes the new one. Responses as for addDoctrineSource; 404 when the source is not in this workspace."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/DoctrineSourceInput"}
      responses:
        '428': {$ref: '#/components/responses/OwnerWorkstationStepUpRequired'}
        "200":
          description: The doctrine layer after the change
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DoctrineLayer"}
        "400": {"description":"Invalid input","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "401": {"description":"Authentication required","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "403": {"description":"Permission denied","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "404": {"description":"Source unavailable","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "409": {"description":"ref does not name commit (code ref_mismatch)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "422": {"description":"GitHub or the credential could not be used; nothing changed","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
    delete:
      operationId: removeDoctrineSource
      description: "settings.manage; person only. Stops indexing a repository and deletes its cached bytes. Git is not touched."
      responses:
        '428': {$ref: '#/components/responses/OwnerWorkstationStepUpRequired'}
        "200":
          description: The doctrine layer after the change
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DoctrineLayer"}
        "401": {"description":"Authentication required","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "403": {"description":"Permission denied","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
        "404": {"description":"Source unavailable","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuleError"}}}}
  /rules/doctrine/sources/{sourceId}/index:
    parameters:
      - {name: sourceId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: indexDoctrineSource
      description: "settings.manage; person only. Reads the source again at its pinned commit and replaces the cache. A failure keeps the files of the last successful index at this commit and sets error. An unavailable credential grant prevents fetching and hides cached files until the operator authorizes this workspace/repository again."
      responses:
        '428': {$ref: '#/components/responses/OwnerWorkstationStepUpRequired'}
        "200":
          description: The doctrine layer after the attempt
          content:
            application/json:

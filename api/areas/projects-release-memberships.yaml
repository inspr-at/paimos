# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/releases
paths:
  /projects/{projectId}/release-memberships:
    get:
      operationId: readReleaseMemberships
      summary: Read native release membership for visible project work
      description: Returns up to 100 requested work nodes (parents or leaves, including legacy ticket/task aliases) in request order. Membership comes from journey_tickets and live release nodes, never fields.release. Parents summarize actual current leaves; compare assigned_leaf_count with leaf_node_ids to verify full coverage, since a single distinct release can coexist with backlog leaves. Null release values mean no single live native membership (including backlog, unprojected work and split parent scope); missing, deleted or foreign nodes are omitted. No journey initialization or writes. Clients refresh this projection for list/detail loads and after membership changes or Undo; imported release metadata remains separate. Requires releases.read.
      security: [{session: []}, {agentKey: []}]
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - name: ticket_node_id
          in: query
          required: true
          style: form
          explode: true
          schema: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
      responses:
        '200': {description: Native membership projection (Cache-Control no-store), content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseMemberships'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
components:
  schemas:
    ReleaseMemberships:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          maxItems: 100
          items:
            type: object
            required: [ticket_node_id, release_node_id, release_title, release_state]
            properties:
              ticket_node_id: {type: string, format: uuid}
              release_node_id: {type: [string, 'null'], format: uuid}
              release_title: {type: [string, 'null']}
              release_state: {type: [string, 'null'], enum: [planning, building, candidate, deploying, refused, access, released, superseded, null]}
              leaf_node_ids: {type: array, maxItems: 1000, uniqueItems: true, items: {type: string, format: uuid}, description: "Current leaves, deduplicated by the client across overlapping parents."}
              assigned_leaf_count: {type: integer, minimum: 0, maximum: 1000, description: Current leaves with a live native release membership. A single distinct release does not imply full coverage; compare with leaf_node_ids before confirming placement.}
              is_parent: {type: boolean, description: Only live work children make a parent.}
              release_count: {type: integer, minimum: 0, description: Distinct releases of current leaves; parent placement intent is excluded.}
              releases:
                type: array
                maxItems: 1000
                items:
                  type: object
                  required: [release_node_id, release_title, release_state]
                  properties:
                    release_node_id: {type: string, format: uuid}
                    release_title: {type: string}
                    release_state: {type: string}
              inheritance_note: {type: [string, 'null'], description: parent_release_closed means the leaf went to the backlog because the placed release was no longer planning.}

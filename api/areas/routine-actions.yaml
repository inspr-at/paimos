# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/routineactions
paths:
  /routine-runs/{runId}/actions:
    parameters:
      - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: executeRoutineAction
      description: 'Submit one bounded catalogue action from the current running attempt. Current qualification, consent, owner, scope, target revision and independently verified guardrails are checked under the final tenant/tree fence. Internal effects commit with their receipt. pr.open persists an exact repository, branch, base, head and deterministic operation reference before an approved App effect; response loss reconciles that reference without another POST. pipeline.request tracks the normal person-controlled pipeline and grants no merge, publish or deploy authority. Pending or unavailable effects never report success. Automatic execution remains default off.'
      security: [{session: []}, {agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoutineActionRequest'}}}}
      responses:
        '200': {description: 'Durable action receipt or identical replay; inspect state for pending effects', content: {application/json: {schema: {$ref: '#/components/schemas/RoutineActionReceipt'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
components:
  schemas:
    RoutineActionRequest:
      type: object
      additionalProperties: false
      required: [attempt_id, action_key, kind, project_id, target_id, expected_revision]
      description: 'UTF-8 JSON limited to 65536 bytes. Exactly the payload matching kind is required. Titles are limited to 500 UTF-8 bytes, bodies to 32768 bytes and states to 64 bytes. The action key occurrence is reserved. target_id is the parent for creation and the entry for updates. expected_revision is the target updated_at as integral Unix microseconds. Knowledge creation targets the output project; work creation targets a work parent inside the frozen output subtree. No path, recipient, command or arbitrary metadata is accepted.'
      oneOf:
        - required: [work_create]
          properties: {kind: {const: work.create}}
          not: {anyOf: [{required: [work_update]}, {required: [knowledge_write]}, {required: [pr_open]}, {required: [pipeline_request]}]}
        - required: [work_update]
          properties: {kind: {const: work.update}}
          not: {anyOf: [{required: [work_create]}, {required: [knowledge_write]}, {required: [pr_open]}, {required: [pipeline_request]}]}
        - required: [knowledge_write]
          properties: {kind: {const: knowledge.write}}
          not: {anyOf: [{required: [work_create]}, {required: [work_update]}, {required: [pr_open]}, {required: [pipeline_request]}]}
        - required: [pr_open]
          properties: {kind: {const: pr.open}}
          not: {anyOf: [{required: [work_create]}, {required: [work_update]}, {required: [knowledge_write]}, {required: [pipeline_request]}]}
        - required: [pipeline_request]
          properties: {kind: {const: pipeline.request}}
          not: {anyOf: [{required: [work_create]}, {required: [work_update]}, {required: [knowledge_write]}, {required: [pr_open]}]}
      properties:
        attempt_id: {type: string, format: uuid}
        action_key: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]*$'}
        kind: {type: string, enum: [work.create, work.update, knowledge.write, pr.open, pipeline.request]}
        project_id: {type: string, format: uuid}
        target_id: {type: string, format: uuid}
        expected_revision: {type: integer, minimum: 1, maximum: 253402300799999999}
        work_create: {$ref: '#/components/schemas/RoutineWorkCreate'}
        work_update: {$ref: '#/components/schemas/RoutineWorkUpdate'}
        knowledge_write: {$ref: '#/components/schemas/RoutineKnowledgeWrite'}
        pr_open: {$ref: '#/components/schemas/RoutinePROpen'}
        pipeline_request: {$ref: '#/components/schemas/RoutinePipelineRequest'}
    RoutinePROpen:
      type: object
      additionalProperties: false
      required: [repository, branch, base_branch, base_sha, head_sha, title]
      description: 'Same-repository PR against main. No fork, arbitrary URL, merge, queue or deployment operation is accepted. The approved App must already have permission; unavailable capability stays pending.'
      properties:
        repository: {type: string, maxLength: 201}
        branch: {type: string, minLength: 1, maxLength: 255}
        base_branch: {type: string, const: main}
        base_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        head_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        title: {type: string, minLength: 1, maxLength: 500}
        body: {type: string, maxLength: 32768}
    RoutinePipelineRequest:
      type: object
      additionalProperties: false
      required: [non_code]
      description: 'Code requests reference a pr.open action key and exact head. Non-code requests require a result digest and no PR. All other catalogue receipts and required approvals must settle before completion.'
      oneOf:
        - required: [pr_action_key, head_sha]
          properties: {non_code: {const: false}}
          not: {required: [result_digest]}
        - required: [result_digest]
          properties: {non_code: {const: true}}
          not: {anyOf: [{required: [pr_action_key]}, {required: [head_sha]}]}
      properties:
        non_code: {type: boolean}
        pr_action_key: {type: string, minLength: 1, maxLength: 128}
        head_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        result_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    RoutineWorkCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        body: {type: string, maxLength: 32768}
    RoutineWorkUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        body: {type: string, maxLength: 32768}
        state: {type: string, minLength: 1, maxLength: 64}
    RoutineKnowledgeWrite:
      type: object
      additionalProperties: false
      required: [type, slug, title]
      description: 'Creates a proposed knowledge entry when target_id is the output project; otherwise updates an entry with unchanged type and slug. Decision records remain person-owned through the Decision Desk.'
      properties:
        type: {type: string, enum: [runbook, guideline, memory, external-system, related-project]}
        slug: {type: string, minLength: 1, maxLength: 64, pattern: '^[a-z][a-z0-9_-]*$'}
        title: {type: string, minLength: 1, maxLength: 500}
        body: {type: string, maxLength: 32768}
    RoutineActionReceipt:
      type: object
      additionalProperties: false
      required: [id, run_id, action_key, kind, request_digest, state, node_id, revision]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        action_key: {type: string}
        kind: {type: string}
        request_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        state: {type: string, enum: [pending, awaiting_decision, awaiting_merge, succeeded]}
        node_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        operation_ref: {type: string, pattern: '^[a-f0-9]{64}$'}
        pull_request: {type: integer, minimum: 1}
        pull_url: {type: string, format: uri}
        approval_id: {type: string, format: uuid}
        wait_reason: {type: string}

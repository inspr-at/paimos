# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/portal
paths:
  /public/portal/{tenantSlug}:
    get:
      operationId: readPublicPortal
      summary: Read one tenant's published product catalog, wishes, sourced comparison and pace
      description: Anonymous. A disabled portal and an unknown tenant both answer 404. The document is a whitelist of public fields; internal notes, ticket keys, voter identity, project names and wish titles that are not published are omitted. comparison and pace are absent when there is nothing public to say. A pace figure from fewer than five releases or five fulfilled wishes is omitted. An unapproved or unsourced comparison cell is stance unknown and carries no quote or source. The explicitly selected default product is returned; sorting never changes that selection.
      security: []
      parameters: [{name: tenantSlug, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}}]
      responses:
        '200': {description: Published catalog, headers: {Cache-Control: {schema: {type: string}}, X-Portal-Binding: {$ref: '#/components/headers/PortalBinding'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PortalPublic'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /public/portal/{tenantSlug}/catalog.json:
    get:
      operationId: readPublicPortalCatalogFile
      summary: Read the published catalog as a file
      description: Anonymous. The body is the same document as readPublicPortal. The site also serves this file at /portal/{tenantSlug}/catalog.json, outside this API. A disabled portal and an unknown tenant both answer 404 with the same JSON error. Shares the catalog read limit of 120 per minute, counted before the tenant is resolved.
      security: []
      parameters: [{name: tenantSlug, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}}]
      responses:
        '200': {description: Published catalog, headers: {Cache-Control: {schema: {type: string}}, X-Portal-Binding: {$ref: '#/components/headers/PortalBinding'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PortalPublic'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /public/portal/{tenantSlug}/corrections:
    post:
      operationId: submitPublicPortalCorrection
      summary: Send an anonymous factual correction
      description: Competitor, aspect, statement and source only. No name and no email. Any of those fields is refused when it contains an address, including a percent-encoded or HTML-entity form, decoded before the check. The website field is a honeypot; a non-empty value is discarded and still answers 201. A competitor that is not on the public comparison is discarded the same way. Five corrections per address per minute, counted before the tenant is resolved, so an unknown address and a closed portal share one window. A disabled portal, unknown tenant or portal without a published product is 404. The correction stays off the public page; a person with settings.manage closes it. Echo the catalog X-Portal-Binding to bind this request to the displayed product and settings revision; stale bindings return 409.
      security: []
      parameters: [{$ref: '#/components/parameters/PortalBinding'}, {name: tenantSlug, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PortalCorrectionIntake'}}}}
      responses:
        '201': {description: 'Accepted, or discarded without a stored row', content: {application/json: {schema: {$ref: '#/components/schemas/PortalWishAccepted'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {description: Participation disabled or unavailable}
        '401': {description: Registered voting requires eligible sign-in}
        '409': {description: Product or settings revision changed; reload the displayed catalog}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /public/portal/{tenantSlug}/llms.txt:
    get:
      operationId: readPublicPortalLlms
      summary: Read a plain-text index of the public catalog
      description: Anonymous. Public titles and summaries only. The site also serves this file at /portal/{tenantSlug}/llms.txt. A disabled portal and an unknown tenant both answer 404 with the same JSON error. Shares the catalog read limit of 120 per minute, counted before the tenant is resolved.
      security: []
      parameters: [{name: tenantSlug, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}}]
      responses:
        '200': {description: Plain-text index, headers: {Cache-Control: {schema: {type: string}}, X-Portal-Binding: {$ref: '#/components/headers/PortalBinding'}}, content: {text/plain: {schema: {type: string}}}}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /public/portal/{tenantSlug}/participation:
    get:
      operationId: readPublicPortalParticipation
      summary: Read the participation policy and separate anonymous history
      description: Anonymous, no-store. Disabled has no intake or voting controls. Registered never counts browser ballots; anonymous history is separate, never added to active totals. B1 reports registered_available false. Echo the catalog X-Portal-Binding to bind this request to the displayed product and settings revision; stale bindings return 409.
      security: []
      parameters:
        - {$ref: '#/components/parameters/PortalBinding'}
        - {name: after, in: query, schema: {type: string, maxLength: 30}, description: Keyset cursor returned as next_cursor; history pages contain at most 100 public wishes}
        - {name: tenantSlug, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Participation policy, headers: {X-Portal-Binding: {$ref: '#/components/headers/PortalBinding'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PortalParticipation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {description: Product or settings revision changed; reload the displayed catalog}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /public/portal/{tenantSlug}/products/{productSlug}:
    get:
      operationId: readPublicPortalProduct
      summary: Read one tenant's published product catalog, wishes, sourced comparison and pace
      description: Product-scoped version of the existing portal contract. Uses this exact product, never the default. Unknown or unpublished products return the same 404 as closed tenants. Shared limiter runs before resolution. Intake and voting require legacy policy; disabled refuses writes, and registered never creates anonymous ballots. All writes recheck policy and publication inside the final fenced transaction. Releases, roadmap and pace use this product's project link. The response fields remain compatible with the existing endpoint.
      security: []
      parameters: [{name: productSlug, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}}, {name: tenantSlug, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}}]
      responses:
        '200': {description: Published catalog, headers: {Cache-Control: {schema: {type: string}}, X-Portal-Binding: {$ref: '#/components/headers/PortalBinding'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PortalPublic'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}

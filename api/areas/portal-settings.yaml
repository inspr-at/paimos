# aeon:owner internal/portal
paths:
  /portal/settings:
    get:
      operationId: readPortalSettings
      summary: Read whether this tenant's public product portal is enabled
      description: settings.manage, people only. Agents are refused. A missing row is off. The slug builds the public path. Enabling does not publish nodes by itself.
      security: [{session: []}]
      responses:
        '200': {description: Portal switch, content: {application/json: {schema: {$ref: '#/components/schemas/PortalSettings'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updatePortalSettings
      summary: Turn this tenant's public product portal on or off
      description: settings.manage, people only. Agents are refused. The portal stays off until this is true. The response is the stored switch and the public slug.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PortalSettingsWrite'}}}}
      responses:
        '428': {$ref: '#/components/responses/OwnerWorkstationStepUpRequired'}
        '200': {description: Stored switch, content: {application/json: {schema: {$ref: '#/components/schemas/PortalSettings'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
components:
  schemas:
    PortalSettings:
      type: object
      additionalProperties: false
      required: [enabled, slug]
      properties:
        enabled: {type: boolean}
        slug: {type: string, description: Tenant address used in the public portal path}
    PortalSettingsWrite:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}

# aeon:owner internal/events
paths:
  /events:
    get:
      operationId: listEvents
      description: >-
        Tenant-wide history excludes quote events, whose document metadata is available only through quote-scoped authorized routes. Optional from/to filters select event timestamps in [from, to), spanning at most 366 days; they must be supplied together. Legacy event ID pagination remains unchanged. With order=time, pages use ascending (at,id) keysets on the existing time index and require from/to. Subsequent time pages must reuse those bounds.
      security: *auth
      parameters:
        - {name: node_id, in: query, schema: {type: string, format: uuid}}
        - {name: after, in: query, description: Exclusive event ID, schema: {type: integer, format: int64, minimum: 0}}
        - {name: order, in: query, schema: {type: string, enum: [id, time]}}
        - {name: cursor, in: query, description: 'Opaque exclusive (at,id) cursor; requires from/to and enables order=time', schema: {type: string, maxLength: 256}}
        - {name: project_id, in: query, schema: {type: string, format: uuid}, description: Restrict to events attached to nodes in this visible project.}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: type, in: query, schema: {type: string, maxLength: 1031}, description: Comma-separated exact event types; at most eight names of 1–128 characters each.}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          $ref: '#/components/responses/Events'
        '400':
          $ref: '#/components/responses/Error'
  /events/activity:
    get:
      operationId: listWorkspaceActivity
      summary: Workspace history, newest first
      description: >-
        Bounded read projection of the existing tenant event log under current project visibility and events.read authority. Quote events remain excluded. Returns summaries, never raw snapshots. Pages use descending (at,id) keysets; the cursor is bound to the view, rule, project and search filters. Automatic means status_autopilot.changed or status_autopilot.derived; People and Agents use the recorded principal kind. Automatic move Undo is offered only with an unchanged live ticket revision and current events.undo, events.undo_other and nodes.write permissions; the existing Undo mutation rechecks these inside its transaction. Derived parent changes require the existing ticket causal preview/confirmation flow. No event schema or per-ticket Activity changes.
      security: *auth
      parameters:
        - {name: view, in: query, schema: {type: string, enum: [everything, automatic, people, agents], default: everything}}
        - {name: rule, in: query, schema: {type: string, enum: [new, backlog, blocked, progress, done, publish, accept, work_parent]}}
        - {name: project_id, in: query, schema: {type: string, format: uuid}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}, description: 'Literal case-insensitive search of key, title, actor, event type and reason; at most 200 UTF-8 bytes.'}
        - {name: cursor, in: query, schema: {type: string, maxLength: 256}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Visible page; next_cursor is null when exhausted
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/WorkspaceActivityItem'}}
                  next_cursor: {type: [string, 'null'], maxLength: 256}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {description: Read timed out; retry the same page}
  /events/stream:
    get:
      operationId: streamEvents
      description: 'SSE id is the event ID; event is its type; data is Event JSON. Quote events are excluded and use the authorized quote collaboration stream. LISTEN/NOTIFY wakes durable replay; periodic comments keep the connection alive. Live mode (AEON-326): with the after query parameter every connection first sends an event named stream.ready whose id and data {"after": N, "resumed": bool} name the event ID the stream continues after. Live mode also sends stream.ping with data {} at the 15-second keepalive deadline, so browsers can detect a silent connection. Pings have no id, carry no tenant data, append no event and do not change the resume cursor. Streams without after retain comment-only keepalives. after=latest starts at the newest event without replaying the log; a numeric after replays from there. Last-Event-ID (a browser reconnect) wins over after. A resume point more than 1000 events behind, or ahead of the newest event, restarts at the newest event. resumed is true only when the stream continues exactly after the ID the client sent; false (after=latest, or a restart) tells the client to refetch what it shows. Node events carry node_changes.'
      security: *auth
      parameters:
        - {name: Last-Event-ID, in: header, schema: {type: integer, format: int64, minimum: 0}}
        - {name: after, in: query, description: 'Live mode: latest, or an exclusive event ID', schema: {type: string, pattern: '^(latest|[0-9]+)$'}}
      responses:
        '200':
          description: Tenant event stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
  /events/subscribe:
    get:
      operationId: subscribeAgentEvents
      description: 'Read-only agent SSE change hints. Requires an explicit events.subscribe key scope and a custom workspace role granting it; built-in agent roles exclude it. Topic reads also require their live resource permissions; node-backed hints require nodes.read for every referenced project. Preference hints require models.resolve, policy hints reviewpolicy.read, approvals approvals.read, decisions questions.read and delivery delivery.read. Settings hints require the corresponding settings.read or settings.manage authority. Project sets above 2000 or events with more than 100 node references are refused without advancing the cursor. Plan hints are restricted to the key creator’s canonical person. Data contains only id, type, topic and at, never snapshots, actor identities, secrets or resource values. Fetch current values through their authorized APIs. LISTEN/NOTIFY wakes durable replay after commit. Numeric cursors replay without a backlog cutoff; Last-Event-ID wins over after. after defaults to latest. A cursor ahead of the tenant log is rejected, never reset. Changing topics requires replaying from the earlier cursor. stream.ready and stream.cursor name the exclusive resume cursor; stream.ping has no id. Persist cursor ids only after processing earlier frames. Heartbeats occur every 15 seconds. Two connections per key across server processes and at most 64 subscriptions per server; excess gets 429 and Retry-After. Reads and writes have 10-second deadlines, replay batches have at most 200 hints, and slow clients disconnect to resume from their last processed cursor. Current key, creator and topic authority is checked on every replay and heartbeat; revoked subscription authority closes the stream.'
      security: *auth
      parameters:
        - {name: Last-Event-ID, in: header, description: 'Exclusive resume cursor; takes precedence over after.', schema: {type: string, pattern: '^[0-9]{1,19}$', maxLength: 19}}
        - {name: after, in: query, description: 'latest or an exclusive numeric resume cursor. No automatic backlog skip.', schema: {type: string, default: latest, pattern: '^(latest|[0-9]{1,19})$', maxLength: 19}}
        - {name: topics, in: query, description: 'Comma-separated distinct topics; omitted means all. Unknown or repeated topics are rejected.', schema: {type: string, maxLength: 128, example: 'plan,policies,delivery'}}
      responses:
        '200':
          description: 'SSE change hints and cursor checkpoints. Topics are plan, settings, preferences, policies, approvals, decisions and delivery.'
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429':
          description: 'Subscription connection limit reached; Retry-After is 15 seconds.'
        '503': {$ref: '#/components/responses/Error'}
  /events/{eventId}/undo:
    parameters: [{$ref: '#/components/parameters/EventId'}]
    post:
      operationId: undoEvent
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed_cause_event_id]
              properties:
                confirmed_cause_event_id: {type: integer, minimum: 1, description: Must match the cause_event_id returned by undo-preview. Required only for derived parent events.}
      description: For status_autopilot.derived, confirmation from undo-preview is required and Undo reverses the visible triggering child change, refusing later child edits. Confirmation is limited to 1 KiB and read with a 10-second deadline before mutation locks; its cause and permissions are rechecked inside the final transaction even after the derivation feature is disabled. Callers lacking events.undo in the workspace or any project are refused before event lookup; final permission checks use the current target's project. Reversing roadmap publication, a human-check completion or its person provenance requires a person; an authorized reversal preserves the historical snapshot attribution. Append one compensating event and restore the prior resource snapshot atomically. Only reversible events can be undone; an event can be undone once. Undoing a change to a portal_product, portal_feature or portal_wish, or a move into or out of a portal parent, requires a person with settings.manage. Agents are refused.
      security: *auth
      responses:
        '201':
          $ref: '#/components/responses/Event'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /events/{eventId}/undo-preview:
    parameters:
      - {name: eventId, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: previewCausalUndo
      description: Preview the visible child change that caused a derived parent status. Checks the same current child revision, mutation permissions and bilingual benefit completion requirements as Undo without committing writes, including tenant-defined Done categories. Reversing roadmap publication, a human-check completion or its person provenance requires a person, including for imported child changes. Hidden causes, later child edits, ambiguous causes and unsupported reversals are refused. Requires events.undo on the child and events.undo_other for another actor's event.
      security: *auth
      responses:
        '200':
          description: A preview to confirm before causal Undo
          content:
            application/json:
              schema:
                type: object
                required: [event_id, cause_event_id, change_type, affected_nodes, message]
                properties:
                  event_id: {type: integer}
                  cause_event_id: {type: integer}
                  change_type: {type: string, description: The visible triggering event type to reverse.}
                  affected_nodes:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      required: [id, key, from, to]
                      properties:
                        id: {type: string, format: uuid}
                        key: {type: string}
                        from: {type: string}
                        to: {type: string}
                  message: {type: string}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  schemas:
    Event:
      type: object
      required: [id, actor_principal_id, type, at]
      properties:
        id:
          type: integer
          format: int64
        actor_principal_id:
          type: string
          format: uuid
        node_id:
          type: [string, 'null']
          format: uuid
        type:
          type: string
          description: Stable dotted name, e.g. node.updated
        before:
          description: Previous resource snapshot or null
        after:
          description: New resource snapshot or null
        at:
          type: string
          format: date-time
        undo_of:
          type: [integer, 'null']
          format: int64
        derivation:
          type: object
          description: Safe Status autopilot derivation and causal-Undo context; cause_event_id is omitted unless the cause event is visible and never exposed in a causal-Undo snapshot. Automatic parent writes preserve the parent edit revision.
          required: [rule_version, reason, affected_nodes]
          properties:
            rule_version: {type: integer, minimum: 1}
            reason: {type: string}
            cause_event_id: {type: integer, minimum: 1}
            affected_nodes: {type: array, maxItems: 1, items: {type: string, format: uuid}}
        node_changes:
          type: array
          description: Set on node.*, status_autopilot.derived/changed/undone and import.node_created/node_updated/parent_changed events when read (history and stream), never stored. Import reparenting can retain updated_at; membership hints must refresh affected parent aggregates even when parent status and revision are unchanged. Also set on harness.usage_reported for the session's currently bound readable ticket, with estimate/planning fields and a null revision, to invalidate spend projections after late reports. Values are read through the authorized node routes.
          items:
            $ref: '#/components/schemas/NodeChange'
    EventPage:
      type: object
      required: [items, next_after]
      properties:
        next_cursor:
          type: [string, 'null']
          description: Exclusive time cursor for order=time pages.
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_after:
          type: [integer, 'null']
          format: int64
    NodeChange:
      type: object
      description: AEON-326. One node change, derived from an event the reader may read. Clients refetch the node through GET /nodes/{nodeId} (or their list) to see values.
      required: [id, project_id, change, fields, revision]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: [string, 'null']
          format: uuid
          description: The node's project now; null outside every project
        change:
          type: string
          enum: [created, updated, deleted]
          description: A restored node reads as created
        fields:
          type: array
          description: 'Changed attributes: key, kind_id, title, body, state, parent_id, position, deleted_at, project_id (a project move) and fields.<name> for custom fields. Empty for created. Usage invalidation hints name estimate and planning projections.'
          items:
            type: string
        revision:
          type: [string, 'null']
          format: date-time
          description: The node's updated_at after the change, the value If-Unmodified-Since takes; null for a projection-only usage invalidation
    WorkspaceActivityItem:
      type: object
      required: [event_id, node_id, project_id, key, title, actor, type, rule, reason, from, to, at, revision, automatic, undone, changed_since, undoable, requires_preview]
      properties:
        event_id: {type: integer, format: int64}
        node_id: {type: [string, 'null'], format: uuid}
        project_id: {type: [string, 'null'], format: uuid}
        key: {type: string}
        title: {type: string}
        actor: {type: string}
        type: {type: string}
        rule: {type: string}
        reason: {type: string}
        from: {type: string}
        to: {type: string}
        at: {type: string, format: date-time}
        revision: {type: [string, 'null'], format: date-time, description: Original event's ticket revision after its change; captured with event_id/node_id when Undo is clicked.}
        automatic: {type: boolean}
        undone: {type: boolean}
        changed_since: {type: boolean}
        undoable: {type: boolean}
        requires_preview: {type: boolean}
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Event:
      description: Event
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Event'
    Events:
      description: Event page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventPage'

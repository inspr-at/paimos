# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/recurrences
paths:
  /recurrences:
    get:
      operationId: listRecurrences
      description: 'Visible recurring work and scoped routine definitions. People need nodes.read; agents need an explicit recurrences.manage grant and key scope. Personal definitions are private to the canonical owner; workspace definitions require workspace read authority; project definitions follow their scope project readers. Output project visibility is also required. Deleted definitions are omitted. Filtering occurs before the bounded 100-row UUID page.'
      security: [{session: []}, {agentKey: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: string, format: uuid}}
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: scope, in: query, schema: {type: string, enum: [project, personal, workspace]}, description: 'Definition scope; legacy definitions count as project scope. project_id continues to filter the output project.'}
      responses:
        '200': {description: Recurrences, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Recurrence'}}, next_cursor: {type: [string, 'null'], format: uuid}}}}}}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createRecurrence
      description: 'Create a ticket template in a live project and parent. Requires recurrences.manage and nodes.write in that project. queue_each also requires run.create and work_orders.write. The schedule lives in the server; no external timer is needed. Definitions persist across restarts. Creation appends recurrence.created. Optional scoped definitions start paused and without execution consent; saving an assignment never starts agents. Output project_id/parent_id retain their legacy meaning, independently of definition scope. The canonical owner must have current target and source authority. Project/workspace owners must be administrators in their scope.'
      security: [{session: []}, {agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecurrenceInput'}}}}
      responses:
        '201': {description: Created recurrence, content: {application/json: {schema: {$ref: '#/components/schemas/Recurrence'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /recurrences/preview:
    post:
      operationId: previewRecurrenceDraft
      description: 'Validate an unsaved definition and preview the next four dates on the database clock, using the scheduler calendar engine. No definition or event is written. Requires recurrences.manage and a visible valid target. Spring gaps and invalid month days are skipped; a fall-back fold uses its first instant.'
      security: [{session: []}, {agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecurrenceInput'}}}}
      responses:
        '200': {description: Preview, content: {application/json: {schema: {$ref: '#/components/schemas/RecurrencePreview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /recurrences/{recurrenceId}:
    parameters:
      - {name: recurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getRecurrence
      description: 'Read a visible recurrence. People need nodes.read; agents need recurrences.manage. Invisible or deleted IDs return 404.'
      security: [{session: []}, {agentKey: []}]
      responses:
        '200': {description: Recurrence, content: {application/json: {schema: {$ref: '#/components/schemas/Recurrence'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: updateRecurrence
      description: 'Replace the template and options at expected_revision. Project and parent are immutable. A changed trigger starts after the database clock; an unchanged trigger retains overdue work. Paused state is preserved; adding a scoped definition to a legacy recurrence pauses it. Definition scope and canonical owner are immutable once supplied. Omitting definition (or supplying null) preserves a saved projection for legacy editors; an explicit complete definition with no assignment clears the assignment. Each edit clears execution consent. Appends recurrence.updated.'
      security: [{session: []}, {agentKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/RecurrenceInput'}
                - {type: object, required: [expected_revision], properties: {expected_revision: {type: integer, minimum: 1}}}
      responses:
        '200': {description: Updated recurrence, content: {application/json: {schema: {$ref: '#/components/schemas/Recurrence'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteRecurrence
      description: 'Stop and retire a recurrence at expected_revision. Requires recurrences.manage inside the mutation transaction. Its definition, receipts, created tickets and audit history are retained. Appends recurrence.deleted. Deleted definitions cannot be run or edited.'
      security: [{session: []}, {agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_revision], properties: {expected_revision: {type: integer, minimum: 1}}}}}}
      responses:
        '204': {description: Retired}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /recurrences/{recurrenceId}/guardrails:
    parameters:
      - {name: recurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getRoutineGuardrails
      description: 'Read the compiled hard floor, versioned installation recommendations and applicable tenant, project and owner-user revisions. Requires the same live scope visibility as the routine. Missing or stale override evidence fails closed.'
      security: [{session: []}, {agentKey: []}]
      responses:
        '200': {description: 'Effective policy', content: {application/json: {schema: {$ref: '#/components/schemas/RoutineGuardPolicy'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    put:
      operationId: putRoutineGuardrails
      description: 'Person-only revisioned policy edit. Tenant and project policies require a current administrator in that scope; user policies require their canonical owner. Removing or weakening non-hard rules also requires a current administrator and a reason. The server binds identity, inherited digest, prior revision and rule digest; callers cannot supply approval or replace compiled script hashes. Changes save policy only and grant no execution.'
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope, expected_revision, rules]
              properties:
                scope: {type: string, enum: [tenant, project, user]}
                expected_revision: {type: integer, minimum: 0}
                reason: {type: string, maxLength: 2048}
                rules: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/RoutineGuardRule'}}
      responses:
        '200': {description: 'Saved scoped revision with server-bound evidence', content: {application/json: {schema: {$ref: '#/components/schemas/RoutineGuardSource'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /recurrences/{recurrenceId}/history:
    parameters:
      - {name: recurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: recurrenceHistory
      description: 'Project-visible append-only recurrence events, newest first. Same read permissions as getRecurrence. Each page is bounded to 50; before is the previous next_cursor. Includes current node key, title and state only for visible live occurrence tickets.'
      security: [{session: []}, {agentKey: []}]
      parameters:
        - {name: before, in: query, schema: {type: integer, minimum: 1}}
        - {name: filter, in: query, schema: {type: string, enum: [all, created, skipped, changes], default: all}}
      responses:
        '200': {description: History, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/RecurrenceHistoryEntry'}}, next_cursor: {type: [integer, 'null']}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /recurrences/{recurrenceId}/pause:
    parameters:
      - {name: recurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: pauseRecurrence
      description: 'Requires recurrences.manage and expected_revision. Resume starts after the database clock and discards work accumulated while paused. Repeating the current state is a no-op. Appends recurrence.paused on a state change.'
      security: [{session: []}, {agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_revision], properties: {expected_revision: {type: integer, minimum: 1}}}}}}
      responses:
        '200': {description: Recurrence, content: {application/json: {schema: {$ref: '#/components/schemas/Recurrence'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /recurrences/{recurrenceId}/execution-consent:
    parameters:
      - {name: recurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: putRoutineExecutionConsent
      security: [{session: []}]
      description: 'Interactive canonical owner only for enable, with live recurrence management and execution authority under the tenant/tree fence. Project/workspace routines require an administrator-provisioned keyless agent with one restricted custom role in their scope. Personal routines act as their canonical owner. expected_revision binds the displayed definition; each edit or control revision requires renewed consent. A project qualification and this separate consent are both required. Scope administrators may disable shared routines after owner loss. Consent creates no process, key, pairing, extra role or runtime grant.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, execute_consent]
              properties:
                expected_revision: {type: integer, minimum: 1}
                execute_consent: {type: boolean, default: false}
                execution_principal_id: {type: [string, 'null'], format: uuid, description: 'Existing restricted keyless agent required for project/workspace enable; personal scope uses its canonical owner.'}
      responses:
        '200': {description: 'Current revision and redacted effective policy', content: {application/json: {schema: {$ref: '#/components/schemas/Recurrence'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'Stale revision, missing qualification, consent or restricted identity.'}
  /recurrences/{recurrenceId}/preview:
    parameters:
      - {name: recurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: previewRecurrence
      description: 'Read-only next N scheduled times, strictly after the supplied after instant or the database clock, even while paused. The same calendar engine runs the scheduler. Event triggers have no predictable dates and return an empty list. Spring gaps and invalid month days are skipped; a fall-back fold uses its first instant. UTC timestamps are returned.'
      security: [{session: []}, {agentKey: []}]
      parameters:
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 5}}
        - {name: after, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: 'Occurrence preview and the same effective execution policy as save/claim', content: {application/json: {schema: {$ref: '#/components/schemas/RecurrencePreview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /recurrences/{recurrenceId}/releases:
    parameters:
      - {name: recurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: recurrenceReleases
      description: 'Published releases of the configured same-tenant source projects, defaulting to the recurrence project. Requires current nodes.read and project visibility for every source. Bounded to the newest 100, with truncated explicitly reported. Names and versions are bounded source metadata. Manual and automatic release runs share a source-project and canonical-publication receipt.'
      security: [{session: []}, {agentKey: []}]
      responses:
        '200': {description: Release choices, content: {application/json: {schema: {type: object, required: [items, truncated], properties: {items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/RecurrenceRelease'}}, truncated: {type: boolean}}}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /recurrences/{recurrenceId}/resume:
    parameters:
      - {name: recurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: resumeRecurrence
      description: 'Requires recurrences.manage and expected_revision. Resume starts after the database clock and discards work accumulated while paused. Repeating the current state is a no-op. Appends recurrence.resumed on a state change.'
      security: [{session: []}, {agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_revision], properties: {expected_revision: {type: integer, minimum: 1}}}}}}
      responses:
        '200': {description: Recurrence, content: {application/json: {schema: {$ref: '#/components/schemas/Recurrence'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /recurrences/{recurrenceId}/events:
    parameters:
      - {name: recurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: receiveRecurrenceExternalEvent
      description: 'Receive a signed external tag or successful deploy event from the configured active agent principal. Requires its existing agent key, nodes.read and recurrences.manage on the target project inside the final write transaction. X-Aeon-Signature is base64 Ed25519 over UTF-8 aeon-recurrence-event-v1, tenant UUID, recurrence UUID and the exact request body, separated by LF. occurred_at must be within five minutes of the database clock. The sender and delivery_id own a durable tenant-local receipt, even after definition edits. Exact retries return that receipt; changed payloads return 409. Only a bounded event is recorded; the scheduler creates work and never launches an agent.'
      security: [{agentKey: []}]
      parameters:
        - {name: X-Aeon-Signature, in: header, required: true, schema: {type: string, maxLength: 88}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecurrenceExternalEvent'}}}}
      responses:
        '202': {description: 'Durable event receipt', content: {application/json: {schema: {type: object, required: [event_id, duplicate], properties: {event_id: {type: integer}, duplicate: {type: boolean}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /recurrences/{recurrenceId}/run-now:
    parameters:
      - {name: recurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: runRecurrenceNow
      description: 'Manually attempt one occurrence, including while paused. An idempotency_key is required; retrying it returns the original receipt without creating another ticket, even after template edits. Manual runs do not move the schedule or event cursor. Uses the overlap policy and existing queue readiness. Explicit every-publication subscriptions return 409 on release overlap without recording a skipped receipt; a later retry can create the pending publication. Legacy occurrence numbers count both created and skipped attempts. Creates ordinary tickets with Recurring work system-actor provenance; appends recurrence.occurred or recurrence.skipped with a reason.'
      security: [{session: []}, {agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [idempotency_key], properties: {idempotency_key: {type: string, minLength: 1, maxLength: 128}, expected_revision: {type: integer, minimum: 1}, force_overlap: {type: boolean, default: false, description: Explicitly confirmed manual override of skip policy; does not change the definition.}, release_key: {type: string, maxLength: 256, description: A server-issued release choice key. Event only; renders the trusted release name and version and shares its durable receipt identity with the scheduler.}}}}}}
      responses:
        '200': {description: Durable occurrence receipt, content: {application/json: {schema: {$ref: '#/components/schemas/RecurrenceOccurrence'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  schemas:
    RecurrenceEventFilter:
      type: object
      additionalProperties: false
      description: 'Internal events only. All supplied conditions must match. Source projects default to the recurrence project and must be visible and readable to the saving caller and definition owner; permissions and event visibility are rechecked inside the occurrence fence. For release.published only project_ids is supported. A nonempty release source list explicitly requests ordered delivery of every publication, retaining pending publications during overlap; automatic consumption requires the output project execution gate. Omitted or empty release sources retain legacy latest-only catch-up.'
      properties:
        project_ids: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}, description: 'Same-tenant readable source projects; nonempty release sources opt into every-publication delivery.'}
        has_release_copy: {type: boolean, description: 'Done only; require nonblank bilingual pills and benefits in the event snapshot.'}
        exclude_hidden: {type: boolean, description: 'Done only; reject snapshots hidden from release notes.'}
        entry_id: {type: string, format: uuid, description: 'Knowledge only; one live source entry.'}
        knowledge_type: {type: string, enum: [runbook, guideline, memory, external-system, related-project, decision]}
        tag: {type: string, minLength: 1, maxLength: 128, description: 'Knowledge only; exact tag in the event snapshot fields.tags array.'}
    RecurrenceExternalSender:
      type: object
      additionalProperties: false
      required: [principal_id, public_key]
      description: 'External only. Active tenant agent principal and base64 Ed25519 public key from an existing sender signing authority. No signing secret is generated or stored by PAIMOS.'
      properties:
        principal_id: {type: string, format: uuid}
        public_key: {type: string, minLength: 44, maxLength: 44}
    RecurrenceExternalEvent:
      type: object
      additionalProperties: false
      required: [delivery_id, event, occurred_at, source, ref]
      properties:
        delivery_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$'}
        event: {type: string, enum: [external.tag, external.deploy]}
        occurred_at: {type: string, format: date-time}
        source: {type: string, minLength: 1, maxLength: 256, description: 'Product, repository or site identifier; no credentials or arbitrary payload.'}
        ref: {type: string, minLength: 1, maxLength: 256, description: 'Published tag or successful deployment identifier.'}
    Recurrence:
      allOf:
        - {$ref: '#/components/schemas/RecurrenceInput'}
        - type: object
          required: [id, paused, revision, occurrence_count, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            paused: {type: boolean}
            revision: {type: integer}
            occurrence_count: {type: integer}
            next_at: {type: [string, 'null'], format: date-time}
            event_cursor: {type: integer}
            active_since: {type: string, format: date-time}
            created_by_principal_id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            last_result: {$ref: '#/components/schemas/RecurrenceResult'}
            open_previous: {$ref: '#/components/schemas/RecurrenceResult'}
            execution_policy: {$ref: '#/components/schemas/RoutineExecutionPolicy'}
    RecurrenceHistoryEntry:
      type: object
      required: [id, type, at, actor_name, before, after]
      properties:
        id: {type: integer}
        type: {type: string}
        at: {type: string, format: date-time}
        actor_name: {type: string}
        before: {type: [object, 'null']}
        after: {type: [object, 'null']}
        node: {type: [object, 'null'], properties: {key: {type: string}, title: {type: string}, state: {type: string}}}
    RecurrenceInput:
      type: object
      required: [project_id, parent_id, template, trigger]
      properties:
        project_id: {type: string, format: uuid}
        parent_id: {type: string, format: uuid}
        definition: {$ref: '#/components/schemas/RoutineDefinition'}
        template: {$ref: '#/components/schemas/RecurrenceTemplate'}
        trigger: {$ref: '#/components/schemas/RecurrenceTrigger'}
        queue_each: {type: boolean, default: false}
        overlap_policy: {type: string, enum: [skip, create], default: skip, description: Skip if any preceding occurrence ticket is still nonterminal and live.}
        catch_up_policy: {type: string, enum: [one], default: one, description: 'Consume only the latest missed time or publication per scheduler pass; new event kinds process source events in order in bounded passes.'}
    RecurrenceOccurrence:
      type: object
      required: [recurrence_id, occurrence_key, number, scheduled_at, outcome, reason]
      properties:
        recurrence_id: {type: string, format: uuid}
        occurrence_key: {type: string}
        number: {type: integer}
        scheduled_at: {type: string, format: date-time}
        node_id: {type: [string, 'null'], format: uuid}
        source_event_id: {type: [integer, 'null']}
        outcome: {type: string, enum: [created, skipped]}
        reason: {type: string}
        created_at: {type: string, format: date-time}
        run: {$ref: '#/components/schemas/RoutineRunReceipt'}
    RoutineRunReceipt:
      type: object
      additionalProperties: false
      required: [id, state, assignment_digest, policy_digest]
      description: 'Optional durable execution intent for an occurrence with a saved assignment. Replay returns the same run identity. Pending intent grants no launch authority; consent, project qualification and current permissions remain required. Ticket-only and skipped occurrences omit this field.'
      properties:
        id: {type: string, format: uuid}
        state: {type: string}
        work_order_id: {type: string, format: uuid}
        agent_run_id: {type: string, format: uuid}
        assignment_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        policy_digest: {type: string, pattern: '^[a-f0-9]{64}$', description: 'Digest of the frozen scope, owner, target, consent revision and assignment policy inputs; it is not an evaluated guardrail verdict.'}
    RecurrencePreview:
      type: object
      required: [times, trigger_kind]
      properties:
        times: {type: array, maxItems: 100, items: {type: string, format: date-time}}
        trigger_kind: {type: string, enum: [time, event]}
        execution_policy: {$ref: '#/components/schemas/RoutineExecutionPolicy'}
    RoutineExecutionPolicy:
      type: object
      additionalProperties: false
      required: [eligible, consent_required, wait_reason, project_revision, consent_revision]
      description: 'Redacted live policy only. Eligible does not grant a start; final claims recheck current owner, exact record revision, qualification and scoped identity, then the existing admission and effect gates. Ticket-only definitions require no execution consent.'
      properties:
        eligible: {type: boolean}
        consent_required: {type: boolean}
        wait_reason: {type: string}
        project_revision: {type: integer, minimum: 0}
        consent_revision: {type: integer, minimum: 0}
    RecurrenceRelease:
      type: object
      required: [key, name, version, published_at]
      properties:
        key: {type: string}
        name: {type: string}
        version: {type: string}
        published_at: {type: string, format: date-time}
        receipt: {$ref: '#/components/schemas/RecurrenceResult'}
    RecurrenceResult:
      allOf:
        - {$ref: '#/components/schemas/RecurrenceOccurrence'}
        - type: object
          properties:
            key: {type: string}
            title: {type: string}
            state: {type: string}
    RecurrenceTemplate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        name: {type: string, maxLength: 80, description: Human name of the recurrence; optional for existing CLI definitions.}
        title: {type: string, minLength: 1, maxLength: 512}
        description: {type: string, maxLength: 65536}
        acceptance_criteria: {type: array, maxItems: 100, items: {type: string, minLength: 1, maxLength: 4096}}
        estimate_hours: {type: number, minimum: 0, maximum: 200}
        priority: {type: string, enum: [critical, high, medium, low]}
        tags: {type: array, maxItems: 50, uniqueItems: true, items: {type: string, format: uuid}, description: Existing tag-node UUIDs in this project or workspace; stored as current tag names in ordinary node fields.tags.}
        type: {type: string, enum: [work, ticket, task, epic], default: work, description: Legacy kinds normalize to work; recurrences create leaves.}
        pill_en: {type: string, maxLength: 512, description: 'Optional English release pill; 2–4 words required before Done.'}
        pill_de: {type: string, maxLength: 512, description: 'Optional German release pill; 2–4 words required before Done.'}
        benefit_en: {type: string, maxLength: 4096, description: 'Optional English benefit; nonblank text required before Done.'}
        benefit_de: {type: string, maxLength: 4096, description: 'Optional German benefit in impersonal form; nonblank text required before Done.'}
        hide_from_release_notes: {type: boolean, default: true, description: 'Recurring routines default to hidden; explicit false includes generated tickets in release notes. Hiding does not waive the Done copy requirements.'}
      description: 'Variables in title, description, criteria and release copy: {{occurrence}}, {{date}}, {{release_name}}, {{release_version}}. Unknown variables are rejected. Release variables are empty for time and manual runs. queue_each requires positive estimate_hours and non-empty acceptance_criteria. Release copy may be incomplete in a template; generated tickets still require all four valid texts before Done.'
    RoutineDefinition:
      type: object
      additionalProperties: false
      required: [scope, owner_principal_id]
      description: 'Optional saved routine intent. Output remains RecurrenceInput.project_id/parent_id. Creation is paused, unconsented and never launches work. PUT uses the recurrence expected_revision. Scope and canonical person owner cannot be changed after creation. Consent, qualification, guardrails and budget enforcement are separate gates; these saved fields grant no execution authority.'
      properties:
        scope: {$ref: '#/components/schemas/RoutineDefinitionScope'}
        owner_principal_id: {type: string, format: uuid, description: 'Active canonical person with current output/source authority; project/workspace owners must be scope administrators.'}
        assignment: {$ref: '#/components/schemas/RoutineAssignment'}
    RoutineDefinitionScope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [project, personal, workspace]}
        project_id: {type: string, format: uuid, description: 'Required only for project scope. This visibility project is independent of the output project.'}
    RoutineAssignment:
      type: object
      additionalProperties: false
      required: [goal, role, work_kind_id, runtime_requirements]
      properties:
        goal: {type: string, minLength: 1, maxLength: 16384}
        sources:
          type: array
          maxItems: 32
          uniqueItems: true
          description: 'Distinct live tenant node IDs, readable by both the saving caller and canonical owner. Knowledge references must resolve to knowledge nodes. No URLs or remote fetches.'
          items:
            type: object
            additionalProperties: false
            required: [kind, id]
            properties:
              kind: {type: string, enum: [node, knowledge]}
              id: {type: string, format: uuid}
        role: {type: string, description: 'Existing model registry route role. No fixed model or account is granted by a definition.'}
        work_kind_id: {type: string, format: uuid, description: 'Active registry work kind in the output project or workspace.'}
        allowed_actions:
          type: array
          maxItems: 5
          uniqueItems: true
          items: {type: string, enum: [work.create, work.update, knowledge.write, pr.open, pipeline.request]}
          description: 'Closed outward action catalogue. Every eventual action still requires its ordinary authority, policy and person/pipeline gates.'
        runtime_requirements: {$ref: '#/components/schemas/RoutineRuntimeRequirements'}
        budget: {$ref: '#/components/schemas/RoutineDefinitionBudget'}
    RoutineRuntimeRequirements:
      type: object
      additionalProperties: false
      required: [needs_native_host, needs_browser, runtime_class]
      description: 'Saved requirements only; no host selection or native capability qualification occurs during save. Native host is required; browser is required exactly for native_browser.'
      properties:
        needs_native_host: {type: boolean, const: true}
        needs_browser: {type: boolean}
        runtime_class: {type: string, enum: [native_coding, native_browser]}
    RoutineDefinitionBudget:
      type: object
      additionalProperties: false
      description: 'Per-run ceiling intent, default off. Tokens/money require only their respective positive ceiling; both requires both and stops at the first exhausted dimension. Off accepts no ceilings. Stored limits are not proof of adapter availability or enforcement. Money is actual paid micro-USD, separate from subscription list-price comparisons.'
      properties:
        mode: {type: string, enum: [off, tokens, money, both], default: off}
        token_ceiling: {type: integer, minimum: 1, maximum: 1000000000000}
        money_ceiling_microusd: {type: integer, minimum: 1, maximum: 1000000000000}
    RoutineGuardScope:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, enum: [installation, tenant, project, user]}
        id: {type: string}
    RoutineGuardRule:
      type: object
      additionalProperties: false
      required: [id, checkpoint, method, result]
      properties:
        id: {type: string, maxLength: 80}
        checkpoint: {type: string, enum: [save, action, both]}
        method: {type: string, enum: [words, paths, size, template]}
        result: {type: string, enum: [allow, needs_person, block]}
        values: {type: array, maxItems: 32, items: {type: string, maxLength: 1024}}
        limit: {type: integer, minimum: 1, maximum: 131072}
        template: {type: string, enum: [protected_paths_v1, catalogue_v1, harmful_intent_v1, different_family_v1]}
        script_hash: {type: string, maxLength: 64}
    RoutineGuardLoosening:
      type: object
      required: [rule_id, actor_id, reason, expected_revision, inherited_digest, previous_digest, replacement_digest]
      properties:
        rule_id: {type: string}
        actor_id: {type: string, format: uuid}
        reason: {type: string}
        expected_revision: {type: integer}
        inherited_digest: {type: string}
        previous_digest: {type: string}
        replacement_digest: {type: string}
    RoutineGuardSource:
      type: object
      required: [scope, revision, rules, loosenings]
      properties:
        scope: {$ref: '#/components/schemas/RoutineGuardScope'}
        revision: {type: integer}
        rules: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/RoutineGuardRule'}}
        loosenings: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/RoutineGuardLoosening'}}
    RoutineGuardPolicy:
      type: object
      required: [hard_version, preset_version, digest, sources, rules]
      properties:
        hard_version: {type: string}
        preset_version: {type: string}
        digest: {type: string}
        sources: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/RoutineGuardSource'}}
        rules:
          type: array
          maxItems: 198
          items:
            type: object
            required: [rule, level, scope, version]
            properties:
              rule: {$ref: '#/components/schemas/RoutineGuardRule'}
              level: {type: string, enum: [hard, recommended, custom]}
              scope: {$ref: '#/components/schemas/RoutineGuardScope'}
              version: {type: string}
              superseded: {type: boolean}

paths:
  /audit:
    get:
      operationId: listAccessAudit
      summary: Access changes, with names resolved
      parameters:
        - {name: category, in: query, required: true, schema: {type: string, enum: [access]}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: asc}, description: Event id order; asc preserves the existing oldest-first contract}
        - {name: after, in: query, schema: {type: integer, minimum: 0}, description: Return events with id greater than this cursor; only for asc order}
        - {name: before, in: query, schema: {type: integer, minimum: 0}, description: Return events with id less than this cursor; only for desc order}
      responses:
        '200':
          description: One page of access events
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessAuditPage'}
        '403': {description: audit.read required}
components:
  schemas:
    AccessAuditEvent:
      type: object
      required: [id, type, at, actor, subject, project, data]
      properties:
        id: {type: integer}
        type: {type: string}
        at: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/PrincipalRef'}
        subject: {oneOf: [{$ref: '#/components/schemas/PrincipalRef'}, {type: 'null'}]}
        project: {oneOf: [{type: object, required: [id, key], properties: {id: {type: string, format: uuid}, key: {type: string}}}, {type: 'null'}]}
        data: {type: object}
    AccessAuditPage:
      type: object
      required: [items, next_after]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AccessAuditEvent'}}
        next_after: {type: [integer, 'null'], description: Cursor for the next asc page; null in desc order}
        next_before: {type: [integer, 'null'], description: "Cursor for the next desc page; present in desc order, null when complete"}

# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/modelregistry
paths:
  /models/lines/{harness}/{model}/pause:
    parameters:
      - {name: harness, in: path, required: true, schema: {type: string, enum: [codex, claude, pi, cursor, grok, gemini, opencode]}}
      - {name: model, in: path, required: true, schema: {type: string, maxLength: 128}}
    put:
      operationId: putModelPause
      security: [{session: []}]
      description: 'Person-only models.manage, rechecked under the tenant and catalog fences. Pauses all registered native levels of this harness/model route, including Cursor effort suffixes (up to 32 model ids). until null means until resumed; a timestamp must be in the future. Appends model.pause_changed after the mutation.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [until, reason]
              properties:
                until: {type: [string, 'null'], format: date-time}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {description: 'Saved model pause.', content: {application/json: {schema: {$ref: '#/components/schemas/ModelPauseResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteModelPause
      security: [{session: []}]
      description: 'Person-only models.manage under the tenant and catalog fences. Resumes this route at every native level and appends model.pause_changed.'
      responses:
        '200': {description: 'Resumed model route.', content: {application/json: {schema: {$ref: '#/components/schemas/ModelPauseResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /models/lines/{harness}/{model}:
    parameters:
      - {name: harness, in: path, required: true, schema: {type: string, enum: [codex, claude, pi, cursor, grok, gemini, opencode]}}
      - {name: model, in: path, required: true, description: 'URL-encoded immutable model identifier.', schema: {type: string, maxLength: 128}}
    put:
      operationId: editModelLineVersion
      description: 'Person with models.manage creates replacement immutable profiles, retires the old active profiles and transfers orders, rules and role routes atomically. The optional revision from the usage preview rejects stale edits. Discovery source is preserved. Existing runs retain their original pins.'
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelLineWrite'}}}}
      responses:
        '200': {description: 'Replacement profiles and registry revision.', content: {application/json: {schema: {type: object, required: [profiles, revision], properties: {profiles: {type: array, items: {$ref: '#/components/schemas/ModelProfile'}}, revision: {type: string}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /models/lines/{harness}/{model}/usage:
    parameters:
      - {name: harness, in: path, required: true, schema: {type: string, enum: [codex, claude, pi, cursor, grok, gemini, opencode]}}
      - {name: model, in: path, required: true, schema: {type: string, maxLength: 128}}
    get:
      operationId: previewModelLineRemoval
      description: 'Requires models.read. One read-only snapshot lists visible usages and qualified replacements using the dispatch fallback. Other people and project rules are visible only with workspace model_prefs.manage; hidden usages are reported as incomplete. No preference or retirement writes.'
      security: *auth
      responses:
        '200': {description: 'Removal preview.', content: {application/json: {schema: {$ref: '#/components/schemas/ModelLineUsage'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /models:
    get:
      operationId: listModelProfiles
      description: Catalog preparation commits separately under current read authority before the model snapshot is loaded. Denied preparation creates no profiles, routes or seed events.
      security: *auth
      responses:
        '200': {description: "Tenant model registry; optional lifecycle enrichment is null when unavailable or over budget", headers: {Aeon-Event-Position: {$ref: '#/components/headers/EventPosition'}}, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ModelCatalogProfile'}}}}}
    post:
      operationId: createModelProfile
      description: Admin creates an immutable model profile version. Routing policy is a separate ordered ladder.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelProfileWrite'}}}}
      responses:
        '201': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/ModelProfile'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /models/proposals/accept:
    post:
      operationId: acceptModelProposal
      description: Person with models.manage accepts and enables a previously observed model using its declared conservative mapping. Unmapped families require explicit person-managed profile creation. No ladder changes.
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [harness, model, effort]
              properties:
                harness: {type: string, enum: [codex, claude, pi, cursor, grok]}
                model: {type: string, maxLength: 128}
                effort: {type: string, maxLength: 32}
      responses:
        '200': {description: Accepted profile, content: {application/json: {schema: {$ref: '#/components/schemas/ModelProfile'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /models/catalog:
    get:
      tags: [Models]
      summary: "Read provider and route facts with provenance"
      description: "Public provider facts; native provider and exact-route harness fields outrank aggregators. Null values are unknown. Immutable profiles and account authority are unchanged."
      operationId: getModelCatalog
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}, description: "Opaque keyset cursor from next_cursor"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: "Bounded facts and raw provenance, grouped by provider identity and exact route"
          content:
            application/json:
              schema:
                type: object
                required: [models, next_cursor, truncated]
                properties:
                  models: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ModelCatalogEntry'}}
                  next_cursor: {type: string}
                  truncated: {type: boolean, description: "True when the evidence count or byte bound omitted facts; never a complete disappearance signal"}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /models/harness-probes/claim:
    post:
      operationId: claimModelHarnessProbes
      description: 'Agent with models.report claims at most 16 requests for its current enrolled daemon generation. Schedules due accounts using interval_minutes and consumes Check now requests. Requires ongoing pairing approval; disabled reporting returns no work. One-minute leases permit retry after interruption. Cursor is an account UUID; next_cursor is empty at the end. No model, account-health or routing grants are changed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [daemon_id, daemon_generation]
              properties:
                daemon_id: {type: string, maxLength: 128}
                daemon_generation: {type: string, maxLength: 128}
                cursor: {type: string, maxLength: 36}
      responses:
        '200':
          description: 'Bounded current probe requests'
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/ModelHarnessProbe'}}
                  next_cursor: {type: string}
        '403': {description: 'Agent reporting permission required'}
  /models/harness-probes/{accountId}:
    parameters:
      - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: reportModelHarnessProbe
      description: 'Agent with models.report publishes a claimed content-free list under tenant, tree, pairing, catalog and account fences. Rechecks the exact live key, ongoing approval, account owner, binding revision, daemon generation and request. At most 500 models and 1 MiB; exact native field paths are retained as route-specific harness facts. Missing fields stay unknown. Failed and partial lists retain last good evidence; they never prove disappearance. Explicit native levels record at most 200 advertised tuples and, when auto_add_profiles permits, new inactive profiles. Identical replay is idempotent and adds nothing; different evidence or a replaced request returns 409. No model activation, account-health or allowance changes.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, binding_revision, daemon_id, daemon_generation, state, models]
              properties:
                request_id: {type: string, format: uuid}
                binding_revision: {type: integer, minimum: 0}
                daemon_id: {type: string, maxLength: 128}
                daemon_generation: {type: string, maxLength: 128}
                state: {type: string, enum: [fresh, limited, unsupported, stale, timeout]}
                models: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/ModelHarnessCatalogModel'}}
      responses:
        '200': {description: 'Probe outcome recorded', content: {application/json: {schema: {type: object, required: [recorded, added, proposed, profiles_truncated], properties: {recorded: {type: boolean}, added: {type: integer, minimum: 0, maximum: 200, description: 'New inactive profiles inserted by this publication; zero on replay'}, proposed: {type: integer, minimum: 0, maximum: 200}, profiles_truncated: {type: boolean, description: 'The advertised tuple bound omitted profile proposals; catalog facts remain independently bounded'}}}}}}
        '400': {description: 'Invalid or oversized public facts'}
        '403': {description: 'Current agent reporting authority required'}
        '409': {description: 'Binding, generation, request or evidence changed'}
  /models/outdated:
    get:
      operationId: getOutdatedModels
      description: "Bounded keyset page of registered outdated versions, with source evidence and moving Default, Except for, fallback, lock and legacy pinned references. Hidden uses set incomplete. Daily caps remain with accounts. Revision binds retirement to this catalog and reference snapshot."
      security: *auth
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}, description: "Canonical version cursor returned by next_cursor"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200': {description: "Outdated preview", content: {application/json: {schema: {$ref: '#/components/schemas/ModelOutdatedDocument'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /models/outdated/retire:
    post:
      operationId: retireOutdatedModels
      description: "Person with models.manage retires up to fifty previewed versions atomically. Moving preferences also requires workspace model_prefs.manage and current project access. Stale previews, missing registered successor routes, selected successors and conflicting rules reject the batch. Native successor evidence precedes the same-line version rule. Historical pins, grants and daily caps remain intact."
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOutdatedRetireWrite'}}}}
      responses:
        '200': {description: "Atomic retirement and Undo token", content: {application/json: {schema: {$ref: '#/components/schemas/ModelOutdatedRetireResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /models/outdated/undo:
    post:
      operationId: undoOutdatedModels
      description: "Person with current models.manage and events.undo restores the batch using its opaque token. Moving preferences requires current model_prefs.manage and project access; another actor also needs events.undo_other. Changed references or repeated Undo return 409. Preference revisions advance monotonically."
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [undo_token]
              properties:
                undo_token: {type: string, maxLength: 84}
      responses:
        '200':
          description: "Batch restored"
          content:
            application/json:
              schema:
                type: object
                required: [event_id, restored]
                properties:
                  event_id: {type: integer, format: int64}
                  restored: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /models/refresh:
    get:
      operationId: getModelRefreshStatus
      security: *auth
      responses:
        '200': {description: 'Settings, last refresh result, pending models and observations; no credentials', content: {application/json: {schema: {$ref: '#/components/schemas/ModelRefreshStatus'}}}}
    post:
      operationId: refreshModelCatalog
      description: 'Requires models.refresh. Runs the deterministic refresh with tenant settings and vault credentials and queues up to 64 approved harness accounts for asynchronous discovery on the daemon capture loop. harness_probes_queued and harness_probes_truncated report queueing; completion and failures are visible in GET refresh harness_sources. Person-triggered checks bypass interval_minutes and share a five-minute per-tenant manual cooldown; 429 includes retry_after seconds and Retry-After. Agents and the scheduler retain interval_minutes. Vendor requests run after the reservation transaction commits, with a shared 30-second deadline, at most 5 pages and 10000 identifiers per vendor, and 200 observations/profile additions per run. Accepts no profile, route, URL or credential writes. Explicit refreshes fetch public catalogs without keys; credentialed calls and scheduled public discovery require api_enabled. Every completed run writes one audit event; outages keep the last good catalog and mark that source stale.'
      security: *auth
      responses:
        '200': {description: Refresh result, content: {application/json: {schema: {type: object, additionalProperties: true, properties: {new_lines: {type: array, maxItems: 200, items: {type: string}}, added: {type: integer, minimum: 0, description: 'Profiles inserted by this run, including disabled discoveries and one profile per effort.'}, accepted_models: {type: array, maxItems: 200, items: {type: string}, description: 'Distinct board line ids whose newer version was accepted because the line is already in use. Absent when acceptance was not established.'}}}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {description: 'Manual cooldown or agent interval; retry_after is seconds.', headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {type: object, properties: {error: {type: string}, retry_after: {type: integer, minimum: 1, maximum: 300}}}}}}
  /models/refresh/credentials/{accountId}:
    parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
    put:
      operationId: setModelDiscoveryCredential
      description: Person with models.manage stores a vendor model-list key encrypted and bound to this tenant/account. Empty key revokes it. Secrets never enter responses or audit events. Only fixed vendor model-list endpoints are used; redirects are refused.
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vendor, api_key]
              properties:
                vendor: {type: string, enum: [openai, anthropic, xai, openrouter, google]}
                api_key: {type: string, maxLength: 4096, writeOnly: true}
      responses:
        '200': {description: Credential configured or revoked; no key material}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /models/refresh/settings:
    put:
      operationId: setModelRefreshSettings
      description: 'Person with models.manage configures reporting, profile acceptance and optional API discovery. Auto-update accepts newer versions of lines used by saved orders or rules through the shared successor policy; unused and new lines remain proposals.'
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelRefreshSettingsWrite'}}}}
      responses:
        '200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/ModelRefreshSettings'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /models/reports:
    post:
      operationId: reportModelObservations
      description: Requires models.report. Every agent observation requires an available account owned by the caller on the reported harness; registering a session does not enroll an account. Health evidence also requires an active caller-owned session with the exact stored model and effort or its managed run pin; usage for another model is insufficient. Two invalid-model failures at least five minutes apart suppress routing for 24 hours independently of person overrides. Replayed report ids remain idempotent for seven days; at most 1000 receipts per principal and 200 new receipts per hour are accepted. New profiles are auto-added disabled by default and require person acceptance before dispatch; no reports reorder ladders. Unknown families are proposed for person acceptance.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/ModelObservationWrite'}}}}}
      responses:
        '200': {description: Report result, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /models/resolve:
    get:
      operationId: resolveModelRole
      description: "Resolves every role through Models orders. Migration 1333 moved saved role ladders, holds, pin-bottom and Not-allowed rules into orders, model pauses and row constraints; the retained ladder tables are not read. Nothing outside the row's order and the Default's order runs, and the Default ends in Wait. A kind without a saved row uses the Default's situations. A live dial Wait setting still stops after sibling routes of the current model until the dial follows Models. Without ticket, uses Default, situation first and the key's canonical person; ticket supplies kind, estimate, fix round and project. Quick jobs try qualifying fast models by catalog list price, then Default. Build uses the kind row or Default; build-hard uses Stuck with a strong tier floor. Review uses the kind's Review order or automatic cross-family selection at the highest native level, at least xhigh equivalent; security excludes Anthropic. Each model tries its registered routes before the next step. Workspace locks freeze the pick and order. Account approval, project, residency, tools, pauses, harness health and daily caps remain required. Unknown quota does not imply exhaustion. Exhausted orders return owner_required with the first cause and known reset in the trace; a route refused only for residency reports not allowed and the residency. A harness filter never switches harnesses. Command templates come from trusted local templates."
      security: *auth
      parameters:
        - {name: role, in: query, description: 'Required unless ticket supplies its route role. review-gate-security requires placement resolution; unavailable security ladders return owner_required with their explanation.', schema: {type: string, enum: [scout, mechanical, build, build-hard, review-gate, review-gate-security]}}
        - {name: author_family, in: query, description: "Required for review-gate and review-gate-security. Accepts openai, anthropic, xai, cursor, google or local and aliases codex → openai, claude → anthropic, grok → xai, gemini → google. pi and opencode are ambiguous; pass the model family instead.", schema: {type: string}}
        - {name: harness, in: query, schema: {type: string, enum: [codex, claude, pi, cursor, grok, gemini, opencode, media, terminal]}}
        - {name: project_id, in: query, description: Optional project for the starter's residency preference trace., schema: {type: string, format: uuid}}
        - {name: mode, in: query, description: Explicitly enable placement resolution when only role and project_id are supplied., schema: {type: string, enum: [placement]}}
        - {name: ticket, in: query, schema: {type: string, maxLength: 80}, description: Visible work item or legacy ticket or task key or UUID. Supplies placement and project; an explicit role overrides its role.}
        - {name: area, in: query, schema: {type: string, maxLength: 48}}
        - {name: situation, in: query, schema: {type: string, enum: [first, fix, stuck]}}
        - {name: fix_round, in: query, schema: {type: integer, minimum: 0, maximum: 1000}}
        - {name: estimate_hours, in: query, schema: {type: number, minimum: 0, maximum: 100000}}
        - {name: concept, in: query, schema: {type: boolean}, description: 'Explicit request for a concept or ADR; uses the Concepts column.'}
        - {name: previous_family, in: query, schema: {type: string}, description: 'Previous author family for a Stuck fallback.'}
        - {name: complexity, in: query, schema: {type: string, enum: [S, M, L]}}
        - {name: person_id, in: query, schema: {type: string, format: uuid}, description: Must map to the canonical caller or key creator. Operator keys cannot supply it.}
      responses:
        '200': {description: Resolution, content: {application/json: {schema: {$ref: '#/components/schemas/ModelResolution'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /models/routes:
    get:
      operationId: readModelRoutes
      deprecated: true
      description: "Deprecated compatibility read derived from Models rows, chains, situations and model pauses. Requires models.read, never seeds the catalog or appends events. Returns at most 50 steps; truncated means incomplete. can_edit is false and edit_token is null. Use model preferences for choices and settings/review-policy for review rules."
      security: *auth
      parameters:
        - {name: role, in: query, required: true, schema: {type: string, enum: [scout, mechanical, build, build-hard, review-gate, review-gate-security]}}
      responses:
        '200': {description: "Bounded Models-derived compatibility snapshot", content: {application/json: {schema: {$ref: '#/components/schemas/ModelRoutesRead'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {description: Statement timeout; retry later, headers: {Retry-After: {schema: {type: integer}, description: Seconds before retrying}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    put:
      operationId: replaceModelRoutes
      deprecated: true
      description: "Retired role ladder writer. Returns 410 Gone without decoding or changing settings. Use Models orders and model pauses."
      security: [{session: []}]
      parameters:
        - {name: role, in: query, schema: {type: string, enum: [scout, mechanical, build, build-hard, review-gate, review-gate-security]}}
        - {name: If-Match, in: header, description: Required in role mode; complete strong SHA-256 content token from GET. No wildcard or weak/list form., schema: {type: string, maxLength: 66}}
        - {name: order_mode, in: query, description: Only with role=review-gate. saved explicitly activates saved managed fallback priorities; legacy compensates activation. Omission preserves current mode., schema: {type: string, enum: [legacy, saved]}}
        - {name: expiry_policy, in: query, description: Allowed only with role. clear is for compensation; preserves future holds without extending them., schema: {type: string, enum: [preserve, clear], default: preserve}}
      requestBody: {required: true, content: {application/json: {schema: {type: array, maxItems: 300, items: {$ref: '#/components/schemas/ModelRoute'}}}}}
      responses:
        '410': {description: "Role ladders moved to Models orders and pauses", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '200': {description: Actual normalized stored routes for the addressed role or whole tenant, headers: {ETag: {description: New quoted strong role content token including ordinary review mode in conditional mode, schema: {type: string}}, Model-Order-Mode: {description: Actual stored ordinary review mode for role=review-gate, schema: {type: string, enum: [legacy, saved]}}}, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ModelRoute'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /models/{id}/retire:
    post:
      operationId: retireModelProfile
      security: *auth
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelRetirementWrite'}}}}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/ModelRetirement'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      operationId: restoreModelProfile
      security: *auth
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/ModelRetirement'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
components:
  schemas:
    ModelPause:
      type: object
      required: [until, reason, by, at]
      properties:
        until: {type: [string, 'null'], format: date-time}
        reason: {type: string, maxLength: 1000}
        by: {type: [string, 'null'], format: uuid}
        at: {type: string, format: date-time}
    ModelPauseResult:
      type: object
      required: [harness, model, pause]
      properties:
        harness: {type: string}
        model: {type: string}
        pause: {oneOf: [{$ref: '#/components/schemas/ModelPause'}, {type: 'null'}]}
    ModelPreferenceDecision:
      type: object
      description: Additive resolution evidence returned only when preference placement parameters are supplied.
      required: [kind, complexity, role, person_id, project_id, cell, residency, fallback, blocked, hard_rules]
      properties:
        kind:
          type: object
          required: [slug, source]
          properties: {slug: {type: string}, source: {type: string}}
        complexity:
          type: object
          required: [value, bucket, source]
          properties: {value: {type: string}, bucket: {type: string, enum: [normal, complex]}, source: {type: string}}
        role: {type: string}
        person_id: {type: [string, 'null'], format: uuid}
        project_id: {type: [string, 'null'], format: uuid}
        cell:
          type: object
          required: [set_by, selector]
          properties:
            set_by: {type: string, enum: [default, person, project]}
            locked_by: {type: string, enum: [default, person]}
            selector: {$ref: '#/components/schemas/ModelSelector'}
        residency:
          allOf:
            - {$ref: '#/components/schemas/ModelPreferenceTrace/properties/residency'}
            - type: object
              required: [ticket_requirement, qualifying_account_ids]
              properties:
                ticket_requirement: {type: string, enum: [any, eu, local]}
                qualifying_account_ids: {type: array, description: "An empty list under any residency means the role ladder was not account-filtered; it does not mean no account qualifies.", items: {type: string, format: uuid}}
        latest_resolved_to: {type: string, format: uuid}
        fallback: {type: [object, 'null'], properties: {reason: {type: string}}}
        blocked: {type: [object, 'null'], properties: {reason: {type: string}}}
        hard_rules: {type: array, items: {type: string, enum: [cross_family, security_review, review_qualification, residency]}}
    ModelHarnessProbe:
      type: object
      required: [account_id, account_key, harness, binding_revision, request_id, requested_at]
      properties:
        account_id: {type: string, format: uuid}
        account_key: {type: string}
        harness: {type: string, enum: [codex, cursor, opencode, pi, claude]}
        binding_revision: {type: integer, minimum: 0}
        request_id: {type: string, format: uuid}
        requested_at: {type: string, format: date-time}
    ModelHarnessCatalogModel:
      type: object
      additionalProperties: false
      required: [model, facts]
      properties:
        model: {type: string, maxLength: 128}
        provider: {type: string, maxLength: 64}
        effort: {type: string, maxLength: 32, description: 'Only an explicitly reported native effort; never inferred from an identifier suffix.'}
        facts:
          type: object
          maxProperties: 16
          propertyNames: {enum: [display_name, model_version, line, native_levels, default_level, successor, retirement_at, lifecycle, hidden, tools, thinking]}
          additionalProperties:
            type: object
            additionalProperties: false
            required: [value, field_path]
            properties:
              value: {description: 'Allowlisted public native scalar or native-level name array; null is unknown.'}
              field_path: {type: string, minLength: 1, maxLength: 128}
    ModelCatalogProfile:
      allOf:
        - {$ref: '#/components/schemas/ModelProfile'}
        - type: object
          properties:
            identity: {type: string, description: "Canonical provider:model identity"}
            lifecycle:
              description: "Best-effort evidence for this profile; null when calculation fails or exceeds its bounds"
              oneOf: [{$ref: '#/components/schemas/ModelCatalogLifecycle'}, {type: 'null'}]
    ModelCatalogLifecycle:
      type: object
      required: [state, date, successor, reason, source]
      properties:
        state: {type: [string, 'null'], enum: [active, preview, superseded, deprecated, retiring, vanished, null], description: "Null means no lifecycle evidence was reported"}
        date: {type: [string, 'null'], format: date-time}
        successor: {type: [string, 'null'], description: "Canonical provider:model identity, or null when unknown"}
        reason: {type: string}
        source: {type: string, description: "Evidence source or the named SQL version rule"}
    ModelOutdatedUse:
      type: object
      required: [label, who, from, to]
      properties:
        label: {type: string}
        who: {type: string, description: "Default or the person who owns or set the reference"}
        from: {type: string}
        to: {type: [string, 'null']}
    ModelOutdatedVersion:
      allOf:
        - {$ref: '#/components/schemas/ModelCatalogLifecycle'}
        - type: object
          required: [version, line, uses, incomplete]
          properties:
            version: {type: string, description: "Canonical provider:model identity used in versions[]"}
            line: {type: string}
            uses: {type: array, items: {$ref: '#/components/schemas/ModelOutdatedUse'}}
            incomplete: {type: boolean}
    ModelOutdatedDocument:
      type: object
      required: [versions, revision, next_cursor, incomplete]
      properties:
        versions: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ModelOutdatedVersion'}}
        revision: {type: string, minLength: 64, maxLength: 64}
        next_cursor: {type: string}
        incomplete: {type: boolean}
    ModelOutdatedRetireWrite:
      type: object
      additionalProperties: false
      required: [versions, revision]
      properties:
        versions: {type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: {type: string, maxLength: 193}}
        revision: {type: string, minLength: 64, maxLength: 64}
    ModelOutdatedRetireResult:
      type: object
      required: [moved, removed, undo_token]
      properties:
        moved: {type: array, items: {$ref: '#/components/schemas/ModelOutdatedUse'}}
        removed: {type: array, maxItems: 50, items: {type: string}}
        undo_token: {type: string, maxLength: 84}
    ModelCatalogFact:
      type: object
      required: [provider, model_id, route, fact, value, source, source_kind, field_path, fetched_at]
      properties:
        provider: {type: string}
        model_id: {type: string}
        route: {type: string, description: "Empty for provider-wide evidence; otherwise the exact harness or API launch route"}
        fact: {type: string}
        value: {description: "Source value verbatim, or null for an unknown fact; an empty array is a known empty list"}
        source: {type: string, description: "Fixed public source URL or content-free harness source; empty when no evidence exists"}
        source_kind: {type: string, enum: ['', bootstrap, aggregator, native, harness]}
        field_path: {type: string}
        fetched_at: {type: string, format: date-time}
    ModelCatalogEntry:
      type: object
      required: [identity, provider, model_id, facts, routes, evidence, truncated]
      properties:
        identity: {type: string, description: "Provider and canonical model ID shared across routes"}
        provider: {type: string}
        model_id: {type: string}
        lifecycle: {$ref: '#/components/schemas/ModelCatalogLifecycle'}
        facts: {type: object, additionalProperties: {$ref: '#/components/schemas/ModelCatalogFact'}}
        routes:
          type: array
          items:
            type: object
            required: [route, facts]
            properties:
              route: {type: string}
              facts: {type: object, additionalProperties: {$ref: '#/components/schemas/ModelCatalogFact'}}
        evidence: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/ModelCatalogFact'}}
        truncated: {type: boolean}
    ModelRefreshSettings:
      type: object
      additionalProperties: false
      required: [agent_reports_enabled, auto_add_profiles, api_enabled, interval_minutes]
      properties:
        agent_reports_enabled: {type: boolean, default: true}
        auto_add_profiles: {type: boolean, default: true}
        api_enabled: {type: boolean, default: false, description: "Enables credentialed native discovery and scheduled public catalog fetches. Explicit refreshes can fetch public catalogs without keys. Disabled by default; startup and interval workers remain offline."}
        interval_minutes: {type: integer, minimum: 60, maximum: 43200, default: 1440}
    ModelRefreshSettingsWrite:
      type: object
      additionalProperties: false
      required: [agent_reports_enabled, auto_add_profiles, api_enabled, interval_minutes]
      properties:
        agent_reports_enabled: {type: boolean, default: true}
        auto_add_profiles: {type: boolean, default: true}
        api_enabled: {type: boolean, default: false, description: "Enables credentialed native discovery and scheduled public catalog fetches. Explicit refreshes can fetch public catalogs without keys. Disabled by default; startup and interval workers remain offline."}
        interval_minutes: {type: integer, minimum: 60, maximum: 43200, default: 1440}
        account_use_revision: {type: integer, minimum: 1, description: "Required when changing auto_add_profiles. Person account.use.manage is rechecked under tenant, catalog and matrix fences; stale revision returns 409."}
    ModelRefreshStatus:
      type: object
      required: [settings, sources, observations, last_result]
      properties:
        settings: {$ref: '#/components/schemas/ModelRefreshSettings'}
        last_run_at: {type: [string, 'null'], format: date-time}
        last_result: {type: object, additionalProperties: true}
        sources: {type: array, items: {type: object, required: [account_id, vendor], properties: {account_id: {type: string, format: uuid}, vendor: {type: string, enum: [openai, anthropic, xai, openrouter, google]}}}}
        harness_sources:
          type: array
          maxItems: 64
          items:
            type: object
            required: [account_id, harness, requested_at, completed_at, state, seen]
            properties:
              account_id: {type: string, format: uuid}
              harness: {type: string}
              requested_at: {type: string, format: date-time}
              completed_at: {type: [string, 'null'], format: date-time}
              state: {type: string, enum: [pending, probing, fresh, limited, unsupported, stale, timeout]}
              seen: {type: integer, minimum: 0}
        harness_sources_truncated: {type: boolean}
        public_sources: {type: array, items: {type: string, enum: [openrouter, modelsdev, litellm]}, description: "Keyless sources available to explicit refreshes; scheduled fetches require api_enabled and use the existing bounded refresh interval"}
        observations: {type: array, items: {type: object, additionalProperties: true}}
    ModelResolution:
      type: object
      required: [role, ladder, owner_required, source]
      properties:
        role: {type: string}
        author_family: {type: string, enum: ['', openai, anthropic, xai, cursor, google, local], description: Normalised author family used for exclusion; empty when none was supplied.}
        profile: {oneOf: [{$ref: '#/components/schemas/ModelProfile'}, {type: 'null'}]}
        ladder: {type: array, items: {type: object, required: [profile_id, selected, skip_reasons], properties: {stage: {type: string, enum: [column, default, role]}, profile_id: {type: string, format: uuid}, selected: {type: boolean}, skip_reasons: {type: array, items: {type: string}}}}}
        preview: {type: boolean, description: "Catalog-only choice when no harness accounts exist; never executable."}
        command_template: {type: string}
        owner_required: {type: boolean}
        source: {type: string, enum: [aeon]}
        trace: {$ref: '#/components/schemas/ModelPreferenceTrace'}
        residency: {type: string, enum: [any, eu, local], description: Present for placement-aware resolution.}
        preference: {$ref: '#/components/schemas/ModelPreferenceDecision'}
    ModelRetirement:
      type: object
      required: [profile_id, retired]
      properties:
        profile_id: {type: string, format: uuid}
        retired: {type: boolean}
        reason: {type: string, maxLength: 200}
        retire_at: {type: [string, 'null'], format: date-time}
    ModelRetirementWrite:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 200}
        retire_at: {type: string, format: date-time, description: 'Optional future retirement time. Until then the profile remains eligible. DELETE cancels the schedule or restores the profile.'}
    ModelLineWrite:
      type: object
      additionalProperties: false
      required: [display_name, note, efforts, route]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 128}
        note: {type: string, maxLength: 80}
        efforts: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 32}, description: 'Native effort names, lowest first.'}
        route: {type: string, minLength: 1, maxLength: 32, description: 'Provider route matching the harness and model namespace; for example OpenRouter for pi openrouter/vendor/model.'}
        model: {type: string, minLength: 1, maxLength: 128}
        revision: {type: string, maxLength: 64}
    ModelLineUsage:
      type: object
      required: [used_by, replacement, revision, incomplete, line_profiles]
      properties:
        used_by:
          type: array
          maxItems: 256
          items:
            type: object
            required: [column, layer, replacement]
            properties:
              column: {type: string}
              layer: {type: string, enum: [default, person, workspace, project]}
              person: {type: string, format: uuid}
              replacement: {$ref: '#/components/schemas/ModelSimplePick'}
        replacement: {$ref: '#/components/schemas/ModelSimplePick'}
        revision: {type: string}
        incomplete: {type: boolean}
        line_profiles: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/ModelProfile'}, description: 'Active profiles of this line, read in the same transaction as revision.'}
    ModelRoute:
      type: object
      required: [role, priority, profile_id, state]
      properties:
        role: {type: string, enum: [scout, mechanical, build, build-hard, review-gate, review-gate-security]}
        priority: {type: integer, minimum: 1, maximum: 2147483647}
        profile_id: {type: string, format: uuid}
        state: {type: string, enum: [available, unavailable, conserved, budget_limited]}
        reason: {type: string}
        valid_until: {type: [string, 'null'], format: date-time}
    ModelRoutesRead:
      type: object
      required: [role, steps, routes, edit_token, can_edit, setup, truncated, dispatch_family_order, review_floors]
      properties:
        role: {type: string, enum: [scout, mechanical, build, build-hard, review-gate, review-gate-security]}
        routes: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ModelRoute'}, description: Stored rows matching steps; conditional PUT sends this complete array.}
        edit_token: {type: [string, 'null'], description: Quoted SHA-256 content token; null when truncated. Time passing alone never changes it.}
        can_edit: {type: boolean, description: Person with models.manage and a complete initialized snapshot; source authorization still checked on save.}
        steps:
          type: array
          maxItems: 50
          items:
            allOf:
              - {$ref: '#/components/schemas/ModelRoute'}
              - type: object
                required: [profile]
                properties:
                  profile: {$ref: '#/components/schemas/ModelProfile'}
        setup: {type: boolean, description: Whether the tenant has any model profiles; false means the registry has not been set up.}
        truncated: {type: boolean, description: More than 50 steps exist for this role; the omitted steps still apply.}
        order_mode: {type: string, enum: [legacy, saved], description: Present for review-gate; absent metadata means legacy. Included in the complete token.}
        managed_fallback_order: {type: array, maxItems: 50, items: {type: string, format: uuid}, description: Present for review-gate. Applied fallback order of the displayed profiles before qualification and model preferences; incomplete when truncated.}
        dispatch_family_order: {type: array, items: {type: string}, description: 'Built-in family order used only by legacy ordinary review dispatch.'}
        review_floors: {type: array, items: {type: string}, description: Existing review constraints in words; not new enforcement.}

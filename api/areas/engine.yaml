# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/engineadmission
paths:
  /engine/admission:
    post:
      summary: Evaluate shadow admission without starting or reserving work
      description: "Requires engine.admission and agents.plan.read, plus account.read for people or explicit account.overview.read for agents when capacity is evaluated. The live person's plan, two-slot first-build finishing reserve, work PR WIP ceiling, fresh host signals, account capacity floors and the daily ceiling decide. Exhausted daily headroom denies with daily_limit; missing, malformed, redacted, future or older-than-two-minute daily evidence denies with daily_limit_unknown. Resolve an allowed ladder successor through /models/resolve, then evaluate that harness with a new request ID. Missing inputs deny. Every successful evaluation is an event. The result grants no launch, claim, merge or deployment authority."
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineAdmissionRequest'
      responses:
        '200':
          description: "Durable advisory decision; enforced is always false."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineAdmissionDecision'
        '400':
          description: "Invalid or oversized input."
        '403':
          description: "Missing explicit authority or live person owner."
        '404':
          description: "Project not visible or not found."
        '409':
          description: "Request ID was reused with different input."
        '503':
          description: "Decision could not be durably recorded."
components:
  schemas:
    EngineAdmissionDecision:
      type: object
      additionalProperties: false
      required: [request_id, project_id, allowed, reason, retry_after, mode, enforced, script_agrees, evaluated_at]
      properties:
        request_id:
          type: string
        project_id:
          type: string
          format: uuid
        allowed:
          type: boolean
          description: "Advisory result only. A shadow allow neither reserves a slot nor authorizes a start."
        reason:
          type: string
          description: "Stable reason code, with no private account or host measurements. daily_limit means measured daily exhaustion; daily_limit_unknown means daily evidence cannot authorize a start."
        retry_after:
          type: [integer, 'null']
          minimum: 1
          description: "Advisory seconds before reevaluation with a new request ID; null for allowed or configuration waits."
        mode:
          type: string
          enum: [off, shadow]
        enforced:
          type: boolean
          const: false
        script_agrees:
          type: [boolean, 'null']
          description: "Whether the supplied script decision equals the advisory result. Null when no comparison was supplied or the project switch is off."
        evaluated_at:
          type: string
          format: date-time
    EngineAdmissionRequest:
      type: object
      additionalProperties: false
      required: [kind, project, estimate]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: "Optional idempotency identity scoped to the caller and tenant. A replay returns the original decision; use a new ID to evaluate again. Generated when omitted."
        kind:
          type: string
          enum: [first_build, fix, merge, land, review]
        harness:
          type: string
          enum: [claude, codex, cursor, gemini, grok, opencode, pi]
          description: "Routed harness. Omission returns harness_required until a client has resolved routing."
        project:
          type: string
          minLength: 1
          maxLength: 64
          description: "Visible project UUID or unambiguous project key."
        estimate:
          type: number
          exclusiveMinimum: 0
          maximum: 168
          description: "Estimated agent hours. Measured account burn, where known, increases the required quota hold."
        script_allowed:
          type: boolean
          description: "Optional prototype decision for comparison only; never authority."

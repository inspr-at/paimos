      required: [items, next_after]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AccountReadiness'}}
        next_after: {type: [string, 'null'], format: uuid}
    AccountResidencyEvidence:
      type: object
      additionalProperties: false
      required: [model_profile_ids, inference_countries, storage_countries, log_countries, local_execution, verified_at, expires_at, proof_ref]
      description: Host attestation, not an automated compliance certification. Country sets use uppercase ISO 3166-1 alpha-2 codes. EU and local require all three nonempty sets to contain only EU member countries; local additionally requires explicit operator-local execution. Both classes require a covered profile, a proof reference, verified_at no later than now and expires_at strictly after now. The validity interval from verified_at to expires_at must be positive and at most 400 days. Optional retention and training declarations are recorded without changing the residency class.
      properties:
        model_profile_ids: {type: array, minItems: 1, maxItems: 256, uniqueItems: true, items: {type: string, format: uuid}}
        inference_countries: {type: array, maxItems: 249, uniqueItems: true, items: {type: string, pattern: '^[A-Z]{2}$'}}
        storage_countries: {type: array, maxItems: 249, uniqueItems: true, items: {type: string, pattern: '^[A-Z]{2}$'}}
        log_countries: {type: array, maxItems: 249, uniqueItems: true, items: {type: string, pattern: '^[A-Z]{2}$'}}
        local_execution: {type: boolean}
        retention_days: {type: [integer, 'null'], minimum: 0, maximum: 36500}
        training_opt_out: {type: [boolean, 'null']}
        verified_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        proof_ref: {type: string, minLength: 1, maxLength: 1024, description: Opaque reference to proof documents; never credentials or signed access URLs.}

      required: [label, plan, host_label, allowed_model_profile_ids]
      properties:
        billing_mode: {type: string, enum: [unknown, api, subscription], description: 'Person with account.manage only. Omission preserves the saved value; unknown is the initial value. Never inferred from the account label or plan name.'}
        label: {type: string, minLength: 1, maxLength: 128}
        plan: {type: string, maxLength: 128}
        host_label: {type: string, maxLength: 128}
        allowed_model_profile_ids: {type: array, maxItems: 256, uniqueItems: true, items: {type: string, format: uuid}}
    AgentAccountWrite:
      type: object
      required: [account_key, harness, daemon_id, label]
      properties:
        account_key: {type: string, minLength: 1, maxLength: 128}
        harness: {type: string, enum: [codex, claude, pi, cursor, grok, gemini, opencode]}
        daemon_id: {type: string, minLength: 1, maxLength: 128}
        label: {type: string, minLength: 1, maxLength: 128}
        max_parallel_runs: {type: integer, minimum: 1}
    AllowanceWindow:
      allOf:
        - type: object
          required: [starts_at, ends_at, unit, allowance, pace_model]
          properties:
            starts_at: {type: string, format: date-time}
            ends_at: {type: string, format: date-time}
            unit: {type: string, enum: [requests, tokens, cost_micros, percent]}
            allowance: {type: integer, format: int64, minimum: 1}
            pace_model: {type: string, enum: [steady, frontload, unrestricted]}
            burst_ratio: {type: number, minimum: 0, maximum: 1}
        - type: object
          required: [id, account_id, used, reserved, provisional]
          properties:
            id: {type: string, format: uuid}
            account_id: {type: string, format: uuid}
            used: {type: integer, format: int64}
            reserved: {type: integer, format: int64}
            provisional: {type: boolean, description: "True when this window has no measured usage for its unit, or at least one settled reservation lacked measured usage. Zero-valued legacy telemetry is treated as unknown."}
            set_by_you: {type: boolean, description: 'True for a manual window set by a person (the old Settings form, pairing or the CLI), which caps on top of readings. Absent for windows read from the vendor. Removed windows are not listed.'}
    AllowanceWindowWrite:
      type: object
      required: [starts_at, ends_at, unit, allowance, pace_model]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        unit: {type: string, enum: [requests, tokens, cost_micros]}
        allowance: {type: integer, format: int64, minimum: 1}
        pace_model: {type: string, enum: [steady, frontload, unrestricted]}
        burst_ratio: {type: number, minimum: 0, maximum: 1, default: 0.1}
    CapacityBudget:
      type: object
      additionalProperties: false
      required: [currency, source, read_at, key_usage_usd]
      properties:
        currency: {type: string, const: USD}
        source: {type: string, const: agentd}
        read_at: {type: string, format: date-time}
        key_usage_usd: {type: number, minimum: 0, maximum: 1000000000000}
        key_limit_usd: {type: [number, 'null'], minimum: 0, maximum: 1000000000000}
        key_remaining_usd: {type: [number, 'null'], minimum: 0, maximum: 1000000000000}
        balance_usd: {type: [number, 'null'], minimum: 0, maximum: 1000000000000, description: "Account balance when /credits accepts this key; null means unknown."}
    CapacityEvidence:
      type: object
      additionalProperties: false
      required: [kind, samples]
      properties:
        kind: {type: string, enum: [runs, tokens, limit_hits, drift]}
        samples: {type: integer, minimum: 1}
    CapacityLearning:
      type: object
      description: Tenant-local observations only. Suggestions never change a schedule without a person saving it. No paths or vendor text.
      required: [windows, tokens, cost_micros, runs, limit_hits]
      properties:
        tokens: {type: integer, minimum: 0, description: "Observed managed and token-only session consumption in the current known cycle, or since observation began."}
        cost_micros: {type: integer, minimum: 0}
        runs: {type: integer, minimum: 0}
        limit_hits: {type: integer, minimum: 0}
        presence_until: {type: string, format: date-time}
        away_suggested: {type: boolean}
        sleeps_at_night: {type: boolean}
        suggested_hours:
          type: object
          required: [start, end, days]
          properties:
            start: {type: number, minimum: 0, maximum: 23.5}
            end: {type: number, minimum: 0.5, maximum: 24}
            days: {type: integer, minimum: 5}
        correction:
          type: object
          required: [points, at]
          properties:
            points: {type: number, description: Positive means the estimate was too optimistic.}
            at: {type: string, format: date-time}
        windows:
          type: array
          items:
            type: object
            required: [window_kind, bucket, run_count, work_days]
            properties:
              window_kind: {type: string, enum: [5h, weekly, monthly, other]}
              bucket: {type: string}
              run_count: {type: integer, minimum: 0}
              run_percent: {type: number, minimum: 0, maximum: 100}
              hold_percent: {type: number, minimum: 1, maximum: 25}
              plus_minus: {type: number, minimum: 0}
              percent_per_million_tokens: {type: number, minimum: 0}
              percent_per_hour: {type: number, minimum: 0}
              auto_reserve_percent: {type: number, minimum: 10, maximum: 60}
              work_days: {type: integer, minimum: 0}
    CapacityNext:
      type: object
      required: [harness, accounts, parallel_runs]
      properties:
        harness: {type: string}
        parallel_runs: {type: integer, minimum: 0}
        wait: {$ref: '#/components/schemas/CapacityWait'}
        accounts:
          type: array
          items:
            allOf:
              - {$ref: '#/components/schemas/CapacityRouting'}
              - type: object
                required: [account_id, account_label, daemon_id, harness]
                properties:
                  account_id: {type: string, format: uuid}
                  account_label: {type: string}
                  daemon_id: {type: string}
                  harness: {type: string}
    CapacityPacing:
      type: object
      required: [usable_hours, percent_per_hour, suggested_today_percent]
      properties:
        usable_hours: {type: number}
        percent_per_hour: {type: number}
        suggested_today_percent: {type: number, description: Remaining share of the current schedule day}
        available_now_percent: {type: number, description: 'Enforced remaining allowance in the active schedule band: min(paced share, remaining - reserve_effective_percent). Zero outside work bands unless Sprint or Away is active.'}
        budget_percent: {type: number}
        used_today_percent: {type: number, description: Observed usage since the schedule boundary when usage_today_known is true; otherwise since the first sample available in the period}
        tonight_percent: {type: number}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        finish: {type: string, format: date-time}
        allow_off: {type: boolean}
        unused: {type: boolean}
        ahead: {type: boolean}
        reserve_percent: {type: number, description: 'Keep for you level R for this window: auto (30 until learned), the fixed share, or 0 when off.'}
        reserve_effective_percent: {type: number, description: 'R_eff now: what agents leave the person of this window. 0 under Sprint, Away and Run now once, and when no work hours remain before the reset.'}
        drift_percent: {type: number, minimum: 0, description: Pessimistic usage since an aging reading; already subtracted from available_now_percent.}
        would_expire_percent: {type: number, minimum: 0, description: Remaining capacity the learned throughput cannot consume in scheduled hours.}
        reserve_until: {type: string, format: date-time, description: 'End of the person''s last work band before the reset, after which the reserve is gone. Absent when reserve_effective_percent is 0.'}
    CapacityRate:
      description: Off (0), full (1), or adjustable reduced pace (0.1 to 0.9).
      anyOf:
        - {type: number, enum: [0, 1]}
        - {type: number, minimum: 0.1, maximum: 0.9}
    CapacityReading:
      type: object
      additionalProperties: false
      required: [window_kind, window_minutes, used_percent, resets_at, source, read_at]
      properties:
        window_kind: {type: string, enum: [5h, weekly, monthly, other]}
        bucket: {type: string, maxLength: 64, description: 'Vendor bucket, e.g. codex or seven_day_opus; empty means general quota'}
        window_minutes: {type: integer, minimum: 1, maximum: 527040}
        used_percent: {type: number, minimum: 0, maximum: 100}
        resets_at: {type: string, format: date-time}
        plan: {type: string, maxLength: 128}
        source: {type: string, enum: [harness, agentd, estimate]}
        read_at: {type: string, format: date-time}
        ordinary_usage_allowed: {type: boolean, description: Vendor authority; false forbids dispatch even when percent remains}
        run_id: {type: string, format: uuid}
        phase: {type: string, enum: [start, update, end]}
        plus_minus: {type: number, minimum: 0, maximum: 100, description: Uncertainty in percentage points; display only at three points or more.}
        evidence: {$ref: '#/components/schemas/CapacityEvidence'}
    CapacityRouting:
      type: object
      required: [rank, available_slots]
      properties:
        rank: {type: integer, minimum: 0, description: One-based server order within the harness; zero means currently ineligible.}
        available_slots: {type: integer, minimum: 0, description: Additional runs that fit all windows and the concurrency limit right now.}
        resets_at: {type: string, format: date-time, description: Soonest current weekly or monthly reset; falls back to a shorter window only when no long window exists.}
        cap_percent: {type: number, minimum: 0, description: Smallest normalized available cap across all binding windows.}
        same_quota_as: {type: string, format: uuid, description: Set on an extra door of a quota whose slots are already counted on another account.}
        wait: {$ref: '#/components/schemas/CapacityWait'}
    CapacitySchedule:
      type: object
      additionalProperties: false
      required: [timezone, week, off_days, nights, model, night, shifts, blocks]
      properties:
        timezone: {type: string, description: IANA timezone; defaults to the person profile timezone}
        override_until: {type: string, format: date-time, description: 'Sprint expires at this reset, populated by the server from the earliest current reset in scope. Away requires it (its date); Hold may carry it (a dated hold). The override ends at this instant.'}
        override: {type: string, enum: ["", sprint, hold, away], description: 'Sprint uses remaining quota until reset; Hold prevents measured-capacity routing; Away (user scope) is a Sprint bounded by override_until, across resets, with no reserve. Manual windows and the Advanced limit still cap on top.'}
        reserve: {type: string, enum: ["", auto, fixed, off], description: 'Keep for you (AEON-375): how much of every window agents leave the person while they work, shrinking as a reset comes close (R_eff = R x min(1, H_you/H_ref)). Omitted or empty inherits the next scope up; on the user scope it means auto (30% until learned). off reproduces release 11 pacing.'}
        reserve_percent: {type: number, minimum: 10, maximum: 80, multipleOf: 5, description: The fixed reserve level R; present only with reserve fixed.}
        week:
          type: array
          minItems: 7
          maxItems: 7
          description: Monday first; at least one day on. Local hours use a half-hour grid.
          items:
            type: object
            additionalProperties: false
            required: [on, start, end]
            properties:
              on: {type: boolean}
              start: {type: number, minimum: 0, maximum: 23.5, multipleOf: 0.5}
              end: {type: number, minimum: 0.5, maximum: 24, multipleOf: 0.5}
        off_days: {type: string, enum: [rest, expire, normal], default: expire}
        nights: {type: boolean, default: false}
        model: {type: string, enum: [daynight, shifts, blocks], default: daynight}
        night:
          type: object
          additionalProperties: false
          required: [start, end, k]
          properties:
            start: {type: number, minimum: 0, maximum: 23.5, multipleOf: 0.5}
            end: {type: number, minimum: 0, maximum: 23.5, multipleOf: 0.5}
            k: {type: number, minimum: 0.1, maximum: 1}
        shifts:
          type: object
          additionalProperties: false
          required: [early, late, night, k]
          properties:
            early: {type: number, minimum: 0, maximum: 23.5, multipleOf: 0.5}
            late: {type: number, minimum: 0, maximum: 23.5, multipleOf: 0.5}
            night: {type: number, minimum: 0, maximum: 23.5, multipleOf: 0.5}
            k: {type: array, minItems: 3, maxItems: 3, items: {$ref: '#/components/schemas/CapacityRate'}}
        blocks: {type: array, minItems: 24, maxItems: 24, items: {$ref: '#/components/schemas/CapacityRate'}}
    CapacityScheduleOverride:
      type: object
      additionalProperties: false
      required: [scope, schedule]
      properties:
        scope: {type: string, enum: [user, pool, account, group]}
        pool: {type: string, enum: [codex, claude, pi, cursor, grok, gemini, opencode]}
        account_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid, description: Set when scope is group. The schedule sits between the account and the vendor pool.}
        schedule:
          anyOf:
            - {$ref: '#/components/schemas/CapacitySchedule'}
            - {type: 'null'}
        carry_overrides: {type: boolean, description: 'PUT with scope user only. In one transaction, pool and account entries that only carry Sprint/Hold on top of the previous person schedule follow the new schedule (ended overrides are removed); deliberate pool or account schedules stay.'}
    OpenRouterCredits:
      type: object
      additionalProperties: false
      required: [observed_at]
      description: Safe local GET /api/v1/key projection. Missing amounts are unknown; these are dollar credits, not a renewable capacity window.
      properties:
        observed_at: {type: string, format: date-time}
        usage: {type: [number, 'null'], minimum: 0}
        limit: {type: [number, 'null'], minimum: 0}
        remaining: {type: [number, 'null'], minimum: 0}
    QuotaWarningSession:
      type: object
      required: [session_id, project_id, account_id, availability, details_redacted]
      properties:
        session_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        availability: {type: string, const: limited}
        details_redacted: {type: boolean}
        severity: {type: string, enum: [early, urgent]}
        remaining_percent: {type: number, minimum: 0, maximum: 50}
        threshold_percent: {type: integer, minimum: 1, maximum: 50}
        window_key: {type: string, maxLength: 128}
        resets_at: {type: [string, 'null'], format: date-time}
    ReadinessCheckResult:
      type: string
      description: Identity mismatch blocks work and is distinct from confirmed sign-out (authentication_failed). Timeout, protocol and launch_failed are measurement failures; they do not establish sign-out or clear an earlier identity failure.
      enum: [success, unsupported, timeout, protocol, launch_failed, identity_mismatch, authentication_failed]
    ReadinessFact:
      allOf:
        - {$ref: '#/components/schemas/ReadinessFactFields'}
        - type: object
          properties:
            reading_error: {$ref: '#/components/schemas/ReadinessCheckResult'}
            reading_age_seconds: {type: [integer, 'null'], minimum: 0}
            backoff_step: {type: integer, minimum: 0, maximum: 3}
            next_attempt_at: {type: [string, 'null'], format: date-time}
            wait_id: {type: [string, 'null'], format: uuid}
            early_recovery_used: {type: boolean}
            failure_count: {type: integer, minimum: 0}
            check_next_attempt_at: {type: [string, "null"], format: date-time}
    ReadinessFactFields:
      type: object
      required: [resource_id, window_key, source, observed_at, credit_state]
      properties:
        resource_id: {type: string, format: uuid, description: Must already be a current resource membership; daemon reports cannot invent shared identities.}
        window_key: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
        source: {type: string, enum: [agentd, harness, provider]}
        observed_at: {type: string, format: date-time, description: Observation of this fact. A null check cannot move the retained hard stop's evidence time or postpone acceptance of a newer same-window room reading.}
        resets_at: {type: [string, 'null'], format: date-time}
        reading_at: {type: [string, 'null'], format: date-time}
        used_percent: {type: [number, 'null'], minimum: 0, maximum: 100}
        credit_state: {type: string, enum: [unknown, available, exhausted], default: unknown}
        remaining: {type: [number, 'null'], minimum: 0, description: Measured remaining amount for this resource. A declared zero key cap is exhausted even if the provider omits remaining; a null key cap does not describe total balance.}
        stop_kind: {type: string, enum: [none, named_reset, unnamed, money_402], default: none}
        denial_reason: {type: string, enum: ['', vendor_denied, quota_exhausted, key_cap_exhausted, money_exhausted]}
    ReadinessFactWrite:
      allOf: [{$ref: "#/components/schemas/ReadinessFactFields"}]
      unevaluatedProperties: false
    ReadinessReport:
      type: object
      additionalProperties: false
      required: [binding_revision, result]
      description: Automatic reports without check_id may replay durable observations older than 24 hours while their binding and resource membership remain current. Original observation and reading times are preserved; replay does not renew freshness or replace newer facts. Manual reports retain the 24-hour observation bound and their check generation and expiry fences.
      properties:
        check_id: {type: string, format: uuid, description: Omitted for automatic captures including daemon restart; a supplied check ID remains fenced to its original generation and expiry.}
        binding_revision: {type: integer, minimum: 0}
        result: {$ref: '#/components/schemas/ReadinessCheckResult'}
        facts: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ReadinessFactWrite'}}
    ReadinessResource:
      type: object
      required: [id, kind, binding_revision]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [subscription_quota, key_cap, shared_balance, endpoint_concurrency]}
        binding_revision: {type: integer, minimum: 0}
    StatuslineConsent:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
        plan: {type: string, maxLength: 240, readOnly: true}

    AccountContextLabel:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}

        state: {type: string, enum: [available, draining, unavailable]}
        billing_mode: {type: string, enum: [unknown, subscription, api]}
        usage_policy: {$ref: '#/components/schemas/AccountUsagePolicy'}
        windows: {type: array, maxItems: 4096, items: {$ref: '#/components/schemas/AccountOverviewWindow'}}
        schedule: {$ref: '#/components/schemas/CapacitySchedule'}
        limit: {$ref: '#/components/schemas/AccountLimitRule'}

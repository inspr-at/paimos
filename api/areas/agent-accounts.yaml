        state: {type: string, enum: [ready, unknown, blocked]}
        can_try: {type: boolean, description: Advisory; reserve and claim recheck all model/project gates.}
        reason_codes: {type: array, items: {type: string}, description: Stable ordered reasons; usage_unknown_reserve_not_enforceable never means Ready. Unshared peers receive only available/unavailable.}
        display_reason: {type: string}
        checked_at: {type: [string, 'null'], format: date-time}
        next_attempt_at: {type: [string, 'null'], format: date-time}
        check_result: {allOf: [{$ref: "#/components/schemas/ReadinessCheckResult"}], description: The account owner and registering daemon may see their own capture result even when pooled quota measurements remain withheld.}
        measured_usage: {type: [array, 'null'], maxItems: 32, items: {$ref: '#/components/schemas/ReadinessFact'}}
        details_redacted: {type: boolean}

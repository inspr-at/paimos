# SPDX-License-Identifier: AGPL-3.0-only
paths:
  /agent-accounts:
    get:
      operationId: listAgentAccounts
      description: Opaque local accounts. Details require ownership or owner sharing; otherwise allowance windows are empty and quota fields are masked. include_checks is enrolling-daemon-only and adds pending revision/generation-bound checks and resource memberships. No credential material.
      parameters: [{name: include_checks, in: query, schema: {type: boolean, default: false}}]
      security: [{session: []}]
      responses:
        '200': {description: Accounts, headers: {Aeon-Event-Position: {$ref: '#/components/headers/EventPosition'}}, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AgentAccount'}}}}}
    post:
      operationId: registerAgentAccount
      description: An authenticated daemon with account.manage scope registers an opaque local account key. AEON records the registering agent principal and never accepts credential material.
      security: [{agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccountWrite'}}}}
      responses:
        '201': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /agent-accounts/boost:
    put:
      operationId: putAccountBoost
      summary: Set Boost today on the person's accounts
      description: "Person account.manage and canonical owner only. Atomically writes every current canonical-owned account inside the mutation fence. The body lists exactly the privacy-visible owned accounts, with the policy and binding revisions captured on screen. Accounts withheld by owner-sharing are updated from the locked row's stored revision, omitted from accounts, and reported only as withheld_count. Boost adds N/100 to pacing, never to vendor allowance; hard floors, Hold and safety guards still apply. Ends at 23:59 in the supplied IANA local timezone, computed by the server clock. Zero clears it. At most 1024 accounts and a five-second deadline."
      tags: [agent-accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [boost_percent, timezone, accounts]
              properties:
                boost_percent: {type: integer, enum: [0, 10, 20, 30]}
                timezone: {type: string, minLength: 1, maxLength: 128}
                accounts:
                  type: array
                  minItems: 0
                  maxItems: 1024
                  items:
                    type: object
                    additionalProperties: false
                    required: [account_id, revision, binding_revision]
                    properties:
                      account_id: {type: string, format: uuid}
                      revision: {type: integer, minimum: 0}
                      binding_revision: {type: integer, minimum: 0}
      responses:
        '200':
          description: "Visible owned account policies. Withheld owned accounts are saved and omitted."
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts: {type: array, items: {$ref: '#/components/schemas/AccountUsagePolicy'}}
                  withheld_count: {type: integer, minimum: 0, description: "Canonical-owned accounts updated from their stored revisions because owner-sharing withheld them. Omitted when zero."}
                  withheld_boost_until: {type: [string, 'null'], format: date-time, description: "Shared expiry of a nonzero withheld boost. Absent when withheld_count is zero or the boost is cleared."}
        '400': {description: "Invalid boost, timezone or account list."}
        '403': {description: "Current person owner and account.manage required."}
        '409': {description: "Visible account list, policy or binding changed; reload before retrying."}
  /agent-accounts/capacity:
    get:
      operationId: listAccountCapacity
      summary: Current observed capacity and schedule pacing per account
      description: Person account.read permission. Separate from the legacy account contract. Manual active windows and the account's Advanced limit cap on top of these readings (AEON-384); both bind.
      responses:
        '200': {description: Capacity, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccountCapacity'}}}}}
        '403': {description: Person account.read permission required}
  /agent-accounts/capacity/next:
    get:
      operationId: nextCapacityAccount
      summary: Next eligible accounts in the router's order, without reserving them
      description: Person account.read permission, or a workspace-authorized agent with account.read. Paired agents and probe-only keys see only their own accounts. Order is soonest long-window reset, larger available cap, then account ID. Rechecks approval, probe, model grants, vendor truth, schedule, reserve and concurrency. Advisory only. No config path or credential is returned; --env resolves through the authenticated local agentd socket.
      security: &auth [{session: []}, {agentKey: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: string, format: uuid}, description: "Project context; omitted uses the default context. Unmapped and holding projects fail closed."}
        - {name: harness, in: query, required: true, schema: {type: string, enum: [codex, claude, pi, cursor, grok, gemini, opencode]}}
        - {name: daemon_id, in: query, schema: {type: string, maxLength: 128}}
        - {name: model_profile_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Ordered advice, content: {application/json: {schema: {$ref: '#/components/schemas/CapacityNext'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /agent-accounts/capacity/preview:
    post:
      operationId: previewAccountCapacity
      summary: Capacity paced with a draft schedule, without saving it
      description: Person account.read permission. Returns the same projection as listAccountCapacity, paced on the schedule each account would follow after saving the draft as the person's schedule with carry_overrides (the same server rule) - deliberate pool or account schedules stay, entries that only carry Sprint/Hold or their own Keep for you follow the draft, ended overrides fall away. A drafted Away (override away with override_until) previews until its date; drafted Sprint and Hold are ignored. pool_reserves drafts each pool's own Keep for you. Nothing is stored. Rate limited per person, bounded in concurrency, time and integration work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schedule]
              properties:
                schedule: {$ref: '#/components/schemas/CapacitySchedule'}
                pool_reserves:
                  type: array
                  maxItems: 8
                  description: Drafted Keep for you per pool (AEON-375), at most one entry per pool. An empty reserve drops the pool's own choice so it follows the person's.
                  items:
                    type: object
                    additionalProperties: false
                    required: [pool, reserve]
                    properties:
                      pool: {type: string, enum: [codex, claude, pi, cursor, grok, gemini, opencode]}
                      reserve: {type: string, enum: ["", auto, fixed, off]}
                      reserve_percent: {type: number, minimum: 10, maximum: 80, multipleOf: 5, description: Required with fixed; omitted otherwise.}
      responses:
        '200': {description: Capacity, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccountCapacity'}}}}}
        '400': {description: Invalid schedule}
        '403': {description: Person account.read permission required}
        '408': {description: The request body did not arrive within the preview deadline}
        '413': {description: Too many long capacity windows to preview at once (bounded integration work)}
        '429': {description: Per-person preview rate exceeded; see Retry-After}
        '503': {description: Previews busy or the preview deadline passed; see Retry-After}
  /agent-accounts/capacity/schedule:
    get:
      operationId: listCapacitySchedules
      summary: Current person's default, pool and account schedule overrides
      responses:
        '200': {description: Schedules, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CapacityScheduleOverride'}}}}}
    put:
      operationId: putCapacitySchedule
      summary: Set current person's default, pool or account schedule
      description: Person account.manage permission required. Pacing is enforced for measured windows using the pairing owner schedule (for unpaired accounts, the first person to save an account schedule establishes its schedule owner). Account override wins over the account's group, then pool (harness), then user default, then built-in default. Keep for you (reserve) resolves separately - the most specific explicit reserve wins, Auto when none is set - so a pool, group or account entry without one follows the person's. Away is set on the user scope only (400 elsewhere), must end within a year and reaches every pool without an override of its own in force. Hold may carry override_until within 31 days (until tomorrow's hours, for 2 hours); without it Hold lasts until resumed. Times are local to the explicit IANA timezone; week is Monday first. Shifts and hourly blocks replace work hours while nights is enabled. Null schedule removes an override. A group scope names group_id and leaves account_id empty.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CapacityScheduleOverride'}}}}
      responses:
        '204': {description: Schedule saved}
        '400': {description: Invalid schedule}
        '403': {description: Person account.manage permission required}
  /agent-accounts/catalog:
    get:
      operationId: getAgentAccountCatalog
      description: Tenant-scoped host → harness → account → model → effort cascade derived from enrolled accounts, owner probes, allowance windows and the existing model registry. Availability is advisory; routing reserves atomically. Legacy null account profile policy inherits the tenant harness catalog, not provider entitlements. Empty explicit grants offer no models.
      security: [{session: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: string, format: uuid}, description: "Project context; omitted uses the default context. Unmapped and holding projects fail closed."}
        - {name: role, in: query, schema: {type: string, default: build, enum: [scout, mechanical, build, build-hard, review-gate, review-gate-security]}}
        - {name: author_family, in: query, description: Required for review-gate; that family is excluded., schema: {type: string, enum: [openai, anthropic, xai, cursor, google, local]}}
      responses:
        '200': {description: Cascade and defaults, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccountCatalog'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /agent-accounts/groups:
    get:
      operationId: listAccountGroups
      summary: Groups that split a vendor pool
      description: Person account.read. A group is one vendor, its member accounts, and an optional project fence. Project IDs include only live projects visible to the caller.
      responses:
        '200': {description: Groups, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccountGroup'}}}}}
    post:
      operationId: createAccountGroup
      summary: Keep selected accounts separate
      description: Person account.manage. Exclusive requires at least one project. A fenced project routes only inside the group. An exclusive group's other work waits rather than using its members.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountGroupWrite'}}}}
      responses:
        '201': {description: Group, content: {application/json: {schema: {$ref: '#/components/schemas/AccountGroup'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /agent-accounts/groups/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      operationId: updateAccountGroup
      description: Person account.manage. account_ids, when present, replaces account membership. project_ids, when present, replaces only the caller-visible live project membership; hidden memberships remain intact. Omit a list to leave it.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountGroupWrite'}}}}
      responses:
        '200': {description: Group, content: {application/json: {schema: {$ref: '#/components/schemas/AccountGroup'}}}}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteAccountGroup
      summary: Return the group's accounts to the vendor pool
      description: Person account.manage. Members lose the group. The group's schedule rows are removed.
      responses:
        '204': {description: Group removed}
        '404': {$ref: '#/components/responses/Error'}
  /agent-accounts/overview:
    get:
      operationId: listAccountOverview
      summary: "Every enrolled account and its capacity values"
      description: "Tenant-scoped, read-only keyset pages. People need account.read; agent keys need the explicit account.overview.read scope and a custom-role grant, excluded from built-in agent defaults. Current owner-sharing masking applies, including private peers in shared pools. No vendor identity, account key, config-home path or contents, or credentials. Routing is advice; reservation and claim recheck all admission rules. Work is bounded to 1024 current accounts and 4096 windows per tenant with a five-second deadline; larger projections fail explicitly."
      security: [{session: []}, {agentKey: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
        - {name: after, in: query, schema: {type: string, format: uuid}, description: "Last account_id from the previous page; accounts are ordered by UUID."}
      responses:
        '200': {description: "Account values", content: {application/json: {schema: {$ref: '#/components/schemas/AccountOverviewPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /agent-accounts/pins:
    get:
      operationId: listAccountPins
      description: Person account.read. Pins for one live ticket visible to the caller; invisible tickets return an empty list.
      parameters: [{name: ticket_id, in: query, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Pins, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccountTicketPin'}}}}}
    put:
      operationId: putAccountPin
      summary: Remember an account or a group for this ticket
      description: Person run.create and nodes.write in the visible ticket's project. Exactly one of account_id or group_id. A pin narrows routing and never crosses a project fence.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountTicketPin'}}}}
      responses:
        '204': {description: Pin saved}
        '400': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteAccountPin
      description: Person run.create and nodes.write in the visible ticket's project.
      parameters:
        - {name: ticket_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: harness, in: query, required: true, schema: {type: string, enum: [codex, claude, pi, cursor, grok, gemini, opencode]}}
      responses:
        '204': {description: Pin removed}
  /agent-accounts/posture:
    get:
      operationId: listAccountPostures
      description: "Small, tenant-scoped guard projection of owner posture, floors and active Boost today, without windows, owner details or credentials. Requires account.read, including a live explicit key scope for agents. Only owner-authorized or usage-shared accounts are included; sharing is rechecked at the response boundary. At most 100 accounts per keyset page, with a five-second deadline. Order follows routing advice; Max out uses the soonest active reset. Expired or rebound boosts read as zero and null."
      parameters:
        - {name: harness, in: query, required: true, schema: {type: string, enum: [codex, claude, grok, pi, cursor, gemini, opencode]}}
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200': {description: "Postures", content: {application/json: {schema: {type: object, required: [accounts, has_more, as_of], properties: {accounts: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AccountPosture'}}, has_more: {type: boolean}, next_cursor: {type: string, format: uuid}, as_of: {type: string, format: date-time}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /agent-accounts/quota-pool:
    put:
      operationId: confirmAccountQuotaPool
      summary: Confirm that selected accounts use the same vendor login
      description: Person account.manage required. Only the explicitly selected accounts share quota; confirmation removes unnamed members of the same fingerprint and harness from the pool. Matching signals from later enrollments never join automatically. All accounts must report the supplied nonempty fingerprint and use the same harness. A changed signal clears that account's confirmation. Set confirmed to false to remove only the selected accounts from the pool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_ids, quota_fingerprint, confirmed]
              properties:
                account_ids: {type: array, minItems: 1, maxItems: 256, uniqueItems: true, items: {type: string, format: uuid}}
                quota_fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
                confirmed: {type: boolean, description: Confirmation requires at least two accounts; removal may name one account.}
      responses:
        '204': {description: Confirmation saved or removed}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {description: An account no longer reports the selected fingerprint or uses another harness}
  /agent-accounts/quota-warnings:
    get:
      summary: Affected active sessions with fresh measured low-quota warnings
      operationId: listQuotaWarningSessions
      security: [{session: []}, {agentKey: []}]
      tags: [Agents]
      parameters:
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Project-filtered session warnings. Unshared peers see limited availability only, without severity, thresholds, windows, or numbers.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_after]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/QuotaWarningSession'}}
                  next_after: {type: [string, 'null'], format: uuid}
        '400': {description: Invalid cursor or limit}
        '403': {description: Account read permission required}
  /agent-accounts/readiness:
    get:
      operationId: listAgentAccountReadiness
      summary: Availability and nullable measurements, never launch authority
      description: Requires account.read. Unknown usage never throttles and carries usage_unknown_reserve_not_enforceable. Model/project admission remains authoritative. Owners and the enrolling daemon see details; teammates see availability only unless the owner shares. No administrator bypass. Keyset paginated, at most 100 accounts per page.
      security: *auth
      parameters:
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Readiness page, content: {application/json: {schema: {$ref: '#/components/schemas/AccountReadinessPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /agent-accounts/route:
    post:
      operationId: reserveAgentAccount
      description: Atomically select an eligible account enrolled on the requesting daemon for a queued run and reserve allowance. Routing orders fitting accounts by soonest long-window reset, then larger available cap and account ID; concurrency reservations spread parallel work across accounts; fail closed when estimates are absent or no account fits. Queued retries recheck account state, probe, enabled profile and grants. If the reserved account leaves its routing fence or loses quota-pool confirmation, release its hold and slot and reroute within the current fence. When no replacement is eligible, return 409 with code account_moved_out_of_group or quota_pool_changed and leave the run unreserved. The daemon resolves the opaque key to its local credential.
      security: [{agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountRouteRequest'}}}}
      responses:
        '200': {description: Selected account, content: {application/json: {schema: {$ref: '#/components/schemas/AccountRoute'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /agent-accounts/runs/{runId}/target:
    post:
      operationId: setRunAccountTarget
      summary: Move a queued run to an account or a group
      description: Person run.create, and the caller can edit the work order. Only while the run is queued and has no account yet. account_id sets the existing requested-account pin. group_id clears that pin and stores a group target. Exactly one of the two.
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                account_id: {type: string, format: uuid}
                group_id: {type: string, format: uuid}
      responses:
        '204': {description: Target saved}
        '409': {description: Run is not awaiting an account}
  /agent-accounts/use:
    get:
      operationId: useAccount
      summary: Resolve a harness label or account id to door ids for the local agent
      description: Specify exactly one of label or account_id. Person account.read, or the same agent authority as capacity next. Returns ids, labels and the quota fingerprint only. No path, home, socket or credential. The shell export is printed by aeon use from the local agentd.
      parameters:
        - {name: project_id, in: query, schema: {type: string, format: uuid}, description: "Project context; omitted uses the default context. Unmapped and holding projects fail closed."}
        - {name: harness, in: query, required: true, schema: {type: string, enum: [codex, claude, pi, cursor, grok, gemini, opencode]}}
        - {name: label, in: query, schema: {type: string, maxLength: 128}}
        - {name: account_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Doors of one quota, content: {application/json: {schema: {$ref: '#/components/schemas/AccountUse'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: Several distinct quotas share that label}
  /agent-accounts/{accountId}:
    patch:
      operationId: updateAgentAccount
      description: Admin can drain, disable or reactivate an account. Draining preserves current owned runs and blocks new reservations.
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [state], properties: {state: {type: string, enum: [available, draining, unavailable]}}}}}}
      responses:
        '200': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/archive:
    post:
      operationId: archiveAgentAccount
      summary: Remove an account from the workspace's lists (AEON-402)
      description: Person with account.manage only. A paired binding is disconnected first; queued runs bound to the account are cancelled and release their capacity holds. The account becomes unavailable and leaves the account list, capacity and the ready count; runs, readings and audit events stay (account.archived). Refused while a run is starting, running or waiting on the account. Repeating it returns the archived account. Accounts whose paired computer binding is revoked leave the person-facing lists the same way.
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Archived account, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/capacity/approve:
    post:
      operationId: approveOngoingObservedCapacity
      summary: Approve ongoing managed work using observed account capacity
      description: Person account.manage permission required. Records ongoing-use approval after pairing approval, including before helper redemption, without creating a manual allowance window. Dispatch still requires redeemed pairing, a fresh probe, model grants and capacity admission. Accounts without readings use the provisional first-run policy. Ingesting a reading never grants this approval.
      parameters:
        - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Ongoing use approved}
        '403': {description: Person account.manage permission required}
        '404': {description: Account not found}
  /agent-accounts/{accountId}/check:
    post:
      operationId: requestAgentAccountCheck
      summary: Request one revision-bound refresh
      description: Person owner plus account.manage only. Idempotency keys are persisted; changing a key while pending coalesces to the same check. A persisted 60-second minimum gap applies across callers and restarts. Check now may request one early recovery for an unnamed or provider-confirmed money stop, deduplicated with automatic recovery; this endpoint never grants launch authority or clears a stop. Revocation, relinking and daemon-generation changes invalidate pending checks. Audits contain actor, account/revision and check ID, never vendor diagnostics.
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountCheckWrite'}}}}
      responses:
        '202': {description: Accepted or idempotently reused check, content: {application/json: {schema: {$ref: '#/components/schemas/AccountCheck'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: Binding/revision stale or conflicting idempotency key, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '410': {description: Enrollment revoked; outstanding checks are invalidated}
        '429': {description: Minimum gap, headers: {Retry-After: {schema: {type: integer, minimum: 1}}}, content: {application/json: {schema: {$ref: '#/components/schemas/AccountCheckRetry'}}}}
  /agent-accounts/{accountId}/floor:
    put:
      operationId: putAccountUsageFloor
      description: "Person account.manage and workspace model_prefs.manage only. Sets a permanent reserve on the account’s quota; confirmed siblings use the strictest floor. Sprint, Max out and Run now cannot bypass it. Checked under the access-change fence with the current binding and policy revision."
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [floor_percent, revision, binding_revision], properties: {floor_percent: {type: integer, minimum: 0, maximum: 80}, revision: {type: integer, minimum: 0}, binding_revision: {type: integer, minimum: 0}}}}}}
      responses:
        '200': {description: "Saved policy", content: {application/json: {schema: {$ref: '#/components/schemas/AccountUsagePolicy'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/label:
    put:
      operationId: renameAgentAccount
      summary: Rename an account
      description: Person account.manage permission. Changes only the display label (Settings, inline rename); plan, host label and model grants stay exactly as they are, including a legacy null grant policy. Audited; an identical label is a no-op.
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label]
              properties:
                label: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/limit:
    put:
      operationId: putAccountLimit
      summary: Set the Advanced limit of an account
      description: 'Person account.manage permission. One sentence per account - "Let agents use at most <amount> <unit> of this account per <period>" - in the account owner''s schedule timezone. It caps on top of readings, pacing and Keep for you and never replaces them. percent sums positive reading deltas across vendor resets within the owner calendar period, including the person''s use; the largest total across vendor window kinds and buckets binds. Synthetic refresh runs obey the same cap. Admission atomically counts measured usage plus outstanding per-run estimates (one run, learned request/token/cost estimates or conservative defaults). Missing cost telemetry retains its estimate. cost_micros requires priced run accounting; unsupported accounts return 422 unsupported_limit_unit. A run may finish above its estimate. A reached limit waits with code allowance until the period ends, and Run now does not skip it. An identical sentence is a no-op; a different one replaces the old, which stays as history.'
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountLimitWrite'}}}}
      responses:
        '200': {description: The limit now in force, content: {application/json: {schema: {$ref: '#/components/schemas/AccountLimitRule'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {description: 'unsupported_limit_unit - this account does not report priced run usage.', content: {application/json: {schema: {type: object, required: [error, code], properties: {error: {type: string}, code: {type: string, const: unsupported_limit_unit}}}}}}
    delete:
      operationId: removeAccountLimit
      summary: Remove the Advanced limit of an account
      description: Person account.manage permission. Idempotent; the removed rule stays as history.
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: No limit}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/metadata:
    put:
      operationId: replaceAgentAccountMetadata
      description: Replace display metadata and explicit model-profile grants. Requires account.manage for a person or a scoped registering agent key. IDs must reference this tenant's enabled profiles for the account harness and match a pi account's configured provider/model. Change that binding through the person-only model endpoint; empty grants still revoke dispatch. No credentials, home paths or provider identities. Audited and idempotent.
      security: *auth
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccountMetadataWrite'}}}}
      responses:
        '200': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/model:
    put:
      operationId: setPiAccountModel
      summary: Choose the model for new pi runs
      description: Requires a person with account.manage. Provider is fixed by local enrollment. Saves an immutable registry profile and replaces this account's profile grant; active runs retain their model. OpenRouter's public catalog is cached with a bounded timeout; unknown or unreachable slugs are saved with unknown status. No credentials are accepted.
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model]
              properties:
                model: {type: string, minLength: 1, maxLength: 116, description: 'Provider model ID; OpenRouter uses vendor/model[:variant].'}
      responses:
        '200': {description: Saved account, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/reset-policy:
    parameters:
      - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: setAccountResetPolicy
      summary: Set the owning person's reset policy
      description: "Owner plus live account.manage only. Uses the floor's revision and binding_revision, under the access fence. Defaults to suggest. Auto consent is bound to the owner and enrollment; relinking never inherits it. Does not spend a credit."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reset_policy, revision, binding_revision]
              properties:
                reset_policy: {type: string, enum: [suggest, auto_before_expiry]}
                revision: {type: integer, minimum: 0}
                binding_revision: {type: integer, minimum: 0}
      responses:
        '200': {description: "Current policy and reset advice", content: {application/json: {schema: {$ref: '#/components/schemas/AccountResetState'}}}}
        '400': {description: "Invalid policy"}
        '403': {description: "Owner account management required"}
        '409': {description: "Policy or binding changed"}
  /agent-accounts/{accountId}/resets/use:
    parameters:
      - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: useAccountReset
      summary: Spend one vendor-reported reset credit
      description: "Owner plus live account.manage. Fresh vendor count, consent, binding and window are checked under the final write fence. confirmed is required when the vendor cannot undo. A configured adapter must deduplicate the durable action ID. No adapter returns 422. A 502 outcome may have spent the credit and blocks retries until reconciliation. Success writes account.reset_used last and returns the fresh window."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_count, binding_revision]
              properties:
                expected_count: {type: integer, minimum: 1, maximum: 32}
                binding_revision: {type: integer, minimum: 0}
                confirmed: {type: boolean, default: false}
      responses:
        '200': {description: "Vendor-confirmed fresh window", content: {application/json: {schema: {$ref: '#/components/schemas/AccountResetResult'}}}}
        '400': {description: "Invalid action"}
        '403': {description: "Owner account management required"}
        '409': {description: "Stale count, binding, pending action, or inline confirmation required"}
        '422': {description: "Vendor reset execution unavailable"}
        '502': {description: "Vendor outcome unknown; reconciliation required before retry"}
  /agent-accounts/{accountId}/resets/{actionId}/undo:
    parameters:
      - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: actionId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: undoAccountReset
      summary: Undo a reset while the vendor allows it
      description: "Owner plus live account.manage, same binding, succeeded action and vendor undo_until required. The vendor must actually restore the credit and return its fresh window; local quota is never fabricated. Uncertain Undo blocks further spending."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [binding_revision]
              properties:
                binding_revision: {type: integer, minimum: 0}
      responses:
        '200': {description: "Vendor-confirmed Undo", content: {application/json: {schema: {$ref: '#/components/schemas/AccountResetResult'}}}}
        '400': {description: "Invalid action"}
        '403': {description: "Owner account management required"}
        '404': {description: "Reset action not found"}
        '409': {description: "Action, binding or Undo deadline changed"}
        '422': {description: "Vendor reset execution unavailable"}
        '502': {description: "Vendor outcome unknown; reconciliation required before retry"}
  /agent-accounts/{accountId}/posture:
    put:
      operationId: putAccountPosture
      description: "Person account.manage and current canonical account owner only. Null posture follows the owner’s personal setting. Authorization, ownership and binding revision are checked inside the fenced write. One revision and audit event; no paid usage or credit purchase."
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [posture, revision, binding_revision], properties: {posture: {type: [string, 'null'], enum: [careful, balanced, maxout, null]}, revision: {type: integer, minimum: 0}, binding_revision: {type: integer, minimum: 0}}}}}}
      responses:
        '200': {description: "Saved policy", content: {application/json: {schema: {$ref: '#/components/schemas/AccountUsagePolicy'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /agent-accounts/probes:
    post:
      operationId: reportAgentAccountProbeBatch
      description: "Transport batch of one to 32 independent local health observations. Each item has its own transaction and result; current account.probe key, grants, registering principal, daemon and pairing fences are checked inside every write. Readiness completions and measurement-only writes use the single-account route. Observed times retain the existing probe freshness limit; stale, superseded or more than one minute future observations are refused. Accepted future clock skew is clamped to server time. Failure of one item does not acknowledge siblings. The body is limited to 64 KiB and processing to 20 seconds."
      security: [{agentKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: object
                    additionalProperties: false
                    required: [account_id, observed_at, probe]
                    properties:
                      account_id: {type: string, format: uuid}
                      observed_at: {type: string, format: date-time}
                      probe: {$ref: '#/components/schemas/AccountProbe'}
      responses:
        '200':
          description: "Ordered per-account HTTP statuses; only status 200 acknowledges a persisted observation."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 32
                    items:
                      type: object
                      additionalProperties: false
                      required: [account_id, status]
                      properties:
                        account_id: {type: string, format: uuid}
                        status: {type: integer, minimum: 200, maximum: 599}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/probe:
    post:
      operationId: reportAgentAccountProbe
      description: The registering agent principal reports a bounded local identity/availability probe for its daemon. The daemon ID must match the account; no credential material is sent. Routing requires a recent successful probe.
      security: [{agentKey: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountProbe'}}}}
      responses:
        '200': {description: Account availability, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: 'Stale readiness check or binding. On the first report after a daemon generation change, the heartbeat commits and the stale check and its facts are rejected; refresh pending work before retrying.'
          headers:
            X-Aeon-Write-Committed:
              schema: {type: boolean}
              description: 'True only when the heartbeat committed despite rejecting the old-generation readiness completion.'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /agent-accounts/{accountId}/quota-key:
    parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: getTenantQuotaKey
      description: Registering agents with account.probe only. Stable tenant HMAC key for local fingerprinting; never log, journal, pass to children or include in public projections. No vendor credentials involved.
      security: *auth
      responses:
        '200':
          description: Private key; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [key]
                properties:
                  key: {type: string, contentEncoding: base64}
  /agent-accounts/{accountId}/readings:
    parameters:
      - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: ingestCapacityReadings
      summary: Report allowlisted quota observations for an owned account
      description: Requires agent key scope account.probe and the account registering principal. Does not grant ongoing pairing approval. Duplicate observations are idempotent; older reports cannot replace newer current windows. Stale or fully reset observations permit one provisional 1% refresh job; a new measured snapshot is required before another.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [readings]
              properties:
                readings: {description: "Full normalized snapshot per source; missing buckets retire previous windows without deleting history. An empty array requires a dollar budget or explicit vendor reset report.", type: array, minItems: 0, maxItems: 32, items: {$ref: '#/components/schemas/CapacityReading'}}
                usage_probe: {type: boolean, description: "Host usage probe; requires current owner consent and binding_revision."}
                binding_revision: {type: integer, minimum: 0}
                resets: {$ref: '#/components/schemas/AccountResetReport'}
                budget: {$ref: '#/components/schemas/CapacityBudget'}
      responses:
        '204': {description: Observations recorded}
        '400': {description: Invalid reading}
        '403': {description: Scope or ownership mismatch}
    get:
      operationId: listCapacityReadings
      description: Person account.read permission, or the registering agent with account.probe scope. Paired keys may read only accounts enrolled by their own computer. Used by idle capture to respect the latest observation across daemon restarts; lookup failures fall back to locally persisted successful capture times.
      summary: Most recent 200 observations for an account
      responses:
        '200': {description: Readings, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CapacityReading'}}}}}
        '403': {description: Scope or pairing ownership mismatch}
  /agent-accounts/{accountId}/residency-evidence:
    parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getAgentAccountResidencyEvidence
      summary: Read the account's recorded residency evidence
      description: Requires account.read. People can inspect workspace evidence; agent keys must be the account's paired host identity. Missing evidence returns 404. Expired or superseded evidence remains inspectable but does not qualify a route.
      security: *auth
      responses:
        '200': {description: Recorded evidence, content: {application/json: {schema: {$ref: '#/components/schemas/AccountResidencyEvidenceRecord'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: putAgentAccountResidencyEvidence
      summary: Replace host-owned account residency evidence
      description: Requires account.manage for the linked owning person, or account.probe for the connected paired host's bound runtime key. Workspace admins and agent key creators are not owners by implication. Authorization is repeated under the tenant and pairing locks in the write transaction. Each write emits account.residency_evidence_updated. Evidence covers only the listed model profiles and current account binding; a host, owner, provider or model change invalidates it. No proof reference is fetched by the server.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountResidencyEvidence'}}}}
      responses:
        '200': {description: Saved evidence, content: {application/json: {schema: {$ref: '#/components/schemas/AccountResidencyEvidenceRecord'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/sharing:
    put:
      operationId: setAgentAccountUsageSharing
      summary: Owner opts quota details into workspace sharing
      description: Person owner plus account.manage only, revision checked under the access fence and audited. Defaults to false. Relinking resets sharing. Owners retain sharing control after computer or ongoing-use revocation; sharing never grants execution authority. Sharing covers quota detail, credits, reset times and bounded check errors on accounts, capacity, history, advice and events/SSE. It does not delegate checks.
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [binding_revision, share_usage]
              properties:
                binding_revision: {type: integer, minimum: 0}
                share_usage: {type: boolean}
      responses:
        '204': {description: Sharing saved}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/signals:
    parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
    put:
      operationId: reportAccountSignals
      description: Only the registering agent may publish reading support and the tenant-keyed quota fingerprint. Never accepts a vendor identity, email, path or credential.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountSignals'}}}}
      responses:
        '204': {description: Accepted}
  /agent-accounts/{accountId}/statusline:
    parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getAccountStatusline
      description: Registering agent reads explicit human consent. A read writes no settings.
      security: *auth
      responses:
        '200': {description: Consent, content: {application/json: {schema: {$ref: '#/components/schemas/StatuslineConsent'}}}}
    put:
      operationId: setAccountStatusline
      description: A person may opt in only for a Claude account enrolled on a computer they approved, or a workspace owner or admin may opt in for any Claude account. account.manage alone is not enough. The enrolled daemon applies the change locally and preserves a status line it did not install.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StatuslineConsent'}}}}
      responses:
        '200': {description: Consent, content: {application/json: {schema: {$ref: '#/components/schemas/StatuslineConsent'}}}}
  /agent-accounts/{accountId}/usage-probe:
    parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
    put:
      operationId: setAccountUsageProbe
      summary: Owner consent to host usage probes
      description: "Requires the owning person with account.manage and the current binding revision. Uses unofficial provider endpoints; they may change or stop. You are responsible for following your provider's terms. Consent grants no execution or sharing authority."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [binding_revision, enabled]
              properties:
                binding_revision: {type: integer, minimum: 0}
                enabled: {type: boolean}
      responses:
        '204': {description: "Consent saved"}
        '400': {description: "Invalid request"}
        '403': {description: "Owning person required"}
        '409': {description: "Account binding changed"}
  /agent-accounts/{accountId}/windows:
    post:
      operationId: createAccountWindow
      description: Admin sets a bounded allowance and pacing policy for the CLI and older clients. Overlapping windows of one unit are rejected. The window caps on top of readings, pacing and Keep for you; it no longer replaces them (AEON-384). The web app offers the Advanced limit instead.
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AllowanceWindowWrite'}}}}
      responses:
        '201': {description: Window, content: {application/json: {schema: {$ref: '#/components/schemas/AllowanceWindow'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/windows/{windowId}:
    delete:
      operationId: removeAccountWindow
      summary: Remove a limit set by hand
      description: Person account.manage permission. The manual window stops capping; its row, usage and reservations stay, so nothing is lost and running work settles as before. Windows read from the vendor and pairing verifications are not removable (404).
      security: [{session: []}]
      parameters:
        - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: windowId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Removed}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/windows/{windowId}/repeat:
    post:
      operationId: repeatAccountWindow
      summary: Make a limit set by hand repeat
      description: Person account.manage permission. Turns a manual window into the account's Advanced limit - its allowance and unit per the period its length matches (up to 36 hours a day, up to 10 days a week, else a month) - and hides the window in the same transaction. Its original cap stays binding until expiry. An existing Advanced limit is preserved and returns 409.
      security: [{session: []}]
      parameters:
        - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: windowId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: The limit now in force, content: {application/json: {schema: {$ref: '#/components/schemas/AccountLimitRule'}}}}
        '409': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {description: 'unsupported_limit_unit - this account does not report priced run usage.', content: {application/json: {schema: {type: object, required: [error, code], properties: {error: {type: string}, code: {type: string, const: unsupported_limit_unit}}}}}}
components:
  schemas:
    AccountCapacity:
      type: object
      required: [account_id, schedule, windows]
      properties:
        contexts: {type: array, items: {$ref: '#/components/schemas/AccountContextLabel'}}
        budget: {$ref: '#/components/schemas/CapacityBudget'}
        account_id: {type: string, format: uuid}
        routing: {$ref: '#/components/schemas/CapacityRouting'}
        learning: {$ref: '#/components/schemas/CapacityLearning'}
        ongoing_use_approved: {type: boolean, description: True for unpaired accounts or a separately approved connected pairing; readings never change this approval}
        probe_failure: {type: string, enum: [auth_failed, unavailable], description: 'Why the last probe failed; absent after a successful probe. Only auth_failed means the account needs a new sign-in.'}
        limiting_reset: {type: string, format: date-time, description: 'Earliest reset of the account''s current measured windows (including 5-hour windows); a Sprint in scope ends at the earliest of these.'}
        awaiting_reading: {type: boolean, description: 'True after a recovery run cleared a denial and no later reading has arrived. Current windows are omitted until the next run measures capacity.'}
        details_redacted: {type: boolean, description: True when the owner has not shared quota detail; ignore the placeholder schedule.}
        schedule: {$ref: '#/components/schemas/CapacitySchedule'}
        quota_fingerprint: {type: string, pattern: '^([a-f0-9]{64})?$'}
        group_id: {type: string, format: uuid}
        group_name: {type: string}
        host_label: {type: string}
        hosts: {type: array, items: {type: string}, description: Host chips when several doors share one quota. Slots are not summed across those doors.}
        same_quota_as: {type: string, format: uuid, description: The freshest door of this quota. Windows for the single gauge come from that door.}
        windows:
          type: array
          items:
            type: object
            required: [reading, starts_at, allowance, remaining_percent, freshness, pacing]
            properties:
              reading: {$ref: '#/components/schemas/CapacityReading'}
              starts_at: {type: string, format: date-time}
              allowance: {type: number, const: 100}
              remaining_percent: {type: number}
              freshness: {type: string, enum: [fresh, aging, stale, expired]}
              usage_today_known: {type: boolean, description: False when no exact schedule-boundary observation exists; never infers daily usage from tokens}
              pacing: {$ref: '#/components/schemas/CapacityPacing'}
        limit:
          description: The account's Advanced limit (AEON-384) with what it counted this period. Absent when none is set.
          allOf:
            - {$ref: '#/components/schemas/AccountLimitRule'}
            - type: object
              required: [used, period_end]
              properties:
                used: {type: number, minimum: 0, description: Measured usage plus outstanding estimates in the owner calendar period; percent retains positive deltas across vendor resets.}
                period_end: {type: string, format: date-time, description: When the period ends and the count starts again.}
        cost_limit_supported: {type: boolean, description: True only when this account reports priced run usage; only then may cost_micros limits be set.}
        spend_month_usd: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', description: 'List-price spend this local month, in dollars, for an account whose usage is billed by API key. Absent for subscriptions. An estimate, not a billed charge.'}
    AccountCatalogChoice:
      type: object
      required: [id, label, plan, registered_by_principal_id, state, last_probe_at, last_probe_ok, available, unavailable_reasons, remaining_fraction, windows, models, default_model_profile_id]
      properties:
        wait: {$ref: '#/components/schemas/CapacityWait'}
        id: {type: string, format: uuid}
        label: {type: string}

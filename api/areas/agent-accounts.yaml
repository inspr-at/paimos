            id: {type: string, format: uuid}
            registered_by_principal_id: {type: string, format: uuid}
            state: {type: string, enum: [available, draining, unavailable]}
            last_probe_at: {type: [string, 'null'], format: date-time}
            last_probe_ok: {type: [boolean, 'null']}
            created_at: {type: string, format: date-time}
            billing_mode: {type: string, enum: [unknown, api, subscription], default: unknown, description: Person-declared billing for this account.}
            plan: {type: string}
            host_label: {type: string}
            provider: {type: string, description: Pi provider fixed by the approved local enrollment.}

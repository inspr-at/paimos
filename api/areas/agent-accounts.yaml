        revision: {type: integer, minimum: 0}
        binding_revision: {type: integer, minimum: 0}
        can_set_posture: {type: boolean}
        can_set_floor: {type: boolean}
        boost_percent: {type: integer, enum: [0, 10, 20, 30]}
        boost_until: {type: [string, 'null'], format: date-time}
    AccountUse:

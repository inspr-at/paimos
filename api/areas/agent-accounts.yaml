        read_at: {type: string, format: date-time}
        binding_revision: {type: integer, minimum: 0}
        undo_supported: {type: boolean}
      description: "Explicit vendor data reported by the bound daemon through the existing account.probe scope, with current usage-probe consent. Max 32 credits, each expiring within 367 days. Older/equal reports cannot replace current data. Stale or rebound reports read as null."
    AccountResetPlan:
      type: object
      additionalProperties: false
      required: [planned_at, raised_pace_points, raised_pace_until]
      properties:
        planned_at: {type: string, format: date-time}
        raised_pace_points: {type: number, minimum: 0, maximum: 50}
        raised_pace_until: {type: string, format: date-time}
      description: "Advice from the current window's learned burn. The plan waits for near-exhaustion and leaves five minutes before credit expiry. Natural window resets before expiry give no plan. Only fresh daemon captures with owner opt-in can spend automatically; reads never spend. Raised pace is active only after vendor success and remains bounded by floors and explicit Boost today."
    AccountResetPlanOrNull:
      oneOf:
        - {$ref: '#/components/schemas/AccountResetPlan'}
        - {type: 'null'}
    AccountResetState:
      type: object
      additionalProperties: false
      required: [account_id, reset_policy, revision, binding_revision, resets, reset_plan, undo_supported]
      properties:
        account_id: {type: string, format: uuid}
        reset_policy: {type: string, enum: [suggest, auto_before_expiry]}
        revision: {type: integer, minimum: 0}
        binding_revision: {type: integer, minimum: 0}
        resets: {$ref: '#/components/schemas/AccountResetCreditsOrNull'}
        reset_plan: {$ref: '#/components/schemas/AccountResetPlanOrNull'}
        undo_supported: {type: boolean}
    AccountResetResult:

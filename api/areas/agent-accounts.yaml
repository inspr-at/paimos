        posture: {type: string, enum: [careful, balanced, maxout]}
        floor_percent: {type: integer, minimum: 0, maximum: 80}
        boost_percent: {type: integer, enum: [0, 10, 20, 30]}
        boost_until: {type: [string, 'null'], format: date-time}
        keep_for_you_percent: {type: number, minimum: 0, maximum: 80}
    AccountProbe:
      type: object
      required: [daemon_id, daemon_generation, available]
      properties:
        readiness: {$ref: "#/components/schemas/ReadinessReport"}
        measurement_only: {type: boolean, default: false, description: 'Scoped daemon measurement or generation heartbeat. Preserves last_probe_at, last_probe_ok, failure and legacy credit snapshot under the account write fence. Readiness reports require the generation already established by a measurement-only heartbeat without readiness; available and failure remain compatibility fields and do not update health in this mode.'}
        daemon_id: {type: string, minLength: 1, maxLength: 128}
        daemon_generation: {type: string, minLength: 1, maxLength: 128}
        available: {type: boolean}
        host_label: {type: string, maxLength: 128, description: Optional display-only host name reported by the owner daemon; fills an empty label without overwriting configured metadata.}
        openrouter_credits: {$ref: '#/components/schemas/OpenRouterCredits'}
        failure: {type: string, enum: [auth_failed, unavailable], description: 'Only with available=false. auth_failed only when the vendor status command confirmed this account is signed out; identity mismatch and every other failure are unavailable (the default when omitted). Only confirmed sign-out asks for another login. Bounded daemon lifecycle reasons may distinguish identity_mismatch, timeout, protocol and launch_failed, without changing these historical probe categories or uploading vendor identity or diagnostics. A version response alone never establishes signed-in readiness.'}
    AccountReadiness:

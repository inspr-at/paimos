# aeon:owner internal/modelregistry
paths:
  /work-kinds:
    get:
      operationId: listWorkKinds
      security: *auth
      parameters:
        - {name: lang, in: query, schema: {type: string, enum: [en, de], default: en}, description: "Selects display_words; legacy English fields and German words_de remain available."}
        - {name: project_id, in: query, schema: {type: string, format: uuid}}
        - {name: include_archived, in: query, schema: {type: boolean, default: false}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}, description: Last ID from the preceding page.}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/WorkKindPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    post:
      operationId: createWorkKind
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkKindWrite'}}}}
      responses:
        '201': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/WorkKind'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /work-kinds/order:
    put:
      operationId: orderWorkKinds
      security: *auth
      description: "Order all active visible work kinds once, preserving ticket area values."
      parameters:
        - {name: project_id, in: query, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkKindOrderWrite'}}}}
      responses:
        '200': {description: 'Result', content: {application/json: {schema: {$ref: '#/components/schemas/WorkKindOrderedPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
  /work-kinds/{kindId}:
    patch:
      operationId: updateWorkKind
      security: *auth
      parameters:
        - {name: kindId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkKindPatch'}}}}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/WorkKind'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      operationId: archiveWorkKind
      security: *auth
      parameters:
        - {name: kindId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/WorkKind'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /work-kinds/{kindId}/restore:
    post:
      operationId: restoreWorkKind
      security: *auth
      parameters:
        - {name: kindId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/WorkKind'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
components:
  schemas:
    WorkKindOrderWrite:
      type: object
      additionalProperties: false
      required: [slugs]
      properties:
        slugs: {type: array, maxItems: 256, uniqueItems: true, items: {type: string, maxLength: 48}}
    WorkKindOrderedPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/WorkKind'}}
        next_cursor: {type: 'null'}
    WorkKindPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/WorkKind'}}
        next_cursor: {type: [string, 'null'], format: uuid}
    WorkKindPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        words_de: {$ref: '#/components/schemas/WorkDisplayWords'}
        examples: {type: array, maxItems: 3, items: {type: string, maxLength: 120}}
        labels: {type: array, maxItems: 32, items: {type: string, maxLength: 48}}
        label: {type: string, minLength: 1, maxLength: 60}
        hint: {type: string, maxLength: 120}
        position: {type: integer, minimum: -1000000, maximum: 1000000}
    WorkKindWrite:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        words_de: {$ref: '#/components/schemas/WorkDisplayWords'}
        examples: {type: array, maxItems: 3, items: {type: string, maxLength: 120}}
        labels: {type: array, maxItems: 32, items: {type: string, maxLength: 48}}
        position: {type: integer, minimum: -1000000, maximum: 1000000}
        label: {type: string, minLength: 1, maxLength: 60}
        hint: {type: string, maxLength: 120}
        project_id: {type: string, format: uuid}

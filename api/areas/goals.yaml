# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/goals
paths:
  /goals:
    get:
      operationId: listGoals
      summary: List visible goals with current rollup
      description: "Filters include home and visible contributing projects. Totals ignore search/state/hide-done and span pages. Computed sorts use the displayed ETA or progress. Up to 100 goals share one materialized expansion query; state and ETA reuse the same invoker work scope. Aggregate root/pair/history budgets shrink the returned page with truncated true and a continuation cursor; a singleton that exceeds its budget is counts-only with expansion too_large. Full-filter totals and computed sorts use bounded batches across at most 1000 matching goals; larger sets require narrower project/group filters."
      security: *auth
      parameters:
        - {name: project, in: query, schema: {type: string, maxLength: 64}}
        - {name: group, in: query, schema: {type: string, maxLength: 64}, description: "Group UUID or none"}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: state, in: query, schema: {type: string, enum: [moving, queued, paused, done]}}
        - {name: hide_done, in: query, schema: {type: boolean, default: false}}
        - {name: sort, in: query, schema: {type: string, enum: [eta, name, progress, project, moving, queued, done], default: eta}}
        - {name: dir, in: query, schema: {type: string, enum: [asc, desc]}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 4096}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: "Visible goals and full-filter totals; totals_partial marks unexpanded oversized goals"
          headers:
            Aeon-Contract: {$ref: '#/components/headers/GoalsContract'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalList'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
    post:
      operationId: createGoal
      summary: Create a project or workspace goal
      description: "Creates a goal node and lazily restores the tenant goal/outcome kinds. Requires nodes.write in the destination. Replay rechecks the current created target."
      security: *auth
      parameters:
        - {$ref: '#/components/parameters/GoalIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalCreate'}
      responses:
        '200':
          description: "Created goal or authorized receipt replay"
          headers:
            Aeon-Contract: {$ref: '#/components/headers/GoalsContract'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalWriteResult'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /goals/status-note:
    get:
      operationId: getGoalStatusNote
      summary: Read the workspace status note
      description: "The workspace's one status paragraph, written by agents, with its author and time; note is null when none is set. Requires nodes.read in the workspace."
      security: *auth
      responses:
        '200':
          description: "The current note, or null"
          headers:
            Aeon-Contract: {$ref: '#/components/headers/GoalsContract'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalStatusNoteRead'}
        '403': {$ref: '#/components/responses/Error'}
    patch:
      operationId: setGoalStatusNote
      summary: Set or clear the workspace status note
      description: "A text of 1–2000 characters replaces the note and records the caller and time; null clears it. Repeating the current text changes nothing. Requires nodes.write in the workspace, rechecked in the write transaction before receipt replay. Each change appends goal.status_note_changed, delivered to topics=goals subscribers and the event stream."
      security: *auth
      parameters:
        - {$ref: '#/components/parameters/GoalIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalStatusNoteUpdate'}
      responses:
        '200':
          description: "Committed result or authorized receipt replay"
          headers:
            Aeon-Contract: {$ref: '#/components/headers/GoalsContract'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalStatusNoteWriteResult'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /goals/epics:
    get:
      operationId: listGoalEpics
      summary: List open epics in the goal shape
      description: "AEON-1395, Goals grouped by epics. An area is the topmost open parent work item in a visible project (no open work parent above it); its items are its direct children without Closed ones, and an item's keys are its own key followed by its children's. Takes the Goals list filters, sorts, page and cursor; cursors are bound to this grouping. Counts follow the children's status and live work: Moving is a live session, In progress or QA, or an open pull request or review; Done is Done, Delivered or Accepted; Paused is Backlog or paused on purpose; the rest is Queued. Progress is computed, never set by hand: completed estimate hours over all estimate hours of the epic's leaves (a parent's own estimate never counts), or completed leaves over all leaves while no leaf has an estimate. LANDS is the latest worker ETA over the open items, else the target release, else the suggested release (~ Next or Next +N from the work queue and release cadence, or the stored suggested release). Hide done keeps an open epic whose own status is open, with its failing checks. Notes and session ids need harness.read; an author name needs harness.read or members.read; a pull request state and a hold reason need delivery.read. Steps list what is missing: the epic's failing entry checks for its next status from the effective definition, in definition order, then held deliveries and blockers; no_active_build is not evaluated in this read. next_step is the first open item by ETA, else the first step. An epic with more than 200 items is counts-only with expansion too_large. Discovery is bounded to 1000 epics."
      security: *auth
      parameters:
        - {name: project, in: query, schema: {type: string, maxLength: 64}}
        - {name: group, in: query, schema: {type: string, maxLength: 64}, description: "Project group UUID or none"}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: state, in: query, schema: {type: string, enum: [moving, queued, paused, done]}}
        - {name: hide_done, in: query, schema: {type: boolean, default: false}}
        - {name: sort, in: query, schema: {type: string, enum: [eta, name, progress, project, moving, queued, done], default: eta}}
        - {name: dir, in: query, schema: {type: string, enum: [asc, desc]}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 4096}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: "Visible open epics and full-filter totals over their items; totals_partial marks counts-only epics"
          headers:
            Aeon-Contract: {$ref: '#/components/headers/GoalsContract'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EpicList'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /goals/{goalId}:
    parameters:
      - {name: goalId, in: path, required: true, schema: {type: string, maxLength: 64}, description: "Goal key or UUID; release nodes are also goals"}
    get:
      operationId: getGoal
      summary: Read a goal with visibility-filtered derived values
      description: "An outcome contributes only when its goal and every serves end are visible. Oversized expansion returns HTTP 200 with counts and expansion too_large, omitting outcome states, progress and ETA fallback. Passed uses a fixed ten-minute grace and is computed before scheduled revalidation."
      security: *auth
      responses:
        '200':
          description: "Goal snapshot"
          headers:
            Aeon-Contract: {$ref: '#/components/headers/GoalsContract'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalDetail'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateGoal
      summary: Atomically update a goal and its outcomes
      description: "Omitted fields stay unchanged; null clears them. Every upsert requires a client ref. Receipts bind tenant, actor, key, method, immutable target and canonical body. Current target authorization precedes replay. Replace requires the latest goal event watermark. Limits apply before writes. Authorized fresh writes lazily restore the goal/outcome kinds, including a release receiving its first outcome."
      security: *auth
      parameters:
        - {$ref: '#/components/parameters/GoalIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalUpdate'}
      responses:
        '200':
          description: "Committed result or authorized receipt replay, retaining its original watermark and changed flag"
          headers:
            Aeon-Contract: {$ref: '#/components/headers/GoalsContract'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalWriteResult'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /goals/{goalId}/history:
    get:
      operationId: goalHistory
      summary: Read bounded goal or immutable outcome history
      description: "Outcome history follows its immutable id across moves; it does not filter by the current goal or client ref. All events remain subject to current visibility. ETA popovers use value-bearing goal.eta_changed events and ignore change pings."
      security: *auth
      parameters:
        - {name: goalId, in: path, required: true, schema: {type: string, maxLength: 64}}
        - {name: outcome, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 19}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: "Newest first, with the next event-id cursor"
          headers:
            Aeon-Contract: {$ref: '#/components/headers/GoalsContract'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalHistory'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /goals/{goalId}/series:
    get:
      operationId: goalProgressSeries
      summary: Read bounded event-backed progress over time
      description: "24h uses 24 hourly UTC buckets, 7d uses 28 six-hour buckets, and 30d uses 30 daily buckets. Each value is as of the bucket end or now. Immutable outcome events preserve membership across moves. Each bucket includes delta versus the preceding bucket and changed_keys for visible outcome/ticket state transitions, including transitions with unchanged progress. Current visibility filters every point. Work-scope, event-count, byte and projection bounds return expansion too_large with no points."
      security: *auth
      parameters:
        - {name: goalId, in: path, required: true, schema: {type: string, maxLength: 64}}
        - {name: range, in: query, schema: {type: string, enum: [24h, 7d, 30d], default: 24h}}
      responses:
        '200':
          description: "Recorded progress, or an explicit oversized expansion"
          headers:
            Aeon-Contract: {$ref: '#/components/headers/GoalsContract'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalSeries'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
components:
  parameters:
    GoalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "8–200 permitted characters; auto: is reserved. Reuse the exact key and body after a lost response."
      schema: {type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{7,199}$'}
  headers:
    GoalsContract:
      description: "Goals API contract"
      schema: {type: string, enum: [goals/1.5]}
  schemas:
    GoalCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        project_id: {type: [string, 'null'], format: uuid, description: "Null or omitted creates a workspace goal"}
    GoalWriteResult:
      type: object
      additionalProperties: false
      required: [id, key, changed, read_through, generation]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        changed: {type: boolean}
        read_through: {type: integer, format: int64, minimum: 0}
        generation: {type: integer, format: int64, minimum: 1}
    GoalETAInput:
      type: [object, 'null']
      additionalProperties: false
      properties:
        text: {type: string, maxLength: 40}
        at: {type: [string, 'null'], format: date-time}
    GoalStep:
      type: object
      additionalProperties: false
      required: [id, text, state]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,31}$'}
        text: {type: string, minLength: 1, maxLength: 200}
        state: {type: string, enum: [done, now, later]}
    GoalOutcomeUpsert:
      type: object
      additionalProperties: false
      required: [ref]
      properties:
        ref: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
        label: {type: string, minLength: 1, maxLength: 300, description: "Required for a new outcome"}
        keys: {type: [array, 'null'], maxItems: 20, uniqueItems: true, items: {type: string, maxLength: 64}}
        state: {type: [string, 'null'], enum: [moving, queued, paused, done, null]}
        note: {type: [string, 'null'], maxLength: 200, description: "The item's live note; a changed text records its author and time, null or blank clears all three"}
        eta: {$ref: '#/components/schemas/GoalETAInput'}
        position: {type: [number, 'null'], exclusiveMinimum: -1000000000000000, exclusiveMaximum: 1000000000000000, multipleOf: 0.000000000000001}
    GoalOutcomeMove:
      type: object
      additionalProperties: false
      required: [outcome_id, to_goal]
      properties:
        outcome_id: {type: string, format: uuid}
        to_goal: {type: string, maxLength: 64}
        to_ref: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
    GoalUpdate:
      type: object
      additionalProperties: false
      properties:
        if_read_through: {type: integer, format: int64, minimum: 0}
        eta: {$ref: '#/components/schemas/GoalETAInput'}
        steps: {type: [array, 'null'], maxItems: 20, items: {$ref: '#/components/schemas/GoalStep'}}
        progress_override:
          type: [object, 'null']
          additionalProperties: false
          required: [pct]
          properties:
            pct: {type: integer, minimum: 0, maximum: 100}
            note: {type: string, maxLength: 200}
        items:
          type: object
          additionalProperties: false
          properties:
            mode: {type: string, enum: [merge, replace], default: merge}
            upsert: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/GoalOutcomeUpsert'}}
            remove: {type: array, maxItems: 200, uniqueItems: true, items: {type: string, maxLength: 64}}
            move: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/GoalOutcomeMove'}}
            handed_over:
              type: [object, 'null']
              additionalProperties: false
              required: [ref]
              properties:
                ref: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
                detail: {type: string, maxLength: 2000}
    GoalEffectiveETA: {"type":"object","required":["source","partial"],"properties":{"source":{"type":"string","enum":["none","agent","worker","outcomes"]},"text":{"type":"string","maxLength":40},"at":{"type":"string","format":"date-time"},"by":{"type":"string"},"partial":{"type":"boolean"}}}
    GoalCoverage: {"type":"object","required":["estimated_leaves","total_leaves"],"properties":{"estimated_leaves":{"type":"integer","minimum":0},"total_leaves":{"type":"integer","minimum":0}}}
    GoalStateCounts: {"type":"object","required":["moving","queued","paused","done"],"properties":{"moving":{"type":"integer","minimum":0},"queued":{"type":"integer","minimum":0},"paused":{"type":"integer","minimum":0},"done":{"type":"integer","minimum":0}}}
    GoalCounts: {"type":"object","required":["outcomes","tickets"],"properties":{"outcomes":{"type":"integer","minimum":0},"tickets":{"type":"integer","minimum":0}}}
    GoalProjectBadge: {"type":"object","required":["id","key","name","group_ids"],"properties":{"id":{"type":"string","format":"uuid"},"key":{"type":"string"},"name":{"type":"string"},"group_ids":{"type":"array","items":{"type":"string","format":"uuid"},"maxItems":1}}}
    GoalWaits: {"type":"object","required":["count","question_ids"],"properties":{"count":{"type":"integer","minimum":0},"question_ids":{"type":"array","items":{"type":"string","format":"uuid"},"maxItems":3}}}
    GoalProgress: {"type":"object","required":["pct","computed_pct","source","basis","total","done","items_without_estimate","items_partially_estimated","remaining_hours","remaining_unestimated"],"properties":{"pct":{"type":"integer","minimum":0,"maximum":100},"computed_pct":{"type":"integer","minimum":0,"maximum":100},"source":{"type":"string","enum":["computed","override"]},"basis":{"type":"string","enum":["count","estimate","mixed"]},"total":{"type":"integer","minimum":0},"done":{"type":"integer","minimum":0},"items_without_estimate":{"type":"integer","minimum":0},"items_partially_estimated":{"type":"integer","minimum":0},"override_by":{"type":"string","format":"uuid"},"override_at":{"type":"string","format":"date-time"},"override_note":{"type":"string","maxLength":200},"remaining_hours":{"type":"number","minimum":0,"description":"Estimate hours of the unfinished visible work leaves of unfinished items, each leaf once"},"remaining_unestimated":{"type":"integer","minimum":0,"description":"Unfinished work leaves counted in remaining_hours that carry no estimate"}}}
    GoalOutcome: {"type":"object","required":["id","ref","label","note","position","keys","state","session_ids","eta","passed","coverage","weight","handed_over"],"properties":{"id":{"type":"string","format":"uuid"},"ref":{"type":"string"},"label":{"type":"string"},"note":{"type":"string"},"position":{"type":"number"},"keys":{"type":"array","maxItems":20,"items":{"type":"string"}},"state":{"type":"string","enum":["moving","queued","paused","done"]},"reason":{"type":"string"},"session_ids":{"type":"array","maxItems":200,"items":{"type":"string","format":"uuid"}},"eta":{"$ref":"#/components/schemas/GoalEffectiveETA"},"passed":{"type":"boolean"},"coverage":{"$ref":"#/components/schemas/GoalCoverage"},"weight":{"type":"number","minimum":0},"handed_over":{"type":"boolean"},"note_by":{"type":"string","format":"uuid","description":"Principal who last changed the note"},"note_by_name":{"type":"string"},"note_at":{"type":"string","format":"date-time"},"merged_at":{"type":"string","format":"date-time","description":"A done item's latest merge, as recorded on its work leaves"}}}
    GoalDetail: {"type":"object","required":["id","key","title","kind","project_id","workspace","expansion","counts","steps","next_step","projects","waits","read_through","generation"],"properties":{"id":{"type":"string","format":"uuid"},"key":{"type":"string"},"title":{"type":"string"},"kind":{"type":"string","enum":["goal","release"]},"project_id":{"type":["string","null"],"format":"uuid"},"workspace":{"type":"boolean"},"expansion":{"type":"string","enum":["full","too_large"]},"counts":{"$ref":"#/components/schemas/GoalCounts"},"items":{"type":"array","maxItems":200,"items":{"$ref":"#/components/schemas/GoalOutcome"}},"steps":{"type":"array","maxItems":20,"items":{"$ref":"#/components/schemas/GoalStep"}},"next_step":{"anyOf":[{"$ref":"#/components/schemas/GoalStep"},{"type":"null"}]},"projects":{"type":"array","maxItems":4001,"items":{"$ref":"#/components/schemas/GoalProjectBadge"}},"waits":{"$ref":"#/components/schemas/GoalWaits"},"progress":{"$ref":"#/components/schemas/GoalProgress"},"eta":{"$ref":"#/components/schemas/GoalEffectiveETA"},"passed":{"type":"boolean"},"states":{"$ref":"#/components/schemas/GoalStateCounts"},"done":{"type":"boolean"},"read_through":{"type":"integer","minimum":0,"format":"int64"},"generation":{"type":"integer","minimum":1,"format":"int64"},"stall":{"$ref":"#/components/schemas/GoalStall"},"handed_over":{"$ref":"#/components/schemas/GoalHandedOver"}}}
    GoalList: {"type":"object","required":["items","totals","totals_partial","quiet_projects","truncated","read_through","generation"],"properties":{"items":{"type":"array","maxItems":100,"items":{"$ref":"#/components/schemas/GoalDetail"}},"totals":{"$ref":"#/components/schemas/GoalStateCounts"},"totals_partial":{"type":"boolean"},"quiet_projects":{"type":"object","required":["count","keys"],"properties":{"count":{"type":"integer","minimum":0},"keys":{"type":"array","maxItems":2000,"items":{"type":"string"}}}},"next_cursor":{"type":"string"},"truncated":{"type":"boolean"},"status_note":{"$ref":"#/components/schemas/GoalStatusNote"},"eta_last_set_at":{"type":"string","format":"date-time","description":"Latest authored ETA change over every goal and item the project/group filters match"},"read_through":{"type":"integer","minimum":0,"format":"int64"},"generation":{"type":"integer","minimum":1,"format":"int64"}}}
    GoalHistory: {"type":"object","required":["items","read_through","generation"],"properties":{"items":{"type":"array","maxItems":50,"items":{"$ref":"#/components/schemas/Event"}},"next_cursor":{"type":"string"},"read_through":{"type":"integer","minimum":0,"format":"int64"},"generation":{"type":"integer","minimum":1,"format":"int64"}}}
    GoalStall: {"type":"object","required":["stalled","since"],"properties":{"stalled":{"type":"boolean"},"since":{"type":"string","format":"date-time","description":"Last visibility-filtered displayed percentage change, or goal creation; moving outcomes and age at least four hours make stalled true"}}}
    GoalSeriesPoint: {"type":"object","required":["t","pct","basis","delta","keys","keys_truncated"],"properties":{"t":{"type":"string","format":"date-time"},"pct":{"type":"integer","minimum":0,"maximum":100},"basis":{"type":"string","enum":["count","mixed","estimate"]},"delta":{"type":"integer","minimum":-100,"maximum":100},"keys":{"type":"array","maxItems":200,"items":{"type":"string"}},"changed_keys":{"type":"array","maxItems":200,"items":{"type":"string"},"description":"Visible outcome and ticket keys whose state changed during the bucket; keys is a compatibility alias"},"keys_truncated":{"type":"boolean"}}}
    GoalSeries: {"type":"object","required":["range","expansion","read_through","generation"],"properties":{"range":{"type":"string","enum":["24h","7d","30d"]},"expansion":{"type":"string","enum":["full","too_large"]},"read_through":{"type":"integer","format":"int64","minimum":0},"generation":{"type":"integer","format":"int64","minimum":1},"points":{"type":"array","maxItems":200,"items":{"$ref":"#/components/schemas/GoalSeriesPoint"}}}}
    GoalHandedOver: {"type":"object","required":["outcome_id","label","detail","at","by"],"properties":{"outcome_id":{"type":"string","format":"uuid"},"label":{"type":"string","maxLength":300},"detail":{"type":"string","maxLength":2000},"at":{"type":"string","format":"date-time"},"by":{"type":"string","format":"uuid"}}}
    GoalStatusNote: {"type":"object","required":["text","by","by_name","set_at"],"properties":{"text":{"type":"string","minLength":1,"maxLength":2000},"by":{"type":"string","format":"uuid"},"by_name":{"type":"string"},"set_at":{"type":"string","format":"date-time"}},"description":"The workspace status note; only workspace readers receive it"}
    GoalStatusNoteRead: {"type":"object","required":["note","read_through","generation"],"properties":{"note":{"anyOf":[{"$ref":"#/components/schemas/GoalStatusNote"},{"type":"null"}]},"read_through":{"type":"integer","minimum":0,"format":"int64"},"generation":{"type":"integer","minimum":1,"format":"int64"}}}
    GoalStatusNoteWriteResult: {"type":"object","required":["changed","note","read_through","generation"],"properties":{"changed":{"type":"boolean"},"note":{"anyOf":[{"$ref":"#/components/schemas/GoalStatusNote"},{"type":"null"}]},"read_through":{"type":"integer","minimum":0,"format":"int64"},"generation":{"type":"integer","minimum":1,"format":"int64"}}}
    EpicETA: {"type":"object","required":["source","partial"],"properties":{"source":{"type":"string","enum":["none","worker","outcomes","release"],"description":"worker is a live or ready ETA a worker reported; outcomes the latest over the open items; release the target or suggested release, in text"},"text":{"type":"string","maxLength":40},"at":{"type":"string","format":"date-time"},"by":{"type":"string"},"partial":{"type":"boolean","description":"Some open items have no ETA yet"}}}

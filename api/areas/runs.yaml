# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/agentruns
paths:
  /runs:
    get:
      operationId: listAgentRuns
      description: Newest first by created_at and ID. Filters intersect; agents can read only their own runs with run.read. Cursor binds tenant, principal and filters. A session selects its explicitly bound run.
      parameters:
        - {name: session, in: query, schema: {type: string, format: uuid}}
        - {name: agent, in: query, schema: {type: string, format: uuid}}
        - {name: work_order, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Run page
          headers:
            Aeon-Event-Position: {$ref: '#/components/headers/EventPosition'}
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AgentRun'}}
                  next_cursor: {type: [string, 'null']}
        '400': {description: Invalid filter or cursor}
        '401': {description: Authentication required}
        '403': {description: Scope required or another agent requested}
  /runs/queued:
    get:
      operationId: listQueuedRuns
      description: "Paired daemon transport receives only allowlisted run metadata, without trace, recovery brief, labels or free-text outcome detail. Advertise run_content_v1 and acquire a capability during Prepare before reading content or claiming. Older daemons receive run_capability_upgrade_required and cannot claim. The poll omits per-run wait."
      security: [{agentKey: []}]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {name: X-Aeon-Run-Capability-Policy, in: header, schema: {type: string, const: run_content_v1}}
        - {name: X-Aeon-Review-Policy, in: header, schema: {type: string, enum: [no_tools_v1]}, description: Advertise no_tools_v1 to receive review runs. Legacy daemons receive ordinary runs only.}
      responses:
        '200': {description: "Queued metadata; Aeon-Run-Content-Policy advertises run_content_v1 and Aeon-Upgrade-Reason explains missing daemon support, including an empty queue", content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AgentRun'}}}}}
        '403': {$ref: '#/components/responses/Error'}
  /runs/queued/notifications:
    get:
      operationId: watchQueuedRunHints
      description: "Content-free queue.wake SSE hints for an agent daemon using its existing run.read key. Initial wake after subscribing covers startup and reconnect gaps. Only changes to its own queued runs wake it; no run or event content is returned. The exact key is rechecked before each hint and every 15 seconds. Connections last at most 30 minutes, with at most two per principal and 32 per server. Hints grant no dispatch authority; lifecycle reconciliation, account freshness, routing and final claims remain required."
      security: [{agentKey: []}]
      responses:
        '200': {description: "Queue hints and stream.ping keepalives", content: {text/event-stream: {schema: {type: string}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /runs/{runId}:
    get:
      operationId: getAgentRun
      description: "Paired transport receives metadata only. Run content requires the server-issued capability, checked against the exact run and current person/computer/generation on every transaction."
      security: *auth
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/RunCapability'}]
      responses:
        '200': {description: Run, headers: {Aeon-Event-Position: {$ref: '#/components/headers/EventPosition'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /runs/{runId}/capability:
    post:
      operationId: prepareRunCapability
      description: "Issue a run content credential to its paired daemon during Prepare. The server binds the credential to the existing run person, computer, account and currently probed daemon generation. Only a digest is stored. Missing person authority or a stale generation refuses issuance. No caller-selected person is accepted."
      security: [{agentKey: []}]
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-Aeon-Run-Capability-Policy, in: header, required: true, schema: {type: string, const: run_content_v1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [daemon_id, daemon_generation]
              properties:
                daemon_id: {type: string, maxLength: 200}
                daemon_generation: {type: string, maxLength: 200}
      responses:
        '200':
          description: "Ephemeral run credential; never persist or pass to a harness child"
          content:
            application/json:
              schema:
                type: object
                required: [capability, run_id, acting_person_id, computer_id, daemon_id, daemon_generation, expires_at]
                properties:
                  capability: {type: string, minLength: 64, maxLength: 64, readOnly: true}
                  run_id: {type: string, format: uuid}
                  acting_person_id: {type: string, format: uuid}
                  computer_id: {type: string, format: uuid}
                  daemon_id: {type: string}
                  daemon_generation: {type: string}
                  expires_at: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /runs/{runId}/cancel:
    post:
      operationId: cancelAgentRun
      summary: Cancel a queued run (AEON-402)
      description: Person with run.create permission and work-order edit access only. A queued run ends as cancelled and its capacity reservations are released in the same transaction (run.cancelled). A run that already started is never changed (409); repeating a cancel returns the cancelled run.
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Cancelled run, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /runs/{runId}/capacity-override:
    post:
      operationId: runNowOnce
      summary: Let a queued managed run skip its schedule and reserve once
      description: Person with run.create permission and work-order edit access only. Vendor, account, approval, freshness and concurrency fences still apply.
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [capacity_override], properties: {capacity_override: {type: string, const: now}}}}}}
      responses:
        '200': {description: Updated run, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /runs/{runId}/claim:
    post:
      operationId: claimAgentRun
      description: "Paired computers require their exact server-issued run content capability for an executable claim. A no-launch verification refusal remains metadata-only. Fenced daemon claim after account reservation. The caller must be the assigned agent or hold an approved run.claim grant for this run. Same generation is idempotent; a different live generation conflicts. A queued managed reservation with obsolete measured capacity is revalidated against current admission; a resource-scoped recovery permit is required only while a recoverable stop remains. Manual and pairing expiry still bind. Current person-confirmed sibling resources carry the same authority at reservation and claim. When the exact stored reservation set belongs to an obsolete quota pool or routing group, a queued managed claim atomically releases its holds and account slot and returns 409. A daemon observing that queued run without an account must discard its journaled route and route again before claiming. Invalid reservation IDs never release a hold. For an authenticated owning daemon, a revoked pairing enrollment returns 410 enrollment_revoked before reservation checks, including when disconnect has already released the queued holds."
      security: [{agentKey: []}]
      parameters:
        - {$ref: '#/components/parameters/RunCapability'}
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-Aeon-Review-Policy, in: header, schema: {type: string, enum: [no_tools_v1]}, description: Required for review claims. Ordinary run claims are unchanged.}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunClaim'}}}}
      responses:
        '200': {description: Claimed run, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
  /runs/daemon-waits:
    get:
      operationId: listRunDaemonWaits
      description: "Read checkout-wait reasons for up to 50 runs. Requires run.read. A person in the tenant may read any existing run. An agent receives only runs it owns; other runs are omitted. reason is null when no checkout wait is recorded. The value is process memory, not a field of the run."
      parameters:
        - name: ids
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 2048}
          description: "Comma-separated run ids, at most 50 UUIDs."
      responses:
        '200':
          description: "Checkout wait reasons."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      additionalProperties: false
                      required: [run_id, reason]
                      properties:
                        run_id: {type: string, format: uuid}
                        reason:
                          type: string
                          nullable: true
                          enum: [checkout_held_by_earlier_pairing]
                          description: "checkout_held_by_earlier_pairing means this computer's checkout is still held by an earlier pairing. Null means no checkout wait is recorded."
        '400': {$ref: '#/components/responses/Error'}
  /runs/{runId}/daemon-wait:
    get:
      operationId: getRunDaemonWait
      description: "Read one run's checkout-wait reason. Requires run.read. A person in the tenant may read any existing run. An agent who does not own the run receives 404. reason is null when no checkout wait is recorded. The value is process memory, not a field of the run."
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: "Checkout wait reason."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reason]
                properties:
                  reason:
                    type: string
                    nullable: true
                    enum: [checkout_held_by_earlier_pairing]
                    description: "checkout_held_by_earlier_pairing means this computer's checkout is still held by an earlier pairing. Null means no checkout wait is recorded."
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: putRunDaemonWait
      description: "Record or clear the checkout-wait reason for one run. Agent with run.claim only. reason checkout_held_by_earlier_pairing is accepted only while the run is queued. An empty reason clears the wait and is accepted after the run leaves the queue. Any other reason is rejected. The value is process memory, not a column on the run."
      security: [{agentKey: []}]
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: ["", checkout_held_by_earlier_pairing]
                  description: "checkout_held_by_earlier_pairing records the checkout sentence. An empty string clears it."
      responses:
        '200':
          description: "Stored checkout wait reason."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reason]
                properties:
                  reason:
                    type: string
                    nullable: true
                    enum: [checkout_held_by_earlier_pairing]
                    description: "The stored reason, or null after a clear."
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /runs/{runId}/handoff:
    get:
      operationId: getWorkerHandoff
      description: Read the durable lead assignment for a run. Requires current run.read and project access. Returns content-free ticket/order revisions, brief digest, opaque worktree identity and receipts; no paths, prompts, account details or worker leases. launch_unknown never authorizes retry. Lead succession does not transfer an active writer.
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Durable assignment, content: {application/json: {schema: {$ref: '#/components/schemas/WorkerHandoff'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /runs/{runId}/telemetry:
    post:
      operationId: reportRunTelemetry
      description: "Daemon reports monotonic sequence numbers; exact duplicate is idempotent and divergent replay conflicts. Telemetry is content-free. Totals, run status and event update atomically; budget excess blocks further dispatch. Model-only or error-only status and turn reports may precede started after a successful claim; an omitted status preserves the current run state. After observing local exit, a daemon may settle a rejected outbox with a fresh minimal finished/failed report using reporter_unavailable; rejected usage remains unconfirmed, never invented. The bounded report is decoded before catalog preparation. Eligible build completion, usage settlement, budget blocking, review resources and their ordered events commit together. Identical accepted sequence replay does not settle or queue twice; divergent replay is refused before setup. Lead assignments require local process evidence on finished reports. Unconfirmed ownership_lost remains fenced; a later finished exited report from the same authenticated daemon may reconcile it. No lead-generation change transfers the writer."
      security: [{agentKey: []}]
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunTelemetry'}}}}
      responses:
        '200': {description: Run, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  parameters:
    RunCapability:
      name: X-Aeon-Run-Capability
      in: header
      description: "Opaque server-issued run content credential. Required for content and launch through a paired computer; transport alone has metadata authority. Never log or persist. Stop/yield safety transport uses its exact worker proof without this credential."
      schema: {type: string, minLength: 64, maxLength: 64}
  schemas:
    RunClaim:
      type: object
      required: [daemon_id, daemon_generation, reservation_ids]
      properties:
        daemon_id: {type: string, minLength: 1, maxLength: 128}
        daemon_generation: {type: string, minLength: 1, maxLength: 128}
        reservation_ids: {type: array, items: {type: string, format: uuid}, description: Required and nonempty for a normal claim; empty for verification refusal.}
        handoff:
          allOf: [{$ref: '#/components/schemas/WorkerPickup'}]
          description: Required for a lead-routed assignment. Accepts the exact frozen brief and revisions with a host-local opaque worktree identity. Claim commits launch_unknown only after every pickup and reservation check succeeds, before any local process launch. A replay must retain this pickup and daemon generation; response loss is recovered through the existing durable daemon journal, never a second launch.
        routine:
          allOf: [{$ref: '#/components/schemas/RoutinePickup'}]
          description: 'Required for a routine launch intent. Binds qualified capability and exact daemon artifact to one opaque owner worktree; ordinary legacy claims omit it. Missing or stale evidence refuses routine launch before accepting a writer.'
        verification_unavailable:
          type: string
          enum: [adapter_unsupported, binding_incomplete, local_binding_missing]
          description: Fail an owned unclaimed pairing verification without launching it. Requires its owning computer principal and enrolled daemon; managed and already claimed runs are rejected. Idempotent for the same refusal. Records verification_error=verification_unavailable and verification_reason, and releases reserved allowance.
    RoutinePickup:
      type: object
      additionalProperties: false
      required: [launch_id, worktree_id, capability, daemon_digest, capability_digest, computer_id]
      properties:
        launch_id: {type: string, format: uuid}
        worktree_id: {type: string, pattern: '^[a-f0-9]{64}$'}
        capability: {type: string, const: routine_execution_v1}
        daemon_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        capability_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        computer_id: {type: string, format: uuid}
    RunTelemetry:
      type: object
      description: "A status report requires status, effective_model or a recognized error_code. Model and error evidence preserve the current run state when status is omitted. Empty status reports remain invalid."
      required: [sequence, kind]
      properties:
        process_state: {type: string, enum: [not_attempted, exited, unconfirmed], description: Content-free local journal proof on finished reports for lead assignments. not_attempted is allowed only before a launch receipt; unconfirmed never releases the writer fence. Legacy runs may omit this field.}
        service_tier: {$ref: '#/components/schemas/ServiceTier'}
        sequence: {type: integer, format: int64, minimum: 1}
        kind: {type: string, enum: [started, heartbeat, turn, tool, usage, status, finished]}
        status: {type: string, enum: [starting, running, waiting, completed, failed, cancelled, ownership_lost]}
        input_tokens_delta: {type: integer, format: int64, minimum: 0}
        output_tokens_delta: {type: integer, format: int64, minimum: 0}
        cached_input_tokens_delta: {type: integer, format: int64, minimum: 0, maximum: 1000000000000}
        reasoning_tokens_delta: {type: integer, format: int64, minimum: 0, maximum: 1000000000000, description: Reasoning output in this report. Not added to cost.}
        cost_micros_delta: {type: integer, format: int64, minimum: 0}
        tool_count_delta: {type: integer, minimum: 0}
        turn_count_delta: {type: integer, minimum: 0}
        effective_model: {type: string}
        model_evidence: {type: string, enum: [unverified, vendor_reported]}
        error_code: {type: string, enum: [event_stream_bound, app_server_protocol, child_exit_failed, turn_failed, child_stop_failed, ownership_lost, reporter_unavailable, workspace_conflict, decision_refused, vendor_limit]}
        limit_window: {type: string, enum: [5h, weekly, monthly, other], description: Present only when reported by the vendor.}
        limit_resets_at: {type: string, format: date-time, description: Present only when reported by the vendor.}
        review_range:
          type: object
          description: Optional exact range produced by a completed builder run. Automatically requests an independent review of that run's parent work leaf (or legacy ticket/task), subject to the caller's existing work_orders.write and run.create permissions. Reviewer runs cannot request recursive reviews.
          required: [repository, base_sha, head_sha]
          properties:
            repository: {type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'}
            base_sha: {type: string, pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'}
            head_sha: {type: string, pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'}
        git_commits:
          type: array
          maxItems: 20
          description: Optional commit evidence of this run, as non-merge commits on the first-parent history of its final HEAD that neither its launch commit, the default branch as it was at launch, nor the remote default branch at the end contains (at most 20, newest first). The server derives committed or no_commit from these, from the run's harness session commits, and from this run's work evidence. Local git never yields merged.
          items:
            type: object
            required: [sha, subject]
            properties:
              sha: {type: string, pattern: '^[0-9a-f]{7,40}$'}
              subject: {type: string, minLength: 1, maxLength: 200}
              parents: {type: integer, minimum: 0, maximum: 64, description: Parent count from git. Optional. A merge commit has at least two.}
              on_default_branch: {type: boolean, description: 'Optional and ignored. Kept for compatibility; merged comes from forge or release evidence, never from local git.'}
    WorkerPickup:
      type: object
      additionalProperties: false
      required: [ticket_revision, work_order_revision, brief_sha256, worktree_id]
      properties:
        ticket_revision: {type: string, format: date-time}
        work_order_revision: {type: integer, format: int64, minimum: 1}
        brief_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        worktree_id: {type: string, pattern: '^[a-f0-9]{64}$', description: 'Domain-separated digest of stable host identity and physical workspace, independent of daemon or tenant selection. No filesystem path or credential.'}

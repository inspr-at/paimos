  /aithema/ledger/sessions/{sid}/settle:
    post:
      operationId: aithemaLedgerSettlePost
      summary: Aithema ledger settle
      description: Requires the exact aithema.ledger capability in a verified delegated token. Tenant, session, plugin and actor are bound to host-owned authorization; project and committed claim ownership are required. The token generation and epoch must match the claim (403 otherwise); its owner may settle after takeover, epoch change or purge, closing an open claim as unknown charged at maximum. A closed hold returns its recorded result. Exact settlement retries return that result; different bytes conflict when a settlement already committed. Responses are uncached.
      security: [{aithemaDelegated: []}]
      parameters:
        - {name: sid, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:

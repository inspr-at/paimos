paths:
  /projects/{projectId}/delivery-reviews:
    parameters: [{"name":"projectId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
    get: {"operationId":"listDeliveryReviews","description":"Requires delivery_reviews.read. Bounded position keyset pagination of shadow review rounds. All proposed actions are observations and confer no approval authority.","security":[{"session":[]},{"agentKey":[]}],"responses":{"200":{"description":"Shadow review result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryReviewPage"}}}},"400":{"$ref":"#/components/responses/Error"},"403":{"$ref":"#/components/responses/Error"},"404":{"$ref":"#/components/responses/Error"},"409":{"description":"Conflicting retry, stale revision or unavailable binding"}},"parameters":[{"name":"after","in":"query","schema":{"type":"string","pattern":"^[0-9]{1,19}$"}},{"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":50}}]}
    post: {"operationId":"queueDeliveryReview","description":"Requires explicit delivery_reviews.manage. Records an idempotent shadow review for a completed delivery round and completed build run on the same leaf. Author family comes from the run profile. Continuations use the latest review of this slug and cannot reset the two gate-triggered fix cap. No worker starts.","security":[{"session":[]},{"agentKey":[]}],"responses":{"200":{"description":"Shadow review result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryReviewRound"}}}},"400":{"$ref":"#/components/responses/Error"},"403":{"$ref":"#/components/responses/Error"},"404":{"$ref":"#/components/responses/Error"},"409":{"description":"Conflicting retry, stale revision or unavailable binding"},"201":{"description":"Shadow review result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryReviewRound"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryReviewInput"}}}}}
  /projects/{projectId}/delivery-reviews/settings:
    parameters: [{"name":"projectId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
    get: {"operationId":"getDeliveryReviewSettings","description":"Requires delivery_reviews.read. Default off; only shadow mode is supported.","security":[{"session":[]},{"agentKey":[]}],"responses":{"200":{"description":"Shadow review result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryReviewSettings"}}}},"400":{"$ref":"#/components/responses/Error"},"403":{"$ref":"#/components/responses/Error"},"404":{"$ref":"#/components/responses/Error"},"409":{"description":"Conflicting retry, stale revision or unavailable binding"}}}
    put: {"operationId":"putDeliveryReviewSettings","description":"Requires explicit delivery_reviews.manage and current revision. Records a project switch change as an event.","security":[{"session":[]},{"agentKey":[]}],"responses":{"200":{"description":"Shadow review result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryReviewSettings"}}}},"400":{"$ref":"#/components/responses/Error"},"403":{"$ref":"#/components/responses/Error"},"404":{"$ref":"#/components/responses/Error"},"409":{"description":"Conflicting retry, stale revision or unavailable binding"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryReviewSettings"}}}}}
  /projects/{projectId}/delivery-reviews/{reviewId}/claim:
    parameters: [{"name":"projectId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"reviewId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
    post: {"operationId":"claimDeliveryReview","description":"Requires explicit delivery_reviews.claim. Resolves the current reviewer route from preferences, qualified accounts and current AEON-851 family policy. One claimant per review; request UUID is bound to caller and comparison. Always execute=false. Every decision is recorded, including off or unavailable routes.","security":[{"session":[]},{"agentKey":[]}],"responses":{"200":{"description":"Shadow review result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryReviewClaim"}}}},"400":{"$ref":"#/components/responses/Error"},"403":{"$ref":"#/components/responses/Error"},"404":{"$ref":"#/components/responses/Error"},"409":{"description":"Conflicting retry, stale revision or unavailable binding"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryReviewClaimInput"}}}}}
  /projects/{projectId}/delivery-reviews/{reviewId}/verdict:
    parameters: [{"name":"projectId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"reviewId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
    post: {"operationId":"recordDeliveryReviewVerdict","description":"Requires explicit delivery_reviews.report and original claimant. Ingests a bounded script observation for the pinned head and selected profile, rechecking the current target, completed author run, route identity and policy. High/Medium block; changes with only Low/Nit becomes ok. Two gate-triggered fix rounds are proposed, then a lead decision. Low/Nit become one proposed sibling follow-up ticket per verdict with pills. Script action comparison is recorded. These shadow proposals never create tickets, Desk requests, build rounds, GitHub statuses or shipping authority.","security":[{"session":[]},{"agentKey":[]}],"responses":{"200":{"description":"Shadow review result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryReviewRound"}}}},"400":{"$ref":"#/components/responses/Error"},"403":{"$ref":"#/components/responses/Error"},"404":{"$ref":"#/components/responses/Error"},"409":{"description":"Conflicting retry, stale revision or unavailable binding"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeliveryReviewVerdictInput"}}}}}

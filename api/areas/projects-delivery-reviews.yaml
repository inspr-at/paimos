":[{"$ref":"#/components/schemas/DeliveryRoundInput"},{"type":"null"}]},"follow_up":{"oneOf":[{"$ref":"#/components/schemas/DeliveryReviewFollowUp"},{"type":"null"}]},"lead_decision":{"oneOf":[{"$ref":"#/components/schemas/DeliveryReviewLeadDecision"},{"type":"null"}]},"agreement":{"oneOf":[{"type":"boolean"},{"type":"null"}]}}}

components:
  headers:
    NativeSessionContract:
      description: "Owned native session wire contract, independent of the product release."
      schema:
        type: "string"
        enum: ["native-session/1.0"]
  schemas:
    NativeBinding:
      type: "object"
      additionalProperties: false
      required: ["tenant_id", "project_id", "owned_session_id", "harness_session_id", "runtime_epoch", "daemon_id", "daemon_generation", "binding_revision", "run_id"]
      properties:
        tenant_id:
          type: "string"
          format: "uuid"
        project_id:
          type: "string"
          format: "uuid"
        owned_session_id:
          type: "string"
          format: "uuid"
        harness_session_id:
          type: "string"
          format: "uuid"
        runtime_epoch:
          type: "string"
          format: "uuid"
        daemon_id:
          type: "string"
          minLength: 1
          maxLength: 128
        daemon_generation:
          type: "string"
          minLength: 1
          maxLength: 128
        binding_revision:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        run_id:
          anyOf: [{"type": "string", "format": "uuid"}, {"type": "null"}]
    NativeCapabilities:
      type: "object"
      additionalProperties: false
      required: ["input", "steer", "interrupt", "stop", "resume", "take", "expert", "terminal_view", "approvals", "questions", "correlated_receipts", "quota", "qualification_digest", "take_supported", "events_supported", "interrupt_supported", "chat_supported"]
      properties:
        input:
          type: "boolean"
        steer:
          type: "string"
          enum: ["native", "queued", "next_step", "unsupported"]
        interrupt:
          type: "boolean"
        stop:
          type: "boolean"
        resume:
          type: "boolean"
        take:
          type: "boolean"
        expert:
          type: "boolean"
        terminal_view:
          type: "boolean"
        approvals:
          type: "boolean"
        questions:
          type: "boolean"
        correlated_receipts:
          type: "boolean"
        quota:
          type: "string"
          enum: ["stream", "stream_and_qualified_idle", "unsupported"]
        qualification_digest:
          type: "string"
          pattern: "^[0-9a-f]{64}$"
        take_supported:
          type: "boolean"
        events_supported:
          type: "boolean"
        interrupt_supported:
          type: "boolean"
        chat_supported:
          type: "boolean"
    NativePolicy:
      type: "object"
      additionalProperties: false
      required: ["grant_id", "grant_revision", "expires_at", "tool_policy_digest", "settings_policy_digest", "permission_policy", "local_history", "continuation", "maximum_runtime_seconds", "maximum_turns", "maximum_tokens"]
      properties:
        grant_id:
          type: "string"
          format: "uuid"
        grant_revision:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        expires_at:
          type: "string"
          format: "date-time"
        tool_policy_digest:
          type: "string"
          pattern: "^[0-9a-f]{64}$"
        settings_policy_digest:
          type: "string"
          pattern: "^[0-9a-f]{64}$"
        permission_policy:
          type: "string"
          enum: ["supervised", "bounded_preapproved"]
        local_history:
          type: "string"
          enum: ["disabled", "vendor_native"]
        continuation:
          type: "string"
          enum: ["manual", "bounded_preapproved"]
        maximum_runtime_seconds:
          type: "integer"
          minimum: 1
          maximum: 86400
        maximum_turns:
          type: "integer"
          minimum: 1
          maximum: 100000
        maximum_tokens:
          type: "integer"
          minimum: 1
          maximum: 100000000
    NativeSessionView:
      type: "object"
      additionalProperties: false
      required: ["owned_session_id", "current_binding", "owner_person_id", "role", "profile", "harness", "state", "mode", "capabilities", "revision", "conversation_ref", "predecessor_harness_session_id", "controller", "quota", "last_receipt", "reason", "generation", "terminal_viewer_url"]
      properties:
        owned_session_id:
          type: "string"
          format: "uuid"
        current_binding:
          anyOf: [{"$ref": "#/components/schemas/NativeBinding"}, {"type": "null"}]
        owner_person_id:
          type: "string"
          format: "uuid"
        role:
          type: "string"
          enum: ["coordinator", "worker"]
        profile:
          type: "string"
          enum: ["native"]
        harness:
          type: "string"
          enum: ["claude", "codex", "cursor", "grok", "pi", "gemini", "opencode"]
        state:
          type: "string"
          enum: ["accepted", "waiting_for_exit", "starting", "idle", "running", "requires_action", "quiescing", "taken", "returning", "recovering", "ownership_lost", "stopping", "stopped", "failed"]
        mode:
          type: "string"
          enum: ["structured", "terminal", "none"]
        capabilities:
          $ref: "#/components/schemas/NativeCapabilities"
        revision:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        conversation_ref:
          type: "string"
          minLength: 1
          maxLength: 128
        predecessor_harness_session_id:
          anyOf: [{"type": "string", "format": "uuid"}, {"type": "null"}]
        controller:
          anyOf: [{"$ref": "#/components/schemas/NativeControllerView"}, {"type": "null"}]
        quota:
          anyOf: [{"$ref": "#/components/schemas/NativeQuota"}, {"type": "null"}]
        last_receipt:
          anyOf: [{"$ref": "#/components/schemas/NativeReceipt"}, {"type": "null"}]
        reason:
          anyOf: [{"$ref": "#/components/schemas/NativeReason"}, {"type": "null"}]
        generation:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        terminal_viewer_url:
          anyOf: [{"type": "string", "format": "uri", "minLength": 1, "maxLength": 2048}, {"type": "null"}]
    NativeStartIntent:
      type: "object"
      additionalProperties: false
      required: ["request_id", "expected_project_revision", "role", "profile", "harness", "computer_id", "account_id", "workspace_id", "model_profile_id", "work_id", "parent_harness_session_id", "resume_from_owned_session_id", "policy_id"]
      properties:
        request_id:
          type: "string"
          format: "uuid"
        expected_project_revision:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        role:
          type: "string"
          enum: ["coordinator", "worker"]
        profile:
          type: "string"
          enum: ["native"]
        harness:
          type: "string"
          enum: ["claude", "codex", "cursor", "grok", "pi", "gemini", "opencode"]
        computer_id:
          type: "string"
          format: "uuid"
        account_id:
          type: "string"
          format: "uuid"
        workspace_id:
          type: "string"
          minLength: 1
          maxLength: 128
        model_profile_id:
          type: "string"
          format: "uuid"
        work_id:
          anyOf: [{"type": "string", "format": "uuid"}, {"type": "null"}]
        parent_harness_session_id:
          anyOf: [{"type": "string", "format": "uuid"}, {"type": "null"}]

# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/phoneapprovals
paths:
  /phone-approvals/{kind}/{requestId}:
    get:
      operationId: getPhoneApproval
      description: Review live server context. Attach is restricted to its computer owner. Gates preserve existing permission checks.
      security: [{session: []}]
      parameters: [{name: kind, in: path, required: true, schema: {type: string, enum: [approval, attach]}}, {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/PhoneApprovalReview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /phone-approvals/{kind}/{requestId}/decision:
    post:
      operationId: decidePhoneApproval
      description: Verify required WebAuthn UV, origin, RP ID, signature, counter, request hash and one-use challenge in the existing decision transaction. Push payload never authorizes a decision. Missing, unauthorized, expired and already decided store requests return 404 request unavailable; phone verification errors retain their status.
      security: [{session: []}]
      parameters: [{name: kind, in: path, required: true, schema: {type: string, enum: [approval, attach]}}, {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PhoneDecisionProof'}}}}
      responses:
        '200': {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/PhoneApprovalReview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /phone-approvals/{kind}/{requestId}/options:
    post:
      operationId: beginPhoneDecision
      description: Fresh 2-minute challenge includes request ID and hash, person, tenant, decision and reason.
      security: [{session: []}]
      parameters: [{name: kind, in: path, required: true, schema: {type: string, enum: [approval, attach]}}, {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PhoneDecision'}}}}
      responses:
        '200': {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/PhoneCeremony'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  schemas:
    PhoneApprovalReview:
      type: object
      required: [kind, request_id, request_hash, pending]
      properties:
        kind: {type: string, enum: [approval, attach]}
        request_id: {type: string, format: uuid}
        request_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        pending: {type: boolean}
        approval: {$ref: '#/components/schemas/Approval'}
        attach: {$ref: '#/components/schemas/AttachView'}
    PhoneDecision:
      type: object
      additionalProperties: false
      required: [decision, request_hash]
      properties:
        decision: {type: string, enum: [approved, denied]}
        reason: {type: string, maxLength: 4000}
        request_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    PhoneDecisionProof:
      type: object
      additionalProperties: false
      required: [decision, request_hash, challenge_id, credential]
      properties:
        decision: {type: string, enum: [approved, denied]}
        reason: {type: string, maxLength: 4000}
        request_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        challenge_id: {type: string, format: uuid}
        credential: {type: object}

# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/delivery
paths:
  /github/webhook:
    post:
      operationId: deliveryGitHubWebhook
      description: 'Public ingress authenticated solely by the host-owned GitHub App HMAC, delivery ID, installation and repository binding. Stores verified payloads before processing, checkpoints completed steps and retries unfinished work internally. Reusing a delivery ID with different authenticated content is refused.'
      security: []
      parameters:
        - {name: X-Hub-Signature-256, in: header, required: true, schema: {type: string}}
        - {name: X-GitHub-Delivery, in: header, required: true, schema: {type: string, maxLength: 128}}
        - {name: X-GitHub-Event, in: header, required: true, schema: {type: string, enum: [pull_request, check_run, check_suite, merge_group, push, status, workflow_run]}}
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '204': {description: 'Verified delivery accepted; unfinished merge proof or ticket-gate work remains queued'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
components:

# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/portal
paths:
  /portal/products/{productId}:
    patch:
      operationId: editPortalProduct
      summary: Edit the public product title, summary or publication
      description: settings.manage, people only. Agents are refused. published true stores state published; false stores unpublished. Omitted fields stay as they are.
      security: [{session: []}]
      parameters: [{name: productId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PortalProductEdit'}}}}
      responses:
        '428': {$ref: '#/components/responses/OwnerWorkstationStepUpRequired'}
        '200': {description: Product after the edit, content: {application/json: {schema: {$ref: '#/components/schemas/PortalModeration'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /portal/products/{productId}/market:
    parameters:
      - {name: productId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: readPortalMarketProduct
      summary: Read the comparison, its history and pending corrections
      description: settings.manage, people only. Agents are refused. History and corrections are admin-only. Quotes stay off the public page until a cell is approved.
      security: [{session: []}]
      responses:
        '200': {description: Comparison for the current product, content: {application/json: {schema: {$ref: '#/components/schemas/PortalMarket'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /portal/products/{productId}/pace:
    parameters:
      - {name: productId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: readPortalPaceProduct
      summary: Read the linked project and the aggregated pace figures
      description: settings.manage, people only. The project title is admin-only. This read returns the exact counts and medians, including a sample smaller than five. The public document omits those small figures.
      security: [{session: []}]
      responses:
        '200': {description: Pace for this portal, content: {application/json: {schema: {$ref: '#/components/schemas/PortalPace'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    put:
      operationId: writePortalPaceProduct
      summary: Link one project whose release dates become the public count, clear it, or choose whether its frozen notes are public
      description: settings.manage, people only. Sending project_id alone keeps release history when the project stays the same and turns it off when the project changes, and advances the link revision. Sending release_history also sends the project_id and revision from the read this publish is based on. That write is one update matching both, so it cannot publish notes for a project linked later; a mismatch is 409 and leaves the link as it is. Clearing the link deletes the row and keeps the issued revision, so linking again receives a new revision and a history write from before the clear does not match. Clearing the link and setting release history in one body is refused. Release history without that project and revision is refused.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PortalPaceWrite'}}}}
      responses:
        '200': {description: Pace after the link, content: {application/json: {schema: {$ref: '#/components/schemas/PortalPace'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /portal/products/{productId}/settings:
    parameters:
      - {name: productId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: readPortalProductSettings
      summary: Read one product's address and participation policy
      description: People with settings.manage only. Does not publish or enable participation.
      security: [{session: []}]
      responses:
        '200': {description: Stored product settings, content: {application/json: {schema: {$ref: '#/components/schemas/PortalProductSettings'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: writePortalProductSettings
      summary: Configure one product with a revision check
      description: People with settings.manage only. Tenant then tree then product fences serialize policy, default and publication changes with intake, votes and wish moves. New products start disabled. Existing products retain legacy participation. Registered activation is refused until B3, B8 and B7 have passed their activation gate. A stale revision returns 409. Changing the default never falls back to another published product. Events and settings commit together.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PortalProductSettingsWrite'}}}}
      responses:
        '200': {description: Stored product settings, content: {application/json: {schema: {$ref: '#/components/schemas/PortalProductSettings'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'Stale revision, address already used, or registered participation not ready'}
components:
  schemas:
    PortalProductEdit:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        summary: {type: string, maxLength: 4000}
        published: {type: boolean}
    PortalProductSettings:
      type: object
      additionalProperties: false
      required: [product_id, slug, published, is_default, participation_policy, revision, theme_revision]
      properties:
        product_id: {type: string, format: uuid}
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
        published: {type: boolean}
        is_default: {type: boolean}
        participation_policy: {type: string, enum: [disabled, legacy, registered]}
        revision: {type: integer, minimum: 1}
        theme_revision: {type: integer, minimum: 0, description: Reserved for a reviewed theme revision; B1 uses zero}
        registered_since: {type: string, format: date-time}
        anonymous_history_until: {type: string, format: date-time}
    PortalProductSettingsWrite:
      type: object
      additionalProperties: false
      required: [revision, slug, published, participation_policy]
      properties:
        revision: {type: integer, minimum: 1}
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
        published: {type: boolean}
        is_default: {type: boolean, description: True selects this product as default; omission preserves the current default}
        participation_policy: {type: string, enum: [disabled, legacy, registered]}

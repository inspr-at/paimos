# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/attachments
paths:
  /attachments/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getAttachment
      description: 'Read live attachment metadata by ID with attachments.read and current node/project visibility.'
      security: *auth
      responses:
        '200': {description: 'Tenant-scoped attachment metadata', content: {application/json: {schema: {$ref: '#/components/schemas/Attachment'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateAttachment
      description: Tenant staff people only. Optional If-Unmodified-Since compares the exact updated_at timestamp under row lock; stale writes return 412.
      security: *auth
      parameters: [{name: If-Unmodified-Since, in: header, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, minProperties: 1, additionalProperties: false, properties: {caption: {type: string}, position: {type: string, description: Decimal rank}}}}}}
      responses:
        '200': {description: Updated attachment, content: {application/json: {schema: {$ref: '#/components/schemas/Attachment'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
    delete:
      operationId: removeAttachment
      description: Tenant staff people only.
      security: *auth
      responses:
        '204': {description: Soft deleted}
        '404': {$ref: '#/components/responses/Error'}
  /attachments/{id}/content:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getAttachmentContent
      description: Tenant staff people only.
      security: *auth
      parameters: [{name: variant, in: query, schema: {type: string, enum: [original, preview, thumb], default: original}}]
      responses:
        '200': {description: Tenant-scoped bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '304': {description: ETag matched}
        '404': {$ref: '#/components/responses/Error'}
  /attachments/{id}/preview:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: createAttachmentPreview
      summary: Mint a short-lived HTML preview capability for a browser session
      description: |
        Person session only; attachments.read and current node/project visibility are
        checked at issuance and every content request. No request body. The capability
        is bound to the session, tenant, project, node, attachment and immutable digest.
        It is not an API credential. Do not persist, log, share or cache the returned URL.
        Missing/unsafe sandbox configuration returns available=false; originals remain
        downloadable. The sandbox origin serves no app/auth routes or cookies.
        Use iframe sandbox="allow-scripts" and referrerpolicy="no-referrer".
        Inline scripts/styles and data images/fonts only. Frame self-navigation remains
        possible; this is an origin isolation boundary, not a network sandbox.
      security: *auth
      responses:
        '200':
          description: Private, no-store preview availability
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: {type: boolean}
                  url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
components:

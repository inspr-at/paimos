# aeon:owner internal/httpapi
paths:
  /ready:
    get:
      summary: Readiness for new requests
      description: >-
        Load-balancer probe. 200 only while this process is accepting HTTP,
        is not draining, and the database ping succeeds. The ping is capped
        at 500ms so an unbounded caller cannot hold it open. A cancelled
        request or an earlier caller deadline still cancels or shortens it.
        A drain that starts during the ping still returns 503. GET /health
        stays liveness and still returns 200 while this endpoint returns 503.
      responses:
        "200":
          description: Accept new requests
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ready]}
        "503":
          description: Do not send new requests
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [unavailable]}
components:

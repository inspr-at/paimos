# aeon:owner internal/delivery
paths:
  /delivery:
    get:
      operationId: listDelivery
      description: 'Observe-only delivery rows the caller may read. A project or ticket filter requires delivery.read on that project. An unscoped list is allowed when delivery.read is held on the workspace or on any project, and returns only projects where this caller holds delivery.read. Rows with no project are included only when the workspace grant holds. Bounded UUID keyset pagination.'
      security: [{session: []}, {agentKey: []}]
      parameters:
        - {name: project, in: query, schema: {type: string, maxLength: 64}}
        - {name: state, in: query, schema: {$ref: '#/components/schemas/DeliveryState'}}
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: 'Delivery page', content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /delivery/alerts:
    get:
      operationId: listDeliveryAlerts
      description: 'Observe-only stall alerts visible to the caller. Requires delivery.read; project keys and bounded episode keyset pagination are supported.'
      security: [{session: []}, {agentKey: []}]
      parameters:
        - {name: project, in: query, schema: {type: string, maxLength: 64}}
        - {name: open, in: query, description: 'True lists uncleared alerts; false lists cleared alerts. Omit to list both.', schema: {type: boolean}}
        - {name: after, in: query, schema: {type: string, maxLength: 256}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: 'Delivery alert page', content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryAlertPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /delivery/audit:
    get:
      operationId: listDeliveryMergeAudit
      description: 'Observe-only merge audit visible to the caller. Requires delivery.read; project keys and flagged rows can be filtered with bounded repository and SHA keyset pagination. Does not grant merge authority.'
      security: [{session: []}, {agentKey: []}]
      parameters:
        - {name: project, in: query, schema: {type: string, maxLength: 64}}
        - {name: flagged, in: query, schema: {type: boolean}}
        - {name: after, in: query, schema: {type: string, maxLength: 768}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: 'Merge audit page', content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryAuditPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /delivery/enqueue-allowed:
    get:
      operationId: getDeliveryEnqueueAllowed
      description: 'Requires delivery.read on the visible PR project. Observe-only answer for an exact PR head; required CI queue failures block that head, infra failures do not. Makes no GitHub write. At most 100 failures are returned; overflow is an explicit error.'
      security: [{session: []}, {agentKey: []}]
      parameters:
        - {name: repository, in: query, required: true, schema: {type: string, maxLength: 255, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'}}
        - {name: pr, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 2147483647}}
        - {name: head, in: query, required: true, schema: {type: string, pattern: '^[0-9a-f]{40}$'}}
      responses:
        '200': {description: 'Observed quarantine answer', content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryEnqueueAllowed'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /delivery/{itemId}/hold:
    parameters:
      - {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: holdDelivery
      parameters:
        - {in: header, name: If-Unmodified-Since, required: false, schema: {type: string, maxLength: 64}, description: 'Current delivery updated_at as RFC3339. A mismatch returns 412.'}
      description: 'Requires delivery.manage on the current project. Records a hold with a reason; makes no GitHub write.'
      security: [{session: []}, {agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 1000}}}}}}
      responses:
        '412': {description: 'The current revision changed; reload before writing.'}
        '200': {description: 'Held row', content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryItem'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: releaseDeliveryHold
      parameters:
        - {in: header, name: If-Unmodified-Since, required: false, schema: {type: string, maxLength: 64}, description: 'Current delivery updated_at as RFC3339. A mismatch returns 412.'}
      description: 'Requires delivery.manage on the current project. Recomputes the observed state and records the release.'
      security: [{session: []}, {agentKey: []}]
      responses:
        '412': {description: 'The current revision changed; reload before writing.'}
        '200': {description: 'Released row', content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryItem'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
components:
  schemas:
    DeliveryAlert:
      type: object
      required: [item_id, state, state_since, alerted_at, recipient_principal_id, inbox_message_id, cleared_at]
      properties:
        item_id: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/DeliveryState'}
        state_since: {type: string, format: date-time}
        alerted_at: {type: string, format: date-time}
        recipient_principal_id: {type: [string, 'null'], format: uuid}
        inbox_message_id: {type: [string, 'null'], format: uuid}
        cleared_at: {type: [string, 'null'], format: date-time}
    DeliveryAlertPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/DeliveryAlert'}}
        next_cursor: {type: [string, 'null'], maxLength: 256}
    DeliveryAudit:
      type: object
      required: [repository, merge_sha, pull_request, ticket_node_id, project_id, merged_by, via_queue, checks_passed, review_ok, flags, at, alerted_at]
      properties:
        repository: {type: string}
        merge_sha: {type: string}
        pull_request: {type: [integer, 'null'], format: int64}
        ticket_node_id: {type: [string, 'null'], format: uuid}
        project_id: {type: [string, 'null'], format: uuid}
        merged_by: {type: string, maxLength: 100, description: 'GitHub merged_by for a PR or the authenticated push sender. Empty when reconciliation cannot prove the direct pusher.'}
        via_queue: {type: boolean}
        checks_passed: {type: boolean}
        review_ok: {type: boolean}
        flags: {type: array, items: {type: string, enum: [no_queue, checks_missing, no_review, direct_push]}}
        at: {type: string, format: date-time}
        alerted_at: {type: [string, 'null'], format: date-time, description: 'Null until an alert can be accepted by an authorized project lead. Unlinked merges remain visible in the workspace audit.'}
    DeliveryAuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/DeliveryAudit'}}
        next_cursor: {type: [string, 'null']}
    DeliveryEnqueueAllowed:
      type: object
      additionalProperties: false
      required: [allowed, reason, failures]
      properties:
        allowed: {type: boolean}
        reason: {type: string, description: 'Plain sentence explaining this exact head.'}
        failures:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DeliveryQueueFailure'}
    DeliveryQueueFailure:
      type: object
      additionalProperties: false
      required: [check, conclusion, kind, at]
      properties:
        check: {type: string}
        conclusion: {type: string}
        kind: {type: string, enum: [required_failure, infra]}
        at: {type: string, format: date-time}

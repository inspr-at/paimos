# aeon:owner internal/harness
paths:
  /projects/{projectId}/routine-execution-settings:
    parameters:
      - {$ref: '#/components/parameters/projectId'}
    get:
      operationId: getRoutineExecutionSettings
      summary: Read effective routine execution consent
      description: 'Requires harness.read. Default off. Saved consent is effective only while the exact qualification, current owner policy and trusted runtime observations match. No read grants execution.'
      responses:
        '200':
          description: 'Redacted current execution settings'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoutineExecutionSettings'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: putRoutineExecutionSettings
      summary: Change person-owned project execution consent
      security: [{session: []}]
      description: 'Interactive person only, with live harness.control and run.create and canonical owner or administrator authority, rechecked under tenant/tree fences. Enabling requires accepted coordinator evidence, OPS attestation and matching exact artifacts, capabilities, owner policy, host mapping and budget modes. Disabling blocks future grants and preserves unknown processes and accounting holds. This endpoint launches no process and cannot record qualification evidence.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, automatic_launch_enabled, qualification_id]
              properties:
                expected_revision: {type: integer, minimum: 0}
                automatic_launch_enabled: {type: boolean, default: false}
                qualification_id: {type: [string, 'null'], format: uuid, description: 'Accepted qualification UUID required for enable; null is accepted for disable.'}
      responses:
        '200':
          description: 'Saved consent and its effective state'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoutineExecutionSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Stale revision or missing, changed or unavailable qualification, policy or runtime.'}
components:
  schemas:
    RoutineExecutionSettings:
      type: object
      additionalProperties: false
      required: [revision, automatic_launch_enabled, consent_enabled, qualification_id, wait_reason]
      properties:
        revision: {type: integer, minimum: 0}
        automatic_launch_enabled: {type: boolean, default: false, description: 'Effective consent, never an admission or process-launch grant.'}
        consent_enabled: {type: boolean, default: false, description: 'Saved person intent; invalid qualification keeps effective consent off.'}
        qualification_id: {type: [string, 'null'], format: uuid}
        wait_reason: {type: string}

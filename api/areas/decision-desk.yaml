# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/decisiondesk
# aeon:owner internal/questions
paths:
  /decision-desk:
    get:
      operationId: listDecisionDeskQuestions
      security: [{session: []}, {agentKey: []}]
      description: P1 question-only projection, filtered by questions.read per project and asker for agents. No counts or content from inaccessible projects. Defaults to oldest-first creation order; state=answered with order=desc lists newest current answers first (answer created_at, then question ID) using bounded keyset pagination via next_cursor. Later packages add other item types and held-work ordering.
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [open, answered]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: asc}, description: desc requires state=answered and offset=0.}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}, description: 'Opaque next_cursor from order=desc. Bound to tenant, principal and project; permissions are rechecked on every page. Requires state=answered and order=desc.'}
      responses:
        '200': {description: Visible questions, content: {application/json: {schema: {$ref: '#/components/schemas/QuestionPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /decision-desk/projection:
    get:
      operationId: decisionDeskProjection
      security: [{session: []}]
      description: >-
        Person-only canonical open desk pointers and exact counts, reauthorized per source and project.
        Held approvals and step-ups sort by expiry, then other held items by creation time, then other items by creation time;
        stable source ID breaks ties. Merged askers count once and a question replaces its linked held request.
        Answered questions (including grace/corrections), decided/expired approvals and resolved requests are excluded.
        A parked/paused/stopped question is held only with a live unfinished work link; carries_on alone is quiet.
        Key trim proposals require keys.manage and remain quiet; their own protected approval API rechecks scopes and recent use. Sign-ins count as separate chores. Doctrine retains its existing toast claim and is never pushed by this adapter.
        Counts describe all visible open sources, independently of page size. Keyset pages recheck current access;
        counts and ordering are a current snapshot, not a frozen review round. Coverage above 1000 projects returns 422 with an explicit coverage error.
        Routine consent is a quiet link-out source for the interactive canonical owner only, with an assignment,
        missing or stale revision consent, live management authority and an effective output-project qualification gate.
        It opens exactly project settings, personal settings or workspace routine settings at the consent step.
        Routine candidate coverage above 1000 returns 422; partial counts are never presented as exact.
        Prepared lessons are quiet sources, filtered by knowledge.read and current source/target validity.
        Their stable UUID derives from the native learning ID; revision is the recommendation event ID.
        Accept and Dismiss use the existing knowledge learning APIs. Lesson candidate coverage above 1000 returns 422.
        Person-step action requests are visible only to their current person owner with nodes.read.
        Their native person_step payload carries the ticket and definition revision; inline tick and reassignment use the person-step APIs.
        Manual items appear when their status is next; human checks appear on Done. Current access loss immediately routes to an admin.
        Source ticket and definition events audit request creation; native tick and reassignment events audit resolution and routing.
        Person-step candidate coverage above 1000 tickets returns 422 before presenting any partial totals.
        The existing question-only decision-desk endpoint remains available.
        Workspace definition changes are quiet project-settings links visible only to current person project admins with nodes.read.
        The definition_change payload identifies the project key and waiting count. The source disappears when no changes wait.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
      responses:
        '200': {description: Canonically ordered visible sources, content: {application/json: {schema: {$ref: '#/components/schemas/DecisionDeskProjection'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {description: Decision Desk coverage exceeds 1000 projects, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/Error'}
  /decision-desk/instances:
    get:
      operationId: decisionDeskInstances
      security: [{session: []}]
      description: "AEON-1709. Any active signed-in browser person (no agent keys) can discover deployment-configured siblings. No credential is issued by discovery. Each connection needs confirmation on its home instance."
      responses:
        '200': {description: "This instance and the owner's siblings", content: {application/json: {schema: {$ref: '#/components/schemas/DecisionDeskInstances'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /decision-desk/owner-summary:
    get:
      operationId: decisionDeskOwnerSummary
      security: [{deskSummary: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 5}, description: "First lines to display. The shared browser store requests more only after Show all, with a hard cap of 100; the home Desk holds the rest."}
      description: "AEON-1709. The route name is retained for compatibility. Accepts ONLY a read-only person-summary bearer credential, never cookies or agent keys. Origin must be an exact configured sibling and match the connection. Reads the connected person's own current Desk, rechecking active status and source visibility. At most five first lines by default, up to 100 after Show all, exact counts, as-of, and first upcoming step. Credentials expire after 90 days or explicit revocation. No decision authority."
      responses:
        '200': {description: "The connected person's summary", content: {application/json: {schema: {$ref: '#/components/schemas/DecisionDeskOwnerSummary'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {description: "Per-token read limit reached; Retry-After gives seconds until retry", headers: {Retry-After: {schema: {type: integer, minimum: 1}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/Error'}
    options:
      operationId: decisionDeskSummaryPreflight
      security: []
      description: "Allows only GET or DELETE with Authorization from one exact configured sibling origin. No Access-Control-Allow-Credentials. Responses are no-store and vary by Origin."
      responses:
        '204': {description: "Configured sibling may read with Authorization"}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      operationId: decisionDeskSummaryDisconnect
      security: [{deskSummary: []}]
      description: "The bearer revokes only its own grant, under the tenant access-change fence. Same exact configured-origin CORS allow-list as reads; cookies and agent keys never authorize this route."
      responses:
        '204': {description: "Grant ended"}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {description: "Per-token request limit reached", headers: {Retry-After: {schema: {type: integer, minimum: 1}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /decision-desk/connections:
    get:
      operationId: decisionDeskConnections
      security: [{session: []}]
      description: "Active browser person only. Lists their own issued connections, newest first, bounded to 100 active connections. Never returns credential values or hashes. Expired and revoked grants are omitted."
      responses:
        '200': {description: "Personal issued connections", content: {application/json: {schema: {type: object, required: [connections], properties: {connections: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/DecisionDeskConnection'}}}}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: decisionDeskConnect
      security: [{session: []}]
      description: "Explicit same-origin confirmation by an active browser person, never an agent key. Exact configured sibling origin, random single-use state and PKCE S256 challenge required. Returns a fixed /instances/connected address with a hashed-at-rest single-use code in its fragment, valid for 60 seconds and bound to state, challenge and origin. No bearer is put in a URL. At most 100 active connections per person."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, state, code_challenge]
              additionalProperties: false
              properties:
                origin: {type: string, maxLength: 300}
                state: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
                code_challenge: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: "Base64url SHA-256 of the browser's PKCE verifier (S256 only)."}
      responses:
        '201': {description: "Browser-only return address", content: {application/json: {schema: {type: object, required: [redirect_url], properties: {redirect_url: {type: string, maxLength: 2048}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {description: "State already consumed or active connection limit reached", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /decision-desk/connections/exchange:
    options:
      operationId: decisionDeskExchangePreflight
      security: []
      description: "Allows only POST with Content-Type from an exact configured sibling origin, without credentials. No-store; Vary includes Origin."
      responses:
        '204': {description: "Configured sibling may exchange a code"}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: decisionDeskExchange
      security: []
      description: "Atomically consumes a 60-second code with its bound state and PKCE S256 verifier. The 90-day read-only bearer appears only in this no-store response body, never a URL. Exact configured-origin CORS without credentials; rechecks current person and Desk authority inside the write. Replay, expiry and wrong proof are refused."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state, code_verifier]
              additionalProperties: false
              properties:
                code: {type: string, maxLength: 128}
                state: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
                code_verifier: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '200': {description: "Browser-only credential", content: {application/json: {schema: {type: object, required: [token, instance, account, created_at, expires_at], properties: {token: {type: string, maxLength: 128}, instance: {type: string}, account: {type: string, maxLength: 120}, created_at: {type: string, format: date-time}, expires_at: {type: string, format: date-time}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /decision-desk/connections/{id}:
    delete:
      operationId: decisionDeskDisconnect
      security: [{session: []}]
      description: "Revokes only the signed-in person's own connection, with authorization rechecked inside the final write transaction. Idempotent."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: "Connection ended"}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

components:
  securitySchemes:
    deskSummary:
      type: http
      scheme: bearer
      description: "Read-only person summary capability. Valid only on the cross-instance summary route, bound to a configured sibling origin."
  schemas:
    DecisionDeskItem:
      type: object
      required: [id, kind, revision, title, created_at, held, href, source]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [question, approval, action_request, doctrine, key_trim, stepup, tier_request, account_matrix, routine_consent, lesson, definition_change]}
        project_id: {type: string, format: uuid}
        ticket_key: {type: string, description: "Live key of the ticket the question's ask named, in the same tenant and project. Omitted when that ask named no ticket or the ticket is gone."}
        revision: {type: integer, minimum: 0, description: "Native tier revisions can begin at zero; other source revisions begin at one."}
        title: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        held: {type: boolean}
        can_decide: {type: boolean, description: "Current source authority; native mutation APIs remain authoritative."}
        href: {type: string, description: App review link to the exact source}
        source: {type: string, description: Authorized app route or API link to the exact source}
        person_step: {$ref: '#/components/schemas/PersonStep'}
        asked_by: {$ref: '#/components/schemas/DecisionDeskAsker'}
        definition_change:
          type: object
          required: [project_key, pending_count]
          properties:
            project_key: {type: string}
            pending_count: {type: integer, minimum: 1, maximum: 192}
    DecisionDeskProjection:
      type: object
      required: [items, counts, has_more, as_of]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/DecisionDeskItem'}}
        counts:
          type: object
          required: [open, held, chores]
          properties:
            open: {type: integer, minimum: 0}
            held: {type: integer, minimum: 0}
            chores: {type: integer, minimum: 0}
            lessons: {type: object, maxProperties: 1000, additionalProperties: {type: integer, minimum: 0}, description: "Prepared lesson totals keyed by authorized project UUID, independent of the loaded projection page."}
        has_more: {type: boolean}
        next_cursor: {type: string}
        as_of: {type: string, format: date-time}
        upcoming: {type: array, maxItems: 5, description: "AEON-1495. Person steps the reader owns that are not due yet (human checks on work before Done), newest first; omitted when there are none.", items: {$ref: '#/components/schemas/DecisionDeskUpcomingStep'}}
    DecisionDeskAsker:
      type: object
      description: "AEON-1495. The source principal: a question's first asker or an approval's asking agent."
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    DecisionDeskUpcomingStep:
      type: object
      required: [node_id, check_id, project_id, ticket_key, label]
      properties:
        node_id: {type: string, format: uuid}
        check_id: {type: string, description: "human for the human check."}
        project_id: {type: string, format: uuid}
        ticket_key: {type: string}
        label: {type: string, maxLength: 200}
    DecisionDeskSibling:
      type: object
      required: [tag, origin]
      properties:
        tag: {type: string, pattern: '^[a-z][a-z0-9-]{0,15}$'}
        origin: {type: string, description: "Exact scheme://host[:port] origin of the sibling instance."}
    DecisionDeskInstances:
      type: object
      required: [here, siblings]
      properties:
        here: {type: string, description: "This instance's tag; empty when none is configured."}
        siblings: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/DecisionDeskSibling'}, description: "Configured siblings, available to every active signed-in person."}
    DecisionDeskOwnerSummaryItem:
      type: object
      required: [id, kind, title, held, href]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        project_key: {type: string}
        title: {type: string, maxLength: 200}
        asked_by: {type: string, maxLength: 120}
        created_at: {type: string, format: date-time}
        held: {type: boolean}
        href: {type: string, description: "App path on the answering instance, starting with a single slash."}
    DecisionDeskOwnerSummary:
      type: object
      required: [instance, items, counts, as_of]
      properties:
        instance: {type: string}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/DecisionDeskOwnerSummaryItem'}}
        counts:
          type: object
          required: [open, held]
          properties:
            open: {type: integer, minimum: 0}
            held: {type: integer, minimum: 0}
        upcoming: {$ref: '#/components/schemas/DecisionDeskUpcomingStep'}
        as_of: {type: string, format: date-time}
    DecisionDeskConnection:
      type: object
      required: [id, origin, instance, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        origin: {type: string}
        instance: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}

# SPDX-License-Identifier: AGPL-3.0-only
# aeon:owner internal/usagedashboard
paths:
  /usage/dashboard:
    get:
      operationId: getUsageDashboard
      summary: Cost and usage by project, model and subscription (AEON-217)
      description: >-
        Sessions the caller can see that started in [from, to). Each harness_session_usage row is the lifetime
        total for one session and model. The range selects sessions by start time and does not mean the tokens
        or list estimate were consumed inside it. Null totals are unknown, not zero. estimated_cost_usd is the
        exact USD list estimate, summed once; it is not a billed charge. billing_mode and subscription_label are
        reported metadata, not verified coverage. New reports are priced from model_prices only when billing_mode
        is api. Subscription and unknown store tokens without a dollar estimate. Dashboard totals sum a
        stored estimate only when billing_mode is api. Subscription and unknown rows stay unknown even
        when a historical estimate is stored. Run telemetry
        and agent-run totals are not added. More than 5000 sessions or completed tickets sets truncated and drops the rest. work.truncated identifies capped work totals. If the
        usage relation is not installed the response is 503, not a dashboard of zeros. Allowance windows are the
        caller's registered account windows and only when they hold account.read; the response has no account key.
        A provisional window, including mixed settled evidence, returns null used, headroom and hard remaining.
        Declared allowance, explicit reservations and the pace-cap schedule stay numbers. Null is unknown, not zero.
        Project visibility follows harness sessions. The most expensive tickets are a ranking, not a session list.
        by_harness groups the same usage rows by session harness. ratings count rework by exception
        on the sessions in this read. A vote row is an exception; a session with none counts only
        as a delivery. rework_rate is exceptions/deliveries. by_model and by_harness use the same
        labels as the usage breakdown. average remains the mean of optional scores and is null when
        no score was given. Token and list-price totals are unchanged. A missing vote table leaves
        exception counts at zero rather than failing the read.
      parameters:
        - {name: from, in: query, schema: {type: string}, description: 'RFC3339 or YYYY-MM-DD. Both from and to, or neither (then the last 30 UTC days).'}
        - {name: to, in: query, schema: {type: string}, description: Exclusive end. Span at most 366 days.}
        - {name: project, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Usage dashboard
          content:
            application/json:
              schema:
                type: object
                required: [from, to, generated_at, attribution, trend_basis, list_price_currency, truncated, totals, by_project, by_model, by_harness, by_subscription, trend, tickets, tickets_cost_unknown, allowance, ratings, work]
                properties:
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  generated_at: {type: string, format: date-time}
                  attribution: {type: string, enum: [lifetime_for_sessions_started_in_range]}
                  trend_basis: {type: string, enum: [session_started_utc_day]}
                  list_price_currency: {type: string, enum: [USD]}
                  truncated: {type: boolean}
                  totals: {$ref: '#/components/schemas/UsageGroup'}
                  by_project: {type: array, items: {$ref: '#/components/schemas/UsageGroup'}}
                  by_model: {type: array, items: {$ref: '#/components/schemas/UsageGroup'}}
                  by_harness: {type: array, items: {$ref: '#/components/schemas/UsageGroup'}}
                  by_subscription: {type: array, items: {$ref: '#/components/schemas/UsageGroup'}}
                  trend: {type: array, items: {$ref: '#/components/schemas/UsageTrend'}}
                  tickets: {type: array, maxItems: 12, items: {$ref: '#/components/schemas/UsageTicket'}}
                  tickets_cost_unknown: {type: integer, minimum: 0, description: Visible tickets whose list estimate is entirely unknown. They are not ranked.}
                  allowance: {$ref: '#/components/schemas/UsageAllowance'}
                  ratings: {$ref: '#/components/schemas/DeliveryRatingSummary'}
                  work: {$ref: '#/components/schemas/UsageWork'}
        '400': {description: Invalid range or project}
        '401': {description: Authentication required}
        '403': {description: Permission denied}
        '503': {description: Session usage relation is not installed}
  /usage/model-estimates:
    get:
      security: *auth
      operationId: modelEstimateHistory
      summary: Read calibrated model history for a kind and complexity bucket
      parameters:
        - {name: profile_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: kind, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
        - {name: bucket, in: query, required: true, schema: {type: string, enum: [normal, complex]}}
        - {name: project_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Visible completed-ticket history; numeric hints are null below five samples. Requires harness.read.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelEstimateHistory'}
        '400': {description: Invalid or overly broad query}
        '401': {description: Unauthorized}
        '403': {description: Permission denied}
        '404': {description: Model profile not found}
components:
  schemas:
    DeliveryRatingGroup:
      type: object
      required: [label, votes, average, exceptions, deliveries, rework_rate]
      properties:
        label: {type: string, description: Same label as the usage breakdown for this model or harness.}
        votes: {type: integer, minimum: 1}
        average: {type: [string, 'null'], pattern: '^(?:[1-4]\.[0-9]{2}|5\.00)$'}
        exceptions: {type: integer, minimum: 1}
        deliveries: {type: integer, minimum: 1}
        rework_rate: {type: string, pattern: '^[1-9][0-9]*/[1-9][0-9]*$'}
    DeliveryRatingSummary:
      type: object
      required: [votes, average, exceptions, deliveries, rework_rate, by_model, by_harness]
      properties:
        votes: {type: integer, minimum: 0, description: Exception rows. A row is a rework mark.}
        average: {type: [string, 'null'], pattern: '^(?:[1-4]\.[0-9]{2}|5\.00)$', description: Mean of optional scores. Null when no score was given.}
        exceptions: {type: integer, minimum: 0, description: Distinct sessions with at least one vote row.}
        deliveries: {type: integer, minimum: 0, description: Distinct sessions in this read.}
        rework_rate: {type: [string, 'null'], pattern: '^[1-9][0-9]*/[1-9][0-9]*$', description: exceptions/deliveries. Null when there are no exceptions.}
        by_model: {type: array, items: {$ref: '#/components/schemas/DeliveryRatingGroup'}}
        by_harness: {type: array, items: {$ref: '#/components/schemas/DeliveryRatingGroup'}}
    UsageAllowance:
      type: object
      description: Windows are withheld unless current account privacy permits quota detail; accounts retain labels and state only. At most 1024 active windows are considered; truncated marks omitted windows and their accounts. Partial means visible windows are incomplete because others were withheld or truncated. Declared allowance, explicit reservations and schedule capacity stay numbers. Used, headroom and hard remaining are null while a window is provisional, including mixed settled evidence. Null and overflow are never zero.
      required: [state, windows]
      properties:
        state: {type: string, enum: [visible, partial, withheld, none]}
        truncated: {type: boolean, description: 'More than 1024 active windows exist; returned windows and account identities are bounded and incomplete. Independent of privacy withholding.'}
        accounts:
          type: array
          maxItems: 1024
          description: Availability-only account identities, including accounts whose windows are withheld.
          items:
            type: object
            required: [account_id, label, harness, account_state]
            properties:
              account_id: {type: string, format: uuid}
              label: {type: string}
              harness: {type: string}
              account_state: {type: string}
        windows:
          type: array
          maxItems: 1024
          items:
            type: object
            required: [account_id, label, harness, account_state, window_id, unit, allowance, used, reserved, pace_model, burst_ratio, starts_at, ends_at, provisional, pace_cap, headroom, hard_remaining]
            properties:
              account_id: {type: string, format: uuid}
              label: {type: string}
              harness: {type: string}
              account_state: {type: string}
              window_id: {type: string, format: uuid}
              unit: {type: string, enum: [requests, tokens, cost_micros]}
              allowance: {type: integer, format: int64, minimum: 1, description: Declared window size.}
              used: {type: [integer, 'null'], format: int64, description: Measured ledger usage. Null while provisional. A present zero is measured zero.}
              reserved: {type: integer, format: int64, minimum: 0, description: 'Explicit reservations. A hold, not measured usage.'}
              pace_model: {type: string, enum: [steady, frontload, unrestricted]}
              burst_ratio: {type: string}
              starts_at: {type: string, format: date-time}
              ends_at: {type: string, format: date-time}
              provisional: {type: boolean, description: 'True when the window has no settled measurement, or any settled reservation recorded zero actual units.'}
              pace_cap: {type: [integer, 'null'], format: int64, description: Schedule capacity at the read. Independent of measured usage.}
              headroom: {type: [integer, 'null'], format: int64, description: 'Schedule capacity minus measured used and reserved. Null when usage or the cap is unknown, or the difference overflows.'}
              hard_remaining: {type: [integer, 'null'], format: int64, description: Declared allowance minus measured used and reserved. Null when usage is unknown or the difference overflows.}
    UsageGroup:
      type: object
      description: Distinct sessions, with token and list-estimate sums across current model rows. A null total is unknown, not zero. A known zero is the decimal zero string.
      required: [label, sessions, usage_rows, unreported_sessions, input_tokens, input_known_rows, input_unknown_rows, output_tokens, output_known_rows, output_unknown_rows, cached_input_tokens, cached_input_known_rows, cached_input_unknown_rows, tokens_state, estimated_cost_usd, cost_known_rows, cost_unknown_rows, cost_state, provisional_rows, provisional_sessions]
      properties:
        id: {type: string}
        key: {type: string}
        label: {type: string}
        billing_mode: {type: string, enum: [subscription, api, unknown, unreported, mixed], description: 'Present on subscription groups. Reported metadata, not verified coverage.'}
        sessions: {type: integer, minimum: 0, description: Distinct sessions. A session with several models counts once.}
        usage_rows: {type: integer, minimum: 0, description: Current model rows. Several models on one session are several rows.}
        unreported_sessions: {type: integer, minimum: 0}
        input_tokens: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$', description: Sum of known input totals. Null when none are known.}
        input_known_rows: {type: integer, minimum: 0}
        input_unknown_rows: {type: integer, minimum: 0}
        output_tokens: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$'}
        output_known_rows: {type: integer, minimum: 0}
        output_unknown_rows: {type: integer, minimum: 0}
        cached_input_tokens: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$', description: 'Sum of known cached input, which is a subset of input.'}
        cached_input_known_rows: {type: integer, minimum: 0}
        cached_input_unknown_rows: {type: integer, minimum: 0}
        tokens_state: {type: string, enum: [known, partial, unknown]}
        estimated_cost_usd: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)\.[0-9]{12}$', description: Exact USD list estimate with 12 fractional digits. Null when no row has a price. Not a billed charge.}
        cost_known_rows: {type: integer, minimum: 0}
        cost_unknown_rows: {type: integer, minimum: 0}
        cost_state: {type: string, enum: [known, provisional, unknown, partial]}
        provisional_rows: {type: integer, minimum: 0}
        provisional_sessions: {type: integer, minimum: 0}
    UsageTicket:
      allOf:
        - {$ref: '#/components/schemas/UsageGroup'}
        - type: object
          required: [project_id, project_key]
          properties:
            project_id: {type: string, format: uuid}
            project_key: {type: string}
    UsageTrend:
      type: object
      required: [day, group]
      properties:
        day: {type: string, format: date}
        group: {$ref: '#/components/schemas/UsageGroup'}
    UsageWork:
      type: object
      description: >-
        What agents got done and where the time went (AEON-301). Sessions are the visible sessions that started in
        [from, to), the same set as the usage totals. done and released count distinct visible tickets whose ticket_done or
        released outcome event was recorded in [from, to) with an agent session; a ticket done by a person alone is not
        counted. Agent time runs from a session's start to its last heartbeat, or to its stop when that came within 15
        minutes of it, clipped to the range end; a session with no heartbeat that was not stopped within 15 minutes of
        registering has no known time and is left out of agent_seconds, never counted as zero. Tokens are the known input
        plus output of reported usage rows; null when no session in the group reported any. Token coverage is per
        component (UsageWorkTokenParts), so a partial report never reads as complete. Every day of the range is
        present in days, as UTC days; zero there is a known zero.
      allOf:
        - {$ref: '#/components/schemas/UsageWorkTokenParts'}
      required: [basis, sessions, worker_sessions, timed_sessions, agent_seconds, usage_reported_sessions, model_sessions, done, released, done_attributed, tickets_worked, tickets_done, days, tickets, by_harness, by_model, by_project, waste]
      properties:
        truncated: {type: boolean, description: Work totals are lower bounds because the session or completion population exceeded 5000.}
        basis: {type: string, enum: [sessions_started_in_range]}
        sessions: {type: integer, minimum: 0}
        worker_sessions: {type: integer, minimum: 0}
        timed_sessions: {type: integer, minimum: 0, description: Sessions whose agent time is known.}
        agent_seconds: {type: integer, format: int64, minimum: 0, description: Sum over timed_sessions.}
        usage_reported_sessions: {type: integer, minimum: 0, description: 'Sessions that reported both input and output tokens; a usage report without them does not count. Per-component coverage is in UsageWorkTokenParts.'}
        model_sessions: {type: integer, minimum: 0, description: Sessions that registered a model; by_model covers only these.}
        done: {type: integer, minimum: 0}
        released: {type: integer, minimum: 0}
        done_attributed: {type: integer, minimum: 0, description: "Done tickets with a harness session, attributed in by_harness and by_model to the ticket's latest worker session before it was done."}
        tickets_worked: {type: integer, minimum: 0, description: Distinct tickets with a session in the range. tickets holds at most 50 of them.}
        tickets_done: {type: integer, minimum: 0, description: "Worked tickets whose state is done, accepted or delivered now."}
        days:
          type: array
          items:
            type: object
            required: [day, done, sessions, agent_seconds]
            properties:
              day: {type: string, format: date}
              done: {type: integer, minimum: 0}
              sessions: {type: integer, minimum: 0, description: Sessions that started on this day.}
              agent_seconds: {type: integer, format: int64, minimum: 0}
        tickets:
          type: array
          maxItems: 50
          description: Worked tickets, most agent time first.
          items:
            type: object
            allOf:
              - {$ref: '#/components/schemas/UsageWorkTokenParts'}
            required: [id, key, title, project_id, project_key, state, done_in_range, released, sessions, timed_sessions, agent_seconds, tokens, usage_reported_sessions, last_active_at]
            properties:
              id: {type: string, format: uuid}
              key: {type: string}
              title: {type: string}
              project_id: {type: string, format: uuid}
              project_key: {type: string}
              state: {type: string}
              done_in_range: {type: boolean}
              released: {type: boolean, description: The ticket has a released outcome event.}
              sessions: {type: integer, minimum: 0}
              timed_sessions: {type: integer, minimum: 0}
              agent_seconds: {type: integer, format: int64, minimum: 0}
              tokens: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$'}
              usage_reported_sessions: {type: integer, minimum: 0}
              last_active_at: {type: string, format: date-time}
        by_harness: {type: array, items: {$ref: '#/components/schemas/UsageWorkGroup'}}
        by_model: {type: array, items: {$ref: '#/components/schemas/UsageWorkGroup'}}
        by_project: {type: array, items: {$ref: '#/components/schemas/UsageWorkGroup'}}
        waste:
          type: object
          description: >-
            stuck is an open session that is not idle or throttled and has not sent a heartbeat for over 10 minutes.
            The other kinds are stopped worker sessions on a ticket that is not done: failed (run failed or lost
            ownership, or an error stop reason), lost (the server closed it for silence and it left no commit), and
            no_result (it had a worktree to report commits from, or a managed run, and left no commit). A ticket that is
            not done after three or more worker sessions is one retried row holding them all. total counts every row;
            rows holds the ten with the most agent time.
          required: [total, stuck, failed, lost, no_result, retried, rows]
          properties:
            total: {type: integer, minimum: 0}
            stuck: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            lost: {type: integer, minimum: 0}
            no_result: {type: integer, minimum: 0}
            retried: {type: integer, minimum: 0}
            rows:
              type: array
              maxItems: 10
              items:
                type: object
                required: [kind, session_id, project_id, project_key, ticket_id, ticket_key, ticket_title, harness, model, label, at, sessions, agent_seconds]
                properties:
                  kind: {type: string, enum: [stuck, failed, lost, no_result, retried]}
                  session_id: {type: string, format: uuid, description: "For retried, the newest worker session."}
                  project_id: {type: string, format: uuid}
                  project_key: {type: string}
                  ticket_id: {type: [string, 'null'], format: uuid}
                  ticket_key: {type: [string, 'null']}
                  ticket_title: {type: [string, 'null']}
                  harness: {type: string}
                  model: {type: [string, 'null']}
                  label: {type: [string, 'null'], description: The session's display label.}
                  at: {type: string, format: date-time, description: Last sign of life.}
                  sessions: {type: integer, minimum: 1}
                  agent_seconds: {type: [integer, 'null'], format: int64, description: Null when unknown.}
    UsageWorkGroup:
      type: object
      allOf:
        - {$ref: '#/components/schemas/UsageWorkTokenParts'}
      required: [key, label, sessions, timed_sessions, agent_seconds, done, tokens, usage_reported_sessions]
      properties:
        key: {type: string, description: 'Harness, registered session model, or project ID.'}
        label: {type: string}
        sessions: {type: integer, minimum: 0}
        timed_sessions: {type: integer, minimum: 0}
        agent_seconds: {type: integer, format: int64, minimum: 0}
        done: {type: integer, minimum: 0}
        tokens: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$'}
        usage_reported_sessions: {type: integer, minimum: 0}
    UsageWorkTokenParts:
      type: object
      description: >-
        Tokens by component (AEON-301), each with the sessions that reported it. A session counts for a component only
        when every one of its usage rows carries it; a missing component is left out of the sum, never added as zero,
        and a null sum means no session reported that component. Cached input is part of input and not added to tokens.
      required: [input_tokens, output_tokens, cached_input_tokens, input_reported_sessions, output_reported_sessions, cached_input_reported_sessions, usage_provisional_sessions]
      properties:
        input_tokens: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$'}
        output_tokens: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$'}
        cached_input_tokens: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$'}
        input_reported_sessions: {type: integer, minimum: 0}
        output_reported_sessions: {type: integer, minimum: 0}
        cached_input_reported_sessions: {type: integer, minimum: 0}
        usage_provisional_sessions: {type: integer, minimum: 0, description: Sessions with a provisional usage report; their figures may still change.}

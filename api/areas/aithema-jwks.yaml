# aeon:owner internal/aithema/tokens
paths:
  /aithema/jwks:
    get:
      operationId: aithemaJWKS
      summary: Public Aithema token verification keys
      description: Host-wide Ed25519 signing keys (active, prepublished next, and retired keys during the 960-second overlap). Requires no authentication. Private keys are never returned.
      security: []
      responses:
        "200":
          description: Public JSON Web Key Set
          headers:
            Cache-Control:
              schema: {type: string, const: "public, max-age=60, must-revalidate"}
            ETag:
              schema: {type: string}
          content:
            application/jwk-set+json:
              schema:
                type: object
                additionalProperties: false
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [kty, crv, alg, use, kid, x]
                      properties:
                        kty: {type: string, const: OKP}
                        crv: {type: string, const: Ed25519}
                        alg: {type: string, const: EdDSA}
                        use: {type: string, const: sig}
                        kid: {type: string}
                        x: {type: string}
        "304": {description: Public key set unchanged}
        "503":
          description: Signing key store unavailable or HTTPS token issuer not configured
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error, code]
                properties:
                  error: {type: string}
                  code: {type: string, const: unavailable}
components:

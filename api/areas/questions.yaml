# aeon:owner internal/questions
paths:
  /settings/question-reminders:
    get:
      operationId: getQuestionReminderSettings
      security: [{session: []}]
      description: 'Person-only workspace reminder defaults, requiring settings.read or settings.manage. Applies to fresh questions; existing schedules retain their interval. Quiet hours are checked again at delivery, using the recipient phone quiet preferences when present.'
      responses:
        '200': {description: 'Reminder defaults', content: {application/json: {schema: {$ref: '#/components/schemas/QuestionReminderSettings'}}}}
        '403': {$ref: '#/components/responses/Error'}
    put:
      operationId: putQuestionReminderSettings
      security: [{session: []}]
      description: 'Person-only settings.manage, checked under the access fence in the final transaction. A stale expected_revision returns 409. Equal quiet endpoints disable quiet hours. No existing question interval, grant or execution consent changes.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuestionReminderSettingsInput'}
      responses:
        '200': {description: 'Saved reminder defaults', content: {application/json: {schema: {$ref: '#/components/schemas/QuestionReminderSettings'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /questions/{questionId}:
    parameters:
      - {name: questionId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getQuestion
      security: [{session: []}, {agentKey: []}]
      description: Requires current questions.read permission; agents must be an asker. Inaccessible questions return 404 at the service boundary.
      responses:
        '200': {description: Question, content: {application/json: {schema: {$ref: '#/components/schemas/Question'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /questions/{questionId}/decision:
    parameters:
      - {name: questionId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: decideQuestion
      security: [{session: []}]
      description: >-
        Person-only questions.decide plus questions.read; key-backed callers cannot decide.
        Serializes on the question and requires expected_revision (initial revision 1).
        An identical decision request_id replays even with its old expected_revision; altered input conflicts.
        Appends an immutable answer revision and durable pending effect/delivery rows due database-now + 10 seconds.
        Re-deciding replaces pending work and restarts the deadline; dispatched revisions require the P3 correction adapter.
        P1 accepts Once only. Always, Requirement and Doctrine return outcome_unavailable until their P4 adapters exist;
        their suggestions remain available on asks. No active Always authority, external side effect or delivery is claimed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuestionDecisionInput'}
      responses:
        '200': {description: Recorded answer with pending delivery, content: {application/json: {schema: {$ref: '#/components/schemas/Question'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'code revision_conflict or replay_conflict'}
        '422': {description: 'code outcome_unavailable'}
  /questions/{questionId}/status:
    parameters:
      - {name: questionId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: questionStatus
      security: [{session: []}, {agentKey: []}]
      description: Same authorized durable projection as getQuestion; works after the original session ends and never waits for an answer.
      responses:
        '200': {description: Current durable state, content: {application/json: {schema: {$ref: '#/components/schemas/Question'}}}}
        '404': {$ref: '#/components/responses/Error'}
components:
  schemas:
    QuestionReminderSettingsInput:
      type: object
      additionalProperties: false
      required: [default_after_seconds, time_zone, quiet_start, quiet_end, expected_revision]
      properties:
        default_after_seconds: {type: integer, minimum: 0, maximum: 2592000}
        time_zone: {type: string, maxLength: 100}
        quiet_start: {type: integer, minimum: 0, maximum: 1439}
        quiet_end: {type: integer, minimum: 0, maximum: 1439}
        expected_revision: {type: integer, minimum: 0}
    QuestionReminderSettings:
      type: object
      required: [default_after_seconds, time_zone, quiet_start, quiet_end, revision]
      properties:
        default_after_seconds: {type: integer, minimum: 0, maximum: 2592000, default: 7200, description: 'Default elapsed interval for new questions; zero disables it.'}
        time_zone: {type: string, maxLength: 100, default: UTC, description: 'IANA timezone for fallback quiet hours.'}
        quiet_start: {type: integer, minimum: 0, maximum: 1439, default: 1320, description: 'Local minute of day, inclusive.'}
        quiet_end: {type: integer, minimum: 0, maximum: 1439, default: 480, description: 'Local minute of day, exclusive.'}
        revision: {type: integer, minimum: 0}
    QuestionReminder:
      type: object
      required: [after_seconds, count]
      properties:
        after_seconds: {type: integer, minimum: 0, maximum: 2592000}
        count: {type: integer, minimum: 0, description: 'Number of durably accepted reminders, never a transport success claim.'}
        next_at: {type: string, format: date-time, description: 'Next reminder check. Omitted after answering or disabling.'}
        last_at: {type: string, format: date-time}
    QuestionDecisionInput:
      type: object
      additionalProperties: false
      required: [request_id, expected_revision, outcome]
      properties:
        request_id: {type: string, format: uuid}
        expected_revision: {type: integer, minimum: 1}
        option_id: {type: string, maxLength: 40}
        answer: {type: string, maxLength: 8000, description: Required for a custom answer; omit to use the option answer}
        reason: {type: string, maxLength: 2000}
        outcome: {$ref: '#/components/schemas/QuestionOutcome'}
        ticket_revision: {type: string, format: date-time, description: Optional ticket updated_at from the screen; changes before commit conflict. The server also snapshots it for delayed application.}
        doctrine: {$ref: '#/components/schemas/QuestionDoctrineTarget'}

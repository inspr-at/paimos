      operationId: syncCRMProviderCustomer
      security: [{session: []}]
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Customer, content: {application/json: {schema: {$ref: '#/components/schemas/CRMOrganisation'}}}}
  /crm/organisations/{organisationId}/sync-status:
    get:
      operationId: getCRMProviderSyncStatus
      description: Admin-only status for an externally linked customer. Errors are safe categories, never provider responses or credentials.
      security: [{session: []}]
      parameters: [{name: organisationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Latest provider sync outcome, content: {application/json: {schema: {type: object, required: [state, provider_id], properties: {state: {type: string, enum: [never, ok, error]}, provider_id: {type: string}, attempted_at: {type: [string, 'null'], format: date-time}, synced_at: {type: [string, 'null'], format: date-time}, error: {type: string}}}}}}
  /business/principals:
    get:
      operationId: listBusinessPrincipals
      summary: Name the tenant's people and agents for business screens
      description: Admin or member person, while at least one business plugin is enabled at its compiled digest. A read model of principals (who logged time, whose period waits for approval); grants nothing.
      security: [{session: []}]
      responses:
        '200': {description: Principals, people first, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BusinessPrincipal'}}}}}
        '403': {$ref: '#/components/responses/Error'}
  /quotes:
    get:
      operationId: listQuotes
      summary: List quote projections
      security: *auth
      parameters:
        - {name: project_node_id, in: query, schema: {type: string, format: uuid}}
        - {name: customer_org_node_id, in: query, schema: {type: string, format: uuid}}
        - {name: state, in: query, schema: {type: string, enum: [draft, issued, accepted, void]}}
        - {name: archived, in: query, schema: {type: string, enum: ['true', 'false', all], default: 'false'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: Quotes in created order; X-Next-Cursor is present when another page exists, headers: {X-Next-Cursor: {schema: {type: string}}}, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BusinessQuoteListItem'}}}}}
    post:
      operationId: createQuote
      summary: Create a quote node and projection
      description: Requires enabled business plugins. A linked project is optional when tenant quote settings are configured; the customer organisation is required. New configured quotes allocate commercial and customer numbers atomically.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteCreate'}}}}
      responses:
        '201': {description: Quote, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessQuote'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}:
    get:
      operationId: getQuote
      summary: Get quote projection
      security: *auth
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Quote, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessQuote'}}}}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteQuoteDraft
      summary: Delete a draft that was never issued
      description: Admin person only. Only a draft with no frozen version can be deleted; anything once issued is evidence and is archived instead (409). The quote is hidden, not erased, and its number stays allocated. Records quote.deleted, reversible through POST /events/{eventId}/undo while the quote is unchanged.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: expected_revision, in: query, required: true, schema: {type: integer, minimum: 1}}]
      responses:
        '204': {description: Deleted}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/settings:
    get:
      operationId: getQuoteSettings
      summary: Read tenant quote defaults and sender
      security: [{session: []}]
      responses:
        '200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteSettings'}}}}
    patch:
      operationId: updateQuoteSettings
      summary: Compare and set future quote defaults
      description: Admin person only. expected_revision is zero for first setup. Email delivery is disabled; smtp_confirmation_enabled must be false. Existing drafts and versions are not rewritten.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteSettingsWrite'}}}}
      responses:
        '200': {description: Updated settings, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteSettings'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quote-profiles:
    get:
      operationId: listQuoteProfiles
      summary: List tenant quote document profiles
      security: [{session: []}]
      responses:
        '200': {description: Profiles, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/QuoteProfile'}}}}}
    post:
      operationId: createQuoteProfile
      summary: Create a versioned tenant quote profile
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteProfileWrite'}}}}
      responses:
        '201': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteProfile'}}}}
  /quote-profiles/{profileId}:
    get:
      operationId: getQuoteProfile
      summary: Get the current profile or a retained revision
      security: [{session: []}]
      parameters: [{name: profileId, in: path, required: true, schema: {type: string, format: uuid}}, {name: revision, in: query, schema: {type: integer, minimum: 1}}]
      responses:
        '200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteProfile'}}}}
    patch:
      operationId: updateQuoteProfile
      summary: Create a new immutable profile revision
      security: [{session: []}]
      parameters: [{name: profileId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteProfileWrite'}}}}
      responses:
        '200': {description: New revision, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteProfile'}}}}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: archiveQuoteProfile
      summary: Archive a profile for new quotes; retained revisions remain readable
      security: [{session: []}]
      parameters: [{name: profileId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Archived}
  /quote-profiles/{profileId}/undo:
    post:
      operationId: undoQuoteProfile
      summary: Undo the latest profile save or archive; a restored prior definition becomes a new revision
      security: [{session: []}]
      parameters: [{name: profileId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [expected_revision], properties: {expected_revision: {type: integer, minimum: 1}}}}}}
      responses:
        '200': {description: Restored profile, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteProfile'}}}}
  /quote-profiles/assets:
    post:
      operationId: uploadQuoteProfileAsset
      summary: Upload a TTF, OTF, WOFF2, PNG or safe SVG for a quote profile
      security: [{session: []}]
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
      responses:
        '201': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteProfileAsset'}}}}
  /quote-profiles/assets/{assetId}:
    get:
      operationId: getQuoteProfileAsset
      summary: Serve an immutable profile asset to tenant staff
      security: [{session: []}]
      parameters: [{name: assetId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Font or mark bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
  /quotes/{quoteId}/profile:
    put:
      operationId: selectQuoteProfile
      summary: Snapshot the current profile revision into an editable quote draft
      description: An empty profile_id removes the profile, so the draft prints as the standard document again.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [expected_draft_revision, profile_id], properties: {expected_draft_revision: {type: integer, minimum: 1}, profile_id: {type: string, description: 'A profile id, or empty for the standard document', pattern: '^([0-9a-fA-F-]{36})?$'}}}}}}
      responses:
        '200': {description: Updated draft, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteDraft'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/draft:
    get:
      operationId: getQuoteDraft
      summary: Read the mutable document draft
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Draft with ETag "qd-N", content: {application/json: {schema: {$ref: '#/components/schemas/QuoteDraft'}}}}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: saveQuoteDraft
      summary: Save one full document with compare and swap
      description: Requires If-Match "qd-N", client_session_id, mutation_id and writer_version. Writer version 2 preserves inline marks; a marked document raises the minimum writer version to 2, including on later edits that remove its marks. Unformatted version-1 drafts remain writable by version-1 clients. The mutation receipt is durable and replays the acknowledgement for the same payload. A stale precondition returns 412; no document content enters the event stream.
      security: [{session: []}]
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"qd-[1-9][0-9]*"$'}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteDraftWrite'}}}}
      responses:
        '200': {description: Mutation acknowledgement and canonical document for a new save, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteMutationReceipt'}}}}
        '400': {description: Invalid draft document includes field reasons; malformed request errors retain the standard error body, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/QuoteDraftValidationError'}, {$ref: '#/components/schemas/ApiError'}]}}}}
        '412': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/presence:
    get:
      operationId: listQuotePresence
      summary: Read leased collaborator presence and current revisions
      description: Authenticated staff or viewer only; names come from tenant principals. Presence expires after 45 seconds and is never part of quote documents or PDFs.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Current snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePresenceSnapshot'}}}}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: joinQuotePresence
      summary: Join or resume a quote collaboration session
      description: The server mints an opaque session ID. A resume ID is accepted only for the same live principal and quote. This is advisory presence, not a lock.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePresenceWrite'}}}}
      responses:
        '201': {description: Session and current snapshot, content: {application/json: {schema: {type: object, properties: {session_id: {type: string, format: uuid}, snapshot: {$ref: '#/components/schemas/QuotePresenceSnapshot'}}}}}}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/presence/{sessionId}:
    patch:
      operationId: updateQuotePresence
      summary: Heartbeat or bounded anchor update
      description: At most five updates per second. An unverified precise anchor is reduced to section fidelity; no selected text is stored.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePresenceWrite'}}}}
      responses:
        '200': {description: Current snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePresenceSnapshot'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
    delete:
      operationId: leaveQuotePresence
      summary: Best effort leave; otherwise lease expires
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Session removed}
  /quotes/{quoteId}/collaboration/stream:
    get:
      operationId: streamQuoteCollaboration
      summary: Quote-scoped SSE presence snapshots and durable revision notices
      description: Revalidates roles and plugin installation on every poll. Last-Event-ID resumes durable quote event IDs; each connection starts with a fresh transient presence snapshot. Notices exclude document content, cursors and acceptance secrets.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: Last-Event-ID, in: header, schema: {type: string, pattern: '^[0-9]+$'}}]
      responses:
        '200': {description: text/event-stream with presence, quote_change and access_revoked events, content: {text/event-stream: {schema: {type: string}}}}
        '403': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/finalize:
    post:
      operationId: finalizeQuoteDraft
      summary: Freeze and issue the exact saved draft atomically
      description: Admin person only. Does not send email. Creates an immutable document-v1 snapshot with cent-half-up-v1 pricing and digest plus a scoped public link in the same transaction; existing R4 versions retain r4-v1.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteFinalizeWrite'}}}}
      responses:
        '200': {description: Issued quote, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessQuote'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/draft/branch:
    post:
      operationId: branchQuoteDraft
      summary: Branch an issued document version into a mutable draft
      description: Admin person only. The previous issued or accepted version and its evidence remain immutable. A new finalization creates the next version on this quote; duplicate creates a separate numbered quote.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteBranchWrite'}}}}
      responses:
        '200': {description: Branched draft with ETag, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteDraft'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/duplicate:
    post:
      operationId: duplicateQuote
      summary: Duplicate into a new numbered draft for the same customer
      description: Undoing quote.duplicated (POST /events/{eventId}/undo, admin) deletes the copy while it is still untouched.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_revision], properties: {expected_revision: {type: integer, minimum: 1}}}}}}
      responses:
        '201': {description: New quote, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessQuote'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/visibility:
    patch:
      operationId: setQuoteVisibility
      summary: Archive or restore without deleting history
      description: Admin person only. quote.visibility_changed is reversible through POST /events/{eventId}/undo while the archived state is unchanged.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_revision, archived], properties: {expected_revision: {type: integer, minimum: 1}, archived: {type: boolean}}}}}}
      responses:
        '200': {description: Quote, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessQuote'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/versions:
    get:
      operationId: listQuoteVersions
      summary: List frozen versions of a quote
      security: *auth
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Versions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/QuoteVersion'}}}}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: createQuoteVersion
      summary: Freeze a new offer version and its line items
      description: Locks the quote and checks expected_revision. Rate, quantity, currency and cost-unit references are copied into a content digest; later rate changes do not rewrite this version.
      security: *auth
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteVersionWrite'}}}}
      responses:
        '201': {description: Version, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteVersion'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/versions/{version}:
    get:
      operationId: getQuoteVersion
      summary: Read one frozen quote version
      security: *auth
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Version, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteVersion'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/versions/{version}/issue:
    post:
      operationId: issueQuoteVersion
      summary: Issue the current frozen offer to its recipient
      description: Issuing records an event and makes this exact digest eligible for customer acceptance.
      security: [{session: []}]
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Issued quote, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessQuote'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/versions/{version}/accept:
    post:
      operationId: acceptQuoteVersion
      summary: Customer approves one issued quote version
      description: Signed-in person must be bound to the version's recipient contact. expected_content_sha256 fences stale offers. Agents cannot accept.
      security: [{session: []}]
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteAcceptanceWrite'}}}}
      responses:
        '201': {description: Acceptance, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteAcceptance'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/versions/{version}/export:
    get:
      operationId: exportQuoteVersion
      summary: Render a frozen quote as Markdown or PDF
      description: Pure view of stored version and lines. Export has no independent mutable offer state or acceptance authority.
      security: *auth
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: format, in: query, required: true, schema: {type: string, enum: [markdown, pdf]}}
      responses:
        '200': {description: Rendered offer, content: {text/markdown: {schema: {type: string}}, application/pdf: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/Error'}
  /quotes/{quoteId}/versions/{version}/public-link:
    post:
      operationId: createQuotePublicLink
      summary: Create a scoped capability for the current issued document
      description: Admin person only. Finalization creates the first link when a persistent link or messaging host key is configured; otherwise explicit creation returns a one-time link. The projection stores only a SHA-256 verifier. Retained capabilities are AES-256-GCM encrypted for admin re-copy. Without a host key re-copy is unavailable. Revoke before reissue; expired links stay readable but cannot accept.
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {expires_at: {type: string, format: date-time}}}}}}
      responses:
        '201': {description: Link and metadata, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePublicLink'}}}}
        '409': {$ref: '#/components/responses/Error'}
    get:
      operationId: getQuotePublicLink
      summary: Read link metadata and, when a host key is available, decrypt the stable path as an admin
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}]
      responses:
        '200': {description: Metadata, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePublicLink'}}}}
  /quotes/{quoteId}/versions/{version}/public-link/revoke:
    post:
      operationId: revokeQuotePublicLink
      summary: Revoke the active capability link
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}]
      responses:
        '200': {description: Revoked metadata, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePublicLink'}}}}
  /public/quotes/{publicTenant}/{token}:
    get:
      operationId: readPublicQuote
      summary: Read only the frozen document bound to a bearer capability
      security: []
      parameters: [{name: publicTenant, in: path, required: true, schema: {type: string}}, {name: token, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Scoped public document and state, headers: {Cache-Control: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePublicDocument'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /public/quotes/{publicTenant}/{token}/accept:
    post:
      operationId: acceptPublicQuote
      summary: Accept the exact issued document through a capability
      description: Name, company, note, explicit confirmation, version, digest and UUID mutation ID are required. One quote decision wins across both acceptance channels. Exact replays return the original acceptance.
      security: []
      parameters: [{name: publicTenant, in: path, required: true, schema: {type: string}}, {name: token, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePublicAcceptanceWrite'}}}}
      responses:
        '201': {description: Accepted; receipt rendering is queued, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePublicAcceptance'}}}}
        '200': {description: Exact replay, content: {application/json: {schema: {$ref: '#/components/schemas/QuotePublicAcceptance'}}}}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /public/quotes/{publicTenant}/{token}/pdf:
    get:
      operationId: printPublicQuote
      summary: Render the frozen document with bundled Chromium
      security: []
      parameters: [{name: publicTenant, in: path, required: true, schema: {type: string}}, {name: token, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: A4 PDF, content: {application/pdf: {schema: {type: string, format: binary}}}}
        '503': {$ref: '#/components/responses/Error'}
  /quotes/readiness:
    get:
      operationId: quoteConfirmationReadiness
      summary: Report renderer availability and disabled email transport
      security: [{session: []}]
      responses:
        '200': {description: Readiness, content: {application/json: {schema: {type: object, properties: {renderer_available: {type: boolean}, smtp_enabled: {type: boolean}, smtp_configured: {type: boolean}, email_delivery: {type: string}}}}}}
  /quotes/acceptances:
    get:
      operationId: listQuoteAcceptanceNotices
      summary: List recent acceptance notices for quote staff, optionally limited to the signed-in offer creator's latest 20
      security: [{session: []}]
      parameters: [{name: created_by_me, in: query, schema: {type: boolean, default: false}, description: Return at most 20 notices for offers created by the signed-in principal}]
      responses:
        '200': {description: Recent notices, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /quotes/{quoteId}/versions/{version}/confirmation:
    get:
      operationId: getQuoteConfirmation
      summary: Read the acceptance receipt job state
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}]
      responses:
        '200': {description: Job state, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteConfirmationJob'}}}}
  /quotes/{quoteId}/versions/{version}/confirmation/receipt:
    get:
      operationId: getQuoteConfirmationReceipt
      summary: Download the immutable accepted PDF receipt
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}]
      responses:
        '200': {description: PDF receipt, content: {application/pdf: {schema: {type: string, format: binary}}}}
  /quotes/{quoteId}/versions/{version}/confirmation/retry:
    post:
      operationId: retryQuoteConfirmation
      summary: Retry a failed job or explicitly acknowledge an uncertain state
      security: [{session: []}]
      parameters: [{name: quoteId, in: path, required: true, schema: {type: string, format: uuid}}, {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [acknowledge_uncertain], properties: {acknowledge_uncertain: {type: boolean}}}}}}
      responses:
        '200': {description: Requeued job, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteConfirmationJob'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /time-periods:
    get:
      operationId: listTimePeriods
      summary: List time periods
      security: *auth
      parameters: [{name: principal_id, in: query, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Periods, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TimePeriod'}}}}}
    post:
      operationId: createTimePeriod
      summary: Open a time period for one principal
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimePeriodWrite'}}}}
      responses:
        '201': {description: Period, content: {application/json: {schema: {$ref: '#/components/schemas/TimePeriod'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /time-periods/{periodId}:
    get:
      operationId: getTimePeriod
      summary: Read a time period and its approval state
      security: *auth
      parameters: [{name: periodId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Period, content: {application/json: {schema: {$ref: '#/components/schemas/TimePeriod'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /time-periods/{periodId}/approve:
    post:
      operationId: approveTimePeriod
      summary: Person approves the exact set of entries in a period
      description: Admin person only. Lock period, hash ordered entry IDs and values, then write approval and event atomically. Approved periods cannot gain entries.
      security: [{session: []}]
      parameters: [{name: periodId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimePeriodApprovalWrite'}}}}
      responses:
        '200': {description: Approved period, content: {application/json: {schema: {$ref: '#/components/schemas/TimePeriod'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /time-entries:
    get:
      operationId: listTimeEntries
      summary: List time entries with period, principal or node filters
      security: *auth
      parameters:
        - {name: period_id, in: query, schema: {type: string, format: uuid}}
        - {name: principal_id, in: query, schema: {type: string, format: uuid}}
        - {name: node_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Entries, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TimeEntry'}}}}}
    post:
      operationId: createTimeEntry
      summary: Record principal time against a node
      description: Manual entries require the acting principal or an admin person. Agent-run entries derive principal, work-order node and terminal interval from R2 telemetry; one entry per run.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimeEntryWrite'}}}}
      responses:
        '201': {description: Entry, content: {application/json: {schema: {$ref: '#/components/schemas/TimeEntry'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /time-entries/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - name: If-Unmodified-Since
        in: header
        description: Optional last observed updated_at (RFC3339 with microseconds or HTTP date). Stale values return 412 with the current entry.
        schema: {type: string}
      - name: If-Match
        in: header
        description: Optional quoted updated_at from the entry ETag (also accepts a list of strong tags or *). Takes precedence over If-Unmodified-Since; weak tags never match.
        schema: {type: string}
    patch:
      operationId: updateTimeEntry
      summary: Correct an entry in an open period
      description: Entry owner (person) or admin person only. Changing cost unit or UTC start date snapshots the effective hourly rate; other edits preserve the rate. Agent-run node and interval remain telemetry-derived. Every actual edit increments the period revision and writes time_entry.updated. Approved periods are immutable.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimeEntryPatch'}}}}
      responses:
        '200': {description: Current entry, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/TimeEntry'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: Approved period or invalid interval/rate; response includes a clear message, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '412': {description: Entry changed, content: {application/json: {schema: {$ref: '#/components/schemas/TimeEntryPreconditionFailed'}}}}
    delete:
      operationId: deleteTimeEntry
      summary: Delete an entry from an open period
      description: Entry owner (person) or admin person only. Writes time_entry.deleted with the full before snapshot and increments the period revision. Undo can restore it only while the period remains open.
      security: [{session: []}]
      responses:
        '204': {description: Entry deleted}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '412': {description: Entry changed, content: {application/json: {schema: {$ref: '#/components/schemas/TimeEntryPreconditionFailed'}}}}
  /nodes/{nodeId}/time-totals:
    get:
      operationId: getNodeTimeTotals
      summary: Sum hours and cost for a node subtree
      description: Traverses live descendants inside db.InTenant. Returns separate totals by currency; no implicit conversion.
      security: *auth
      parameters:
        - {name: nodeId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: approved_only, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Totals, content: {application/json: {schema: {$ref: '#/components/schemas/TimeTotals'}}}}
        '404': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: aeon_session}
    agentKey: {type: http, scheme: bearer, description: Bearer token aeon_<prefix>_<secret>}
  schemas:
    AuthzPermission:
      type: object
      required: [key, group, description, risk, grantable_at, agent_grantable]
      properties:
        key: {type: string}
        group: {type: string}
        description: {type: string}
        risk: {type: string, enum: [low, medium, high]}
        grantable_at: {type: array, items: {type: string, enum: [workspace, project]}}
        agent_grantable: {type: boolean, description: A key may carry this permission. The scope picker is built from this flag.}
    AuthzRoleRef:
      type: object
      required: [id, key, name]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        name: {type: string}
    AuthzRole:
      type: object
      required: [id, key, name, description, builtin, permissions, based_on, member_count]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        name: {type: string}
        description: {type: string}
        builtin: {type: boolean}
        permissions: {type: array, items: {type: string}}
        based_on: {type: [string, 'null'], format: uuid}
        member_count: {type: integer}
    RoleWrite:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        permissions: {type: array, items: {type: string}}
        based_on: {type: string, format: uuid}
    EffectivePermissions:
      type: object
      required: [workspace, project]
      properties:
        workspace:
          type: object
          required: [role, permissions]
          properties:
            role: {oneOf: [{$ref: '#/components/schemas/AuthzRoleRef'}, {type: 'null'}]}
            permissions: {type: array, items: {type: string}}
        project:
          oneOf:
            - {type: 'null'}
            - {type: object, required: [id, role, permissions], properties: {id: {type: string, format: uuid}, role: {oneOf: [{$ref: '#/components/schemas/AuthzRoleRef'}, {type: 'null'}]}, permissions: {type: array, items: {type: string}}}}
    ProjectMember:
      type: object
      required: [principal_id, name, avatar_url, has_avatar, kind, via, role, workspace_role]
      properties:
        principal_id: {type: string, format: uuid}
        name: {type: string}
        avatar_url: {type: [string, 'null']}
        has_avatar: {type: boolean}
        kind: {type: string, enum: [person, agent]}
        via: {type: string, enum: [workspace, project]}
        role: {$ref: '#/components/schemas/AuthzRoleRef'}
        workspace_role: {oneOf: [{$ref: '#/components/schemas/AuthzRoleRef'}, {type: 'null'}]}
    ProjectBinding:
      type: object
      required: [id, principal_id, project_id, scope_type, role, created_at]
      properties:
        id: {type: string, format: uuid}
        principal_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        scope_type: {type: string, enum: [project]}
        role: {$ref: '#/components/schemas/AuthzRoleRef'}
        created_at: {type: string, format: date-time}
    Member:
      type: object
      required: [principal_id, name, avatar_url, has_avatar, email, status, identity, workspace_role, project_roles, aliases, classic_role, last_active_at, last_owner]
      properties:
        principal_id: {type: string, format: uuid}
        name: {type: string}
        avatar_url: {type: [string, 'null']}
        has_avatar: {type: boolean}
        email: {type: [string, 'null']}
        status: {type: string, enum: [active, deactivated]}
        identity: {type: [string, 'null'], enum: [inspr_id, null]}
        workspace_role: {oneOf: [{$ref: '#/components/schemas/AuthzRoleRef'}, {type: 'null'}]}
        project_roles: {type: array, items: {$ref: '#/components/schemas/ProjectRole'}}
        aliases: {type: array, items: {$ref: '#/components/schemas/MemberAlias'}}
        classic_role: {type: [string, 'null']}
        last_active_at: {type: [string, 'null'], format: date-time}
        last_owner: {type: boolean}
    MemberAlias:
      type: object
      required: [principal_id, name, source]
      properties:
        principal_id: {type: string, format: uuid}
        name: {type: string}
        source: {type: string, enum: [classic]}
    ProjectRole:
      type: object
      required: [project_id, project_key, project_title, role]
      properties:
        project_id: {type: string, format: uuid}
        project_key: {type: string}
        project_title: {type: string}
        role: {$ref: '#/components/schemas/AuthzRoleRef'}
    PrincipalRef:
      type: object
      required: [principal_id, name]
      properties:
        principal_id: {type: string, format: uuid}
        name: {type: string}
    Invite:
      type: object
      required: [id, email, workspace_role, project_roles, status, created_by, created_at, expires_at, accepted_by, accepted_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        workspace_role: {oneOf: [{$ref: '#/components/schemas/AuthzRoleRef'}, {type: 'null'}]}
        project_roles: {type: array, items: {$ref: '#/components/schemas/ProjectRole'}}
        status: {type: string, enum: [pending, expired, revoked, accepted]}
        created_by: {$ref: '#/components/schemas/PrincipalRef'}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        accepted_by: {oneOf: [{$ref: '#/components/schemas/PrincipalRef'}, {type: 'null'}]}
        accepted_at: {type: [string, 'null'], format: date-time}
    InviteWrite:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
        workspace_role_id: {type: string, format: uuid}
        project_roles:
          type: array
          items:
            type: object
            required: [project_id, role_id]
            properties:
              project_id: {type: string, format: uuid}
              role_id: {type: string, format: uuid}
        expires_in_days: {type: integer, minimum: 1, maximum: 90, default: 14}
    AccessAuditPage:
      type: object
      required: [items, next_after]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AccessAuditEvent'}}
        next_after: {type: [integer, 'null']}
    AccessAuditEvent:
      type: object
      required: [id, type, at, actor, subject, project, data]
      properties:
        id: {type: integer}
        type: {type: string}
        at: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/PrincipalRef'}
        subject: {oneOf: [{$ref: '#/components/schemas/PrincipalRef'}, {type: 'null'}]}
        project: {oneOf: [{type: object, required: [id, key], properties: {id: {type: string, format: uuid}, key: {type: string}}}, {type: 'null'}]}
        data: {type: object}
    MemberDirectory:
      type: object
      required: [people, agents, invites, imported, owner_count]
      properties:
        people: {type: array, items: {$ref: '#/components/schemas/Member'}}
        agents:
          type: array
          items:
            type: object
            required: [principal_id, name, has_avatar, workspace_role, key_count, last_seen_at, service]
            properties:
              principal_id: {type: string, format: uuid}
              name: {type: string}
              has_avatar: {type: boolean}
              workspace_role: {oneOf: [{$ref: '#/components/schemas/AuthzRoleRef'}, {type: 'null'}]}
              key_count: {type: integer}
              last_seen_at: {type: [string, 'null'], format: date-time}
              service: {type: boolean}
        invites: {type: array, items: {$ref: '#/components/schemas/Invite'}}
        imported: {type: array, items: {type: object}}
        owner_count: {type: integer}
    Greeting:
      type: object
      additionalProperties: false
      required: [salutation, name, message, id]
      properties:
        salutation: {type: string, enum: [Good morning, Morning, Good afternoon, Good evening, Hello, Welcome back]}
        name: {type: string, description: Preferred first name or first word of the principal name}
        message: {type: string, maxLength: 80}
        id: {type: string, description: Stable short hash of normalized message text}
    AvatarCrop:
      type: object
      additionalProperties: false
      required: [x, y, size]
      properties:
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
    PersonalProfilePatch:
      type: object
      additionalProperties: false
      properties:
        first_name: {type: string, maxLength: 100}
        last_name: {type: string, maxLength: 100}
        preferred_name: {type: string, maxLength: 100}
        short_name: {type: string, pattern: '^(?:[a-z0-9._-]{2,24})?$', description: Empty clears the handle}
        initials: {type: string, maxLength: 3, description: Optional override; empty derives initials}
        timezone: {type: string, description: IANA time zone}
        locale: {type: string, description: BCP 47 language tag}
        greeting_enabled: {type: boolean}
    PersonalProfile:
      type: object
      additionalProperties: false
      required: [principal_id, email, first_name, last_name, preferred_name, short_name, initials, timezone, locale, greeting_enabled, avatar_color, avatar_hashes, week_start, revision]
      properties:
        principal_id: {type: string, format: uuid}
        email: {type: [string, 'null'], format: email, readOnly: true}
        first_name: {type: string}
        last_name: {type: string}
        preferred_name: {type: string}
        short_name: {type: string}
        initials: {type: string}
        timezone: {type: string}
        locale: {type: string}
        greeting_enabled: {type: boolean}
        avatar_color: {type: string, description: One of twelve muted palette tokens}
        avatar_hashes: {type: object, additionalProperties: {type: string, pattern: '^[a-f0-9]{64}$'}}
        week_start: {type: integer, minimum: 0, maximum: 6, description: 0=Sunday, 1=Monday}
        revision: {type: integer, minimum: 0}
    ProfileValidationError:
      type: object
      required: [errors]
      properties:
        errors: {type: object, additionalProperties: {type: string}}
    Brand:
      description: The product's names (brand.json, schema inspr.brand.v1; AEON_BRAND_FILE overrides it). generation is a label, never a version.
      type: object
      additionalProperties: false
      required: [schema, product, generation, release_name, wordmark, short_name]
      properties:
        schema: {type: string, enum: [inspr.brand.v1]}
        product: {type: string, maxLength: 48}
        generation: {type: string, maxLength: 48}
        release_name: {type: string, maxLength: 48}
        wordmark: {type: string, maxLength: 48}
        short_name: {type: string, maxLength: 48}
    ReleaseHistory:
      description: inspr.release-history.v1 (see internal/releasehistory), newest release first, plus the running version.
      type: object
      required: [schema, product, repository, version_scheme, generated_at, source, releases, current, live_since]
      properties:
        schema: {type: string, enum: [inspr.release-history.v1]}
        product: {type: string}
        repository: {type: string}
        version_scheme: {type: string}
        generated_at: {type: string, format: date-time}
        source: {type: string, enum: [git+github, git, none]}
        current: {type: string, description: The running build's version or dev}
        live_since: {type: string, format: date-time, description: When this server started running the current version}
        releases: {type: array, items: {$ref: '#/components/schemas/Release'}}
    Release:
      type: object
      required: [version, tag, release_channel, release_sequence, state, reserved_at, tagged_at, published_at, headline, tickets, changes, changes_omitted, evidence]
      properties:
        version: {type: string}
        tag: {type: string}
        release_channel: {type: string}
        release_sequence: {type: integer}
        state: {type: string, enum: [published, reserved]}
        reserved_at: {type: [string, 'null'], format: date-time}
        tagged_at: {type: [string, 'null'], format: date-time}
        published_at: {type: [string, 'null'], format: date-time}
        headline: {type: string}
        tickets: {type: array, items: {type: string}}
        changes:
          type: array
          items:
            type: object
            required: [commit, subject, type, scope, tickets, at]
            properties:
              commit: {type: string}
              subject: {type: string}
              type: {type: string, enum: [feat, fix, test, docs, release, refactor, chore, other]}
              scope: {type: string}
              tickets: {type: array, items: {type: string}}
              at: {type: string, format: date-time}
        changes_omitted: {type: integer, minimum: 0}
        evidence:
          type: object
          required: [source_commit, source_url, image, ci, release_run, release_url, unavailable]
          properties:
            source_commit: {type: string}
            source_url: {type: string}
            image:
              type: [object, 'null']
              properties: {reference: {type: string}, digest: {type: string}}
            ci: {$ref: '#/components/schemas/ReleaseRun'}
            release_run: {$ref: '#/components/schemas/ReleaseRun'}
            release_url: {type: string}
            unavailable: {type: array, items: {type: string}, description: What could not be established, in plain words}
    ReleaseRun:
      type: [object, 'null']
      properties: {name: {type: string}, url: {type: string}, status: {type: string}, conclusion: {type: string}}
    Journey:
      type: object
      required: [project_node_id, project_key, tenant_slug, profile, revision, stage, stage_source, disposable, stages, next_action, requirements_revision, requirements_digest_sha256, requirements_approval_scope, launch_readiness]
      properties:
        project_node_id: {type: string, format: uuid, description: Project node id, read from the node. Not taken from the client.}
        project_key: {type: string, description: 'Route key used in /p/{project_key} links (e.g. PHAROS), read from the project node. Not a request field.'}
        node_key: {type: string, pattern: '^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]*$', description: 'Immutable key of the project node (nodes.key, e.g. PRJ-17). Not a request field.'}
        tenant_slug: {type: string, minLength: 1, description: Slug of the tenant that owns the node. Not taken from the client.}
        profile: {type: string, enum: [personal, professional, enterprise]}
        revision: {type: integer, minimum: 1}
        stage: {type: string, enum: [inspire, shape, requirements, plan, build, deploy, access, live]}
        stage_source: {type: string, enum: [journey, derived], description: Whether stage selection uses recorded journey history or the imported-project data derivation}
        imported: {type: boolean, description: 'True for a project imported from classic Paimos with its history; its stages before Plan were never recorded here'}
        disposable: {type: boolean, description: 'True only after the development operator marks this project disposable; read-only and never inferred from gate state.'}
        stages: {type: array, items: {$ref: '#/components/schemas/JourneyStage'}}
        next_action: {$ref: '#/components/schemas/JourneyNextAction'}
        requirements_revision: {type: integer, minimum: 0}
        requirements_digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        requirements_approval_scope: {type: string, description: Exact approval scope for the current requirements revision and content digest}
        launch_readiness: {$ref: '#/components/schemas/JourneyLaunchReadiness'}
        current_release_id: {type: [string, 'null'], format: uuid}
    JourneyLaunchReadiness:
      type: object
      required: [can_admit, reason]
      properties:
        can_admit: {type: boolean}
        reason: {type: string, description: Current blocker or empty when admission can proceed}
    JourneyStage:
      type: object
      required: [key, state, gate_scope, gate_live, handoff_id, handoff_attempt, handoff_authority_epoch]
      properties:
        key: {type: string, enum: [inspire, shape, requirements, plan, build, deploy, access, live]}
        state: {type: string, enum: [done, current, later, skipped, blocked]}
        gate_scope: {type: string, description: 'Exact approval scope reported by this stage. Empty for Inspire and Live. Plan reports journey.build; Build reports journey.candidate even before its gate exists.'}
        gate_approval_id: {type: [string, 'null'], format: uuid}
        gate_live: {type: boolean, description: Whether any approval and grant for the stage gate are currently valid; false when no gate is recorded}
        handoff_id: {type: [string, 'null'], format: uuid}
        handoff_attempt: {type: [integer, 'null'], minimum: 1}
        handoff_authority_epoch: {type: [integer, 'null'], minimum: 1}
    JourneyNextAction:
      type: object
      required: [key, label, stage, available]
      properties:
        key: {type: string, enum: [continue_intake, confirm_brief, decide, reopen, approve_requirements, open_first_release, start_build, wait_for_build, mark_candidate, approve_candidate, approve_deploy, retry_deploy, approve_permit, plan_next_release]}
        label: {type: string}
        stage: {type: string, enum: [inspire, shape, requirements, plan, build, deploy, access, live]}
        available: {type: boolean}
        reason: {type: string}
        approval_request_id: {type: [string, 'null'], format: uuid}
    JourneyProfileWrite:
      type: object
      additionalProperties: false
      required: [profile, expected_revision]
      properties:
        profile: {type: string, enum: [personal, professional, enterprise]}
        expected_revision: {type: integer, minimum: 1}
    JourneyActionWrite:
      type: object
      additionalProperties: false
      required: [action, expected_revision, idempotency_key]
      properties:

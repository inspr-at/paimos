      properties:
        handoff_id: {type: string, format: uuid}
        admission_id: {type: string, format: uuid}
        consumed: {type: boolean, enum: [true]}
        consumed_at: {type: string, format: date-time}
        authority_open: {type: boolean, description: Recomputed on exact replay; false after the handoff closes or is superseded}
    PluginManifest:

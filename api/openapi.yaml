        idempotency_key: {type: string}
        tenant: {type: string, description: Tenant slug}
        sender_principal_id: {type: string, format: uuid}
        recipient_principal_id: {type: string, format: uuid}
        target_id: {type: [string, 'null'], format: uuid, description: Receiver target, null for direct inbox messages}
        target_version: {type: [integer, 'null'], minimum: 1}
        adapter: {type: string, description: Receiver adapter, for example grok_bot_routine}
        address: {type: string}
        effective_level: {type: string, description: Empty for a direct inbox acknowledgement; simple or steer for a managed adapter hand-off}
        state: {type: string, enum: [queued, handed_off, failed]}
        handed_off_at: {type: [string, 'null'], format: date-time, description: RFC3339, set once when the direct recipient acknowledges or the managed adapter confirms}
        failure_reason: {type: string}
    InboxMessage:
      allOf:
        - {$ref: '#/components/schemas/InboxSend'}
        - type: object
          required: [id, sender_principal_id, sent_event_id, created_at, acked_at]
          properties:
            id: {type: string, format: uuid}
            sender_principal_id: {type: string, format: uuid}
            sent_event_id: {type: integer, format: int64}
            created_at: {type: string, format: date-time}
            acked_at: {type: [string, 'null'], format: date-time}
    InboxPage:
      type: object
      required: [items, next_after]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/InboxMessage'}}
        next_after: {type: integer, format: int64}
    InboxTargetWrite:
      type: object
      required: [principal_id, kind]
      properties:
        principal_id: {type: string, format: uuid}
        kind: {type: string, enum: [pull, webhook]}
        webhook_url: {type: string, format: uri, pattern: '^https://'}
    InboxTarget:
      allOf:
        - {$ref: '#/components/schemas/InboxTargetWrite'}
        - type: object
          required: [id, enabled, created_at]
          properties:
            id: {type: string, format: uuid}
            enabled: {type: boolean}
            created_at: {type: string, format: date-time}
    WorkCriterion:
      type: object
      required: [id, position, description, checked_at]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer, minimum: 0}
        description: {type: string, minLength: 1}
        checked_at: {type: [string, 'null'], format: date-time}
        checked_by_principal_id: {type: [string, 'null'], format: uuid}
    WorkOrderCreate:
      type: object
      required: [title, criteria]
      properties:
        title: {type: string, minLength: 1}
        body: {type: string}
        parent_id: {type: string, format: uuid}
        assignee_principal_id: {type: string, format: uuid}
        max_cost_micros: {type: integer, format: int64, minimum: 0}
        max_duration_seconds: {type: integer, format: int64, minimum: 1}
        criteria: {type: array, minItems: 1, items: {type: string, minLength: 1}}
    WorkOrderPatch:
      type: object
      required: [expected_revision]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        status: {type: string, enum: [draft, ready, running, blocked, done, cancelled]}
        assignee_principal_id: {type: [string, 'null'], format: uuid}
        max_cost_micros: {type: [integer, 'null'], format: int64, minimum: 0}
        max_duration_seconds: {type: [integer, 'null'], format: int64, minimum: 1}
    WorkOrder:
      type: object
      required: [node_id, status, revision, criteria, created_at, updated_at]
      properties:
        node_id: {type: string, format: uuid}
        status: {type: string, enum: [draft, ready, running, blocked, done, cancelled]}
        revision: {type: integer, format: int64}
        requested_by_principal_id: {type: string, format: uuid}
        assignee_principal_id: {type: [string, 'null'], format: uuid}
        max_cost_micros: {type: [integer, 'null'], format: int64}
        max_duration_seconds: {type: [integer, 'null'], format: int64}
        criteria: {type: array, items: {$ref: '#/components/schemas/WorkCriterion'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    WorkEvidenceWrite:
      type: object
      required: [kind, reference]
      properties:
        kind: {type: string, enum: [url, node, text]}
        reference: {type: string, minLength: 1}
        criterion_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
    WorkEvidence:
      allOf:
        - {$ref: '#/components/schemas/WorkEvidenceWrite'}
        - type: object
          required: [id, work_order_id, submitted_by_principal_id, created_at]
          properties:
            id: {type: string, format: uuid}
            work_order_id: {type: string, format: uuid}
            submitted_by_principal_id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
    RunCreate:
      type: object
      required: [agent_principal_id, model_profile_id]
      properties:
        agent_principal_id: {type: string, format: uuid}
        model_profile_id: {type: string, format: uuid}
        requested_account_id:
          type: [string, 'null']
          format: uuid
          description: Optional strict account choice. Must belong to the selected agent and match the model harness. The daemon still reserves allowance and claims; an unavailable chosen account leaves the run queued without fallback. Omit or null for automatic routing.
    RunClaim:
      type: object
      required: [daemon_id, daemon_generation, reservation_ids]
      properties:
        daemon_id: {type: string, minLength: 1, maxLength: 128}
        daemon_generation: {type: string, minLength: 1, maxLength: 128}
        reservation_ids: {type: array, minItems: 1, items: {type: string, format: uuid}}
    ProjectGroup:
      type: object
      required: [id, name, position, project_ids, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        position: {type: integer}
        project_ids: {type: array, items: {type: string, format: uuid}}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProjectGroupWrite:
      type: object
      required: [event_id]
      description: The result of a shared group write and the event that undoes it.
      properties:
        group: {$ref: '#/components/schemas/ProjectGroup'}
        assignments:
          type: array
          items:
            type: object
            required: [project_id, group_id]
            properties:
              project_id: {type: string, format: uuid}
              group_id: {type: [string, 'null'], format: uuid}
        event_id: {type: [integer, 'null'], format: int64}
    Preference:
      type: object
      required: [key, value, updated_at]
      properties:
        key: {type: string}
        value: {type: [object, 'null']}
        updated_at: {type: [string, 'null'], format: date-time}
    NodeSummary:
      type: object
      required: [id, key, title]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        title: {type: string}
    HarnessRegistration:
      type: object
      required: [agent_principal_id, harness, host, management_mode, role, harness_session_ref, worker_lease]
      properties:
        agent_principal_id: {type: string, format: uuid}
        run_id: {type: [string, 'null'], format: uuid}
        ticket_node_id: {type: [string, 'null'], format: uuid}
        work_order_id: {type: [string, 'null'], format: uuid}
        parent_harness_session_id: {type: [string, 'null'], format: uuid}
        display_label:
          type: [string, 'null']
          maxLength: 128
          description: Optional public session label. Trimmed; empty becomes null. Control characters are rejected. Part of exact registration replay.
        harness: {type: string, enum: [codex, claude, pi, cursor, grok]}
        host: {type: string, minLength: 1, maxLength: 128}
        management_mode: {type: string, enum: [managed, unmanaged]}
        role: {type: string, enum: [coordinator, worker]}
        work_shape: {type: string, enum: [unknown, ship, scout]}
        advertised_capabilities: {type: array, items: {type: string, enum: [inbox, status, steer, interrupt, stop]}}
        harness_session_ref: {type: string, minLength: 16, maxLength: 4096, writeOnly: true}
        worker_lease: {type: string, minLength: 32, maxLength: 256, writeOnly: true}
    HarnessSession:
      type: object
      required: [id, project_id, agent_principal_id, harness, host, management_mode, role, work_shape, advertised_capabilities, phase, activity, activity_sequence, revision, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        agent_principal_id: {type: string, format: uuid}
        run_id: {type: [string, 'null'], format: uuid}
        ticket_node_id: {type: [string, 'null'], format: uuid}
        work_order_id: {type: [string, 'null'], format: uuid}
        parent_harness_session_id: {type: [string, 'null'], format: uuid}
        display_label: {type: [string, 'null'], maxLength: 128, description: Public per-session label; null for generations registered without a label.}
        harness: {type: string, enum: [codex, claude, pi, cursor, grok]}
        host: {type: string}
        management_mode: {type: string, enum: [managed, unmanaged]}
        role: {type: string, enum: [worker, coordinator]}
        work_shape: {type: string, enum: [unknown, ship, scout]}
        advertised_capabilities: {type: array, items: {type: string}}
        phase: {type: string, enum: [starting, working, yielded, stopping, stopped]}
        activity: {type: string, enum: [unknown, busy, idle]}
        activity_sequence: {type: integer, format: int64}
        revision: {type: integer, format: int64}
        heartbeat_at: {type: [string, 'null'], format: date-time}
        stopped_at: {type: [string, 'null'], format: date-time}
        stop_reason: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    HarnessSessionSummary:
      allOf:
        - {$ref: '#/components/schemas/HarnessSession'}
        - type: object
          required: [project, ticket, agent]
          properties:
            project: {$ref: '#/components/schemas/NodeSummary'}
            ticket:
              oneOf:
                - {$ref: '#/components/schemas/NodeSummary'}
                - {type: 'null'}
            agent:
              description: The agent principal running the session (its name, not the host)
              type: [object, 'null']
              properties:
                id: {type: string, format: uuid}
                name: {type: string}
    LiveAgent:
      type: object
      required: [project_id, harness, management_mode, role, phase, activity, ticket, since, heartbeat_at]
      properties:
        project_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid, description: Present only with harness.read in the workspace}
        principal_id: {type: string, format: uuid, description: Present only with members.read or harness.read at the project}
        name: {type: string, description: The agent principal's name; present with principal_id}
        harness: {type: string, enum: [codex, claude, pi, cursor, grok]}
        management_mode: {type: string, enum: [managed, unmanaged]}
        role: {type: string, enum: [worker, coordinator]}
        phase: {type: string, enum: [starting, working, stopping]}
        activity: {type: string, enum: [busy, unknown]}
        ticket:
          description: The bound ticket and the project it lives in now
          oneOf:
            - allOf:
                - {$ref: '#/components/schemas/NodeSummary'}
                - type: object
                  required: [project_id]
                  properties:
                    project_id: {type: string, format: uuid}
            - {type: 'null'}
        since: {type: string, format: date-time, description: When the session started}
        heartbeat_at: {type: string, format: date-time}
    ProjectMessage:
      allOf:
        - {$ref: './openapi-messaging.yaml#/components/schemas/Message'}
        - type: object
          required: [created_at, human_resolution_outcome]
          properties:
            created_at: {type: string, format: date-time}
            human_resolution_outcome: {type: [string, 'null'], enum: [resolved, dismissed, null]}
    HeldMessageResolution:
      type: object
      required: [message_id, decision, created_at]
      properties:
        message_id: {type: string, format: uuid}
        decision: {type: string, enum: [resolved, dismissed]}
        created_at: {type: string, format: date-time}
    AgentRun:
      type: object
      required: [id, work_order_id, agent_principal_id, status, model_evidence, input_tokens, output_tokens, cost_micros, created_at]
      properties:
        id: {type: string, format: uuid}
        work_order_id: {type: string, format: uuid}
        agent_principal_id: {type: string, format: uuid}
        model_profile_id: {type: [string, 'null'], format: uuid}
        account_id: {type: [string, 'null'], format: uuid}
        requested_account_id: {type: [string, 'null'], format: uuid, description: The optional account choice pinned at creation; account_id remains null until a reservation succeeds.}
        status: {type: string, enum: [queued, starting, running, waiting, completed, failed, cancelled, ownership_lost]}
        requested_model: {type: [string, 'null']}
        effective_model: {type: [string, 'null']}
        outcome: {type: [string, 'null'], enum: [completed, failed, cancelled, ownership_lost, null]}
        duration_ms: {type: [integer, 'null'], format: int64, description: Whole elapsed milliseconds for terminal runs; null until both timestamps exist}
        model_evidence: {type: string, enum: [unverified, vendor_reported]}
        input_tokens: {type: integer, format: int64}
        output_tokens: {type: integer, format: int64}
        cost_micros: {type: integer, format: int64}
        started_at: {type: [string, 'null'], format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    RunTelemetry:
      type: object
      required: [sequence, kind]
      properties:
        sequence: {type: integer, format: int64, minimum: 1}
        kind: {type: string, enum: [started, heartbeat, turn, tool, usage, status, finished]}
        status: {type: string, enum: [starting, running, waiting, completed, failed, cancelled, ownership_lost]}
        input_tokens_delta: {type: integer, format: int64, minimum: 0}
        output_tokens_delta: {type: integer, format: int64, minimum: 0}
        cost_micros_delta: {type: integer, format: int64, minimum: 0}
        tool_count_delta: {type: integer, minimum: 0}
        turn_count_delta: {type: integer, minimum: 0}
        effective_model: {type: string}
        model_evidence: {type: string, enum: [unverified, vendor_reported]}
        error_code: {type: string, enum: [event_stream_bound, app_server_protocol, child_exit_failed, turn_failed, child_stop_failed, ownership_lost, reporter_unavailable, workspace_conflict, decision_refused]}
    ApprovalProposal:
      type: object
      required: [scope, resource_kind, rationale, expires_at]
      properties:
        scope: {type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
        resource_kind: {type: string, enum: [tenant, node, run]}
        resource_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        rationale: {type: string, minLength: 1}
        expires_at: {type: string, format: date-time}
    ApprovalDecisionWrite:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [approved, denied]}
        reason: {type: string}
    Approval:
      allOf:
        - {$ref: '#/components/schemas/ApprovalProposal'}
        - type: object
          required: [id, agent_principal_id, proposed_at, decision, risk]
          properties:
            id: {type: string, format: uuid}
            agent_principal_id: {type: string, format: uuid}
            agent_name: {type: string, description: "Present only when the caller holds members.read or harness.read at the approval's workspace or project scope and the proposing agent is visible; otherwise omitted."}
            risk: {type: string, enum: [low, medium, high], readOnly: true, description: "Tenant resource or control/deploy/delete scope segments are high; read-only scopes are low; others medium"}
            proposed_at: {type: string, format: date-time}
            decision: {type: [string, 'null'], enum: [approved, denied, null]}
            decided_by_principal_id: {type: [string, 'null'], format: uuid}
    ModelProfileWrite:
      type: object
      required: [slug, version, harness, family, model, effort, tier]
      properties:
        slug: {type: string, pattern: '^[a-z][a-z0-9_-]*$'}
        version: {type: string, minLength: 1, maxLength: 64}
        harness: {type: string, enum: [codex, claude, pi, cursor, grok]}
        family: {type: string, enum: [openai, anthropic, xai, cursor]}
        model: {type: string, minLength: 1, maxLength: 128}
        effort: {type: string, minLength: 1, maxLength: 32}
        tier: {type: string, enum: [fast, standard, strong, frontier]}
    ModelProfile:
      allOf:
        - {$ref: '#/components/schemas/ModelProfileWrite'}
        - type: object
          required: [id, enabled, created_at]
          properties:
            id: {type: string, format: uuid}
            enabled: {type: boolean}
            created_at: {type: string, format: date-time}
    ModelRoute:
      type: object
      required: [role, priority, profile_id, state]
      properties:
        role: {type: string, enum: [scout, mechanical, build, build-hard, review-gate]}
        priority: {type: integer, minimum: 1}
        profile_id: {type: string, format: uuid}
        state: {type: string, enum: [available, unavailable, conserved, budget_limited]}
        reason: {type: string}
        valid_until: {type: [string, 'null'], format: date-time}
    ModelResolution:
      type: object
      required: [role, ladder, owner_required, source]
      properties:
        role: {type: string}
        profile: {oneOf: [{$ref: '#/components/schemas/ModelProfile'}, {type: 'null'}]}
        ladder: {type: array, items: {type: object, required: [profile_id, selected, skip_reasons], properties: {profile_id: {type: string, format: uuid}, selected: {type: boolean}, skip_reasons: {type: array, items: {type: string}}}}}
        command_template: {type: string}
        owner_required: {type: boolean}
        source: {type: string, enum: [aeon]}
    AgentAccountWrite:
      type: object
      required: [account_key, harness, daemon_id, label]
      properties:
        account_key: {type: string, minLength: 1, maxLength: 128}
        harness: {type: string, enum: [codex, claude, pi, cursor, grok]}
        daemon_id: {type: string, minLength: 1, maxLength: 128}
        label: {type: string, minLength: 1, maxLength: 128}
        max_parallel_runs: {type: integer, minimum: 1}
    AgentAccount:
      allOf:
        - {$ref: '#/components/schemas/AgentAccountWrite'}
        - type: object
          required: [id, registered_by_principal_id, state, created_at]
          properties:
            id: {type: string, format: uuid}
            registered_by_principal_id: {type: string, format: uuid}
            state: {type: string, enum: [available, draining, unavailable]}
            last_probe_at: {type: [string, 'null'], format: date-time}
            last_probe_ok: {type: [boolean, 'null']}
            created_at: {type: string, format: date-time}
    AccountProbe:
      type: object
      required: [daemon_id, daemon_generation, available]
      properties:
        daemon_id: {type: string, minLength: 1, maxLength: 128}
        daemon_generation: {type: string, minLength: 1, maxLength: 128}
        available: {type: boolean}
    AllowanceWindowWrite:
      type: object
      required: [starts_at, ends_at, unit, allowance, pace_model]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        unit: {type: string, enum: [requests, tokens, cost_micros]}
        allowance: {type: integer, format: int64, minimum: 1}
        pace_model: {type: string, enum: [steady, frontload, unrestricted]}
        burst_ratio: {type: number, minimum: 0, maximum: 1, default: 0.1}
    AllowanceWindow:
      allOf:
        - {$ref: '#/components/schemas/AllowanceWindowWrite'}
        - type: object
          required: [id, account_id, used, reserved, provisional]
          properties:
            id: {type: string, format: uuid}
            account_id: {type: string, format: uuid}
            used: {type: integer, format: int64}
            reserved: {type: integer, format: int64}
            provisional: {type: boolean, description: "True when this window has no measured usage for its unit, or at least one settled reservation lacked measured usage. Zero-valued legacy telemetry is treated as unknown."}
    AccountRouteRequest:
      type: object
      required: [run_id, daemon_id, account_ids, estimated_units]
      properties:
        run_id: {type: string, format: uuid}
        daemon_id: {type: string, minLength: 1, maxLength: 128}
        account_ids:
          type: array
          description: IDs of locally enrolled accounts available to the requesting daemon.
          minItems: 1
          maxItems: 256
          items: {type: string, format: uuid}
        estimated_units:
          type: object
          description: Required estimates for every configured active unit; omit only units with no active window.
          propertyNames: {enum: [requests, tokens, cost_micros]}
          additionalProperties: {type: integer, format: int64, minimum: 1}
    AccountRoute:
      type: object
      required: [account_id, account_key, daemon_id, reservations]
      properties:
        account_id: {type: string, format: uuid}
        account_key: {type: string}
        daemon_id: {type: string}
        reservations:
          type: array
          minItems: 1
          items:
            type: object
            required: [reservation_id, window_id, unit]
            properties:
              reservation_id: {type: string, format: uuid}
              window_id: {type: string, format: uuid}
              unit: {type: string, enum: [requests, tokens, cost_micros]}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Principal:
      type: object
      required: [id, tenant_id, kind, name, roles]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [person, agent]
        name:
          type: string
        email:
          type: ["string", "null"]
          description: Display email for auth responses, resolved from the link target when present.
        roles:
          type: array
          items:
            type: string
    Tenant:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    Identity:
      type: object
      required: [id, issuer, subject]
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
        subject:
          type: string
        email:
          type: ["string", "null"]
        display_name:
          type: ["string", "null"]
    MeUnauthorized:
      type: object
      required: [error, dev_mode]
      properties:
        error: {type: string, enum: [unauthorized]}
        dev_mode: {type: boolean, description: True only when AEON_ENV is explicitly dev.}
    Me:
      type: object
      description: Linked persons use their target's name and email for display. Authenticated principal IDs and roles and OIDC identity IDs, issuers and subjects retain their original authority.
      required: [principal, tenant, identity, dev_mode]
      properties:
        dev_mode: {type: boolean, description: True only when AEON_ENV is explicitly dev.}
        principal:
          $ref: "#/components/schemas/Principal"
        tenant:
          $ref: "#/components/schemas/Tenant"
        identity:
          oneOf:
            - {$ref: "#/components/schemas/Identity"}
            - {type: "null"}
    AgentKey:
      type: object
      required: [id, principal_id, name, prefix, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        principal_id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: ["string", "null"]
          format: date-time
        last_used_at:
          type: ["string", "null"]
          format: date-time
        revoked_at:
          type: ["string", "null"]
          format: date-time
    AgentKeyCreated:
      allOf:
        - {$ref: "#/components/schemas/AgentKey"}
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Returned once. Format aeon_<prefix>_<secret>.
    TicketGraph:
      type: object
      required: [nodes, links, truncated]
      properties:
        truncated: {type: boolean}
        nodes:
          type: array
          maxItems: 1500
          items:
            type: object
            required: [id, key, title, type, status, status_category, priority, parent_id, release_id, updated_at, link_count]
            properties:
              id: {type: string, format: uuid}
              key: {type: string}
              title: {type: string}
              type: {type: string, enum: [ticket, epic]}
              status: {type: string, description: Stored workflow state}
              status_category: {type: string, enum: [open, doing, done]}
              priority:
                type: [string, 'null']
              parent_id:
                type: [string, 'null']
                format: uuid
                description: Parent ticket or epic when that parent is visible. Null when the parent is a project, another kind, or not visible.
              release_id:
                type: [string, 'null']
                format: uuid
                description: Journey release of this ticket when that release node is visible.
              updated_at: {type: string, format: date-time}
              link_count: {type: integer, minimum: 0, description: Links in this answer that touch the node}
        links:
          type: array
          items:
            type: object
            required: [source, target, kind]
            properties:
              source: {type: string, format: uuid}
              target: {type: string, format: uuid}
              kind: {type: string, enum: [blocks, relates, implements, duplicates, parent]}
    KnowledgeGraph:
      type: object
      required: [nodes, edges, truncated]
      properties:
        truncated: {type: boolean}
        nodes:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [id, key, type, slug, title, status, degree, updated_at, kind]
            properties:
              id: {type: string, format: uuid}
              key: {type: string}
              type: {type: string, enum: [runbook, guideline, memory, external-system, related-project, ticket]}
              kind: {type: string, enum: [knowledge, ticket]}
              slug: {type: string}
              title: {type: string}
              status: {type: string, description: Knowledge status or ticket state}
              degree: {type: integer, minimum: 0, description: Unique neighbours in the returned graph}
              updated_at: {type: string, format: date-time}
        edges:
          type: array
          maxItems: 8000
          items:
            type: object
            required: [source, target, kind, label]
            properties:
              source: {type: string, format: uuid}
              target: {type: string, format: uuid}
              kind: {type: string, enum: [relation, mention]}
              label: {type: string}
    KnowledgeType:
      type: string
      enum: [runbook, guideline, memory, external-system, related-project]
    KnowledgeStatus:
      type: string
      description: active is stored as backlog, archived as cancelled; any other stored state reads as active.
      enum: [active, proposed, archived]
    KnowledgePerson:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    KnowledgeItem:
      type: object
      required: [id, key, type, kind, slug, title, status, state, project, excerpt, link_count, created_at, updated_at, updated_by, imported]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        type: {$ref: '#/components/schemas/KnowledgeType'}
        kind: {type: string, description: Node kind slug (external_system)}
        slug: {type: string}
        title: {type: string}
        status: {$ref: '#/components/schemas/KnowledgeStatus'}
        state: {type: string}
        project:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, key, title]
              properties:
                id: {type: string, format: uuid}
                key: {type: string}
                title: {type: string}
        excerpt: {type: string}
        link_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        updated_by:
          oneOf: [{type: 'null'}, {$ref: '#/components/schemas/KnowledgePerson'}]
        imported: {type: boolean, description: The last write came from the classic import}
    KnowledgeEntry:
      allOf:
        - $ref: '#/components/schemas/KnowledgeItem'
        - type: object
          required: [body, metadata, author, links]
          properties:
            body: {type: string}
            metadata: {type: object, additionalProperties: true}
            author:
              oneOf: [{type: 'null'}, {$ref: '#/components/schemas/KnowledgePerson'}]
            links:
              type: array
              items:
                type: object
                required: [relation_id, type, direction, node]
                properties:
                  relation_id: {type: string, format: uuid}
                  type: {type: string}
                  direction: {type: string, enum: [out, in]}
                  node:
                    type: object
                    required: [id, key, title, state, kind, project_id]
                    properties:
                      id: {type: string, format: uuid}
                      key: {type: string}
                      title: {type: string}
                      state: {type: string}
                      kind: {type: string}
                      project_id: {type: [string, 'null'], format: uuid}
                      slug: {type: string}
                      type: {$ref: '#/components/schemas/KnowledgeType'}
            renamed_from: {type: string}
            event_id: {type: integer, format: int64, description: The event a write appended; absent on reads and no-op writes}
    KnowledgePage:
      type: object
      required: [items, total, truncated, counts]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/KnowledgeItem'}}
        total: {type: integer}
        truncated: {type: boolean}
        counts:
          type: object
          properties:
            type: {type: object, additionalProperties: {type: integer}}
            status: {type: object, additionalProperties: {type: integer}}
    KnowledgeCreate:
      type: object
      required: [project_id, type, slug, title]
      additionalProperties: false
      properties:
        project_id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/KnowledgeType'}
        slug: {type: string, pattern: '^[a-z][a-z0-9_-]*$', maxLength: 64}
        title: {type: string, minLength: 1, maxLength: 500}
        body: {type: string}
        status: {$ref: '#/components/schemas/KnowledgeStatus'}
        metadata: {type: object, additionalProperties: true}
        key_prefix: {type: string, pattern: '^[A-Z][A-Z0-9]{1,9}$', description: Key prefix, usually the project's key; default is the kind's prefix}
    KnowledgePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        body: {type: string}
        status: {$ref: '#/components/schemas/KnowledgeStatus'}
        slug: {type: string, pattern: '^[a-z][a-z0-9_-]*$', maxLength: 64}
        metadata: {type: object, additionalProperties: true}
    KnowledgeProblem:
      type: object
      required: [error, code]
      properties:
        error: {type: string}
        code: {type: string, enum: [slug_taken, stale]}
        conflict: {$ref: '#/components/schemas/KnowledgeItem'}
        entry: {$ref: '#/components/schemas/KnowledgeEntry'}
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Kind:
      type: object
      required: [id, slug, label, short_prefix, icon, allowed_child_kinds, field_schema]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        label:
          type: string
        short_prefix:
          type: string
          description: Default generated-key prefix
        icon:
          type: string
          description: Symbolic SVG icon name
        allowed_child_kinds:
          type: [array, 'null']
          description: Null allows any kind; empty forbids children
          items:
            type: string
        field_schema:
          type: object
          description: JSON Schema for fields
    KindWrite:
      type: object
      required: [slug, label, short_prefix, icon, field_schema]
      properties:
        slug:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        label:
          type: string
          minLength: 1
        short_prefix:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,9}$'
        icon:
          type: string
          minLength: 1
        allowed_child_kinds:
          type: [array, 'null']
          items:
            type: string
        field_schema:
          type: object
    KindPatch:
      type: object
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
        short_prefix:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,9}$'
        icon:
          type: string
          minLength: 1
        allowed_child_kinds:
          type: [array, 'null']
          items:
            type: string
        field_schema:
          type: object
    CommentBody:
      type: object
      additionalProperties: false
      required: [body_markdown]
      properties:
        body_markdown: {type: string, minLength: 1, maxLength: 65536, description: Nonblank Markdown; at most 65536 UTF-8 bytes. Render safely on the client.}
    ActivityItem:
      type: object
      required: [id, at, type, author]
      properties:
        id: {type: string, description: "Stable tenant-local event ID, represented as a decimal string"}
        at: {type: string, format: date-time}
        type: {type: string, enum: [comment, change, created]}
        author:
          type: object
          required: [id, name, has_avatar]
          properties:
            id: {type: [string, 'null'], format: uuid, description: Null if no imported principal mapping exists}
            name: {type: string}
            has_avatar: {type: boolean, description: 'The person has a profile picture at /api/people/{id}/avatar/{size}; clients request it only then and show initials otherwise.'}
        body_markdown: {type: string, description: Present for comments only}
        changes:
          type: array
          description: Present for changes only; assignees resolve to names when mapped, parent values are source IDs or native UUIDs.
          items:
            type: object
            required: [field, from, to]
            properties:
              field: {type: string, enum: [status, priority, assignee, title, parent]}
              from: {type: [string, 'null']}
              to: {type: [string, 'null']}
    Attachment:
      type: object
      required: [id, node_id, sha256, name, content_type, size, caption, position, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        node_id: {type: string, format: uuid}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        name: {type: string}
        content_type: {type: string}
        size: {type: integer, format: int64}
        width: {type: [integer, 'null']}
        height: {type: [integer, 'null']}
        caption: {type: string}
        position: {type: string}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: [string, 'null'], format: date-time}
    Node:
      type: object
      required: [id, key, kind_id, title, body, fields, state, parent_id, position, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: PAI-123
        kind_id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
          description: Markdown
        fields:
          type: object
        state:
          type: string
        parent_id:
          type: [string, 'null']
          format: uuid
        position:
          type: string
          description: Decimal sibling rank
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, 'null']
          format: date-time
    NodeCreate:
      type: object
      required: [kind_id, title]
      properties:
        kind_id:
          type: string
          format: uuid
        key:
          type: string
          description: Optional preserved import key
        key_prefix:
          type: string
          description: Optional generated-key prefix; defaults to kind short_prefix
        title:
          type: string
          minLength: 1
        body:
          type: string
          default: ''
        fields:
          type: object
          default: {}
        state:
          type: string
          default: open
        parent_id:
          type: [string, 'null']
          format: uuid
        before_id:
          type: [string, 'null']
          format: uuid
          description: Existing sibling; null appends
    NodePatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
        fields:
          type: object
        state:
          type: string
    TagPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1}
        color: {type: string, enum: [gray, slate, blue, indigo, purple, pink, red, orange, yellow, green, teal, cyan]}
        description: {type: string}
    MoveNode:
      type: object
      required: [parent_id]
      properties:
        parent_id:
          type: [string, 'null']
          format: uuid
        before_id:
          type: [string, 'null']
          format: uuid
    NodePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NodeListItem'
        next_cursor:
          type: [string, 'null']
        facets:
          type: object
          description: Requested counts over the filtered result before pagination
          additionalProperties:
            type: object
            additionalProperties: {type: integer}
    NodeListItem:
      allOf:
        - $ref: '#/components/schemas/Node'
        - type: object
          required: [kind_slug, kind_label, priority, assignee, parent, children_count, project, epic]
          properties:
            kind_slug: {type: string}
            kind_label: {type: string}
            priority: {type: [string, 'null']}
            assignee:
              type: [object, 'null']
              properties:
                id: {type: string, format: uuid}
                name: {type: string}
                has_avatar: {type: boolean, description: 'The person has a profile picture at /api/people/{id}/avatar/{size}; clients request it only then and show initials otherwise.'}
            parent:
              type: [object, 'null']
              properties:
                id: {type: string, format: uuid}
                key: {type: string}
                title: {type: string}
                kind_slug: {type: string}
            children_count: {type: integer, minimum: 0}
            project:
              type: [object, 'null']
              properties:
                id: {type: string, format: uuid}
                key: {type: string}
                title: {type: string}
            epic:
              description: The nearest epic above the item (a task's is its ticket's epic); null under no epic.
              type: [object, 'null']
              properties:
                id: {type: string, format: uuid}
                key: {type: string}
                title: {type: string}
    TreeEntry:
      type: object
      required: [node, depth]
      properties:
        node:
          $ref: '#/components/schemas/Node'
        depth:
          type: integer
          minimum: 0
    TreePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TreeEntry'
        next_cursor:
          type: [string, 'null']
    KindList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Kind'
    RelationType:
      type: string
      enum: [blocks, relates, implements, cites, duplicates, customer_of, contact_for]
    RelationCreate:
      type: object
      required: [source_node_id, target_node_id, type]
      properties:
        source_node_id:
          type: string
          format: uuid
        target_node_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/RelationType'
    Relation:
      allOf:
        - {$ref: '#/components/schemas/RelationCreate'}
        - type: object
          required: [id, created_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
    RelationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        next_cursor:
          type: [string, 'null']
    Event:
      type: object
      required: [id, actor_principal_id, type, at]
      properties:
        id:
          type: integer
          format: int64
        actor_principal_id:
          type: string
          format: uuid
        node_id:
          type: [string, 'null']
          format: uuid
        type:
          type: string
          description: Stable dotted name, e.g. node.updated
        before:
          description: Previous resource snapshot or null
        after:
          description: New resource snapshot or null
        at:
          type: string
          format: date-time
        undo_of:
          type: [integer, 'null']
          format: int64
    EventPage:
      type: object
      required: [items, next_after]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_after:
          type: [integer, 'null']
          format: int64
    SearchHit:
      type: object
      required: [node, score]
      properties:
        node:
          $ref: '#/components/schemas/Node'
        score:
          type: number
          description: Reciprocal-rank-fusion score
    SearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        next_cursor:
          type: [string, 'null']
    ViewWrite:
      type: object
      required: [name, filters, columns]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        project_id:
          type: [string, 'null']
          format: uuid
          description: The project whose lists show the view; null or absent is workspace-wide. Set on create only.
        filters:
          type: object
          description: Node-list filter keys and values (at most 8 KiB); the web app owns their shape
        sort_keys:
          type: array
          maxItems: 8
          description: The list sort in the node list's spelling, for example [state, -updated_at]
          items: {type: string, pattern: '^-?[a-z][a-z_]{0,23}$'}
        group_by:
          type: string
          default: none
          pattern: '^[a-z][a-z_]{0,23}$'
        sort:
          type: object
          required: [field, direction]
          properties:
            field:
              type: string
              enum: [position, updated_at, created_at, key, title]
            direction:
              type: string
              enum: [asc, desc]
          description: The earlier single-key sort; defaults to position asc
        columns:
          type: array
          maxItems: 32
          description: Column ids in order; empty means the columns follow the table width
          items:
            type: string
            pattern: '^[a-z][a-z_]{0,23}$'
        shared:
          type: boolean
          default: false
    ViewPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        filters:
          type: object
        sort:
          type: object
        sort_keys:
          type: array
          maxItems: 8
          items: {type: string}
        group_by:
          type: string
        columns:
          type: array
          items:
            type: string
        shared:
          type: boolean
    SavedView:
      allOf:
        - {$ref: '#/components/schemas/ViewWrite'}
        - type: object
          required: [id, owner_principal_id, project_id, sort, sort_keys, group_by, shared, created_at, updated_at, deleted_at]
          properties:
            id: {type: string, format: uuid}
            owner_principal_id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            deleted_at: {type: [string, 'null'], format: date-time}
    ViewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedView'
    ImportJob:
      type: object
      required: [id, status, source, processed_count, created_count, error_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        source:
          type: string
        processed_count:
          type: integer
          format: int64
        created_count:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
        failure_summary:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    ImportPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportJob'
        next_cursor:
          type: [string, 'null']
  parameters:
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KindId:
      name: kindId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationId:
      name: relationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ViewId:
      name: viewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor bound to filters and sort
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
        description: Comma-separated sort keys; prefix a key with - for descending order. Keys are position, updated_at, created_at, key, title, state, priority, kind, assignee (by name, unassigned work last in both directions).
        default: position
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
  requestBodies:
    KindWrite:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KindWrite'
    KindPatch:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KindPatch'
    NodeCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NodeCreate'
    NodePatch:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NodePatch'
    MoveNode:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MoveNode'
    RelationCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RelationCreate'
    ViewWrite:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ViewWrite'
    ViewPatch:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ViewPatch'
  responses:
    KnowledgeEntry:
      description: Knowledge entry
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeEntry'
    Error:
      description: Request error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Kind:
      description: Kind
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Kind'
    Kinds:
      description: Kinds
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KindList'
    Node:
      description: Node
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Node'
    Nodes:
      description: Node page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NodePage'
    Tree:
      description: Tree page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TreePage'
    Relation:
      description: Relation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Relation'
    Relations:
      description: Relation page
      content:
        application/json:
          schema:

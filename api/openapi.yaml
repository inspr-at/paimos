openapi: 3.1.0
info:
  title: PAIMOS AEON API
  version: dev
  license: {name: AGPL-3.0-only}
servers:
  - url: /api
paths:
  /authz/permissions:
    get:
      operationId: listAuthzPermissions
      summary: Versioned permission registry
      responses:
        '200': {description: Permission descriptors, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AuthzPermission'}}}}}
        '403': {description: Permission denied}
  /me/permissions:
    get:
      operationId: getMyPermissions
      summary: Effective workspace and optional project permissions
      parameters:
        - {name: project_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Effective grants, content: {application/json: {schema: {$ref: '#/components/schemas/EffectivePermissions'}}}}
        '403': {description: Permission denied}
  /roles:
    get:
      operationId: listRoles
      responses:
        '200': {description: Built-in and custom roles, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AuthzRole'}}}}}
    post:
      operationId: createRole
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleWrite'}}}}
      responses:
        '201': {description: Role created, content: {application/json: {schema: {$ref: '#/components/schemas/AuthzRole'}}}}
        '403': {description: Permission denied or role escalation}
  /roles/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateRole
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleWrite'}}}}
      responses:
        '200': {description: Updated custom role, content: {application/json: {schema: {$ref: '#/components/schemas/AuthzRole'}}}}
        '403': {description: Permission denied or role escalation}
    delete:
      operationId: deleteRole
      parameters:
        - {name: reassign_to, in: query, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Custom role deleted}
        '409': {description: Role still has bindings}
  /members:
    get:
      operationId: listMembers
      responses:
        '200': {description: Workspace people, agents, invites and imported identities, content: {application/json: {schema: {$ref: '#/components/schemas/MemberDirectory'}}}}
  /members/{principal_id}/workspace-role:
    put:
      operationId: setWorkspaceRole
      parameters:
        - {name: principal_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [role_id], properties: {role_id: {type: [string, 'null'], format: uuid}}}}}}
      responses:
        '200': {description: Updated member, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
        '400': {description: Invalid role; Guest is a project role (code project_only_role)}
        '403': {description: Permission denied or role escalation}
  /members/invites:
    post:
      operationId: createMemberInvite
      summary: Create an invite and return its join link once
      description: No email is sent. The join URL contains a token that is stored only as a hash. The invited email must be verified by the identity provider before the invite can be accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteWrite'}
      responses:
        '201':
          description: Invite and the one-time join URL
          content:
            application/json:
              schema:
                type: object
                required: [invite, join_url]
                properties:
                  invite: {$ref: '#/components/schemas/Invite'}
                  join_url: {type: string}
        '400': {description: Invalid email, expiry, role or project}
        '403': {description: Permission denied or the role exceeds the inviter}
        '409': {description: Email already belongs to an active member}
  /members/invites/{id}:
    delete:
      operationId: revokeMemberInvite
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Invite revoked}
        '404': {description: No such invite}
        '409': {description: Invite was already accepted}
  /members/{principal_id}/deactivate:
    post:
      operationId: deactivateMember
      parameters:
        - {name: principal_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Deactivated member, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
        '403': {description: Permission denied}
        '409': {description: Last active owner, or already deactivated}
  /members/{principal_id}/reactivate:
    post:
      operationId: reactivateMember
      parameters:
        - {name: principal_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Reactivated member, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
        '403': {description: Permission denied}
        '409': {description: Already active}
  /members/{principal_id}/aliases:
    post:
      operationId: linkMemberAlias
      parameters:
        - {name: principal_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_principal_id]
              properties:
                from_principal_id: {type: string, format: uuid}
      responses:
        '200': {description: Person with the new alias, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
        '400': {description: Alias would form a chain or a self-link}
        '403': {description: Permission denied}
        '409': {description: Already linked, or the alias is the last active owner}
  /members/{principal_id}/aliases/{from_principal_id}:
    delete:
      operationId: unlinkMemberAlias
      parameters:
        - {name: principal_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from_principal_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Alias removed}
        '404': {description: That alias is not linked to this person}
  /audit:
    get:
      operationId: listAccessAudit
      summary: Access changes, with names resolved
      parameters:
        - {name: category, in: query, required: true, schema: {type: string, enum: [access]}}
        - {name: after, in: query, schema: {type: integer, minimum: 0}, description: Return events with id greater than this cursor}
      responses:
        '200':
          description: One page of access events
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessAuditPage'}
        '403': {description: audit.read required}
  /projects/{id}/members:
    get:
      operationId: listProjectMembers
      summary: Everyone with access to a project, one row per principal
      description: >-
        ADR-003 P2. A principal has access through a workspace role that holds nodes.read
        (via workspace) or through a binding on this project (via project); role is the
        project binding's role when there is one, else the workspace role. Deactivated
        principals, classic aliases and service principals are omitted. Needs members.read.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Project members, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProjectMember'}}}}}
        '403': {description: Permission denied}
        '404': {description: Not a visible project}
  /projects/{id}/members/{principal_id}:
    put:
      operationId: setProjectRole
      summary: Grant or change a principal's role on one project
      description: >-
        Needs members.manage on the project and every project-grantable permission of the role.
        A project binding grants only the role's project-grantable permissions. Owner and
        Customer are workspace roles. Writes a binding.set event
        on the project.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: principal_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [role_id], properties: {role_id: {type: string, format: uuid}}}}}}
      responses:
        '200': {description: The project binding, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectBinding'}}}}
        '400': {description: Invalid role or principal}
        '403': {description: Permission denied or role escalation}
        '404': {description: Not a visible project}
    delete:
      operationId: removeProjectRole
      summary: Remove a principal's binding on one project
      description: Needs members.manage on the project. Writes a binding.removed event on the project.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: principal_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Project binding removed}
        '403': {description: Permission denied}
        '404': {description: No such project or binding}
        '409': {description: Access comes from the workspace role (code via_workspace)}
  /health:
    get:
      summary: Liveness and database readiness
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: {type: string, enum: [ok]}
                  db: {type: string, enum: [ok, down]}
  /version:
    get:
      summary: Calendar version of this build
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                required: [version, scheme, brand]
                properties:
                  version: {type: string, description: "YYMMDDhhmmss.0.0 or dev"}
                  scheme: {type: string, enum: [inspr-calendar-v2]}
                  brand: {$ref: '#/components/schemas/Brand'}
  /releases:
    get:
      operationId: listReleases
      summary: The release history embedded in this build (inspr.release-history.v1)
      responses:
        '200':
          description: History, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseHistory'}
        '401': {description: Authentication required}
  /releases/{version}:
    get:
      operationId: getRelease
      summary: One release of the embedded history
      parameters:
        - {name: version, in: path, required: true, schema: {type: string}, description: The calendar version, with or without the leading v}
      responses:
        '200':
          description: The release
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Release'}
        '400': {description: Not an inspr-calendar-v2 version}
        '401': {description: Authentication required}
        '404': {description: No such release in this build's history}
  /auth/login:
    get:
      operationId: authLogin
      summary: Start the OIDC authorization-code flow with PKCE
      description: The optional tenant slug is bound into signed OIDC state. A callback opens a session only for a principal explicitly mapped into that tenant.
      security: []
      parameters:
        - {name: tenant, in: query, schema: {type: string, pattern: '^[a-z][a-z0-9-]*$'}}
      responses:
        "302":
          description: Redirect to the identity provider
        "500":
          description: Sign-in is not available
          content:
            text/html:
              schema:
                type: string
  /auth/callback:
    get:
      operationId: authCallback
      summary: Finish sign-in and start a session
      description: Resolve the tenant from signed state, then the OIDC issuer and subject to a person principal in that tenant; never choose a tenant by email alone.
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "302":
          description: Session cookie set and redirect to the app on success; on failure redirect to /signin?error=denied|not_member|unavailable|expired|failed. Provider text is never included. State/cookie/nonce failures use expired; access denial uses denied; missing membership uses not_member; provider availability failures use unavailable; other failures use failed.
          headers:
            Location:
              schema: {type: string}
            Set-Cookie:
              schema: {type: string}
  /auth/logout:
    post:
      operationId: authLogout
      summary: End the current session
      security: []
      responses:
        "204":
          description: Session deleted and cookie cleared
  /auth/dev-login:
    post:
      operationId: authDevLogin
      summary: Sign in by email when AEON_ENV=dev
      description: Not mounted unless AEON_ENV=dev. Other environments respond 404. Email lookup prefers the canonical link target when persons share an email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Email missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a member of this workspace yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Dev login is disabled
  /me:
    get:
      operationId: getMe
      summary: Acting principal, tenant and identity
      security:
        - session: []
        - agentKey: []
      responses:
        "200":
          description: Caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeUnauthorized"
  /me/greeting:
    get:
      operationId: getMeGreeting
      summary: Draw a personal greeting for this page load
      description: Uses the timezone preference, then X-Timezone, then UTC. Draws uniformly from context-matching lines outside the last 300 shown. History is private ephemeral state and creates no tenant event.
      security: [{session: []}, {agentKey: []}]
      parameters:
        - {name: X-Timezone, in: header, description: IANA timezone used when no valid timezone preference exists, schema: {type: string}}
      responses:
        '200':
          description: Greeting
          content: {application/json: {schema: {$ref: '#/components/schemas/Greeting'}}}
        '401': {description: Authentication required}
  /me/profile:
    get:
      operationId: getMyProfile
      summary: Current person's tenant profile and read-only identity email
      security: &auth [{session: []}, {agentKey: []}]
      responses:
        '200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/PersonalProfile'}}}}
        '401': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateMyProfile
      summary: Update the current person's profile; every change is undoable
      security: *auth
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PersonalProfilePatch'}}}
      responses:
        '200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/PersonalProfile'}}}}
        '400': {description: Validation errors keyed by field, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileValidationError'}}}}
        '409': {description: Short name already used in this tenant}
  /me/avatar:
    post:
      operationId: uploadMyAvatar
      summary: Upload an image and a square crop (x, y, size)
      security: *auth
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, crop]
              properties:
                file: {type: string, format: binary, description: PNG, JPEG or WebP up to 8 MiB}
                crop: {$ref: '#/components/schemas/AvatarCrop'}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/PersonalProfile'}}}}
        '400': {description: Invalid crop or image}
        '413': {description: Upload too large}
    delete:
      operationId: deleteMyAvatar
      summary: Remove avatar and use initials fallback
      security: *auth
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/PersonalProfile'}}}}
  /people/{principalId}/avatar/{size}:
    parameters:
      - {name: principalId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: size, in: path, required: true, schema: {type: integer, enum: [32, 64, 128, 256]}}
    get:
      operationId: getPersonAvatar
      summary: Content-addressed PNG avatar; use profile initials and avatar_color if absent
      security: *auth
      responses:
        '200': {description: PNG with strong ETag; immutable cache only with matching v hash query}
        '304': {description: ETag matched}
        '404': {description: Person or avatar missing}
  /agent-keys:
    get:
      operationId: listAgentKeys
      summary: List agent keys for the caller's tenant
      security:
        - session: []
        - agentKey: []
      responses:
        "200":
          description: Keys, without secrets
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentKey"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: keys.manage required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAgentKey
      summary: Create or rotate an agent key and return its secret once
      description: Pass principal_id to mint a key for an existing agent. name alone still finds or creates an agent, for older clients. For confirmed manual rotation, pass rotate_key_id and expires_at only; the server copies the old key's agent, name and scopes, creates the replacement and revokes the old key in one tenant transaction with audit events. Rotation may replace an expired key but never a revoked key. No automatic rotation occurs. Scopes are stored in dot notation; colon input is normalized. A key never receives a permission the creator does not hold, and never a permission that is not agent_grantable. The agent's current role ceiling and the actor's grant rules apply to rotation too. Requires a person with keys.manage.
      security:
        - session: []
        - agentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                rotate_key_id:
                  type: string
                  format: uuid
                  description: Key to replace after user confirmation. Mutually exclusive with name, principal_id and scopes. The old key stops working when the replacement is created.
                name:
                  type: string
                  description: Agent name when principal_id is omitted; otherwise the key's label
                principal_id:
                  type: string
                  format: uuid
                  description: Existing agent. Takes precedence over creating an agent by name.
                scopes:
                  type: array
                  items:
                    type: string
                expires_at:
                  type: [string, "null"]
                  format: date-time
                  description: Future expiry for the new key; omitted or null means never. The UI defaults to 90 days and offers 30, 90, 365 days or never. Rotation uses this new expiry, not the old date.
      responses:
        "201":
          description: Key created. token is shown only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentKeyCreated"
        "400":
          description: Invalid name, scopes or expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: keys.manage required, or the scopes exceed the creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Agent or rotation key not found in this tenant
        "409":
          description: Rotation key was already revoked or rotated
  /agent-keys/{id}:
    delete:
      operationId: revokeAgentKey
      summary: Revoke an agent key
      security:
        - session: []
        - agentKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Revoked
        "400":
          description: id is not a uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: keys.manage required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such key in this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /kinds:
    get:
      operationId: listKinds
      security: &auth [{session: []}, {agentKey: []}]
      responses:
        '200':
          $ref: '#/components/responses/Kinds'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: createKind
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/KindWrite'
      responses:
        '201':
          $ref: '#/components/responses/Kind'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /kinds/{kindId}:
    parameters: [{$ref: '#/components/parameters/KindId'}]
    get:
      operationId: getKind
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/Kind'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateKind
      description: Slug is immutable.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/KindPatch'
      responses:
        '200':
          $ref: '#/components/responses/Kind'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteKind
      description: Only unused kinds can be deleted.
      security: *auth
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /from-classic:
    get:
      operationId: resolveFromClassic
      summary: Resolve a classic Paimos browser link within the caller's visibility
      description: Resolves only known classic paths. Missing, ambiguous and invisible targets all return the same home destination and notice. Query parameters on the classic path are accepted but are not forwarded to Aeon.
      security: *auth
      parameters:
        - name: path
          in: query
          required: true
          description: Original absolute classic browser path, with optional query string.
          schema: {type: string, maxLength: 2048, example: '/issues/42?tab=activity'}
      responses:
        '200':
          description: A safe, relative Aeon route and an optional notice for fallback destinations.
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path: {type: string, pattern: '^/', example: '/p/PAI/PAI-42'}
                  notice: {type: string, description: Present only when the original link cannot be resolved.}
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /projects:
    get:
      operationId: listProjects
      security: *auth
      parameters:
        - {name: include_archived, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Projects with counts of live descendant ticket, task and epic nodes (including descendants below non-work kinds) and last activity. Open counts new/backlog, in_progress counts in_progress/qa, done counts done/delivered/accepted, and cancelled is separate. Total includes all work states.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        key: {type: string}
                        title: {type: string}
                        state: {type: string}
                        open: {type: integer}
                        in_progress: {type: integer}
                        done: {type: integer}
                        cancelled: {type: integer}
                        total: {type: integer}
                        last_activity: {type: string, format: date-time}
                        people:
                          type: array
                          maxItems: 5
                          description: The people and agents most recently active in the project (actors of the tenant's latest events, at most 90 days old, on the project or anything below it), newest first. A linked principal is shown as the person it links to.
                          items:
                            type: object
                            required: [id, name, kind, has_avatar]
                            properties:
                              id: {type: string, format: uuid}
                              name: {type: string}
                              kind: {type: string, enum: [person, agent]}
                              has_avatar: {type: boolean, description: 'The person has a profile picture at /api/people/{id}/avatar/{size}; clients request it only then and show initials otherwise.'}
        '400':
          $ref: '#/components/responses/Error'
  /project-groups:
    get:
      operationId: listProjectGroups
      summary: Shared project groups with their member projects
      description: Groups on the Projects page are personal by default and live in the person's preferences. A group an admin shares with the workspace is this entity; everyone in the tenant reads it. A project is in at most one shared group. Deleted projects are left out of project_ids.
      security: *auth
      responses:
        '200':
          description: Shared groups in their default order (position, then name)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ProjectGroup'}}
        '401': {$ref: '#/components/responses/Error'}
    post:
      operationId: createProjectGroup
      summary: Share a group with the workspace (admins)
      description: Creates the group with its projects; a project already in another shared group moves into this one. Appends project_group.created, which POST /events/{eventId}/undo reverses (the group goes, its projects return to the groups they came from).
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 60, description: Trimmed; unique in the workspace regardless of case}
                project_ids: {type: array, maxItems: 500, items: {type: string, format: uuid}}
                position: {type: integer, minimum: 0, maximum: 100000, description: Defaults to after the last group}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectGroupWrite'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /project-groups/assign:
    post:
      operationId: assignProjectGroup
      summary: Move projects into a shared group, or out of every shared group (admins)
      description: Only projects whose shared group changes are recorded, in one project_group.assigned event that undo reverses while every project is still where the move put it. event_id is null when nothing changed.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group_id, project_ids]
              properties:
                group_id: {type: [string, 'null'], format: uuid, description: null takes the projects out of their shared group}
                project_ids: {type: array, minItems: 1, maxItems: 500, items: {type: string, format: uuid}}
      responses:
        '200': {description: Moved, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectGroupWrite'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /project-groups/{groupId}:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateProjectGroup
      summary: Rename or reorder a shared group (admins)
      description: Appends project_group.updated (undoable) when something changed; event_id is null otherwise.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 60}
                position: {type: integer, minimum: 0, maximum: 100000}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectGroupWrite'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteProjectGroup
      summary: Stop sharing a group (admins); its projects are in no shared group after
      description: Appends project_group.deleted with the whole group; undo brings it back under its id with the projects that are still live and not in another shared group.
      security: *auth
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectGroupWrite'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /nodes:
    get:
      operationId: listNodes
      security: *auth
      parameters:
        - {name: kind_id, in: query, schema: {type: string, format: uuid}}
        - {name: kind, in: query, description: Repeatable or comma-separated kind slugs or IDs, schema: {type: array, items: {type: string}}}
        - {name: state, in: query, description: 'Repeatable or comma-separated states. In every list filter a leading ! excludes a value: plain values of one filter are alternatives, excluded values must all not match, and filters combine with AND.', schema: {type: array, items: {type: string}}}
        - {name: priority, in: query, description: Repeatable or comma-separated priorities or none; ! excludes, schema: {type: array, items: {type: string}}}
        - {name: assignee, in: query, description: Repeatable or comma-separated principal IDs or none; ! excludes, schema: {type: array, items: {type: string}}}
        - {name: tag, in: query, description: 'Tag names (case-insensitive) or none for untagged work; ! excludes. Tags are the name strings or {name} objects in fields.tags.', schema: {type: array, items: {type: string}}}
        - {name: cost_unit, in: query, description: 'Cost unit labels (case-insensitive) or none; ! excludes. Reads fields.cost_unit, else the imported fields.classic.cost_unit.', schema: {type: array, items: {type: string}}}
        - {name: release, in: query, description: 'Release labels (case-insensitive) or none; ! excludes. Reads fields.release.', schema: {type: array, items: {type: string}}}
        - {name: epic, in: query, description: 'Epic node IDs (matching their whole subtree, not the epic itself) or none for work under no epic; ! excludes.', schema: {type: array, items: {type: string}}}
        - {name: date_field, in: query, description: 'Which date date_from and date_to bound. created and updated compare instants; start, end and accepted read fields.start_date, end_date and accepted_at by the calendar day of the bounds in their own offset. Alone it keeps work that has that date.', schema: {type: string, enum: [created, updated, start, end, accepted]}}
        - {name: date_from, in: query, description: Inclusive lower bound (RFC 3339), schema: {type: string, format: date-time}}
        - {name: date_to, in: query, description: Exclusive upper bound (RFC 3339), schema: {type: string, format: date-time}}
        - {name: q, in: query, description: Matches keys (also earlier keys), titles and descriptions; key prefixes rank first and description-only matches last, schema: {type: string}}
        - {name: within, in: query, description: Descendants of this node, excluding itself, schema: {type: string, format: uuid}}
        - {name: hide_closed, in: query, schema: {type: boolean, default: false}}
        - {name: facets, in: query, description: 'Repeatable or comma-separated state, kind, priority, assignee, tag, cost_unit, release. Tag, cost unit and release counts are keyed by their display spelling; none counts work without one.', schema: {type: array, items: {type: string}}}
        - {name: parent_id, in: query, schema: {type: string, format: uuid}}
        - {name: include_descendants, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/Sort'}
        - {$ref: '#/components/parameters/Direction'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Nodes'
        '400':
          $ref: '#/components/responses/Error'
    post:
      operationId: createNode
      description: Allocate a tenant-scoped key, or preserve a supplied import key.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/NodeCreate'
      responses:
        '201':
          $ref: '#/components/responses/Node'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /tags/{tagId}:
    parameters:
      - {name: tagId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateTagAssignments
      description: Atomically update a tag and replace its old name in every live assigned node in the tenant. Each changed node and the tag write an event in the same transaction.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TagPatch'}
      responses:
        '200': {$ref: '#/components/responses/Node'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteTagAssignments
      description: Atomically remove a tag name from every live assigned node and soft-delete the tag. Each changed node and the tag write an event in the same transaction.
      security: *auth
      responses:
        '204': {description: Tag deleted and assignments removed}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /nodes/bulk:
    post:
      operationId: bulkChangeNodes
      description: |
        One change for up to 500 nodes in one transaction: a state (archive is the
        state archived), a priority or assignee (null clears, also over an imported
        value), tags to add and remove (by name, case-insensitive), and a new parent
        inside the same project. Each changed node gets its own node.updated and
        node.moved events; the batch gets one node.bulk_changed event whose id is
        returned. POST /events/{event_id}/undo restores every node of the batch, or
        answers 409 and changes nothing when any of them changed since. A node that
        cannot take the change (not found, another project, a kind rule, a cycle) is
        listed under skipped with a reason; nodes already so are listed as unchanged.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              minProperties: 2
              properties:
                ids: {type: array, minItems: 1, maxItems: 500, items: {type: string, format: uuid}}
                state: {type: string, minLength: 1, maxLength: 64}
                priority: {type: [string, 'null'], maxLength: 32}
                assignee: {type: [string, 'null'], format: uuid}
                tags_add:
                  type: array
                  maxItems: 20
                  items:
                    oneOf:
                      - {type: string, minLength: 1, maxLength: 100}
                      - type: object
                        required: [name]
                        properties:
                          name: {type: string, minLength: 1, maxLength: 100}
                          color: {type: string, maxLength: 32}
                tags_remove: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 100}}
                parent_id: {type: string, format: uuid}
      responses:
        '200':
          description: Changed, unchanged and skipped nodes
          content:
            application/json:
              schema:
                type: object
                required: [event_id, items, unchanged, skipped]
                properties:
                  event_id: {type: [integer, 'null'], description: The node.bulk_changed event to undo; null when nothing changed}
                  items: {type: array, items: {$ref: '#/components/schemas/Node'}}
                  unchanged: {type: array, items: {type: string, format: uuid}}
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [id, reason]
                      properties:
                        id: {type: string, format: uuid}
                        key: {type: string}
                        reason: {type: string}
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /nodes/lookup:
    get:
      operationId: lookupNodes
      description: Resolve up to 100 live node previews by ID and up to 100 by key in one tenant-scoped request (ids, keys or both). Missing, deleted and invisible nodes (outside the caller's projects) are omitted alike.
      security: *auth
      parameters:
        - name: ids
          in: query
          description: Comma-separated or repeated node UUIDs; at most 100 values, duplicates included, or 400.
          schema: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
        - name: keys
          in: query
          description: Comma-separated or repeated node keys (case-insensitive, at most 30 characters, the stored key limit); at most 100 values, duplicates included, or 400. A current key wins; an earlier key (left by a project move) resolves to the node that carried it.
          schema: {type: array, minItems: 1, maxItems: 100, items: {type: string, maxLength: 30, pattern: '^[A-Za-z][A-Za-z0-9]{1,9}-[1-9][0-9]*$'}}
      responses:
        '200':
          description: ID previews in request order, then key previews in request order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, key, title, state]
                      properties:
                        id: {type: string, format: uuid}
                        key: {type: string}
                        title: {type: string}
                        state: {type: string}
                        requested_key: {type: string, description: Key lookups only; the upper-cased key asked for.}
                        project_id: {type: string, format: uuid, description: Key lookups only; the nearest project above the node (or the node itself).}
        '400':
          $ref: '#/components/responses/Error'
  /nodes/tree:
    get:
      operationId: getNodeTree
      description: Depth-first flat page with parent IDs; omission of max_depth permits any depth.
      security: *auth
      parameters:
        - {name: root_id, in: query, description: Omit for all root nodes, schema: {type: string, format: uuid}}
        - {name: max_depth, in: query, schema: {type: integer, minimum: 0}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Tree'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /nodes/{nodeId}:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    get:
      operationId: getNode
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/Node'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateNode
      description: |
        Key, kind, and parent are immutable here; use move for parent.
        Tag renames use PATCH /tags/{tagId} so assignments change atomically.
        Optional optimistic concurrency compares If-Unmodified-Since to the exact
        updated_at value while holding the node row lock in the write transaction.
        A stale value returns 412 without changing the node or appending an event.
        Omission preserves unconditional patch behavior.
      parameters:
        - name: If-Unmodified-Since
          in: header
          description: Exact RFC3339 timestamp from Node.updated_at, including fractional seconds. HTTP dates are also accepted and compared at full stored precision; prefer updated_at to avoid precision loss.
          schema: {type: string}
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/NodePatch'
      responses:
        '200':
          $ref: '#/components/responses/Node'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteNode
      description: Soft-delete; reject while live children remain. Tags use DELETE /tags/{tagId} so assignments are removed atomically.
      security: *auth
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /nodes/{nodeId}/attachments:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    get:
      operationId: listNodeAttachments
      description: Tenant staff people only.
      security: *auth
      responses:
        '200': {description: Live attachments ordered by position and ID, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Attachment'}}}}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: addNodeAttachments
      description: Tenant staff people only. Multipart files (repeat the file field) with optional caption, or a raw image body with X-Filename. Each file is limited by the server's configured maximum (50 MiB by default).
      security: *auth
      requestBody:
        required: true
        content:
          multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: array, items: {type: string, format: binary}}, caption: {type: string}}}}
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/gif: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '201': {description: Created attachments, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Attachment'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
  /attachments/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      operationId: updateAttachment
      description: Tenant staff people only. Optional If-Unmodified-Since compares the exact updated_at timestamp under row lock; stale writes return 412.
      security: *auth
      parameters: [{name: If-Unmodified-Since, in: header, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, minProperties: 1, additionalProperties: false, properties: {caption: {type: string}, position: {type: string, description: Decimal rank}}}}}}
      responses:
        '200': {description: Updated attachment, content: {application/json: {schema: {$ref: '#/components/schemas/Attachment'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
    delete:
      operationId: removeAttachment
      description: Tenant staff people only.
      security: *auth
      responses:
        '204': {description: Soft deleted}
        '404': {$ref: '#/components/responses/Error'}
  /attachments/{id}/content:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getAttachmentContent
      description: Tenant staff people only.
      security: *auth
      parameters: [{name: variant, in: query, schema: {type: string, enum: [original, preview, thumb], default: original}}]
      responses:
        '200': {description: Tenant-scoped bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '304': {description: ETag matched}
        '404': {$ref: '#/components/responses/Error'}
  /nodes/{nodeId}/activity:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    get:
      operationId: listNodeActivity
      summary: Merged comment and visible field-change timeline
      description: Reverse chronological by (at, event ID). The opaque cursor binds tenant, node and event watermark. Imported snapshots with no visible changes are omitted; the first snapshot is a baseline. Comments retain their creation position after edits; deleted comments are omitted. Imported comments are read-only.
      security: *auth
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Activity page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ActivityItem'}}
                  next_cursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /nodes/{nodeId}/comments:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    post:
      operationId: createNodeComment
      summary: Append a comment authored by the authenticated caller
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommentBody'}
      responses:
        '201':
          description: Created comment; id is the creation event ID used for editing and deletion
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityItem'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /nodes/{nodeId}/comments/{commentId}:
    parameters:
      - {$ref: '#/components/parameters/NodeId'}
      - {name: commentId, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
    patch:
      operationId: updateNodeComment
      description: Append comment.updated for the author's own native comment strictly before 15 minutes from creation. The window does not reset on edit. Imported and deleted comments are not editable.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommentBody'}
      responses:
        '200':
          description: Updated comment at its original timeline position
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityItem'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteNodeComment
      description: Append comment.deleted for the author's own native comment strictly before 15 minutes from creation. The immutable audit events remain; the comment leaves the timeline.
      security: *auth
      responses:
        '204': {description: Deleted}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /nodes/{nodeId}/move:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    post:
      operationId: moveNode
      description: |
        Atomically reparent/reorder; reject cycles and disallowed child kinds.
        Optional If-Unmodified-Since must equal Node.updated_at at second precision.
        The comparison holds the node row lock inside the move transaction.
        A mismatch returns 412 with the current node, without changing nodes or
        appending an event. Each successful move advances updated_at to at least
        the next second so competing moves cannot reuse the same precondition.
        Omission preserves unconditional move behavior.
      parameters:
        - name: If-Unmodified-Since
          in: header
          description: Node.updated_at as RFC3339 (fractional seconds accepted) or an HTTP date. Both timestamps are truncated to seconds before equality comparison. Invalid or repeated values return 400.
          schema: {type: string}
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/MoveNode'
      responses:
        '200':
          $ref: '#/components/responses/Node'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          description: Node changed; current node snapshot from the locked transaction.
          content:
            application/json:
              schema:
                type: object
                required: [error, node]
                properties:
                  error: {type: string, const: node has changed}
                  node: {$ref: '#/components/schemas/Node'}
  /node-keys/{key}:
    get:
      operationId: getNodeByKey
      description: Resolve a current key or a historical key alias to the same live node.
      security: *auth
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Node'}
        '404': {$ref: '#/components/responses/Error'}
  /nodes/{nodeId}/project-move:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    post:
      operationId: moveNodeProject
      description: Atomically move an issue under a target project, assign its next project key, retain all former keys as aliases, and append an undoable node.project_moved event. Issues with child nodes or feature projections cannot move.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_id]
              properties:
                project_id: {type: string, format: uuid}
      responses:
        '200':
          description: Moved issue and key change
          content:
            application/json:
              schema:
                type: object
                required: [issue_id, old_key, new_key, project_id, detached, notes]
                properties:
                  issue_id: {type: string, format: uuid}
                  old_key: {type: string}
                  new_key: {type: string}
                  project_id: {type: string, format: uuid}
                  detached: {type: array, items: {type: string}}
                  notes: {type: array, items: {type: string}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /tickets/graph:
    get:
      operationId: getTicketGraph
      description: |
        Read-only graph of one project's live tickets and epics. Closed work
        (status category done: accepted, delivered, done, cancelled, archived)
        is left out unless include_closed is true, and a link that would touch
        a left-out node is left out with it. Relation links are blocks, relates,
        implements and duplicates. blocks stays directed; relates keeps the
        stored order, smaller id as source. A parent link points from a child
        to its parent ticket or epic when that parent is also in the answer.
        At most 1500 nodes, newest updated_at first. Bodies are not read.
        Project visibility applies: a relation into a project the caller cannot
        see does not appear, not even as an id.
      security: *auth
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: include_closed, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Bounded graph, without ticket or epic bodies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketGraph'}
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /relations:
    get:
      operationId: listRelations
      security: *auth
      parameters:
        - {name: node_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Relations'
        '400':
          $ref: '#/components/responses/Error'
    post:
      operationId: createRelation
      description: >-
        Relations are directed except relates, which is symmetric and stored with the smaller UUID as source.
        A 409 message reads as words and names items by key, so clients can show it as it stands: an identical
        link that already exists, or a blocks, implements or duplicates link that would close a loop through
        live items (the message spells out the chain). A link from an item to itself is a 400.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/RelationCreate'
      responses:
        '201':
          $ref: '#/components/responses/Relation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /relations/{relationId}:
    parameters: [{$ref: '#/components/parameters/RelationId'}]
    delete:
      operationId: deleteRelation
      security: *auth
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
  /events:
    get:
      operationId: listEvents
      description: Tenant-wide history excludes quote events, whose document metadata is available only through quote-scoped authorized routes.
      security: *auth
      parameters:
        - {name: node_id, in: query, schema: {type: string, format: uuid}}
        - {name: after, in: query, description: Exclusive event ID, schema: {type: integer, format: int64, minimum: 0}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          $ref: '#/components/responses/Events'
        '400':
          $ref: '#/components/responses/Error'
  /events/stream:
    get:
      operationId: streamEvents
      description: SSE id is the event ID; event is its type; data is Event JSON. Quote events are excluded and use the authorized quote collaboration stream. LISTEN/NOTIFY wakes durable replay; periodic comments keep the connection alive.
      security: *auth
      parameters:
        - {name: Last-Event-ID, in: header, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: Tenant event stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
  /events/{eventId}/undo:
    parameters: [{$ref: '#/components/parameters/EventId'}]
    post:
      operationId: undoEvent
      description: Append one compensating event and restore the prior resource snapshot atomically. Only reversible events can be undone; an event can be undone once.
      security: *auth
      responses:
        '201':
          $ref: '#/components/responses/Event'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /knowledge:
    get:
      operationId: listKnowledge
      description: |
        Knowledge entries (runbook, guideline, memory, external-system,
        related-project) across projects, or in one project. q searches title,
        slug, key and body (German and English full text plus word matches);
        the excerpt is plain text around the first match. counts cover the
        project and q scope before the type and status filters.
      security: *auth
      parameters:
        - {name: project_id, in: query, schema: {type: string, format: uuid}}
        - {name: type, in: query, description: Comma-separated knowledge types, schema: {type: string}}
        - {name: status, in: query, description: Comma-separated active, proposed, archived, schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: sort, in: query, schema: {type: string, enum: [relevance, updated, created, title, slug, type]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 500}}
      responses:
        '200':
          description: Knowledge entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgePage'}
        '400':
          $ref: '#/components/responses/Error'
    post:
      operationId: createKnowledge
      description: |
        Create an entry under a project. The slug follows ^[a-z][a-z0-9_-]*$
        (at most 64 characters) and is unique per project and type among live
        entries; memory reserves references, stale, proposed and needs-review.
        A missing external_system or related_project kind is created first.
        Appends knowledge.created (undoable while nobody changed the entry).
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeCreate'}
      responses:
        '201':
          $ref: '#/components/responses/KnowledgeEntry'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Slug taken; conflict names the entry that holds it
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeProblem'}
        '422':
          $ref: '#/components/responses/Error'
  /knowledge/graph:
    get:
      operationId: getKnowledgeGraph
      description: |
        Read-only project graph, with the same live-node and tenant visibility as
        knowledge. Links combine directed relations and resolved body mentions:
        wiki slugs, local knowledge Markdown links, backticked slugs and node keys.
        Slugs resolve in the source kind first, then the project, following rename
        events like resolve. Explicit typed links stay in that type and project.
        Relations win over mentions of the same directed pair; degree counts unique
        neighbours. Tickets are optional directly linked/mentioned satellites;
        their bodies are never read. At most 2000 nodes and 8000 edges, newest
        knowledge first, then tickets. Filters apply before the node cap.
      security: *auth
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: types, in: query, description: Comma-separated knowledge types, schema: {type: string}}
        - {name: status, in: query, description: Comma-separated active, proposed, archived; omitted means all, schema: {type: string}}
        - {name: include, in: query, schema: {type: string, enum: [tickets]}}
      responses:
        '200':
          description: Bounded graph, without entry or ticket bodies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeGraph'}
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /knowledge/resolve:
    get:
      operationId: resolveKnowledge
      description: One entry by project, type and slug. When no live entry holds the slug, the entry that renamed away from it answers with renamed_from set.
      security: *auth
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: type, in: query, required: true, schema: {type: string}}
        - {name: slug, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeEntry'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /knowledge/{knowledgeId}:
    parameters: [{name: knowledgeId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getKnowledge
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeEntry'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateKnowledge
      description: |
        Change title, body, status, slug or metadata (metadata replaces the
        object; {} removes it). Type, project and key never change here.
        If-Unmodified-Since is the exact updated_at as read; a stale value
        returns 412 with the current entry and writes nothing. A write that
        changes nothing appends no event. Appends knowledge.updated, whose undo
        restores the prior values while the entry is unchanged since and its
        old slug is free.
      parameters:
        - {name: If-Unmodified-Since, in: header, schema: {type: string}}
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgePatch'}
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeEntry'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Slug taken
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeProblem'}
        '412':
          description: Changed since it was read; entry is the current version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeProblem'}
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteKnowledge
      description: Soft delete with optional If-Unmodified-Since. Appends knowledge.deleted, whose undo restores the entry while its slug is free.
      parameters:
        - {name: If-Unmodified-Since, in: header, schema: {type: string}}
      security: *auth
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, event_id]
                properties:
                  id: {type: string, format: uuid}
                  event_id: {type: integer, format: int64}
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          description: Changed since it was read
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeProblem'}
  /search:
    get:
      operationId: searchNodes
      description: German and English full-text plus asynchronous halfvec search fused by reciprocal rank.
      security: *auth
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1}}
        - {name: kind_id, in: query, schema: {type: string, format: uuid}}
        - {name: state, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Search'
        '400':
          $ref: '#/components/responses/Error'
  /views:
    get:
      operationId: listViews
      description: Own and tenant-shared views, deleted ones left out. With project_id, that project's views in the order they were made (its view bar); without, every view, most recently changed first.
      security: *auth
      parameters:
        - {name: project_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          $ref: '#/components/responses/Views'
    post:
      operationId: createView
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/ViewWrite'
      responses:
        '201':
          $ref: '#/components/responses/View'
        '400':
          $ref: '#/components/responses/Error'
  /preferences/{key}:
    parameters:
      - {name: key, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_.:-]{0,127}$'}}
    get:
      operationId: getPreference
      description: The calling person's own UI preference (for example list columns and widths). A key never written returns value null.
      responses:
        '200':
          description: Preference
          content: {application/json: {schema: {$ref: '#/components/schemas/Preference'}}}
        '400': {description: Invalid key}
        '401': {description: Authentication required}
    put:
      operationId: putPreference
      description: Replace the calling person's preference. The value is a JSON object of at most 16 KiB. Private to the principal; no event is appended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: {type: object}
      responses:
        '200':
          description: Stored preference
          content: {application/json: {schema: {$ref: '#/components/schemas/Preference'}}}
        '400': {description: Invalid key or value}
        '401': {description: Authentication required}
        '413': {description: Value too large}
  /views/{viewId}:
    parameters: [{$ref: '#/components/parameters/ViewId'}]
    get:
      operationId: getView
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/View'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateView
      description: Owner only.
      security: *auth
      requestBody:
        $ref: '#/components/requestBodies/ViewPatch'
      responses:
        '200':
          $ref: '#/components/responses/View'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteView
      description: Owner only. The delete is soft; restore brings the view back with its id.
      security: *auth
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /views/{viewId}/restore:
    parameters: [{$ref: '#/components/parameters/ViewId'}]
    post:
      operationId: restoreView
      description: Owner only. Brings a deleted view back (the Undo of a delete) and appends view.restored.
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/View'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: The view is not deleted
  /imports:
    get:
      operationId: listImports
      description: Tenant administrator only; import source names and failure summaries are operator data.
      security: *auth
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          $ref: '#/components/responses/Imports'
  /imports/{importId}:
    parameters: [{$ref: '#/components/parameters/ImportId'}]
    get:
      operationId: getImport
      description: Tenant administrator only.
      security: *auth
      responses:
        '200':
          $ref: '#/components/responses/Import'
        '404':
          $ref: '#/components/responses/Error'
  /inbox/messages:
    get:
      operationId: listenInbox
      summary: List or long-poll the caller's durable inbox
      description: Only the caller's principal is readable. Cursor is an exclusive sent event ID; wait_ms=0 returns immediately. Expired messages are omitted. Unacked messages may be delivered again.
      security: *auth
      parameters:
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: wait_ms, in: query, schema: {type: integer, minimum: 0, maximum: 30000, default: 0}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Inbox page, content: {application/json: {schema: {$ref: '#/components/schemas/InboxPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
    post:
      operationId: sendInboxMessage
      summary: Send one durable message to a principal
      description: Requires inbox.send scope for agents. Idempotency key is unique per sender and must replay the same body, recipient and reply target; an exact retry returns the same message id. Reply target must be visible to the sender. One inbox.sent event is written in the same transaction, without message body in event snapshots.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InboxSend'}}}}
      responses:
        '201': {description: Sent message, content: {application/json: {schema: {$ref: '#/components/schemas/InboxMessage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /inbox/stream:
    get:
      operationId: streamInbox
      summary: SSE of messages addressed to the caller
      description: Last-Event-ID is the sent event ID. Replay durable messages after that ID before listening; NOTIFY is only a wake hint. Each message event has its sent event ID as id and InboxMessage JSON as data. Heartbeats carry no message.
      security: *auth
      parameters:
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: Last-Event-ID, in: header, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200': {description: Inbox event stream, content: {text/event-stream: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/Error'}
  /inbox/messages/{messageId}/receipt:
    get:
      operationId: getInboxReceipt
      summary: Read the sender's hand-off receipt
      description: Sender principal only, with inbox.receipt permission in the workspace or the message's project; agents also require the inbox.receipt key scope. Every authenticated caller without access receives the same 404 as a missing message. Messages created before receipt recording have no receipt and return 404; their historical delivery state is not inferred. New receipts are queued on acceptance. Direct inbox acknowledgement by the recipient, or explicit confirmation by a managed receiver adapter, advances a receipt to handed_off. Acceptance and wake hints do not confirm hand-off. handed_off and failed are terminal; handed_off_at is RFC3339 and is set once at confirmation. An exact idempotent send replay retains its message_id and receipt.
      security: *auth
      parameters: [{name: messageId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Hand-off receipt, content: {application/json: {schema: {$ref: '#/components/schemas/InboxReceipt'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /inbox/messages/{messageId}/ack:
    post:
      operationId: ackInboxMessage
      summary: Acknowledge a message addressed to the caller
      description: Idempotent for the same recipient. Acknowledgement and inbox.acked event commit together.
      security: *auth
      parameters: [{name: messageId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Acknowledged message, content: {application/json: {schema: {$ref: '#/components/schemas/InboxMessage'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /inbox/targets:
    get:
      operationId: listInboxTargets
      security: *auth
      responses:
        '200': {description: Caller delivery targets, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/InboxTarget'}}}}}
    post:
      operationId: createInboxTarget
      description: Webhook targets require admin or the recipient principal. HTTPS URL must pass public-address and redirect checks on every wake; POST carries only message ID and event ID. A pull target is unique per principal.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InboxTargetWrite'}}}}
      responses:
        '201': {description: Target, content: {application/json: {schema: {$ref: '#/components/schemas/InboxTarget'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /inbox/targets/{targetId}:
    delete:
      operationId: deleteInboxTarget
      security: *auth
      parameters: [{name: targetId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Target disabled}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /work-orders:
    get:
      operationId: listWorkOrders
      security: *auth
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Work order page, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/WorkOrder'}}}}}
    post:
      operationId: createWorkOrder
      description: Atomically create a work_order node, typed work order, criteria and event. Budgets are hard ceilings across all its runs.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkOrderCreate'}}}}
      responses:
        '201': {description: Work order, content: {application/json: {schema: {$ref: '#/components/schemas/WorkOrder'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /work-orders/{workOrderId}:
    get:
      operationId: getWorkOrder
      security: *auth
      parameters: [{name: workOrderId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Work order, content: {application/json: {schema: {$ref: '#/components/schemas/WorkOrder'}}}}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateWorkOrder
      description: Update assignment, status or budget with a matching revision; done requires checked criteria and evidence.
      security: *auth
      parameters: [{name: workOrderId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkOrderPatch'}}}}
      responses:
        '200': {description: Work order, content: {application/json: {schema: {$ref: '#/components/schemas/WorkOrder'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /work-orders/{workOrderId}/criteria/{criterionId}/check:
    post:
      operationId: checkWorkCriterion
      description: Check or uncheck one acceptance criterion and append an event.
      security: *auth
      parameters:
        - {name: workOrderId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: criterionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [checked], properties: {checked: {type: boolean}}}}}}
      responses:
        '200': {description: Criterion, content: {application/json: {schema: {$ref: '#/components/schemas/WorkCriterion'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /work-orders/{workOrderId}/evidence:
    post:
      operationId: addWorkEvidence
      security: *auth
      parameters: [{name: workOrderId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkEvidenceWrite'}}}}
      responses:
        '201': {description: Evidence, content: {application/json: {schema: {$ref: '#/components/schemas/WorkEvidence'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /work-orders/{workOrderId}/runs:
    post:
      operationId: createAgentRun
      description: Create a queued run against the remaining work-order budget. The agent daemon later claims it with a fenced generation.
      security: *auth
      parameters: [{name: workOrderId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunCreate'}}}}
      responses:
        '201': {description: Run, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/harness-sessions:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: registerHarnessSession
      description: Registers a generation or returns an exact active replay. Emits harness.registered on the existing events stream after commit; stopping emits harness.stopped. Labels are public display metadata, never identity or authority.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HarnessRegistration'}
      responses:
        '201':
          description: Registered or exact active replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessSession'}
        '400': {description: Invalid registration or label}
        '403': {description: Scope required or another agent requested}
        '409': {description: Active generation conflicts with registration}
  /harness-sessions:
    get:
      operationId: listHarnessSessions
      summary: Tenant-wide harness sessions, newest first
      description: Requires a person session or harness.read agent key. Cursor binds tenant, principal and filters. State is stopped when stopped_at is set, otherwise phase. Node summaries retain historical bindings.
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [starting, working, yielded, stopping, stopped]}}
        - {name: harness, in: query, schema: {type: string, enum: [codex, claude, pi, cursor, grok]}}
        - {name: agent, in: query, schema: {type: string, format: uuid}}
        - {name: project, in: query, schema: {type: string, format: uuid}}
        - {name: ticket, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Session page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/HarnessSessionSummary'}}
                  next_cursor: {type: [string, 'null']}
        '400': {description: Invalid filter or cursor}
        '401': {description: Authentication required}
        '403': {description: Scope required}
  /harness-sessions/live:
    get:
      operationId: listLiveAgents
      summary: Agents actively working right now, per visible project (AEON-184)
      description: >-
        One compact read for the Projects page. A session is live while it is not stopped, its heartbeat is at most
        fresh_seconds old, its phase is starting, working or stopping, and its activity is not idle. It is listed under
        its own project and, when its bound ticket has since moved, under the ticket's project as well. Row-level
        security and project visibility (ADR-003 P2) decide what exists for the caller: an invisible project
        contributes nothing. principal_id and name are present only with members.read or harness.read at that project
        (as approval agent names, AEON-171); session_id only with harness.read in the workspace. Needs nodes.read in
        the workspace or any project binding; an agent key also needs harness.read. One answer holds at most 500
        sessions, freshest heartbeat first; truncated says more were live.
      responses:
        '200':
          description: Live agents, freshest heartbeat first
          content:
            application/json:
              schema:
                type: object
                required: [items, at, fresh_seconds, truncated]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/LiveAgent'}}
                  at: {type: string, format: date-time, description: The server clock when read}
                  fresh_seconds: {type: integer, description: How old a heartbeat may be for its session to count as live}
                  truncated: {type: boolean, description: More sessions were live than one answer holds; the freshest are listed}
        '401': {description: Authentication required}
        '403': {description: Scope required}
  /runs:
    get:
      operationId: listAgentRuns
      description: Newest first by created_at and ID. Filters intersect; agents can read only their own runs with run.read. Cursor binds tenant, principal and filters. A session selects its explicitly bound run.
      parameters:
        - {name: session, in: query, schema: {type: string, format: uuid}}
        - {name: agent, in: query, schema: {type: string, format: uuid}}
        - {name: work_order, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Run page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AgentRun'}}
                  next_cursor: {type: [string, 'null']}
        '400': {description: Invalid filter or cursor}
        '401': {description: Authentication required}
        '403': {description: Scope required or another agent requested}
  /projects/{projectId}/messages:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: inspectProjectMessages
      description: Person admin or super_admin inspection including held messages. Ascending by sent event ID by default. In newest_first mode after is an exclusive upper bound; zero starts at the newest. Thread selects the root and all descendants of the supplied message's reply_to chain within this project. Pending selects unresolved held action requests. Resolution never releases or delivers a held message.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 10}}
        - {name: after, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: newest_first, in: query, schema: {type: boolean, default: false}}
        - {name: address, in: query, schema: {type: string}, description: Recipient address (to is a compatibility alias)}
        - {name: to, in: query, schema: {type: string}}
        - {name: thread, in: query, schema: {type: string, format: uuid}}
        - {name: pending, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Project message page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_after, preamble]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ProjectMessage'}}
                  next_after: {type: integer, format: int64}
                  preamble: {type: string}
        '400': {description: Invalid filter}
        '403': {description: Human administrator required}
        '404': {description: Project not found}
  /projects/{projectId}/messages/{messageId}/resolution:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: resolveHeldMessage
      description: Human admin or super_admin session only; Authorization headers and agent attribution are forbidden. Immutable event, serialized per tenant. Exact decision/note retries return the first result; divergent retries conflict. Note is retained only as a digest in the audit event. Message and delivery remain held; pending inspection omits the resolved item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [resolved, dismissed]}
                note: {type: string, maxLength: 8000, default: ''}
      responses:
        '200': {description: Resolution, content: {application/json: {schema: {$ref: '#/components/schemas/HeldMessageResolution'}}}}
        '400': {description: Invalid request}
        '401': {description: Authentication required}
        '403': {description: Human administrator session required}
        '404': {description: Project or message not found}
        '409': {description: Message is not held or resolution differs}
  /runs/queued:
    get:
      operationId: listQueuedRuns
      description: Agent daemon sees queued runs for its principal only. Polling is a fallback when webhook wakes are missed.
      security: [{agentKey: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Queued runs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AgentRun'}}}}}
        '403': {$ref: '#/components/responses/Error'}
  /runs/{runId}:
    get:
      operationId: getAgentRun
      security: *auth
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Run, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /runs/{runId}/claim:
    post:
      operationId: claimAgentRun
      description: Fenced daemon claim after account reservation. The caller must be the assigned agent or hold an approved run.claim grant for this run. Same generation is idempotent; a different live generation conflicts.
      security: [{agentKey: []}]
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunClaim'}}}}
      responses:
        '200': {description: Claimed run, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /runs/{runId}/telemetry:
    post:
      operationId: reportRunTelemetry
      description: Daemon reports monotonic sequence numbers; exact duplicate is idempotent and divergent replay conflicts. Telemetry is content-free. Totals, run status and event update atomically; budget excess blocks further dispatch.
      security: [{agentKey: []}]
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunTelemetry'}}}}
      responses:
        '200': {description: Run, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRun'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /approvals:
    get:
      operationId: listApprovals
      description: Workspace readers see their tenant's approvals. Project-only readers see approvals in projects where they hold approvals.read; workspace-level approvals require a workspace binding. agent_name is conditional as documented on Approval.
      security: *auth
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Approval requests, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Approval'}}}}}
    post:
      operationId: proposeApproval
      description: An agent may propose only for itself. Writes approval.proposed event without granting authority.
      security: [{agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalProposal'}}}}
      responses:
        '201': {description: Proposal, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      description: Only a person can decide. Decision event and any matching scoped grant commit together; agents cannot self-approve. Denial and expiry never grant authority.
      security: [{session: []}]
      parameters: [{name: approvalId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalDecisionWrite'}}}}
      responses:
        '200': {description: Decision, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /approvals/{approvalId}/revoke:
    post:
      operationId: revokeApprovalGrant
      description: A person revokes an approved grant and appends approval.revoked. Repeated revocation is idempotent.
      security: [{session: []}]
      parameters: [{name: approvalId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Revoked grant, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /models:
    get:
      operationId: listModelProfiles
      security: *auth
      responses:
        '200': {description: Tenant model registry, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ModelProfile'}}}}}
    post:
      operationId: createModelProfile
      description: Admin creates an immutable model profile version. Routing policy is a separate ordered ladder.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelProfileWrite'}}}}
      responses:
        '201': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/ModelProfile'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /models/routes:
    put:
      operationId: replaceModelRoutes
      description: Admin atomically replaces the tenant's role ladders. Temporary unavailable/conserved/budget-limited entries require expiry and reason.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ModelRoute'}}}}}
      responses:
        '200': {description: Ordered routes, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ModelRoute'}}}}}
        '403': {$ref: '#/components/responses/Error'}
  /models/resolve:
    get:
      operationId: resolveModelRole
      description: Replaces classic paimos model resolve. review-gate requires author_family and excludes that family; if no eligible candidate, owner_required is true. Candidate reasons include policy, account availability and allowance. Command templates are rendered from trusted local templates, never stored shell snippets.
      security: *auth
      parameters:
        - {name: role, in: query, required: true, schema: {type: string, enum: [scout, mechanical, build, build-hard, review-gate]}}
        - {name: author_family, in: query, schema: {type: string}}
        - {name: harness, in: query, schema: {type: string, enum: [codex, claude, pi, cursor, grok]}}
      responses:
        '200': {description: Resolution, content: {application/json: {schema: {$ref: '#/components/schemas/ModelResolution'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /agent-accounts:
    get:
      operationId: listAgentAccounts
      description: Admin view of opaque local accounts and allowance windows; no credential material.
      security: [{session: []}]
      responses:
        '200': {description: Accounts, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AgentAccount'}}}}}
    post:
      operationId: registerAgentAccount
      description: An authenticated daemon with account.manage scope registers an opaque local account key. AEON records the registering agent principal and never accepts credential material.
      security: [{agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccountWrite'}}}}
      responses:
        '201': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/windows:
    post:
      operationId: createAccountWindow
      description: Admin sets a bounded allowance and pacing policy. Overlapping windows of one unit are rejected.
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AllowanceWindowWrite'}}}}
      responses:
        '201': {description: Window, content: {application/json: {schema: {$ref: '#/components/schemas/AllowanceWindow'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}:
    patch:
      operationId: updateAgentAccount
      description: Admin can drain, disable or reactivate an account. Draining preserves current owned runs and blocks new reservations.
      security: [{session: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [state], properties: {state: {type: string, enum: [available, draining, unavailable]}}}}}}
      responses:
        '200': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /agent-accounts/{accountId}/probe:
    post:
      operationId: reportAgentAccountProbe
      description: The registering agent principal reports a bounded local identity/availability probe for its daemon. The daemon ID must match the account; no credential material is sent. Routing requires a recent successful probe.
      security: [{agentKey: []}]
      parameters: [{name: accountId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountProbe'}}}}
      responses:
        '200': {description: Account availability, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAccount'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /agent-accounts/route:
    post:
      operationId: reserveAgentAccount
      description: Atomically select an eligible account enrolled on the requesting daemon for a queued run and reserve allowance. Routing uses remaining allowance, recent usage, pace target and active run count; fail closed when estimates are absent or no account fits. The daemon resolves the opaque key to its local credential.
      security: [{agentKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountRouteRequest'}}}}
      responses:
        '200': {description: Selected account, content: {application/json: {schema: {$ref: '#/components/schemas/AccountRoute'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/journey:
    get:
      operationId: getProjectJourney
      summary: Read a project's derived journey
      description: ProjectId names a live project node. Stage and the single next action are derived from the current brief, decision, agreed requirements, release, handoff results and R2 decisions; clients cannot set them. project_node_id, project_key and tenant_slug are read from the project node and tenant row so a consumer can verify its configured binding. Query parameters and request bodies do not supply them.
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Journey projection, content: {application/json: {schema: {$ref: '#/components/schemas/Journey'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/journey/profile:
    put:
      operationId: setJourneyProfile
      summary: Choose a journey profile
      description: Person chooses Personal, Professional or Enterprise; expected_revision prevents a stale profile or gate edit. Profile changes never erase recorded decisions.
      security: [{session: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JourneyProfileWrite'}}}}
      responses:
        '200': {description: Journey projection, content: {application/json: {schema: {$ref: '#/components/schemas/Journey'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/journey/actions:
    post:
      operationId: advanceProjectJourney
      summary: Apply the project's next action
      description: Applies one currently offered action after checking the matching R2 approval where required; never creates an approval decision. Idempotency key and expected_revision fence retries and stale UI actions.
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JourneyActionWrite'}}}}
      responses:
        '200': {description: Updated journey, content: {application/json: {schema: {$ref: '#/components/schemas/Journey'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/requirements:
    get:
      operationId: listJourneyRequirements
      summary: List project requirements
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Requirements and generated node links, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/JourneyRequirement'}}}}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: createJourneyRequirement
      summary: Add a draft requirement
      description: A person adds a requirement node in the current draft revision. Later edits use the R1 node API and invalidate any stale Aithema draft or agreement gate.
      security: [{session: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JourneyRequirementCreate'}}}}
      responses:
        '201': {description: Requirement, content: {application/json: {schema: {$ref: '#/components/schemas/JourneyRequirement'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/requirements/agree:
    post:
      operationId: agreeJourneyRequirements
      summary: Agree a requirements revision
      description: A person-approved R2 requirements gate pins a revision and atomically creates one epic per functional requirement and idempotent ticket nodes from accepted breakdowns. Nonfunctional requirements become acceptance criteria or knowledge nodes. Drafts alone never generate work.
      security: [{session: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RequirementsAgreement'}}}}
      responses:
        '200': {description: Agreed requirements, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/JourneyRequirement'}}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/releases/{releaseId}/walker:
    get:
      operationId: getReleaseWalker
      summary: Read the A3 release walker
      description: Stable A3 feature and ticket order, epic node keys, ticket inclusion and linked screens. Feature checkbox state is derived from included open tickets.
      security: *auth
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: releaseId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Walker projection, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseWalker'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/releases/{releaseId}/plan:
    put:
      operationId: replaceReleasePlan
      summary: Replace ticket selection and order
      description: While planning, atomically replaces the selected ticket set and walker order. Feature tri-state, partial-pick memory, and arrow navigation are client projections; no client may move a ticket after build starts.
      security: [{session: []}]
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: releaseId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReleasePlanWrite'}}}}
      responses:
        '200': {description: Walker projection, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseWalker'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/releases/{releaseId}/tickets:
    post:
      operationId: createReleaseTicket
      summary: Create a manual ticket in the release plan or backlog
      description: A person creates a ticket under the project or the selected feature epic. Only the current planning release accepts new tickets. Creation, plan revision, scope invalidation and events are atomic. Idempotency keys share the project's journey action namespace; exact retries return the current walker without another write, even if the release has since left planning. Reusing a key with a different request or actor conflicts.
      security: [{session: []}]
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: releaseId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseTicketCreate'}}}}
      responses:
        '200': {description: Updated walker projection, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseWalker'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/intake/sources:
    post:
      operationId: addIntakeSource
      summary: Record an intake source
      description: Aithema records a source reference, content digest and provenance; file bytes remain behind Aeon's tenant-scoped file storage boundary. Never accepts credentials in locators.
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeSourceWrite'}}}}
      responses:
        '201': {description: Source, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeSource'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/intake:
    get:
      operationId: getProjectIntake
      summary: Read intake history
      description: Aithema's current source, transcript and draft history; accepted and superseded proposals remain visible with citations.
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Intake snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeSnapshot'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/intake/transcript-turns:
    post:
      operationId: appendIntakeTurn
      summary: Append a conversation turn
      description: Appends an immutable conversation turn to a source. Idempotency key binds a retry to the same content.
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeTurnWrite'}}}}
      responses:
        '201': {description: Turn, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeTurn'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/intake/drafts:
    post:
      operationId: proposeIntakeDraft
      summary: Propose a cited draft
      description: Aithema proposes an immutable cited brief or requirement draft against a target node revision. Proposals never patch people-edited nodes.
      security: [{agentKey: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeDraftWrite'}}}}
      responses:
        '201': {description: Draft, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeDraft'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/intake/drafts/{draftId}/accept:
    post:
      operationId: acceptIntakeDraft
      summary: Accept a cited draft
      description: Person explicitly accepts one draft. If the target changed since base_event_id, return 409 with no write; acceptance never overwrites later edits.
      security: [{session: []}]
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeAccept'}}}}
      responses:
        '200': {description: Accepted draft, content: {application/json: {schema: {$ref: '#/components/schemas/IntakeDraft'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs:
    post:
      operationId: requestStageHandoff
      summary: Request a stage operation
      description: The journey coordinator creates a fenced request for a registered first-party stage plugin. Janus prepare may precede Pharos deploy; Janus apply follows deployment and permit approval. Server resolves owner, permissions, lineage, evidence ceiling and approved gate; caller cannot supply authority or result.
      security: *auth
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageHandoffWrite'}}}}
      responses:
        '201': {description: Handoff, content: {application/json: {schema: {$ref: '#/components/schemas/StageHandoff'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}:
    get:
      operationId: getStageHandoff
      summary: Read a stage handoff
      description: >
        Allowed with stage_handoffs.read, or with the handoff's own operation
        scope (stage.prepare, stage.deploy, stage.verify or stage.apply) when
        the caller is the active agent principal whose name is the plugin the
        operation routes to (pharos for deploy and verify, janus for prepare
        and apply). Any other principal is refused, including one that holds
        the operation scope. prerequisite_seal_sha256 is the stored seal that
        a terminal result must echo. attempt and authority_epoch identify this
        attempt; superseded_by points to the latest newer attempt for the same
        release, stage and operation. authority_open is the current server
        projection of whether this attempt can accept another action.
      security: *auth
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Safe handoff projection, content: {application/json: {schema: {$ref: '#/components/schemas/StageHandoff'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/classic-batch-alias:
    post:
      operationId: bindClassicBatchAlias
      summary: Bind an imported classic batch ID to an Aeon delivery handoff
      description: Stores provenance for compatibility lookups; the handoff remains the delivery attempt and owner of evidence.
      security: *auth
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [classic_batch_id, classic_project_id, classic_batch]
              properties:
                classic_batch_id: {type: integer, minimum: 1}
                classic_project_id: {type: integer, minimum: 1}
                classic_batch: {type: object}
                implementation_execution: {type: integer, minimum: 0}
                implementation_authority_epoch: {type: integer, minimum: 0}
                account_key: {type: string}
                runtime_generation: {type: string}
      responses:
        '201': {description: Alias bound to the handoff, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/baseline-batches/batches/{batchId}/built-receipt:
    post:
      operationId: reportClassicBatchBuilt
      summary: Record classic shaped built evidence on the aliased Aeon handoff
      security: *auth
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: batchId, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: Classic batch projection from imported provenance, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/evidence:
    post:
      operationId: appendStageEvidence
      summary: Append typed stage evidence
      description: >
        The bound plugin appends monotonic typed evidence. Exact replay is
        idempotent; divergent replay and stale authority are conflicts. Janus
        evidence is value-free. Kind launch_readiness is Pharos observation on
        a deploy handoff. It requires reviewed_plan_digest (lowercase sha256),
        host, all_host_eval_passed, target_build_passed, backup_ready,
        backup_observed_at, restart_required, running_kernel and expected_kernel.
        Those fields are forbidden on every other kind. Admission treats the
        flags as authority and ignores the outcome word.
      security: [{agentKey: []}]
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageEvidenceWrite'}}}}
      responses:
        '201': {description: Evidence, content: {application/json: {schema: {$ref: '#/components/schemas/StageEvidence'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/result:
    post:
      operationId: closeStageHandoff
      summary: Record a terminal stage result
      description: A terminal result requires current lineage, required prerequisite seal and typed evidence. Failed or stale results never advance the journey.
      security: [{agentKey: []}]
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageResultWrite'}}}}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/StageResult'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/launch/admit:
    post:
      operationId: admitStageLaunch
      summary: Admit one Pharos launch
      description: >
        Issues one launch admission for an active Pharos deploy handoff after
        the live stage.deploy grant, approved candidate and deploy gates, the
        release version and EvidenceLaunchChecks all agree. The admit body must
        equal the artifact Aeon stored for that handoff in
        stage_handoff_build_evidence (digest_sha256 is the OCI config digest,
        manifest_digest_sha256 is the release manifest digest). The body is
        confirmation, not evidence. A launch_readiness row for this handoff and
        its current authority_epoch must have all_host_eval_passed,
        target_build_passed and backup_ready true, and observed_at within 900
        seconds of Aeon's clock. That window is LaunchFreshness. The caller
        cannot pass it. A later launch_readiness row with a false flag or a
        different reviewed_plan_digest contradicts the claim and is refused.
        binding_digest_sha256 is hex(sha256("inspr.aeon.launch-binding.v1" +
        NUL + canonical JSON)). The JSON object has sorted keys, no whitespace
        and UTF-8, and is exactly artifact_digest_sha256, authority_epoch
        (a JSON number), handoff_id, release_node_id and reviewed_plan_digest.
        Idempotency-Key is a required UUID. An exact replay by the same routed
        principal and key returns the original admission without a new event,
        even after consumption. A different body or principal using that key
        returns 409 idempotency_conflict. A new key cannot issue a second live
        admission. Replays end 24 hours after the handoff's terminal result.
        Refused when the handoff is closed, stale, or not an active Pharos deploy.
      security: *auth
      parameters:
        - {name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageArtifact'}}}}
      responses:
        '200': {description: Original launch admission, content: {application/json: {schema: {$ref: '#/components/schemas/StageLaunchAdmission'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/launch/consume:
    post:
      operationId: consumeStageLaunch
      summary: Consume one launch admission
      description: >
        Marks the admission consumed. Exactly one new key wins, including under
        concurrent requests. An exact replay with the original UUID
        Idempotency-Key, routed principal and canonical body returns the
        original receipt with consumed_at and no new event, including after a
        terminal result. A different body or principal using that key returns
        409 idempotency_conflict. A new key after consumption returns 409.
        Replays end 24 hours after the handoff's terminal result.
        Consume recomputes binding_digest_sha256 from the current handoff, the
        stored candidate artifact and the qualifying launch_readiness row, and
        refuses when any of those drifted. The admission must belong to this
        handoff. Missing, foreign, expired and already-consumed admissions are
        refused. A new consume requires the same live stage.deploy grant as
        admission; an exact replay checks the active routed principal.
      security: *auth
      parameters:
        - {name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageLaunchConsume'}}}}
      responses:
        '200': {description: Consumption receipt, content: {application/json: {schema: {$ref: '#/components/schemas/StageLaunchConsumption'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

# OPS-257: web-setup at 67c13c325; retained to prove the move preserves every check.
  web-setup:
    needs: [ci-plan, tree-reuse, tier-plan]
    if: always() && needs.ci-plan.result == 'success' && needs.tier-plan.result == 'success' && (needs.ci-plan.outputs.lane != 'docs-only') && needs.tree-reuse.outputs.reuse != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      browser-cache-key: ${{ steps.web-cache-keys.outputs.browsers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve lockfile and Playwright cache keys
        id: web-cache-keys
        env:
          LOCKFILE_HASH: ${{ hashFiles('web/package-lock.json') }}
        run: |
          set -euo pipefail
          pw_version="$(node -p "require('./web/package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "dependencies=web-deps-v1-${RUNNER_OS}-${RUNNER_ARCH}-node24-${LOCKFILE_HASH}-pw${pw_version}" >> "$GITHUB_OUTPUT"
          echo "browsers=web-playwright-v1-${RUNNER_OS}-${RUNNER_ARCH}-${LOCKFILE_HASH}-pw${pw_version}" >> "$GITHUB_OUTPUT"
      - name: Cache installed web dependencies
        id: web-dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: web/node_modules
          key: ${{ steps.web-cache-keys.outputs.dependencies }}
      - name: Install web dependencies
        if: steps.web-dependencies.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci
      - name: Check Docker web inputs without Docker
        run: node --test scripts/docker-web-inputs.test.mjs
      - name: Install shells used by command round-trip unit tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fish zsh
      - working-directory: web
        run: npm run typecheck
      # The session and run ledger fences (AEON-449): endpoints only in lib/agentRows.ts, wire rows only through the ledger.
      - working-directory: web
        run: npm run lint
      - name: Web unit checks (once)
        env:
          CI_LANE: ${{ needs.ci-plan.outputs.lane }}
          AEON_TEST_TIER_MODE: ${{ needs.tier-plan.outputs.mode }}
        working-directory: web
        run: |
          if [ "$CI_LANE" = spec-only ]; then
            # New specs need no tier entry for this lane's exact-spec run.
            node --test --test-concurrency=1 scripts/ci-web-shard.test.mjs scripts/aeon-676-ci.test.mjs
            npm run test:unit:core
          else
            npm run ci:web:shard:test
            node ../scripts/test-tiers/cli.mjs run web --unit --job web-unit
          fi
      - name: Confirm full tier execution
        if: needs.ci-plan.outputs.lane == 'full' && needs.tier-plan.outputs.mode != 'essential'
        env:
          TIER_REPORT: tmp/test-tiers/web-unit-measurement.json
        run: node scripts/test-tiers/check-full.mjs
      - name: Preserve unit tier measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-unit-tier-measurements
          path: tmp/test-tiers/
          if-no-files-found: warn
          retention-days: 8
          overwrite: true
      - name: Browser runner safety (no browsers)
        working-directory: web
        run: npm run test:browser-safety
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Cache Playwright browsers
        id: web-browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.web-cache-keys.outputs.browsers }}
      - name: Install Playwright browsers
        if: steps.web-browsers.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium
      # Tar preserves executable bits, symlinks and hidden dependency files.
      # Build output is run-specific; never replay a dist cache for another commit.
      - name: Pack web runtime for shards
        run: tar -cf "$RUNNER_TEMP/web-runtime.tar" web/node_modules web/dist
      - name: Share web runtime with shards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-runtime
          path: ${{ runner.temp }}/web-runtime.tar
          retention-days: 1
          overwrite: true
          if-no-files-found: error
